，因此第一步不是换卡。","s":"[  234.567890] NVRM: Xid (PCI:0000:3b:00): 13, pid=4567, name=train.py, Graphics Exception on Channel 0x0010","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 13 GR_EXCEPTION, cuda-gdb and Compute Sanitizer memcheck"},{"id":"t2-xid54-watchdog","d":"6","m":0,"t":"","c":"现场处置","q":"You see this in dmesg and nvidia-smi reports reduced clocks. What is the most likely cause?","zq":"你在 dmesg 里看到这条，且 nvidia-smi 显示时钟降低。最可能的原因是什么？","o":["The GPU is overheating and thermally throttling","The auxiliary power cable is not connected to the GPU board","A hardware watchdog timeout left the GPU unresponsive","NVLink link training failed"],"zo":["GPU 过热，正在热降频","GPU 板卡的辅助电源线未连接","硬件看门狗超时导致 GPU 无响应","NVLink 链路训练失败"],"a":1,"e":"Xid 54 is SILENT_RUNNING_PWR_REDUCED_CLOCKING, described in the catalog as Auxiliary power is not connected to the GPU board. That explains the reduced clocks directly. The immediate resolution bucket is CHECK_MECHANICALS, so inspect the auxiliary power cabling before investigating thermals.","ze":"Xid 54 是 SILENT_RUNNING_PWR_REDUCED_CLOCKING，官方描述为辅助电源未连接到 GPU 板卡，这直接解释了时钟降低。即时处置桶是 CHECK_MECHANICALS，应先检查辅助供电线缆，而不是先去查散热。","s":"[  789.012345] NVRM: Xid (PCI:0000:3b:00): 54, pid=0","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 54 SILENT_RUNNING_PWR_REDUCED_CLOCKING, auxiliary power not connected"},{"id":"t2-xid74-nvlink","d":"6","m":0,"t":"","c":"现场处置","q":"Multi-GPU training suddenly fails. You find this in dmesg. What is your first diagnostic step?","zq":"多卡训练突然失败，你在 dmesg 中看到如下记录。第一个诊断步骤是什么？","o":["Check ECC error counters on GPU memory","Check NVLink status with nvidia-smi nvlink -s and error counters with nvidia-smi nvlink -e","Reinstall the CUDA toolkit","Run nvidia-smi --gpu-reset on all GPUs"],"zo":["检查 GPU 显存的 ECC 错误计数器","用 nvidia-smi nvlink -s 查看 NVLink 状态、用 nvidia-smi nvlink -e 查看错误计数","重装 CUDA 工具包","对所有 GPU 执行 nvidia-smi --gpu-reset"],"a":1,"e":"XID 74 (NVLink Error) indicates a fault on the NVLink interconnect. The first diagnostic step is to check NVLink status and error counters with nvidia-smi nvlink -s and nvidia-smi nvlink -e. You should also verify GPU seating and NVLink bridge connections physically.","ze":"XID 74（NVLink 错误）表示 NVLink 互联上出现了故障。第一步用 nvidia-smi nvlink -s 看链路状态、nvidia-smi nvlink -e 看错误计数，同时检查 GPU 是否插好、NVLink 桥是否连接到位。","s":"[ 3456.789012] NVRM: Xid (PCI:0000:3b:00): 74, pid=5678, name=nccl, NVLink Error on GPU 0000:3b:00","src":"lab"},{"id":"t2-xid63-rowremap","d":"6","m":0,"t":"","c":"现场处置","q":"During a routine health check you find this in the log. What does it mean for the GPU?","zq":"例行健康检查时你在日志里发现这条。它对该 GPU 意味着什么？","o":["The GPU memory is healthy: this is a record of a row-remapping (ECC page retirement) event","The GPU memory has exhausted its error correction capacity and must be replaced","A double-bit ECC error requires an immediate GPU reset","The GPU has fallen off the PCIe bus"],"zo":["显存健康：这是一次行重映射（ECC 页面退役）事件的记录","显存纠错能力已耗尽，必须更换","出现双位 ECC 错误，需要立即重置 GPU","GPU 已从 PCIe 总线上脱落"],"a":0,"e":"Xid 63 is INFOROM_DRAM_RETIREMENT_EVENT, described as a GPU memory remapping event. It records row remapper or dynamic page retirement activity, and the catalog resolution bucket is IGNORE for both the immediate and investigatory action. The failure to record such an event is a different code, Xid 64.","ze":"Xid 63 是 INFOROM_DRAM_RETIREMENT_EVENT，官方描述为显存重映射事件，记录行重映射器或动态页面退役的活动，即时与调查两个处置桶都是 IGNORE。表示记录失败的是另一个码 Xid 64。","s":"[ 9876.543210] NVRM: Xid (PCI:0000:86:00): 63, pid=0","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 63 INFOROM_DRAM_RETIREMENT_EVENT, informational"},{"id":"t2-xid95-uncontained","d":"6","m":0,"t":"","c":"现场处置","q":"A large-scale training run is in progress when you see this. What is the immediate priority?","zq":"大规模训练正在运行时你看到这条。第一优先级是什么？","o":["Continue the run: the error was likely transient","An uncontained error affects multiple applications, so drain the other work on that GPU and reset it","Reset the ECC counters and keep monitoring","Schedule a preventive maintenance window for next week"],"zo":["继续跑：这个错误多半是瞬时的","不可控错误会影响多个应用，应先排空该 GPU 上的其他工作再重置它","重置 ECC 计数器后继续监控","安排到下周的预防性维护窗口"],"a":1,"e":"Xid 95 is ROBUST_CHANNEL_UNCONTAINED_ERROR, described as an uncontained memory error. Unlike Xid 94, which is contained to one application, Xid 95 affects multiple applications and the affected GPU must be reset before applications can restart. The immediate resolution bucket is RESET_GPU, and Xid 45 is typically seen alongside it.","ze":"Xid 95 是 ROBUST_CHANNEL_UNCONTAINED_ERROR，官方描述为不可控显存错误。与仅影响单个应用的 Xid 94 不同，Xid 95 会影响多个应用，必须先重置受影响的 GPU，应用才能重新启动。即时处置桶是 RESET_GPU，通常伴随看到 Xid 45。","s":"[24680.135790] NVRM: Xid (PCI:0000:3b:00): 95, pid=9876, name=python3","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 95 ROBUST_CHANNEL_UNCONTAINED_ERROR, uncontained memory error"},{"id":"t2-xid76-training","d":"6","m":0,"t":"","c":"现场处置","q":"After installing new GPUs you see this in dmesg. What does it indicate?","zq":"装上新 GPU 之后你在 dmesg 里看到这条。它表示什么？","o":["NVLink link training failed, so the NVLink bridge must be reseated","A Copy Engine (CE7) error, reported as CE7: Unknown Error","vGPU failed to start on the host","A double-bit ECC error in GPU memory"],"zo":["NVLink 链路训练失败，需要重新插拔 NVLink 桥","拷贝引擎（CE7）错误，报码为 CE7: Unknown Error","主机上的 vGPU 启动失败","GPU 显存中的双位 ECC 错误"],"a":1,"e":"Xid 76 is ROBUST_CHANNEL_CE7_ERROR, listed in the catalog as CE7: Unknown Error. Xid 70, 71, 72, 75, 76, 77 and 85 are all Copy Engine errors. Only Xid 74 is NVLINK_ERROR, and it applies to A100 and H100; on B100 and GB200 the NVLink codes are 144 through 150. The immediate resolution bucket for Xid 76 is RESTART_APP.","ze":"Xid 76 是 ROBUST_CHANNEL_CE7_ERROR，目录描述为 CE7: Unknown Error。Xid 70、71、72、75、76、77、85 都是拷贝引擎错误。只有 Xid 74 是 NVLINK_ERROR，且适用于 A100/H100；在 B100/GB200 上 NVLink 相关的码是 144 到 150。Xid 76 的即时处置桶是 RESTART_APP。","s":"[   12.345678] NVRM: Xid (PCI:0000:3b:00): 76, pid=0","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 76 ROBUST_CHANNEL_CE7_ERROR, CE7 Unknown Error"},{"id":"t2-xid64-threshold","d":"6","m":0,"t":"","c":"现场处置","q":"Your monitoring system flags this on a production GPU. What is the appropriate response?","zq":"监控系统在生产 GPU 上报出这条。恰当的处置是什么？","o":["No action needed: the GPU will continue to remap rows automatically","The row-remapping record operation failed; reset the affected GPU and escalate if it recurs","Disable ECC to prevent further remapping","Reinstall the driver to clear the remapping table"],"zo":["无需处理：GPU 会自动继续重映射","行重映射的记录操作失败；应重置受影响的 GPU，若再次出现则升级处理","关闭 ECC 以阻止继续重映射","重装驱动以清空重映射表"],"a":1,"e":"Xid 64 is INFOROM_DRAM_RETIREMENT_FAILURE, described as a GPU memory remapping failure: the record operation itself failed. The immediate resolution bucket is RESET_GPU, so reset the affected GPU; if the condition persists, escalate to the hardware vendor. Disabling ECC does not address a failed record operation.","ze":"Xid 64 是 INFOROM_DRAM_RETIREMENT_FAILURE，官方描述为显存重映射失败，失败的是记录这个动作本身。即时处置桶是 RESET_GPU，应重置受影响的 GPU；若问题持续，再升级到硬件厂商。关闭 ECC 并不能解决记录失败。","s":"[ 8765.432100] NVRM: Xid (PCI:0000:3b:00): 64, pid=0","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 64 INFOROM_DRAM_RETIREMENT_FAILURE, remapping record failed"},{"id":"t3-ecc-cascade","d":"6","m":0,"t":"","c":"综合场景","q":"You see the following sequence of errors over a 2-hour period. Which error should you prioritize and why?","zq":"两小时内依次出现如下错误序列，应先处理哪一个、为什么？","o":["Prioritize XID 92 — it appeared first and is the root cause","Prioritize XID 48 — double-bit errors are always the most critical","Prioritize XID 95 — uncontained ECC means data corruption is possible, then address the full memory failure chain","All are equally important — address them in chronological order"],"zo":["优先处理 XID 92——它最先出现，是根因","优先处理 XID 48——双比特错误总是最严重","优先处理 XID 95——未隔离的 ECC 意味着可能已发生数据损坏，随后再处理整条内存失效链","重要性相同——按时间顺序处理即可"],"a":2,"e":"This shows a classic ECC degradation cascade: high single-bit rate (92) escalated to uncorrectable double-bit (48) and then to uncontained (95). XID 95 is the immediate priority because data corruption may have occurred — you must check workload integrity first. Then address the root cause: the GPU memory is failing and replacement is required. The XID 92 warnings were the early indicator.","ze":"这是典型的 ECC 劣化链：单比特速率过高（92）→ 不可纠正双比特（48）→ 未隔离（95）。应优先处理 XID 95，因为可能已发生数据损坏，必须先核查作业数据完整性；然后处理根因——显存正在失效，需要更换。XID 92 是这条链的早期预警。","s":"[10000.000000] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[10045.123456] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[10890.567890] NVRM: Xid (PCI:0000:3b:00): 48, pid=5678, name=python3, Double Bit ECC Error\n[11234.901234] NVRM: Xid (PCI:0000:3b:00): 95, pid=5678, name=python3, Uncontained ECC Error","src":"lab"},{"id":"t3-nvlink-multi","d":"6","m":0,"t":"","c":"综合场景","q":"A multi-GPU training job crashes. You find these errors in dmesg. Which code should drive your first check, and why?","zq":"多卡训练作业崩溃。你在 dmesg 里看到这些错误。应以哪个码作为第一步排查依据，为什么？","o":["Xid 77: CE8 timeouts are the most severe kind of NVLink error","Xid 74: it is the only NVLink code in this list, so start with NVLink status and error counters using nvidia-smi nvlink -s and nvidia-smi nvlink -e","Xid 76: a link training error is the root cause, so reseat the bridges","Ignore them all: restarting the job clears them"],"zo":["Xid 77：CE8 超时是最严重的一类 NVLink 错误","Xid 74：它是这批里唯一的 NVLink 码，应先用 nvidia-smi nvlink -s 与 nvidia-smi nvlink -e 查链路状态与错误计数","Xid 76：链路训练错误是根因，去重新插拔 NVLink 桥","全部忽略：重启作业就会清掉"],"a":1,"e":"Only Xid 74 is NVLINK_ERROR. Xid 76 is ROBUST_CHANNEL_CE7_ERROR and Xid 77 is ROBUST_CHANNEL_CE8_ERROR, both Copy Engine codes reported as Unknown Error in the catalog. So the defensible first step is to inspect NVLink status and counters for the code that actually names the link. Note also that Xid 74 applies to A100 and H100; on B100 and GB200 the NVLink codes are 144 through 150.","ze":"只有 Xid 74 是 NVLINK_ERROR。Xid 76 是 ROBUST_CHANNEL_CE7_ERROR，Xid 77 是 ROBUST_CHANNEL_CE8_ERROR，两者都是拷贝引擎码，目录里都标为 Unknown Error。因此第一步应当是针对真正指向链路的那一个码去查 NVLink 状态与计数。另需注意 Xid 74 适用于 A100/H100；在 B100/GB200 上 NVLink 相关的码是 144 到 150。","s":"[  500.111111] NVRM: Xid (PCI:0000:3b:00): 76, pid=0\n[  500.222222] NVRM: Xid (PCI:0000:3b:00): 74, pid=3456, name=nccl\n[  500.333333] NVRM: Xid (PCI:0000:86:00): 77, pid=3456, name=nccl\n[  500.444444] NVRM: Xid (PCI:0000:86:00): 74, pid=3456, name=nccl","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 74 NVLINK_ERROR versus Xid 76 CE7 and Xid 77 CE8"},{"id":"t3-thermal-cascade","d":"6","m":0,"t":"","c":"综合场景","q":"Over a 10-minute period you see the following errors on one GPU. What is the likely root cause and the correct escalation path?","zq":"10 分钟内，某块 GPU 出现如下错误。最可能的根因与正确的升级处置路径是什么？","o":["Thermal failure cascade: the GPU overheated (43), a watchdog tripped (54), then thermal shutdown dropped the PCIe link (79). Check the cooling system immediately.","Power and connection fault: Xid 54 means the auxiliary power cable is not connected, so the GPU lost power and dropped off the bus (79). Xid 43 is an application-level termination, not overheating. Check the auxiliary power cabling and the PCIe link.","The pattern is a driver bug, so reinstall the NVIDIA driver.","It is purely an application bug (43), so only the application code needs fixing."],"zo":["散热失效链：GPU 过热（43）→ 看门狗触发（54）→ 热关机导致 PCIe 链路断开（79）。应立即检查散热系统。","供电与连接故障：Xid 54 表示辅助电源线未连接，GPU 因此失去供电并从总线上脱落（79）。Xid 43 属应用层终止，并非过热。应检查辅助供电线缆与 PCIe 链路。","这是一类驱动 bug，重装 NVIDIA 驱动即可。","纯粹是应用 bug（43），只需修应用代码。"],"a":1,"e":"Read the three codes against the catalog. Xid 43 (RESETCHANNEL_VERIF_ERROR) is a user application that hit a software-induced fault and was terminated, and the GPU remains healthy, so it is not evidence of overheating. Xid 54 (SILENT_RUNNING_PWR_REDUCED_CLOCKING) means the auxiliary power is not connected to the GPU board, and its resolution bucket is CHECK_MECHANICALS. Xid 79 (GPU_HAS_FALLEN_OFF_THE_BUS) means the GPU became unreachable over PCI Express, typically because the link went down. The hardware signal in this sequence is power and link, not temperature.","ze":"拿这三个码对官方目录看：Xid 43（RESETCHANNEL_VERIF_ERROR）是用户程序遇到软件诱发的故障被终止，且 GPU 仍健康，因此不能作为过热的证据；Xid 54（SILENT_RUNNING_PWR_REDUCED_CLOCKING）表示辅助电源未连接到 GPU 板卡，处置桶是 CHECK_MECHANICALS；Xid 79（GPU_HAS_FALLEN_OFF_THE_BUS）表示 GPU 经 PCI Express 已不可访问，通常是链路断开。这条序列里的硬件信号是供电与链路，不是温度。","s":"[20000.000000] NVRM: Xid (PCI:0000:af:00): 43, pid=7890, name=python3, Ch 00000010\n[20015.123456] NVRM: Xid (PCI:0000:af:00): 43, pid=7890, name=python3, Ch 00000010\n[20120.234567] NVRM: Xid (PCI:0000:af:00): 54, pid=0\n[20300.345678] NVRM: Xid (PCI:0000:af:00): 79, pid=0, GPU has fallen off the bus.","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 43, 54 and 79 meanings and resolution buckets"},{"id":"t3-memory-nvlink","d":"6","m":0,"t":"","c":"综合场景","q":"During a distributed training run across 8 GPUs, you see these errors on GPU 3. Which error is the most urgent signal, and why?","zq":"在 8 卡分布式训练中，GPU 3 出现以下错误。哪个错误是最紧急的信号，原因是什么？","o":["Xid 63: row remapping means the GPU has exhausted its error correction capacity","Xid 92: it appeared first and is the root cause","Xid 48: an uncorrectable double-bit ECC error is the urgent signal, and the GPU needs a reset and field diagnostics","All are equally critical, so replace all NVLink bridges first"],"zo":["Xid 63：行重映射说明 GPU 纠错能力已耗尽","Xid 92：它最早出现，是根因","Xid 48：不可纠正的双位 ECC 错误是最紧急的信号，该 GPU 需要重置并做现场诊断","三者同等严重，应先更换所有 NVLink 桥"],"a":2,"e":"Xid 48 is ROBUST_CHANNEL_GPU_ECC_DBE, an uncorrectable double-bit error; the catalog notes that a GPU reset or node reboot is needed to clear it, and the GPU Debug Guidelines route it to field diagnostics. Xid 92 (EXCESSIVE_SBE_INTERRUPTS) is an early warning of a high single-bit error rate, not the urgent failure. Xid 63 (INFOROM_DRAM_RETIREMENT_EVENT) is an informational record of remapping activity, and the failure to record is Xid 64.","ze":"Xid 48 是 ROBUST_CHANNEL_GPU_ECC_DBE，不可纠正的双位错误；官方注明需要重置 GPU 或重启节点才能清除，GPU 调试指南将其导向现场诊断。Xid 92（EXCESSIVE_SBE_INTERRUPTS）是单比特错误率偏高的早期预警，不是紧急故障。Xid 63（INFOROM_DRAM_RETIREMENT_EVENT）是重映射活动的信息性记录，记录失败才是 Xid 64。","s":"[ 5000.111111] NVRM: Xid (PCI:0000:86:00): 92, pid=0\n[ 5000.222222] NVRM: Xid (PCI:0000:86:00): 63, pid=0\n[ 5001.333333] NVRM: Xid (PCI:0000:86:00): 48, pid=2345, name=python3\n[ 5001.444444] NVRM: Xid (PCI:0000:86:00): 48, pid=2345, name=python3","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 48, 63 and 92 meanings and severity"},{"id":"t3-mixed-severity","d":"6","m":0,"t":"","c":"综合场景","q":"After a driver update, multiple users report GPU issues. You see these errors across different GPUs. What is the most defensible reading?","zq":"一次驱动更新之后，多名用户报告 GPU 问题。你在不同 GPU 上看到这些错误。最站得住脚的解读是什么？","o":["Multiple GPUs failing at once proves the node hardware is failing","Xid 38 is a driver firmware error and appears on two GPUs, so the driver and firmware layer deserves attention first; Xid 13 and 43 are application-level events","Xid 43 is the primary concern because the GPU stopped responding","Xid 13 is unrelated to the rest, so no common cause exists"],"zo":["多块 GPU 同时出问题，足以证明节点硬件在失效","Xid 38 是驱动固件错误，且在两块 GPU 上都出现，所以应先关注驱动与固件层；Xid 13 与 43 属应用层事件","Xid 43 才是主要问题，因为 GPU 停止响应了","Xid 13 与其它几个无关，因此不存在共同原因"],"a":1,"e":"Xid 38 is ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT, a driver firmware error, and seeing it on two GPUs after a driver change makes the driver and firmware layer the first place to investigate. Xid 13 (GR_EXCEPTION) and Xid 43 (RESETCHANNEL_VERIF_ERROR) are both classified as user application events, and Xid 43 explicitly leaves the GPU in a healthy state. None of the four codes is by itself a proven hardware failure.","ze":"Xid 38 是 ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT，属驱动固件错误；在改过驱动之后两块 GPU 都报它，说明应先查驱动与固件层。Xid 13（GR_EXCEPTION）与 Xid 43（RESETCHANNEL_VERIF_ERROR）都被归为用户程序事件，而且 Xid 43 明确说明 GPU 仍保持健康。这四个码中没有任何一个单独构成硬件故障的确证。","s":"[  100.111111] NVRM: Xid (PCI:0000:3b:00): 38, pid=0\n[  100.222222] NVRM: Xid (PCI:0000:86:00): 38, pid=0\n[  200.333333] NVRM: Xid (PCI:0000:3b:00): 13, pid=1234, name=python3\n[  200.444444] NVRM: Xid (PCI:0000:86:00): 43, pid=5678, name=train.py, Ch 00000010","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 38 driver firmware error; Xid 13 and 43 application events"},{"id":"t3-production-triage","d":"6","m":0,"t":"","c":"综合场景","q":"A production inference server shows degrading performance. Monitoring reveals these errors over the past 24 hours. How should you prioritize your response?","zq":"一台生产推理服务器性能在下降。监控显示过去 24 小时内出现以下错误。应如何安排处置优先级？","o":["Focus on Xid 95 because it is the most recent error","The pattern is a progressive memory failure: a row-remapping record failure (64), then uncorrectable double-bit ECC (48), then an uncontained error (95). Migrate workloads off this GPU and schedule replacement.","Reset the ECC counters and monitor for another 24 hours before acting","Xid 64 is only informational, so nothing needs to be done"],"zo":["聚焦 Xid 95，因为它是最新的错误","这是一条渐进的显存失效链：行重映射记录失败（64）→ 不可纠正双位 ECC（48）→ 不可控错误（95）。应把负载迁走并安排更换。","重置 ECC 计数器，再观察 24 小时才动作","Xid 64 只是信息性事件，无需处理"],"a":1,"e":"The three codes describe an escalating memory problem. Xid 64 (INFOROM_DRAM_RETIREMENT_FAILURE) means the remapping record operation failed and its resolution bucket is RESET_GPU, so it is not informational. Xid 48 (GPU_ECC_DBE) is an uncorrectable double-bit error that needs a GPU reset or node reboot. Xid 95 (UNCONTAINED_ERROR) affects multiple applications and requires a GPU reset before applications can restart. Treating the sequence as degradation and moving work off the GPU is the defensible response.","ze":"这三个码描述的是一条逐级恶化的显存问题。Xid 64（INFOROM_DRAM_RETIREMENT_FAILURE）表示重映射记录操作失败，处置桶是 RESET_GPU，因此它不是信息性事件。Xid 48（GPU_ECC_DBE）是不可纠正的双位错误，需要重置 GPU 或重启节点。Xid 95（UNCONTAINED_ERROR）会影响多个应用，且必须先重置 GPU 才能重启应用。把这一序列当作劣化处理并迁走负载是站得住脚的做法。","s":"[  --- 6 hours ago ---]\n[43200.111111] NVRM: Xid (PCI:0000:3b:00): 64, pid=0\n[  --- 2 hours ago ---]\n[57600.222222] NVRM: Xid (PCI:0000:3b:00): 48, pid=4321, name=inference\n[57601.333333] NVRM: Xid (PCI:0000:3b:00): 48, pid=4321, name=inference\n[  --- 30 minutes ago ---]\n[63000.444444] NVRM: Xid (PCI:0000:3b:00): 95, pid=4321, name=inference","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 64, 48 and 95 resolution buckets"},{"id":"ms-ecc-01","d":"1","m":1,"t":"nvidia-smi","c":"参数用法","q":"Which commands or flags show ECC error counters directly? (select all that apply)","zq":"下列哪些命令或参数可以直接查看 ECC 错误计数？（多选）","o":["nvidia-smi -q -d ECC","nvidia-smi -q (its output includes an ECC Errors section)","nvidia-smi --ecc-errors","nvidia-smi -q -d PAGE_RETIREMENT"],"zo":["只查询 ECC 段","全量查询，输出里含 ECC Errors 段","nvidia-smi --ecc-errors","查询页退役信息"],"ans":[0,1],"e":"-q -d ECC prints only the ECC section; a full -q query also contains an ECC Errors section. --ecc-errors is not an nvidia-smi flag, and -q -d PAGE_RETIREMENT reports retired pages rather than ECC counts.","ze":"-q -d ECC 只打印 ECC 段；完整 -q 查询的正文里同样包含 ECC Errors 段。--ecc-errors 并不是 nvidia-smi 的参数；-q -d PAGE_RETIREMENT 给出的是退役页信息，不是 ECC 计数。","s":"","src":"lab"},{"id":"ms-xid-01","d":"6","m":1,"t":"dmesg","c":"错误码识别","q":"Which XID codes relate to the GPU memory subsystem (ECC or row remapping)? (select all that apply)","zq":"下列哪些 XID 码与 GPU 显存子系统（ECC 或行重映射）相关？（多选）","o":["XID 48","XID 63","XID 64","XID 76"],"zo":["双位 ECC 错误（不可纠正）","显存行重映射事件记录（信息性）","行重映射的记录操作失败","拷贝引擎（CE7）错误"],"ans":[0,1,2],"e":"Xid 48 is ROBUST_CHANNEL_GPU_ECC_DBE, an uncorrectable double-bit ECC error. Xid 63 is INFOROM_DRAM_RETIREMENT_EVENT, which records row-remapping activity and is informational. Xid 64 is INFOROM_DRAM_RETIREMENT_FAILURE, where the remapping record operation itself failed. All three belong to the memory subsystem. Xid 76 is ROBUST_CHANNEL_CE7_ERROR, a Copy Engine error: it is neither a memory code nor an NVLink code.","ze":"Xid 48 是 ROBUST_CHANNEL_GPU_ECC_DBE，不可纠正的双位 ECC 错误。Xid 63 是 INFOROM_DRAM_RETIREMENT_EVENT，记录行重映射活动，属信息性事件。Xid 64 是 INFOROM_DRAM_RETIREMENT_FAILURE，失败的是重映射的记录操作。三者都属于显存子系统。Xid 76 是 ROBUST_CHANNEL_CE7_ERROR，拷贝引擎错误，既不是显存码也不是 NVLink 码。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 48, 63, 64 memory subsystem; Xid 76 CE7"},{"id":"ms-diag-01","d":"4","m":1,"t":"dcgmi diag","c":"最佳实践","q":"Which subsystems does dcgmi diag -r 3 exercise? (select all that apply)","zq":"dcgmi diag -r 3 会覆盖下列哪些子系统？（多选）","o":["Memory (bandwidth and stress)","PCIe","NVLink","Fan PWM control loop"],"zo":["显存（带宽与压力）","PCIe 链路","NVLink","风扇 PWM 控制回路"],"ans":[0,1,2],"e":"Level 3 runs the full suite: deployment checks, PCIe, memory bandwidth, SM compute, NVLink bandwidth and power stress. Fan control is handled by the BMC and is not a DCGM diagnostic target.","ze":"3 级跑的是完整套件：部署检查、PCIe、显存带宽、SM 计算、NVLink 带宽与功耗压力。风扇控制由 BMC 负责，不属于 DCGM 诊断目标。","s":"","src":"lab"},{"id":"ms-ib-01","d":"2","m":1,"t":"ibstat","c":"故障排查","q":"Which tools report InfiniBand link rate/width or port error counters? (select all that apply)","zq":"下列哪些工具能给出 InfiniBand 链路速率/宽度或端口错误计数？（多选）","o":["ibstat","iblinkinfo","perfquery","dmidecode"],"zo":["查看本机 HCA 端口状态与速率","查看 fabric 拓扑中各链路速率与宽度","查询端口计数器","读取 SMBIOS 硬件清单"],"ans":[0,1,2],"e":"ibstat shows the local HCA port state and rate, iblinkinfo prints the fabric topology with per-link speed and width, and perfquery reads port counters. dmidecode reads SMBIOS tables and has nothing to do with InfiniBand.","ze":"ibstat 看本机 HCA 端口状态与速率，iblinkinfo 打印 fabric 拓扑里每条链路的速率与宽度，perfquery 读端口计数器；dmidecode 读的是 SMBIOS 硬件清单，与 InfiniBand 无关。","s":"","src":"lab"},{"id":"ms-cont-01","d":"3","m":1,"t":"enroot","c":"命令语法","q":"Which three enroot steps take a registry image to a running container? (select all that apply)","zq":"从仓库镜像到运行容器，enroot 需要哪三个步骤？（多选）","o":["enroot import","enroot create","enroot start","enroot pull"],"zo":["下载镜像并转成 .sqsh","把 .sqsh 解包成沙箱目录","在沙箱里启动进程","拉取镜像"],"ans":[0,1,2],"e":"enroot import downloads a registry image into a squashfs file, enroot create unpacks it into a rootfs sandbox, and enroot start launches a process inside it. There is no 'enroot pull' subcommand.","ze":"enroot import 把仓库镜像下载成 squashfs 文件，enroot create 解包成 rootfs 沙箱，enroot start 在沙箱里启动进程。没有 enroot pull 这个子命令。","s":"","src":"lab"},{"id":"ms-clus-01","d":"3","m":1,"t":"sinfo","c":"输出判读","q":"Which Slurm node states mean the node will not receive new jobs? (select all that apply)","zq":"Slurm 中哪些节点状态意味着不会再被调度新作业？（多选）","o":["drain","down","mixed","idle"],"zo":["已标记维护，跑完现有作业后不再接新作业","不可用（故障或管理员操作）","部分资源已分配，仍有资源可调度","空闲，完全可调度"],"ans":[0,1],"e":"drain and down both take the node out of scheduling; running jobs on a drained node are allowed to finish. mixed and idle nodes are still schedulable.","ze":"drain 与 down 都会把节点排除在调度之外（drain 节点上运行中的作业允许跑完）；mixed 与 idle 仍然可以被调度。","s":"","src":"lab"},{"id":"ms-rack-01","d":"1","m":1,"t":"现场施工","c":"最佳实践","q":"Before racking an AI server, which power/cooling items must be verified? (select all that apply)","zq":"AI 服务器上架之前，供电与散热方面必须确认哪些项？（多选）","o":["A/B dual-feed power and per-rack redundancy","rPDU three-phase load balance","Rack grounding","Switch VLAN assignment"],"zo":["A/B 双路供电与每柜冗余","rPDU 三相负载均衡","机柜接地","交换机 VLAN 划分"],"ans":[0,1,2],"e":"Power redundancy (A/B feeds), rPDU phase balance and grounding are all physical prerequisites. VLAN assignment belongs to network configuration and is not part of rack power readiness.","ze":"A/B 双路供电冗余、rPDU 三相均衡与接地都是物理层前置条件；VLAN 划分属于网络配置，不属于机架上电前的准备项。","s":"","src":"lab"},{"id":"ms-perf-01","d":"4","m":1,"t":"nccl-tests","c":"最佳实践","q":"Which methods verify that inter-GPU connectivity inside an 8-GPU node is healthy? (select all that apply)","zq":"验证 8 卡节点内部 GPU 互联是否正常，可用哪些手段？（多选）","o":["nvidia-smi topo -m","nvidia-smi nvlink -s","nccl-tests all_reduce_perf","nvidia-smi -q -d ECC"],"zo":["查看 GPU 间拓扑（NVLink / PCIe 连接关系）","查看每条 NVLink 的链路速率","跑集合通信基准验证带宽","查询 ECC 计数"],"ans":[0,1,2],"e":"topo -m shows how the GPUs are wired, nvlink -s shows per-link NVLink rates, and nccl-tests proves the collective path end to end. ECC counters say nothing about interconnect health.","ze":"topo -m 看 GPU 之间怎么连、nvlink -s 看每条 NVLink 的速率、nccl-tests 端到端验证集合通信通路；ECC 计数与互联健康无关。","s":"","src":"lab"},{"id":"ms-dcgm-01","d":"4","m":1,"t":"dcgmi","c":"概念理解","q":"Which statements about dcgmi are correct? (select all that apply)","zq":"关于 dcgmi 的下列说法，哪些是正确的？（多选）","o":["It is a client that needs the nv-hostengine daemon running","A single GPU can be targeted with -i","A pre-defined DCGM group can be targeted with -g","It works without the NVIDIA driver installed"],"zo":["它是客户端，需要 nv-hostengine 守护进程在运行","可用 -i 指定单块 GPU","可用 -g 指定预设的 DCGM 组","不装 NVIDIA 驱动也能工作"],"ans":[0,1,2],"e":"dcgmi talks to the DCGM host engine over a socket, so nv-hostengine (or nvidia-dcgm) must run. -i selects one GPU by entity id and -g selects a group. Without the driver the engine cannot even enumerate GPUs.","ze":"dcgmi 通过 socket 与 DCGM host engine 通信，必须有 nv-hostengine（或 nvidia-dcgm）在跑；-i 按实体 ID 选单卡，-g 选组。没有驱动时引擎连 GPU 都枚举不出来。","s":"","src":"lab"},{"id":"ms-k8s-01","d":"3","m":1,"t":"k8s","c":"概念理解","q":"What is required for a Pod to use a GPU in Kubernetes? (select all that apply)","zq":"在 Kubernetes 里让 Pod 使用 GPU，通常需要哪些组件？（多选）","o":["NVIDIA GPU driver on the node","NVIDIA Container Toolkit","NVIDIA device plugin or GPU Operator","MIG mode disabled on every GPU"],"zo":["节点上的 NVIDIA GPU 驱动","NVIDIA Container Toolkit","NVIDIA device plugin 或 GPU Operator","所有 GPU 必须关闭 MIG"],"ans":[0,1,2],"e":"The driver, the container toolkit and a device plugin (or the GPU Operator that deploys it) are the three pieces. MIG can stay enabled — the plugin advertises MIG devices as resources.","ze":"驱动、容器工具链、device plugin（或由 GPU Operator 部署）这三样是必需的。MIG 不必关闭——device plugin 会把 MIG 实例当作资源上报。","s":"","src":"lab"},{"id":"ms-xid-02","d":"6","m":1,"t":"ipmitool","c":"现场处置","q":"A node reports XID 79 (GPU has fallen off the bus). Which actions are appropriate? (select all that apply)","zq":"某节点报 XID 79（GPU 已从 PCIe 总线掉线），下列哪些处置是恰当的？（多选）","o":["Capture nvidia-bug-report.sh before anything destructive","Check temperature/power events and the BMC SEL","Run nvidia-smi --gpu-reset to bring it back","Plan a node reboot and a physical PCIe/power inspection"],"zo":["先采集 nvidia-bug-report.sh 再动任何破坏性操作","查看温度/供电事件与 BMC 的 SEL","执行 nvidia-smi --gpu-reset 尝试恢复","计划重启节点并检查 PCIe 与供电"],"ans":[0,1,3],"e":"XID 79 means the GPU is no longer reachable on the bus, so a GPU reset cannot work. Preserve evidence (bug report), look for thermal or power events in the SEL, then reboot and inspect the slot, riser and power cabling.","ze":"XID 79 表示 GPU 在总线上已不可达，GPU 重置不可能生效。应先保留证据（bug report），到 SEL 里找温度或供电事件，然后重启并检查插槽、转接卡与供电线缆。","s":"","src":"lab"},{"id":"ms-bug-01","d":"5","m":1,"t":"nvidia-bug-report","c":"最佳实践","q":"Which items does nvidia-bug-report.sh normally include? (select all that apply)","zq":"nvidia-bug-report.sh 生成的报告通常包含哪些内容？（多选）","o":["Kernel log (dmesg) including XID errors","PCIe topology","ECC counters","GPU purchase price"],"zo":["含 XID 错误的内核日志","PCIe 拓扑","ECC 计数器","GPU 采购价格"],"ans":[0,1,2],"e":"The bundle contains kernel logs with XID history, PCI device topology, ECC and page-retirement counters, driver and firmware versions, and system configuration. Commercial data such as price is obviously not included.","ze":"报告包内含带 XID 历史的内核日志、PCI 设备拓扑、ECC 与页退役计数、驱动与固件版本、系统配置；价格这类商业信息自然不会包含。","s":"","src":"lab"},{"id":"ms-bmc-01","d":"1","m":1,"t":"ipmitool","c":"命令语法","q":"Which items belong to BMC bring-up on a new node? (select all that apply)","zq":"新节点上架时，下列哪些属于 BMC 侧的初始化内容？（多选）","o":["Management port IP configuration","NTP and time sync","TPM state verification","GPU serial number database"],"zo":["管理口 IP 配置","NTP 与时间同步","TPM 状态确认","GPU 序列号数据库"],"ans":[0,1,2],"e":"BMC bring-up covers IP/netmask/gateway, NTP, accounts, SEL policy and TPM state. A GPU serial number database is an asset-management task performed from the OS, not a BMC setting.","ze":"BMC 初始化包含 IP/掩码/网关、NTP、账号、SEL 策略与 TPM 状态；GPU 序列号数据库是在操作系统里做的资产管理工作，不是 BMC 设置。","s":"","src":"lab"},{"id":"ms-roce-01","d":"2","m":1,"t":"ethtool","c":"输出判读","q":"In a RoCE fabric, which counters deserve attention? (select all that apply)","zq":"RoCE 网络中，下列哪些计数器值得重点关注？（多选）","o":["PFC pause frames","RX/TX discards and errors","Symbol errors on the link","Chassis fan RPM"],"zo":["PFC pause 帧","收发丢弃与错误计数","链路符号错误","机箱风扇转速"],"ans":[0,1,2],"e":"Pause frames show congestion/flow-control pressure, discards and errors show drops, and symbol errors show physical-layer degradation. Fan RPM is a chassis sensor unrelated to RoCE behaviour.","ze":"Pause 帧反映拥塞与流控压力，收发丢弃与错误反映丢包，符号错误反映物理层劣化；风扇转速是机箱传感器，与 RoCE 行为无关。","s":"","src":"lab"},{"id":"ms-img-01","d":"3","m":1,"t":"pyxis","c":"最佳实践","q":"Which approaches let every node of a multi-node job use the same container image? (select all that apply)","zq":"多节点作业要让每台节点都能用同一镜像，哪些做法可行？（多选）","o":["Keep the .sqsh on shared storage","Pre-pull the image on every node","Rely only on the submit node's local cache","Let Pyxis import it on each node"],"zo":["把 .sqsh 放在共享存储","在各节点预拉取镜像","只依赖提交节点的本地缓存","让 Pyxis 在每台节点各自导入"],"ans":[0,1,3],"e":"Shared storage makes one image visible everywhere, pre-pulling prepares every node, and Pyxis imports on the fly per node when the image is absent. A submit-node-only cache leaves the other nodes without the file.","ze":"共享存储让一台机器上的镜像对所有节点可见，预拉取能提前准备好每台节点，Pyxis 在镜像缺失时就地导入；只靠提交节点的缓存，其他节点拿不到文件。","s":"","src":"lab"},{"id":"NCP-AII-P001","d":"1","m":0,"t":"","c":"1.1 Describe sequence of events for deployment and validation.","q":"A deployment team completes cluster installation and wants to verify that the pod settings match the expected specification before acceptance. Which action provides that evidence?","zq":"部署团队完成集群安装后，想在验收前确认 pod 的设置符合预期规格。哪项操作能提供这一证据？","o":["Run bcm-validate-pod and review its configuration check results.","Run nvidia-smi and review its GPU process listing.","Run ngc --version and review its CLI version string.","Run docker images and review its local image listing."],"zo":["运行 bcm-validate-pod，查看其配置检查结果。","运行 nvidia-smi，查看其 GPU 进程列表。","运行 ngc --version，查看 CLI 版本字符串。","运行 docker images，查看本地镜像列表。"],"a":0,"e":"Use configuration validation as a deployment gate before accepting the completed cluster.","ze":"把配置校验当作验收门槛，在确认整个集群达标之前不要签字。","or":["The post-install validation utility checks the completed pod setup against expected settings.","A GPU process listing does not validate the pod configuration.","The CLI version does not validate cluster settings.","Local image inventory does not verify the deployed pod specification."],"ref":"https://docs.nvidia.com/dgx-superpod/deployment-guide-dgx-superpod/latest/validation.html | DGX SuperPOD post-install configuration validation","s":"","src":"official"},{"id":"NCP-AII-P002","d":"1","m":0,"t":"","c":"1.1 Describe sequence of events for deployment and validation.","q":"A tested BCM software image is changed to include a new GPU driver. What should happen before that image is assigned to the remaining production nodes?","zq":"一个已通过测试的 BCM 软件镜像被修改，加入了新的 GPU 驱动。在把该镜像分配给其余生产节点之前，应当做什么？","o":["Provision a small pilot group and repeat relevant validation.","Copy the previous validation report into the new release record.","Assign the image broadly and collect its first validation afterward.","Increase the deployment batch size to shorten the rollout window."],"zo":["先划出一小组试点节点置备，并重复相关验证。","把上一次的验证报告复制到新的发布记录里。","直接大范围分配该镜像，之后再收集第一次验证结果。","增大部署批次规模，以缩短上线窗口。"],"a":0,"e":"Image changes invalidate assumptions based on the previous release; pilot validation provides evidence for rollout.","ze":"镜像一变，上次发布的假设就失效了；用试点验证为推广提供证据。","or":["A changed image needs testing on a limited group before wider rollout.","The previous report describes a different software stack.","Broad rollout before validation exposes more nodes to an untested change.","A larger batch does not establish that the changed image works."],"ref":"https://docs.nvidia.com/dgx/baseos-on-bcm-install-guide/managing-images-bcm.html | Clone, test, and roll out software image changes","s":"","src":"official"},{"id":"NCP-AII-P003","d":"1","m":0,"t":"","c":"1.2 Describe network topologies for AI Factories.","q":"An AI factory’s storage traffic competes with distributed-training communication on a shared network. The approved design provides separate fabrics. Which change follows that design?","zq":"某 AI 工厂的存储流量与分布式训练通信挤在同一张网络上互相争抢。已批准的设计要求使用彼此分离的 fabric。哪种改动符合该设计？","o":["Move storage data traffic onto the designated storage fabric.","Move storage data traffic onto the designated BMC management fabric.","Move training collectives onto the designated BMC management fabric.","Move training collectives onto the designated server provisioning fabric."],"zo":["把存储数据流量迁移到指定的存储 fabric 上。","把存储数据流量迁移到指定的 BMC 管理 fabric 上。","把训练集合通信迁移到指定的 BMC 管理 fabric 上。","把训练集合通信迁移到指定的服务器置备 fabric 上。"],"a":0,"e":"Use the intended compute and storage data paths to preserve the separation specified by the architecture.","ze":"按架构规定使用各自的计算与存储数据路径，保持两者的分离。","or":["The storage fabric separates storage I/O from training communication.","BMC management connectivity is not the designated storage data path.","Management ports are not the designated collective-communication path.","Provisioning connectivity does not replace the designed compute fabric."],"ref":"https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-b200/latest/network-fabrics.html | Storage Fabric and Compute Fabric","s":"","src":"official"},{"id":"NCP-AII-P004","d":"1","m":0,"t":"","c":"1.3 Perform initial configuration of BMC, OOB and TPM.","q":"A newly configured DGX BMC responds to administrators on its local subnet but cannot respond through the routed management network. Its address and subnet mask are correct. Which BMC setting should be checked next?","zq":"一台新配置的 DGX BMC 在本子网内能响应管理员访问，但经路由管理网络访问时没有响应。它的地址与子网掩码都没问题。接下来应检查哪项 BMC 设置？","o":["The default gateway for the management network.","The subnet mask for the host data network.","The default gateway for the host data network.","The DHCP scope for the host data network."],"zo":["管理网络的默认网关。","主机数据网络的子网掩码。","主机数据网络的默认网关。","主机数据网络的 DHCP 作用域。"],"a":0,"e":"A static BMC configuration includes an IP address, subnet mask, and default gateway.","ze":"BMC 的静态配置包含 IP 地址、子网掩码和默认网关三部分。","or":["The BMC needs the management gateway to reach remote subnets.","The host data-network mask does not configure the BMC’s routed return path.","The host data gateway does not replace the BMC gateway.","The host’s DHCP scope does not fix a statically configured BMC return path."],"ref":"https://docs.nvidia.com/dgx/dgxh100-user-guide/bmc.html | Configuring a BMC Static Address Using ipmitool","s":"","src":"official"},{"id":"NCP-AII-P005","d":"1","m":0,"t":"","c":"1.4 Perform firmware upgrades (including on HGXs) and fault detection.","q":"A DGX firmware inventory reports a supported component’s installed version below the approved package version. Which action best establishes the scope of the required update?","zq":"DGX 固件清单显示，某个受支持部件已安装的版本低于批准的包版本。哪项操作最能界定本次需要更新的范围？","o":["Compare component inventory against the approved package’s version matrix.","Compare the package download time against the server’s boot time.","Compare the GPU utilization against the server’s workload schedule.","Compare the OS release name against the package’s archive filename."],"zo":["把部件清单与批准包中的版本矩阵逐项比对。","把包的下载时间与服务器启动时间做比较。","把 GPU 利用率与服务器的工作负载排期做比较。","把操作系统发行版名称与包的归档文件名做比较。"],"a":0,"e":"Plan a firmware update from installed component versions and the approved package contents.","ze":"以“已安装版本”对比“批准包内容”来规划这次固件更新。","or":["Installed and package versions identify the components requiring an update.","Timestamps do not establish which firmware components differ.","Utilization does not identify component firmware versions.","Release names and archive names do not replace a component comparison."],"ref":"https://docs.nvidia.com/dgx/dgxh100-fw-update-guide/view-fw-components-packages.html | Viewing Installed Firmware and Package Versions","s":"","src":"official"},{"id":"NCP-AII-P006","d":"1","m":0,"t":"","c":"1.4 Perform firmware upgrades (including on HGXs) and fault detection.","q":"After a firmware update, the procedure calls for a power cycle to activate a component. The update tool reports a successful transfer. What should the administrator do before closing the maintenance record?","zq":"一次固件更新之后，流程要求执行电源循环来激活某个部件。更新工具报告传输成功。管理员在关闭维护记录之前应当做什么？","o":["Complete the specified activation and verify the installed component version.","Record the successful transfer as proof of the active component version.","Delete the package archive and retain its original download completion message.","Run a short application job and omit the component inventory comparison."],"zo":["完成规定的激活步骤，并核对已安装部件的版本。","把“传输成功”记录下来，作为该部件版本已生效的证明。","删除包归档，只保留最初下载完成的消息。","跑一个短应用作业，跳过部件清单的比对。"],"a":0,"e":"Firmware installation includes the documented activation step and a subsequent inventory check.","ze":"固件安装包含文档规定的激活步骤，以及随后的清单核对。","or":["Transfer success does not replace required activation and version verification.","The transfer result does not prove that the new firmware is active.","Removing an archive does not activate or verify firmware.","Application execution does not establish the exact installed component version."],"ref":"https://docs.nvidia.com/dgx/dgxh100-fw-update-guide/sequence.html | Firmware update activation and verification steps","s":"","src":"official"},{"id":"NCP-AII-P007","d":"1","m":0,"t":"","c":"1.5 Validate power and cooling prarameters","q":"A rack’s room temperature remains normal, but server inlet temperatures rise during sustained GPU load. Which facility check most directly addresses this observation?","zq":"机柜的房间温度正常，但在 GPU 持续满载时服务器进风口温度升高。哪项机房侧检查最能直接解释这一现象？","o":["Check for hot exhaust recirculating into the rack’s intake.","Use the room-average temperature to certify the rack’s cooling.","Lower the temperature alarm threshold without changing the airflow path.","Use the server’s idle temperatures to certify its loaded cooling."],"zo":["检查是否有热排风回卷进机柜进风口。","用房间平均温度来证明该机柜散热合格。","在不改变气流路径的前提下调低温度告警阈值。","用服务器的空闲温度来证明其带载散热合格。"],"a":0,"e":"Validate cooling at the server inlet and inspect airflow containment under representative load.","ze":"在服务器进风处验证散热，并在代表性负载下检查气流封闭情况。","or":["Exhaust recirculation can heat server inlets despite a normal room-average reading.","The observation shows that room temperature is not representative of inlet conditions.","Changing an alarm threshold does not correct the cooling problem.","Idle temperature does not validate the stated high-load cooling condition."],"ref":"https://docs.nvidia.com/dgx-superpod/design-guides/dgx-superpod-data-center-design-h100/latest/cooling.html | Airflow and hot-air containment","s":"","src":"official"},{"id":"NCP-AII-P008","d":"1","m":0,"t":"","c":"1.6 Install GPU based servers (SMI). Includes creating template for HGX - list what commands are necessary.","q":"An administrator builds a repeatable HGX acceptance report using nvidia-smi. Which set of fields best identifies each GPU and documents the installed driver?","zq":"管理员想用 nvidia-smi 生成一份可重复使用的 HGX 验收报告。哪组字段最能标识每块 GPU 并记录已安装的驱动？","o":["GPU UUID, PCI bus identifier, model name, and driver version.","GPU utilization, process identifier, process name, and process memory usage.","GPU temperature, fan speed, power draw, and current graphics clock.","GPU memory usage, encoder utilization, decoder utilization, and current memory clock."],"zo":["GPU UUID、PCI 总线标识、型号名称和驱动版本。","GPU 利用率、进程 ID、进程名和进程显存占用。","GPU 温度、风扇转速、功耗和当前图形时钟。","GPU 显存占用、编码器利用率、解码器利用率和当前显存时钟。"],"a":0,"e":"A reusable installation report separates inventory identity from changing runtime measurements.","ze":"可复用的安装报告应把“资产身份”与“会变化的运行指标”区分开。","or":["These fields associate physical devices with stable identities and the driver release.","Process fields describe workload activity rather than inventory and driver version.","Operating metrics do not provide the requested device and driver identification.","Usage metrics do not identify the driver release or physical device mapping."],"ref":"https://docs.nvidia.com/deploy/nvidia-smi/index.html | Query GPU identification and driver version fields","s":"","src":"official"},{"id":"NCP-AII-P009","d":"1","m":0,"t":"","c":"1.7 Validate installed hardware","q":"The build manifest specifies eight GPUs of one model. The operating system lists eight devices, but one reports a different model. What should the engineer do before acceptance?","zq":"构建清单规定 8 块同型号 GPU。操作系统列出了 8 个设备，但其中一块报告的是不同型号。工程师在验收前应当做什么？","o":["Reconcile the model discrepancy against the approved hardware manifest.","Accept the installation because the reported device count is correct.","Change the manifest to match the discovered devices without investigation.","Reduce the application’s requested GPU count to conceal the discrepancy."],"zo":["把型号差异与已批准的硬件清单核对，弄清原因。","因为设备数量正确，直接接受这次安装。","不做调查，直接修改清单去迁就发现的设备。","降低应用申请的 GPU 数量，把差异掩盖过去。"],"a":0,"e":"Compare discovered hardware identities with the approved configuration before accepting the build.","ze":"硬件验收不只看数量，还要比对设备身份是否符合批准配置。","or":["Hardware acceptance includes the specified device types as well as counts.","A correct count does not resolve an incorrect model.","Changing the manifest without approval obscures a configuration mismatch.","Reducing application allocation does not correct the installed hardware."],"ref":"https://docs.nvidia.com/deploy/nvidia-smi/index.html | GPU product name and device inventory","s":"","src":"official"},{"id":"NCP-AII-P010","d":"1","m":0,"t":"","c":"1.7 Validate installed hardware","q":"Two GPUs are physically replaced, and the administrator needs to update asset records without depending on changing device index numbers. Which identifier is appropriate?","zq":"两块 GPU 被物理更换，管理员需要更新资产记录，且不能依赖会变化的设备索引号。应当使用哪个标识？","o":["The UUID reported for each physical GPU.","The current process identifier using each GPU.","The current utilization percentage on each GPU.","The current memory allocation on each GPU."],"zo":["每块物理 GPU 上报的 UUID。","当前正在使用该 GPU 的进程 ID。","该 GPU 当前的利用率百分比。","该 GPU 当前的显存分配量。"],"a":0,"e":"Use persistent device identifiers when reconciling replacement hardware and asset records.","ze":"对更换硬件与资产记录进行核对时，要用持久不变的设备标识。","or":["A GPU UUID identifies the device independently of its enumeration index.","A process ID identifies a transient process, not the GPU asset.","Utilization changes with workload and is not a device identity.","Memory allocation changes with workload and is not a device identity."],"ref":"https://docs.nvidia.com/deploy/nvidia-smi/index.html | GPU UUID and enumeration-order considerations","s":"","src":"official"},{"id":"NCP-AII-P011","d":"1","m":0,"t":"","c":"1.8 Describe and validate cable types and transceivers","q":"A specified 400G DR4 optical module requires single-mode fiber with an MPO/APC interface. Which patch cable matches those requirements?","zq":"指定的 400G DR4 光模块要求单模光纤、MPO/APC 接口。哪根跳线符合这些要求？","o":["A single-mode patch cable with matching MPO/APC connectors.","A multimode patch cable with matching MPO/APC connectors.","A single-mode patch cable with matching MPO/UPC connectors.","A multimode patch cable with matching MPO/UPC connectors."],"zo":["单模跳线，配匹配的 MPO/APC 连接器。","多模跳线，配匹配的 MPO/APC 连接器。","单模跳线，配匹配的 MPO/UPC 连接器。","多模跳线，配匹配的 MPO/UPC 连接器。"],"a":0,"e":"Validate the specified optical interface rather than choosing a cable by line rate alone.","ze":"要按指定的光接口来选线，不能只看线路速率。","or":["This cable matches both the fiber type and connector polish required by the module.","Matching connectors do not compensate for the wrong fiber type.","UPC polish does not match the specified APC interface.","Both the fiber type and connector polish differ from the requirement."],"ref":"https://networking-docs.nvidia.com/mms4x00ns400 | MMS4X00-NS400 optical interface and fiber requirements","s":"","src":"official"},{"id":"NCP-AII-P012","d":"1","m":0,"t":"","c":"1.9 Install physical GPUs","q":"A server is approved for an A100 PCIe card, but the delivered part is an A100 SXM module. What should the technician do before physical installation?","zq":"某服务器批准安装的是 A100 PCIe 卡，但到货的是 A100 SXM 模块。技术员在动手安装之前应当做什么？","o":["Obtain the approved PCIe card instead of installing the SXM module.","Install the SXM module after changing the PCIe slot’s boot priority.","Install the SXM module after increasing the PCIe slot’s link speed.","Install the SXM module after updating the host’s CUDA Toolkit version."],"zo":["按批准配置换领 PCIe 卡，而不是硬装 SXM 模块。","改掉 PCIe 插槽的启动优先级后再装 SXM 模块。","提高 PCIe 插槽的链路速率后再装 SXM 模块。","更新主机的 CUDA Toolkit 版本后再装 SXM 模块。"],"a":0,"e":"Match the physical GPU form factor to the approved server configuration before installation.","ze":"安装前先让 GPU 的物理形态与已批准的服务器配置相匹配。","or":["PCIe cards and SXM modules use different physical integration; the server requires its approved PCIe form factor.","Boot priority cannot convert an SXM module into a PCIe card.","PCIe speed settings cannot change the module’s physical interface.","A software update cannot change an SXM module’s physical form factor."],"ref":"https://images.nvidia.com/data-center/a100/a100-datasheet.pdf | A100 specifications; PCIe and SXM form factors","s":"","src":"official"},{"id":"NCP-AII-P013","d":"1","m":0,"t":"","c":"1.10 Validate hardware operation for workloads","q":"A node passes a GPU inventory check. The acceptance plan also requires evidence that compute and memory paths work under load. Which next step satisfies that requirement?","zq":"某节点通过了 GPU 清单检查。验收计划还要求提供“计算与显存通路在负载下可用”的证据。哪一步能满足该要求？","o":["Run the appropriate active diagnostics on an idle reserved node.","Repeat the inventory listing with a more detailed output format.","Compare the container registry tags with the approved image list.","Export the management interface configuration to the acceptance report."],"zo":["在一台空闲且被预留的节点上运行为此设计的主动诊断。","用更详细的输出格式再跑一次清单列举。","把容器仓库标签与已批准的镜像清单做比对。","把管理接口配置导出到验收报告里。"],"a":0,"e":"Inventory and active functional testing establish different parts of workload readiness.","ze":"清单列举与主动功能测试，证明的是“负载就绪”的不同部分。","or":["Active diagnostics exercise hardware paths rather than merely enumerate devices.","A detailed listing still does not exercise compute and memory paths.","Registry tags do not test the node’s hardware execution paths.","Management configuration is not evidence of loaded compute and memory operation."],"ref":"https://docs.nvidia.com/datacenter/dcgm/latest/reference/diagnostics/plugins/index.html | Compute, memory, and stress diagnostic purposes","s":"","src":"official"},{"id":"NCP-AII-P014","d":"1","m":0,"t":"","c":"1.10 Validate hardware operation for workloads","q":"An active diagnostic fails while another job occupies the tested GPUs. What should the administrator do to obtain a meaningful acceptance result?","zq":"主动诊断在别的作业正占用被测 GPU 时失败。管理员应当怎么做才能拿到有意义的验收结果？","o":["Reserve the GPUs, remove workload interference, and rerun the diagnostic.","Increase the acceptance threshold to accommodate the concurrent application’s resource use.","Classify the GPUs as faulty based on the contested diagnostic result.","Substitute the application’s process listing for the required active diagnostic result."],"zo":["把这些 GPU 预留出来、排除作业干扰，然后重跑诊断。","提高验收阈值以容纳并发应用的资源占用。","依据这次受干扰的诊断结果，把这些 GPU 判为故障。","用应用的进程列表替代所需的主动诊断结果。"],"a":0,"e":"Prepare an idle test environment before interpreting active diagnostic failures.","ze":"在解读主动诊断的失败之前，先准备好空闲的测试环境。","or":["An isolated test avoids workload interference that can invalidate diagnostic results.","Changing thresholds does not remove the interfering workload.","A contested result is insufficient to conclude that the GPU hardware is faulty.","A process listing does not provide equivalent active-test evidence."],"ref":"https://docs.nvidia.com/datacenter/dcgm/latest/learn/modules/dcgm-diagnostics.html | Preparation and workload interference","s":"","src":"official"},{"id":"NCP-AII-P015","d":"1","m":0,"t":"","c":"1.11 Configure initial parameters for 3rd party storage.","q":"A third-party NAS export will hold shared training data. Each worker’s jobs expect the data at the same filesystem path. Which initial configuration supports this requirement?","zq":"一个第三方 NAS 导出将用于存放共享训练数据。每台 worker 上的作业都期望在同一个文件系统路径下访问数据。哪种初始配置满足该要求？","o":["Configure the intended export and mount path consistently across the workers.","Use a different export on each worker without changing the application path.","Configure the intended export on the head node and omit worker mounts.","Place the storage server’s export path in each worker’s GPU device list."],"zo":["在所有 worker 上一致地配置该导出与挂载路径。","每台 worker 用不同的导出，但保持应用路径不变。","只在头节点配置该导出，省略 worker 的挂载。","把存储服务器的导出路径写进每台 worker 的 GPU 设备列表。"],"a":0,"e":"Configure storage exports and worker mount points to provide the shared namespace expected by the workloads.","ze":"配置存储导出与 worker 挂载点，为负载提供它们期望的共享命名空间。","or":["Workers need consistent access to the shared path used by the application.","Different exports do not provide the intended common dataset namespace.","A head-node mount does not make that path available on every worker.","GPU device lists do not configure filesystem mounts."],"ref":"https://docs.nvidia.com/dgx-superpod/deployment-guide-dgx-superpod/latest/high-availability.html | Shared Storage setup; exports and worker mounts","s":"","src":"official"},{"id":"NCP-AII-P016","d":"2","m":0,"t":"","c":"2.1 Configure and manage a Bluefield Network Platform.","q":"A BlueField-3 maintenance plan calls for updating firmware components while preserving its Arm operating system and installed DOCA software. Which image type matches that scope?","zq":"一份 BlueField-3 维护计划要求更新固件组件，同时保留其 Arm 操作系统与已安装的 DOCA 软件。哪种镜像类型符合该范围？","o":["A BF-fwBundle BFB containing the firmware components.","A BF-Bundle BFB containing firmware and system software.","An Arm OS repository package containing DOCA libraries.","A host repository package containing DOCA runtime libraries."],"zo":["只包含固件组件的 BF-fwBundle BFB。","同时包含固件与系统软件的 BF-Bundle BFB。","包含 DOCA 库的 Arm 操作系统仓库包。","包含 DOCA 运行时库的主机仓库包。"],"a":0,"e":"Choose a BlueField image whose contents match the intended maintenance scope.","ze":"选择的 BlueField 镜像，其内容要与这次维护的目标范围一致。","or":["The firmware-only bundle preserves the Arm OS and installed DOCA software.","A full bundle includes the Arm OS and DOCA, exceeding the maintenance scope.","A DOCA library package does not provide the complete firmware bundle.","Host runtime libraries do not update the BlueField platform firmware."],"ref":"https://docs.nvidia.com/doca/sdk/bf-bundle-installation-and-upgrade/ | BF-Bundle and firmware-only bundle image types","s":"","src":"official"},{"id":"NCP-AII-P017","d":"2","m":0,"t":"","c":"2.2 Configure MIG (AI, and HPC)","q":"MIG mode is enabled on a supported GPU, but no instances have been created. A user expects to schedule an isolated GPU workload. What configuration step is still needed?","zq":"某受支持的 GPU 已启用 MIG 模式，但还没有创建任何实例。用户希望调度一个隔离的 GPU 工作负载。还需要哪一步配置？","o":["Create a GPU instance and a corresponding compute instance.","Enable persistence mode and set a GPU application clock.","Assign a physical GPU UUID to the scheduler’s resource list.","Set CUDA_VISIBLE_DEVICES to the physical GPU’s current device index."],"zo":["创建一个 GPU 实例（GI）及其对应的计算实例（CI）。","启用持久化模式并设置 GPU 应用时钟。","把一个物理 GPU 的 UUID 写进调度器的资源列表。","把 CUDA_VISIBLE_DEVICES 设为该物理 GPU 当前的设备索引。"],"a":0,"e":"Enabling MIG mode and creating usable MIG instances are separate configuration steps.","ze":"“启用 MIG 模式”与“创建可用的 MIG 实例”是两个独立的配置步骤。","or":["GPU and compute instances provide usable MIG execution devices.","Persistence and clock settings do not create MIG instances.","Listing the physical UUID does not instantiate an isolated MIG execution device.","Selecting the physical index does not create the needed MIG instances."],"ref":"https://docs.nvidia.com/datacenter/tesla/mig-user-guide/getting-started-with-mig.html | Creating GPU and Compute Instances","s":"","src":"official"},{"id":"NCP-AII-P018","d":"2","m":0,"t":"","c":"2.2 Configure MIG (AI, and HPC)","q":"A supported MIG GPU has seven equal instances in use. A planned job requires a larger GPU instance than any currently available. What should the administrator plan?","zq":"一块受支持 MIG 的 GPU 上，7 个等大实例都在使用中。一个已排期的作业需要比现有任何实例都更大的 GPU 实例。管理员应如何规划？","o":["Drain affected workloads and recreate instances with a suitable supported profile.","Combine the existing device UUIDs into a larger virtual device identifier.","Increase container shared memory to enlarge the assigned GPU instance’s memory.","Assign the same small instance to additional processes to enlarge its resources."],"zo":["把受影响的工作负载 drain 掉，按受支持的合适 profile 重建实例。","把现有设备 UUID 合并成一个更大的虚拟设备标识。","加大容器共享内存，以扩大已分配 GPU 实例的显存。","把同一个小实例重复分配给更多进程，以扩大其资源。"],"a":0,"e":"MIG resource sizes follow supported instance profiles; change the instance layout to provide a larger partition.","ze":"MIG 的资源尺寸由受支持的实例 profile 决定，要改动实例布局才能得到更大的分区。","or":["Instance geometry must be reconfigured using a supported profile with sufficient resources.","Concatenating UUIDs does not merge MIG hardware resources.","Container shared memory is host memory and does not enlarge a MIG partition.","More processes share the existing partition rather than enlarge it."],"ref":"https://docs.nvidia.com/datacenter/tesla/mig-user-guide/getting-started-with-mig.html | Instance profiles, placement, and instance lifecycle","s":"","src":"official"},{"id":"NCP-AII-P019","d":"3","m":0,"t":"","c":"3.1 Install BCM, configure and verify HA.","q":"A BCM deployment uses two head nodes in an HA pair. Administrators need one connection address that follows the active head node. Which address should they use?","zq":"一套 BCM 部署用两台头节点组成 HA 对。管理员需要一个能跟随“当前活动头节点”的连接地址。应当使用哪个地址？","o":["The external virtual IP configured for the HA pair.","The fixed external IP configured for the primary head node.","The fixed external IP configured for the secondary head node.","The fixed management IP configured for a worker node."],"zo":["为该 HA 对配置的外部虚拟 IP。","为主头节点配置的固定外部 IP。","为备头节点配置的固定外部 IP。","为某台 worker 节点配置的固定管理 IP。"],"a":0,"e":"Connect to the HA virtual address when the endpoint needs to follow the active role.","ze":"当连接端点需要跟随活动角色时，就连 HA 的虚拟地址。","or":["The HA external VIP provides an endpoint for the active head node.","The primary’s fixed address continues to identify that physical head node.","The secondary’s fixed address identifies that node rather than the active role.","A worker management address is not the HA management endpoint."],"ref":"https://docs.nvidia.com/dgx-superpod/deployment-guide-dgx-superpod/latest/high-availability.html | External virtual IP for active head-node access","s":"","src":"official"},{"id":"NCP-AII-P020","d":"3","m":0,"t":"","c":"3.1 Install BCM, configure and verify HA.","q":"After BCM HA setup, both head nodes are reachable. The acceptance plan requires the shared application and user files to remain available from either head node. Which check addresses this requirement?","zq":"BCM 的 HA 配置完成后，两台头节点都能访问。验收计划要求共享的应用文件与用户文件在任一节点上都可访问。哪项检查能覆盖这一要求？","o":["Verify /cm/shared and /home use the configured shared storage mounts.","Verify each head node has a different local hostname and IP.","Verify each head node can list the cluster’s installed GPU models.","Verify each head node can download the cluster’s approved container image."],"zo":["确认 /cm/shared 与 /home 使用的是已配置的共享存储挂载。","确认每台头节点各有不同的本地主机名与 IP。","确认每台头节点都能列出集群已安装的 GPU 型号。","确认每台头节点都能下载集群批准的容器镜像。"],"a":0,"e":"Head-node reachability alone does not demonstrate the shared-storage portion of HA configuration.","ze":"仅“两台头节点都能访问”并不能证明 HA 配置中的共享存储部分成立。","or":["Shared mounts provide the common application and user data paths required by the HA setup.","Unique identities do not establish shared-file availability.","GPU inventory does not establish access to the shared file paths.","Image download access does not verify the application and user mounts."],"ref":"https://docs.nvidia.com/dgx-superpod/deployment-guide-dgx-superpod/latest/high-availability.html | Shared Storage setup and mount verification","s":"","src":"official"},{"id":"NCP-AII-P021","d":"3","m":0,"t":"","c":"3.2 Install OS.","q":"An administrator needs to update a BCM worker OS image while preserving a tested rollback version. Which approach supports that goal?","zq":"管理员要更新某台 BCM worker 的操作系统镜像，同时保留一个已验证的回滚版本。哪种做法能达成该目标？","o":["Clone the current software image and modify the clone.","Modify the current software image and discard its previous contents.","Modify the head node’s root filesystem instead of the worker image.","Modify the registry’s image label instead of the worker image."],"zo":["克隆当前软件镜像，在克隆体上修改。","直接修改当前软件镜像，丢弃它原有的内容。","修改头节点的根文件系统，而不动 worker 镜像。","改镜像仓库里的镜像标签，而不动 worker 镜像。"],"a":0,"e":"Preserve a known-good image when preparing an OS change for managed worker nodes.","ze":"为受管 worker 准备操作系统变更时，要保留一个已知可用的镜像。","or":["Cloning preserves the existing worker image while the replacement is prepared and tested.","In-place replacement removes the readily available tested version.","Changing the head node’s filesystem does not update the worker provisioning image.","A registry label does not modify the BCM worker OS image."],"ref":"https://docs.nvidia.com/dgx/baseos-on-bcm-install-guide/managing-images-bcm.html | Clone an image before changing production software","s":"","src":"official"},{"id":"NCP-AII-P022","d":"3","m":0,"t":"","c":"3.3 Install Cluster (configure category (BCM term, cluster level settings, grouping nodes), configure interfaces (node config), install Slurm/Enroot/Pyxis).","q":"An administrator adds container support to Slurm using Enroot and Pyxis. What role does Pyxis provide?","zq":"管理员用 Enroot 与 Pyxis 为 Slurm 增加容器支持。Pyxis 在这里承担什么角色？","o":["It integrates Enroot container execution with Slurm job launch.","It provisions worker operating systems through the BCM head node.","It replaces the host GPU driver with a container driver.","It creates MIG partitions through the Slurm accounting database."],"zo":["把 Enroot 的容器执行与 Slurm 的作业启动集成起来。","通过 BCM 头节点为 worker 置备操作系统。","用容器内的驱动替换主机的 GPU 驱动。","通过 Slurm 记账数据库创建 MIG 分区。"],"a":0,"e":"Enroot runs containers, and Pyxis connects that capability to Slurm jobs.","ze":"Enroot 负责跑容器，Pyxis 把这项能力接到 Slurm 作业上。","or":["Pyxis is the Slurm SPANK plugin that exposes Enroot container execution during job launch.","BCM provisioning is a different control-plane function.","Containers still depend on the host driver; Pyxis does not replace it.","Pyxis does not create hardware partitions through accounting records."],"ref":"https://github.com/NVIDIA/pyxis | Pyxis purpose and Slurm SPANK integration","s":"","src":"official"},{"id":"NCP-AII-P023","d":"3","m":0,"t":"","c":"3.3 Install Cluster (configure category (BCM term, cluster level settings, grouping nodes), configure interfaces (node config), install Slurm/Enroot/Pyxis).","q":"A Slurm installation includes Pyxis, but srun rejects --container-image as an unknown option. Which configuration should the administrator inspect first?","zq":"某套 Slurm 已安装 Pyxis，但 srun 把 --container-image 当成未知选项拒绝。管理员应先检查哪项配置？","o":["The Slurm SPANK configuration that loads the Pyxis plugin.","The Enroot cache directory used to hold imported container images.","The Docker daemon configuration used to hold container runtime settings.","The NGC registry configuration used to hold organization access settings."],"zo":["加载 Pyxis 插件的 Slurm SPANK 配置。","用来存放已导入容器镜像的 Enroot 缓存目录。","用来存放容器运行时设置的 Docker 守护进程配置。","用来存放组织访问设置的 NGC 仓库配置。"],"a":0,"e":"Check plugin loading when Slurm does not recognize an option supplied by Pyxis.","ze":"当 Slurm 不认识由 Pyxis 提供的选项时，先查插件是否被加载。","or":["Pyxis registers srun container options through Slurm’s SPANK configuration.","Cache configuration can affect imports but does not register srun options.","Docker configuration does not load the Pyxis Slurm plugin.","Registry credentials do not register srun options."],"ref":"https://github.com/NVIDIA/pyxis | Installation; plugstack.conf configuration","s":"","src":"official"},{"id":"NCP-AII-P024","d":"3","m":0,"t":"","c":"3.4 Install/update/remove NVIDIA GPU and DOCA drivers.","q":"An NVIDIA driver installation uses DKMS to build a module for the running Linux kernel. Which prerequisite should be verified?","zq":"一次 NVIDIA 驱动安装使用 DKMS 为当前运行的内核构建模块。应当先确认哪项前提条件？","o":["The installed kernel headers match the running kernel version.","The installed kernel headers match a previously retired kernel version.","The installed CUDA Toolkit matches the application’s build requirements.","The installed Linux compiler matches the application’s language standard."],"zo":["已安装的内核头文件与当前运行的内核版本一致。","已安装的内核头文件与某个早已退役的内核版本一致。","已安装的 CUDA Toolkit 与应用的构建要求一致。","已安装的 Linux 编译器与应用的编程语言标准一致。"],"a":0,"e":"Check operating-system build prerequisites before installing a kernel-dependent GPU driver.","ze":"安装依赖内核的 GPU 驱动之前，先检查操作系统的构建前提。","or":["A module build needs headers for the kernel that will load it.","Headers for a different retired kernel do not satisfy the stated build.","CUDA Toolkit selection does not provide matching kernel headers.","An application language standard does not establish the required kernel development files."],"ref":"https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/latest/pre-installation-actions.html | Kernel headers and development packages","s":"","src":"official"},{"id":"NCP-AII-P025","d":"3","m":0,"t":"","c":"3.4 Install/update/remove NVIDIA GPU and DOCA drivers.","q":"A GPU driver installed through the distribution’s package manager needs removal. Which approach follows the documented installation method?","zq":"一个通过发行版包管理器安装的 GPU 驱动需要卸载。哪种做法符合其文档化的安装方式？","o":["Remove the driver through the distribution’s package management tools.","Delete the driver’s shared libraries directly from the filesystem.","Remove the CUDA application’s source directory from the filesystem.","Delete the Docker image that previously used the GPU."],"zo":["通过发行版的包管理工具卸载该驱动。","直接从文件系统中删除该驱动的共享库。","从文件系统中删除 CUDA 应用的源码目录。","删除此前用过该 GPU 的 Docker 镜像。"],"a":0,"e":"Match the driver removal procedure to its original installation method.","ze":"卸载驱动的步骤要与它当初的安装方式匹配。","or":["Package-managed installations should be removed using the corresponding package manager.","Manual library deletion can leave package records and dependencies inconsistent.","Removing application source does not uninstall the host driver.","Removing a container image does not uninstall the host driver."],"ref":"https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/latest/removing-the-driver.html | Package-manager removal and runfile removal methods","s":"","src":"official"},{"id":"NCP-AII-P026","d":"3","m":0,"t":"","c":"3.5 Install the NVIDIA container tool kit.","q":"Docker works on a host, but GPU containers cannot access its devices. The NVIDIA Container Toolkit is installed. Which command configures its integration with Docker?","zq":"Docker 在该主机上工作正常，但 GPU 容器访问不到设备。NVIDIA Container Toolkit 已安装。哪条命令完成它与 Docker 的集成配置？","o":["Run nvidia-ctk runtime configure --runtime=docker on the host.","Run nvidia-smi --query-gpu=driver_version --format=csv on the host.","Run ngc config set to select the container registry organization.","Run docker image inspect to display the selected image metadata."],"zo":["在主机上执行 nvidia-ctk runtime configure --runtime=docker。","在主机上执行 nvidia-smi --query-gpu=driver_version --format=csv。","执行 ngc config set 选择容器仓库组织。","执行 docker image inspect 显示所选镜像的元数据。"],"a":0,"e":"Installing the toolkit and configuring the selected container runtime are separate steps.","ze":"“安装工具链”与“配置所选容器运行时”是两个独立步骤。","or":["The toolkit configuration command sets up the Docker runtime integration; the documented restart follows it.","Querying the driver version does not configure Docker’s NVIDIA runtime integration.","NGC registry configuration does not configure the local container runtime.","Image inspection does not configure runtime device access."],"ref":"https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html | Configuring Docker with nvidia-ctk","s":"","src":"official"},{"id":"NCP-AII-P027","d":"3","m":0,"t":"","c":"3.6 Demonstrate how to use NVIDIA GPUs with Docker.","q":"A GPU Docker container needs CUDA computation and nvidia-smi, but does not need graphics or video acceleration. Which NVIDIA_DRIVER_CAPABILITIES value matches that requirement?","zq":"一个 GPU Docker 容器需要 CUDA 计算能力和 nvidia-smi，不需要图形或视频加速。哪个 NVIDIA_DRIVER_CAPABILITIES 取值符合该要求？","o":["Set the value to compute,utility.","Set the value to graphics,display.","Set the value to video,display.","Set the value to graphics,video."],"zo":["设为 compute,utility。","设为 graphics,display。","设为 video,display。","设为 graphics,video。"],"a":0,"e":"Driver capabilities determine which host driver features are exposed to a GPU container.","ze":"驱动能力（capabilities）决定容器内暴露哪些主机驱动特性。","or":["Compute supports CUDA and utility supplies NVML and nvidia-smi capabilities.","Graphics and display do not provide the requested compute and utility pair.","Video and display do not provide the requested CUDA and utility pair.","Graphics and video do not provide the requested CUDA and utility pair."],"ref":"https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html | NVIDIA_DRIVER_CAPABILITIES","s":"","src":"official"},{"id":"NCP-AII-P028","d":"3","m":0,"t":"","c":"3.7 Install NGC CLI on hosts.","q":"An administrator extracts the NGC CLI successfully, but typing ngc returns command not found. Running the executable by its full path works. Which change resolves this shell-access issue?","zq":"管理员成功解压了 NGC CLI，但输入 ngc 提示找不到命令；用完整路径执行则可正常运行。哪种改动能解决这个 shell 访问问题？","o":["Add the executable’s directory to the user’s PATH.","Add the executable’s directory to the user’s CUDA_VISIBLE_DEVICES.","Add the executable’s directory to the user’s NVIDIA_DRIVER_CAPABILITIES.","Add the executable’s directory to the user’s NCCL_SOCKET_IFNAME."],"zo":["把该可执行文件所在目录加入用户的 PATH。","把该目录加入用户的 CUDA_VISIBLE_DEVICES。","把该目录加入用户的 NVIDIA_DRIVER_CAPABILITIES。","把该目录加入用户的 NCCL_SOCKET_IFNAME。"],"a":0,"e":"An executable that works by full path needs a shell search-path entry for invocation by name.","ze":"用全路径能跑的可执行文件，要能被名字调用就需要在 shell 的搜索路径里登记。","or":["PATH controls the directories the shell searches for executable commands.","CUDA_VISIBLE_DEVICES selects visible GPUs, not executable search directories.","NVIDIA_DRIVER_CAPABILITIES selects container driver features, not executable locations.","NCCL_SOCKET_IFNAME selects communication interfaces, not executable locations."],"ref":"https://docs.nvidia.com/brev/latest/guides/inference-deployment/ngc-developer-guide | Install NGC CLI; add executable directory to PATH","s":"","src":"official"},{"id":"NCP-AII-P029","d":"4","m":0,"t":"","c":"4.1 Perform single node stress test.","q":"A reserved GPU node needs a stress test of its power delivery under high GPU load. Which DCGM test is designed for that purpose?","zq":"一台已预留的 GPU 节点需要在 GPU 高负载下压测其供电能力。DCGM 里哪个测试就是为此设计的？","o":["The targeted_power test for controlled GPU power loading.","The software checks for installed GPU deployment prerequisites.","The context_create test for basic CUDA context initialization.","The memory_bandwidth test for local framebuffer transfer performance."],"zo":["targeted_power 测试，用于受控的 GPU 功率加载。","software 检查，用于核对已安装 GPU 的部署前提。","context_create 测试，用于基础 CUDA 上下文初始化。","memory_bandwidth 测试，用于本地帧缓存传输性能。"],"a":0,"e":"Choose the diagnostic workload that exercises the subsystem named in the acceptance requirement.","ze":"验收要求点名了哪个子系统，就选那个子系统对应的诊断负载。","or":["Targeted power drives GPUs toward a specified power load while monitoring operating conditions.","Software checks inspect deployment readiness without applying a stress load.","Creating a context does not provide the specified sustained power load.","Memory bandwidth measures local transfer performance rather than the requested power-loading target."],"ref":"https://docs.nvidia.com/datacenter/dcgm/latest/reference/diagnostics/plugins/index.html | Targeted power and diagnostic test purposes","s":"","src":"official"},{"id":"NCP-AII-P030","d":"4","m":0,"t":"","c":"4.2 Execute HPL (High-Performance Linpack).","q":"A cluster has four nodes with eight GPUs each. The NVIDIA HPL benchmark expects one GPU per MPI process. How many MPI processes should the full-cluster run launch?","zq":"某集群有 4 个节点、每节点 8 块 GPU。NVIDIA HPL 基准期望每个 MPI 进程对应一块 GPU。全集群运行时应当启动多少个 MPI 进程？","o":["32 MPI processes across the four nodes.","4 MPI processes across the four nodes.","8 MPI processes across the four nodes.","16 MPI processes across the four nodes."],"zo":["跨 4 个节点共 32 个 MPI 进程。","跨 4 个节点共 4 个 MPI 进程。","跨 4 个节点共 8 个 MPI 进程。","跨 4 个节点共 16 个 MPI 进程。"],"a":0,"e":"Match the MPI process count to the GPU count for this NVIDIA HPL execution model.","ze":"按该 NVIDIA HPL 的执行模型，让 MPI 进程数与 GPU 数一一对应。","or":["Four nodes times eight GPUs gives 32 GPUs and therefore 32 MPI processes.","Four processes would not assign one process to each GPU.","Eight processes would leave most of the cluster’s GPUs outside the required mapping.","Sixteen processes would assign fewer processes than the 32 available GPUs."],"ref":"https://docs.nvidia.com/nvidia-hpc-benchmarks/HPL_benchmark.html | One GPU per MPI process","s":"","src":"official"},{"id":"NCP-AII-P031","d":"4","m":0,"t":"","c":"4.3 Perform single node NCCL (include verify NVLink Switch).","q":"A single-node NCCL test on an eight-GPU server reports fast communication, but its output identifies four participating GPUs. What should happen before the result is accepted for the whole node?","zq":"一台 8 卡服务器上的单机 NCCL 测试报告通信很快，但输出显示只有 4 块 GPU 参与。在该结果被当作整机验收依据之前，应当做什么？","o":["Correct the launch to include the eight intended GPUs and rerun.","Accept the measured bandwidth as evidence for the eight installed GPUs.","Double the measured bandwidth to estimate the eight-GPU acceptance result.","Repeat the four-GPU run with a different output filename for acceptance."],"zo":["修正启动参数，把预期的 8 块 GPU 都纳入，然后重跑。","接受所测带宽，将其作为 8 块已装 GPU 的证据。","把所测带宽翻倍，估算 8 卡的验收结果。","换一个输出文件名，把这次 4 卡的结果再跑一遍。"],"a":0,"e":"Check NCCL test participation as well as its bandwidth result.","ze":"NCCL 测试既要看带宽结果，也要看实际参与的 GPU 数量。","or":["The acceptance test needs to exercise the complete intended GPU set.","A subset result does not validate communication through untested GPUs.","Arithmetic scaling is not a measured result for the full node.","Renaming a report does not change test participation."],"ref":"https://github.com/NVIDIA/nccl-tests | Test configuration; GPU count and parallel execution","s":"","src":"official"},{"id":"NCP-AII-P032","d":"4","m":0,"t":"","c":"4.3 Perform single node NCCL (include verify NVLink Switch).","q":"An NVSwitch server shows healthy GPU devices, but nvidia-smi reports that the GPU fabric state has not completed initialization. Which subsystem should be checked before single-node NCCL acceptance?","zq":"一台 NVSwitch 服务器显示 GPU 设备健康，但 nvidia-smi 报告 GPU fabric 状态尚未完成初始化。在单机 NCCL 验收之前应当检查哪个子系统？","o":["The Fabric Manager service and its initialization logs.","The persistence daemon service and its GPU initialization logs.","The Docker daemon service and its container initialization logs.","The Slurm accounting service and its job initialization logs."],"zo":["Fabric Manager 服务及其初始化日志。","persistence 守护进程服务及其 GPU 初始化日志。","Docker 守护进程服务及其容器初始化日志。","Slurm 记账服务及其作业初始化日志。"],"a":0,"e":"Device enumeration alone does not confirm that the NVSwitch communication fabric is ready.","ze":"仅“设备能被枚举”并不能证明 NVSwitch 通信 fabric 已就绪。","or":["Fabric Manager manages initialization of supported NVSwitch GPU fabrics.","Persistence keeps driver state but does not initialize the NVSwitch fabric.","Docker daemon logs do not establish the host GPU fabric’s initialization state.","Accounting logs do not establish GPU fabric initialization."],"ref":"https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting.html | GPU-to-GPU communication; NVSwitch and Fabric Manager","s":"","src":"official"},{"id":"NCP-AII-P033","d":"4","m":0,"t":"","c":"4.4 Validate cables by verifying signal quality.","q":"A new optical link negotiates the expected rate but accumulates uncorrectable FEC errors during load. Which interpretation best fits this validation result?","zq":"一条新的光链路协商到了预期速率，但在带载过程中累积了不可纠正的 FEC 错误。哪种解读最贴合该验证结果？","o":["Investigate the optical path’s error counters and physical connections.","Accept the link because its negotiated speed matches the design.","Increase application concurrency to compensate for the link’s error rate.","Increase the benchmark’s message size to compensate for the error rate."],"zo":["排查该光路径的错误计数器与物理连接。","因为协商速率符合设计，接受这条链路。","提高应用并发度来补偿链路的误码率。","加大基准测试的报文长度来补偿误码率。"],"a":0,"e":"Validate signal quality with error measurements rather than negotiated rate alone.","ze":"用错误测量来验证信号质量，而不是只看协商速率。","or":["Uncorrectable FEC errors warrant physical-path investigation despite successful rate negotiation.","Negotiated speed does not establish transmission integrity.","More application traffic does not correct physical transmission errors.","Larger messages do not correct an optical quality problem."],"ref":"https://docs.nvidia.com/networking/display/nvidia-firmware-tools-mft-documentation-v4-33-0.0.pdf | mlxlink physical counters and FEC error reporting","s":"","src":"official"},{"id":"NCP-AII-P034","d":"4","m":0,"t":"","c":"4.5 Confirm cabling is correct.","q":"A breakout cable provides four server links from one switch connector. The acceptance inventory currently records the parent cable but no branch endpoints. What should the cabling-validation record add?","zq":"一根 breakout 线从一个交换机端口分出 4 条服务器链路。验收清单目前只记录了母缆，没有记录各分支的端点。布线验证记录应当补充什么？","o":["Record and verify the switch and server endpoint of each branch.","Record the parent cable’s serial number as the complete topology record.","Record the parent cable’s aggregate rate as the complete topology record.","Record the switch’s management address as the complete topology record."],"zo":["记录并核实每个分支所连的交换机端点与服务器端点。","把母缆的序列号作为完整拓扑记录。","把母缆的聚合速率作为完整拓扑记录。","把交换机的管理地址作为完整拓扑记录。"],"a":0,"e":"Represent each breakout branch in the physical topology inventory so every connection can be validated and traced.","ze":"在物理拓扑清单里表示出每条分支，才能验证并追踪每一个连接。","or":["Each branch is a separate physical connection that needs endpoint validation.","A parent serial number does not identify where each branch is connected.","Aggregate rate does not identify individual branch endpoints.","A management address does not describe the physical branch-to-port mapping."],"ref":"https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-b200/latest/network-fabrics.html | Compute Fabric connectivity and prescribed topology","s":"","src":"official"},{"id":"NCP-AII-P035","d":"4","m":0,"t":"","c":"4.6 Confirm FW/SW on switches.","q":"A switch has the approved software image copied to local storage. The active software version is still the previous release. Which conclusion is correct?","zq":"某交换机已把批准的软件镜像拷贝到本地存储，但当前运行的软件版本仍是上一版。哪个结论正确？","o":["The switch has not yet met the approved running-version requirement.","The switch meets the requirement because the new image file is present.","The switch meets the requirement because the download completed without errors.","The switch meets the requirement because its hostname matches the inventory."],"zo":["该交换机尚未满足“运行批准版本”的要求。","满足要求，因为新镜像文件已经存在。","满足要求，因为下载过程没有报错。","满足要求，因为它的主机名与清单一致。"],"a":0,"e":"Confirm active switch firmware and software after the documented installation and reboot steps.","ze":"按文档完成安装与重启后，要确认交换机实际运行的固件与软件版本。","or":["Acceptance depends on the active version, not the presence of an image file.","An available image is not necessarily the running image.","Transfer success does not demonstrate activation of the software release.","A matching hostname does not verify software version."],"ref":"https://docs.nvidia.com/dgx-superpod/deployment-guide-dgx-superpod/latest/infiniband-switches.html | Software update and switch reboot","s":"","src":"official"},{"id":"NCP-AII-P036","d":"4","m":0,"t":"","c":"4.7 Confirm FW/SW on BlueField3","q":"After a BlueField-3 update, the NIC firmware matches the approved release, but the acceptance matrix also lists Arm OS and DOCA versions. What should the engineer verify next?","zq":"一次 BlueField-3 更新后，网卡固件已符合批准版本，但验收矩阵还列了 Arm OS 与 DOCA 版本。工程师接下来应核对什么？","o":["The installed Arm OS and DOCA releases against the matrix.","The NIC firmware release again using a different report filename.","The host GPU driver release as a substitute for the Arm OS.","The host CUDA Toolkit release as a substitute for the DOCA version."],"zo":["把已安装的 Arm OS 与 DOCA 版本对照矩阵核对。","换个报告文件名，再核对一遍网卡固件版本。","用主机 GPU 驱动版本来替代 Arm OS 版本。","用主机 CUDA Toolkit 版本来替代 DOCA 版本。"],"a":0,"e":"A BlueField NIC firmware result does not establish the versions of its other software components.","ze":"网卡固件合格，并不能说明它其它软件组件的版本也合格。","or":["The software stack has distinct components that each need comparison with the acceptance matrix.","Repeating a NIC check does not verify the other required components.","The host GPU driver is not the BlueField Arm OS.","The host CUDA Toolkit is not the installed BlueField DOCA release."],"ref":"https://docs.nvidia.com/doca/sdk/bf-bundle-installation-and-upgrade/ | BlueField software and firmware component versions","s":"","src":"official"},{"id":"NCP-AII-P037","d":"4","m":0,"t":"","c":"4.8 Confirm FW on transceivers.","q":"A managed optical module exposes a firmware revision in its inventory. The cable label lists a part number. Which evidence should be used to confirm that its firmware meets the approved baseline?","zq":"某个可管理的可插拔模块在其清单中给出了固件修订号，线缆标签上印的是部件号。应依据什么证据确认其固件符合批准的基线？","o":["Read the module’s reported revision and compare it with the baseline.","Read the cable’s part number and treat it as the installed revision.","Read the switch’s hostname and treat it as the installed revision.","Read the adapter’s link speed and treat it as the installed revision."],"zo":["读取模块上报的修订号，与基线比对。","读取线缆的部件号，当作已安装的固件修订号。","读取交换机的主机名，当作已安装的固件修订号。","读取适配器的链路速率，当作已安装的固件修订号。"],"a":0,"e":"Use the module’s firmware inventory when it exposes a revision; product identity and link rate are different attributes.","ze":"模块能给出修订号时就用它的固件清单；产品身份与链路速率是另外两类属性。","or":["The module-reported revision is direct evidence of its installed firmware level.","A part number identifies a product rather than its current firmware revision.","A switch hostname does not identify the module’s firmware revision.","Link speed does not identify the module’s installed firmware revision."],"ref":"https://docs.nvidia.com/networking/display/nvidia-firmware-tools-mft-documentation-v4-33-0.0.pdf | Querying firmware information from an AOC or transceiver; pages 127-128","s":"","src":"official"},{"id":"NCP-AII-P038","d":"4","m":0,"t":"","c":"4.9 Run ClusterKit to to perform a multifaceted node assessment.","q":"ClusterKit reports normal GPU memory bandwidth on each node, but one node repeatedly shows poor bandwidth to several peers. Which follow-up best targets the abnormal result?","zq":"ClusterKit 报告每个节点的 GPU 显存带宽都正常，但某个节点对多个对端的带宽反复偏低。哪种后续动作最能针对这个异常结果？","o":["Investigate that node’s network path using the pairwise results.","Replace that node’s GPUs based on the local memory results.","Average the poor peer results into the cluster’s overall bandwidth.","Rerun local memory tests as a replaceme
