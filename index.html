nt for pairwise validation."],"zo":["用成对（pairwise）结果排查该节点的网络路径。","依据本地显存结果，更换该节点的 GPU。","把这些偏低的成对结果平均进集群整体带宽里。","重跑本地显存测试，用它替代成对验证。"],"a":0,"e":"Use the pattern across independent ClusterKit measurements to select the next area for investigation.","ze":"用 ClusterKit 多项独立测量所呈现的规律，来决定下一步该查哪里。","or":["A repeated node-specific peer pattern helps target that node’s communication path.","Normal local memory results do not support GPU replacement as the first action.","A cluster average can mask a consistently underperforming node.","Local memory tests do not exercise the abnormal communication path."],"ref":"https://docs.nvidia.com/networking/display/hpcxv216/clusterkit | Multifaceted node assessment; pairwise bandwidth and local memory tests","s":"","src":"official"},{"id":"NCP-AII-P039","d":"4","m":0,"t":"","c":"4.10 Run NCCL to verify E/W fabric bandwidth.","q":"Two nodes pass their single-node NCCL tests. The team now needs evidence for communication between them. Which test scope addresses that requirement?","zq":"两个节点各自通过了单机 NCCL 测试。团队现在需要两节点之间互通性的证据。哪种测试范围满足该要求？","o":["Launch a collective with ranks distributed across both nodes.","Launch separate collectives confined to each node’s local GPUs.","Launch a memory copy confined to one node’s local GPU.","Launch a compute workload confined to one node’s local GPU."],"zo":["启动一次集合通信，把 rank 分布到两个节点上。","在两个节点各自本地 GPU 内分别启动集合通信。","在单个节点的本地 GPU 内做一次显存拷贝。","在单个节点的本地 GPU 内跑一个计算负载。"],"a":0,"e":"Extend the NCCL test across nodes to validate the east-west communication fabric.","ze":"把 NCCL 测试跨到节点之间，才能验证东西向通信 fabric。","or":["A collective spanning nodes exercises the inter-node communication path.","Separate local tests do not exercise communication between the nodes.","A local GPU memory copy does not exercise the inter-node fabric.","A local compute workload does not exercise the inter-node communication path."],"ref":"https://github.com/NVIDIA/nccl-tests | Multi-process and multi-node execution","s":"","src":"official"},{"id":"NCP-AII-P040","d":"4","m":0,"t":"","c":"4.10 Run NCCL to verify E/W fabric bandwidth.","q":"Two NCCL bandwidth runs use identical nodes but different message-size ranges. The engineer needs a valid comparison after a fabric change. What should be done?","zq":"两次 NCCL 带宽测试用的节点相同，但报文长度区间不同。工程师需要在 fabric 变更后做一次有效对比。应当怎么做？","o":["Rerun with matching message sizes and launch configuration.","Compare the highest reported bandwidth from each unmatched run.","Compare the report filenames as evidence of matching test conditions.","Compare the GPU product names as evidence of matching test conditions."],"zo":["用一致的报文长度与启动配置重跑。","直接比较两次不匹配运行中各自最高的带宽。","比较两次报告的文件名，作为测试条件一致的证据。","比较 GPU 产品型号，作为测试条件一致的证据。"],"a":0,"e":"Control NCCL test conditions before attributing a bandwidth difference to a fabric change.","ze":"把 NCCL 的测试条件控制住，再把带宽差异归因于 fabric 变更。","or":["Consistent message sizes and launch conditions permit a meaningful before-and-after comparison.","Different message ranges can change measured bandwidth independently of the fabric change.","Filenames do not establish matching benchmark conditions.","Matching hardware does not establish matching message sizes or launch conditions."],"ref":"https://github.com/NVIDIA/nccl-tests | Performance measurement and message-size options","s":"","src":"official"},{"id":"NCP-AII-P041","d":"4","m":0,"t":"","c":"4.11 Perform NCCL burn-in.","q":"An NCCL burn-in plan must check collective correctness as well as sustained bandwidth. Which result deserves investigation even when the bandwidth meets its target?","zq":"NCCL 烧机计划既要检查集合通信的正确性，也要检查持续带宽。即使带宽达标，哪种结果仍必须排查？","o":["The test reports a nonzero count of incorrect results.","The report contains the expected participating GPU device count.","The report contains the intended large-message test size range.","The test reports zero incorrect results throughout the run."],"zo":["测试报告了非零的“错误结果”计数。","报告中包含预期的参与 GPU 数量。","报告中包含预期的大报文测试区间。","整个运行过程中错误结果计数为零。"],"a":0,"e":"Accept burn-in based on correctness and stability as well as throughput.","ze":"烧机是否通过，要同时看正确性、稳定性与吞吐。","or":["Incorrect collective results violate correctness acceptance despite adequate throughput.","The expected device count supports correct test scope rather than signals failure.","The intended size range supports the test plan rather than signals failure.","Zero incorrect results meets the correctness requirement."],"ref":"https://github.com/NVIDIA/nccl-tests | Correctness checking and wrong-result count","s":"","src":"official"},{"id":"NCP-AII-P042","d":"4","m":0,"t":"","c":"4.12 Perform HPL burn-in.","q":"A documented NVIDIA HPL burn-in plan calls for repeating the main loop within one invocation. Which benchmark setting controls those repetitions?","zq":"一份 NVIDIA 的 HPL 烧机流程要求在单次调用内重复执行主循环。哪个基准设置控制重复次数？","o":["Set TEST_LOOPS to the required repetition count.","Set HPL_CHUNK_SIZE_NBS to the required repetition count.","Set HPL_FCT_CHUNK_SIZE to the required repetition count.","Set HPL_CUSOLVER_MP_TESTS_GEMM_ITERS to the required repetition count."],"zo":["把 TEST_LOOPS 设为需要的重复次数。","把 HPL_CHUNK_SIZE_NBS 设为需要的重复次数。","把 HPL_FCT_CHUNK_SIZE 设为需要的重复次数。","把 HPL_CUSOLVER_MP_TESTS_GEMM_ITERS 设为需要的重复次数。"],"a":0,"e":"Use the main-loop repetition control for repeated HPL execution, not a similarly named component tuning parameter.","ze":"重复执行 HPL 用主循环次数控制，而不是名字相近的组件调优参数。","or":["TEST_LOOPS controls how many times the main HPL loop runs.","HPL_CHUNK_SIZE_NBS controls the number of matrix blocks grouped for computation.","HPL_FCT_CHUNK_SIZE controls a factorization chunk size.","The GEMM iteration setting controls component tests rather than full main-loop repetitions."],"ref":"https://docs.nvidia.com/nvidia-hpc-benchmarks/HPL_benchmark.html | HPL environment variables; TEST_LOOPS","s":"","src":"official"},{"id":"NCP-AII-P043","d":"4","m":0,"t":"","c":"4.13 Perform Nemo Burn-in.","q":"A NeMo training burn-in uses fewer steps than its planned startup warm-up period. The report averages the whole run’s step times. What change makes the sustained-performance measurement more useful?","zq":"一次 NeMo 训练烧机的步数少于计划中的启动预热期，而报告对整轮运行的步耗时取了平均。怎样改能让持续性能的测量更有意义？","o":["Extend the run and evaluate steady-state steps after warm-up.","Shorten the run and evaluate the initial container startup time.","Reduce the node count and retain the same incomplete warm-up.","Replace training steps with repeated GPU inventory queries during startup."],"zo":["延长运行时间，在预热结束之后评估稳态步。","缩短运行时间，改为评估容器启动初期的耗时。","减少节点数量，同时保留同样不完整的预热。","把训练步替换成在启动阶段反复查询 GPU 清单。"],"a":0,"e":"Burn-in needs enough training execution to observe stable behavior beyond initialization and warm-up.","ze":"烧机需要足够的训练执行量，才能观察到初始化与预热之外的稳定行为。","or":["Post-warm-up steps better represent sustained training behavior.","Startup time does not measure sustained training performance.","Fewer nodes do not address a run that ends before warm-up completes.","Inventory queries do not exercise the representative NeMo training workload."],"ref":"https://docs.nvidia.com/nemo/megatron-bridge/nightly/skills/nemo-mbridge-perf-cuda-graphs/SKILL.html | Performance measurement after warm-up and graph capture","s":"","src":"official"},{"id":"NCP-AII-P044","d":"4","m":0,"t":"","c":"4.14 Test storage.","q":"A storage acceptance test rereads a dataset that fits in host memory. The second read is much faster than the first. What should the engineer control when measuring the storage system’s read performance?","zq":"一项存储验收测试重复读取一个能装进主机内存的数据集，第二次读比第一次快得多。在测量存储系统读性能时，工程师应当控制什么？","o":["Bypass the host page cache with an appropriate direct-I/O test.","Repeat cached reads until their average bandwidth reaches its maximum.","Reduce the dataset further so that every read fits in memory.","Report the cached result as the measured storage device bandwidth."],"zo":["用合适的直接 I/O（direct-I/O）测试绕过主机页缓存。","反复做缓存读，直到平均带宽达到最大值。","把数据集再缩小，让每次读都能留在内存里。","把缓存命中的结果直接作为存储设备的实测带宽上报。"],"a":0,"e":"Control caching when the acceptance requirement is actual storage performance.","ze":"当验收要求的是真实存储性能时，就要把缓存的影响控制住。","or":["Direct I/O can avoid measuring host page-cache performance instead of storage access.","More cached reads emphasize memory performance rather than backend storage performance.","A smaller cached dataset worsens the distinction between memory and storage measurements.","The cached result cannot be presented as a direct measurement of backend bandwidth."],"ref":"https://docs.nvidia.com/gpudirect-storage/configuration-guide/index.html | Page-cache effects and direct-I/O benchmarking","s":"","src":"official"},{"id":"NCP-AII-P045","d":"5","m":0,"t":"","c":"5.1 Identify and troubleshoot hardware faults (e.g. GPU/fan/network card)","q":"An administrator sees a GPU Xid error during a job. Which evidence should be collected before reset or replacement to support troubleshooting?","zq":"管理员在作业运行期间看到一条 GPU Xid 错误。在重置或更换之前，应当先采集哪些证据以支撑排障？","o":["The Xid message, timestamp, GPU identity, and surrounding system logs.","The average GPU utilization, average power draw, and average memory usage.","The final job duration, scheduled GPU count, and aggregate training throughput.","The current driver version, current kernel version, and current container tag."],"zo":["Xid 消息、时间戳、GPU 身份，以及周边的系统日志。","GPU 的平均利用率、平均功耗和平均显存占用。","作业最终时长、被调度的 GPU 数量和总训练吞吐。","当前驱动版本、当前内核版本和当前容器标签。"],"a":0,"e":"Preserve relevant diagnostic evidence before a disruptive action removes useful failure context.","ze":"在破坏性操作把有用的故障上下文清掉之前，先保留相关诊断证据。","or":["Error details and timestamps correlate the failure with the affected device and events.","Averages can conceal the failure event and omit its error code and identity.","Job summary metrics do not preserve the device error details.","Versions are useful context but omit the reported Xid and surrounding event evidence."],"ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Analyzing an Xid error; collect error and system information","s":"","src":"official"},{"id":"NCP-AII-P046","d":"5","m":0,"t":"","c":"5.1 Identify and troubleshoot hardware faults (e.g. GPU/fan/network card)","q":"A DGX fan alert identifies a particular fan’s low-speed condition. Which follow-up best distinguishes the reported component fault from a general GPU performance complaint?","zq":"一条 DGX 风扇告警指向某个风扇的低转速状况。哪种后续动作最能把它与“GPU 性能不佳”的一般性投诉区分开？","o":["Inspect that fan’s status and the associated chassis thermal alerts.","Inspect the GPUs’ utilization and the associated application performance logs.","Inspect the adapters’ throughput and the associated fabric congestion counters.","Inspect the drives’ throughput and the associated filesystem performance counters."],"zo":["查看该风扇的状态与相关的机箱热告警。","查看 GPU 利用率与相关的应用性能日志。","查看适配器的吞吐与相关的 fabric 拥塞计数器。","查看磁盘吞吐与相关的文件系统性能计数器。"],"a":0,"e":"Follow the alert’s identified subsystem and component when investigating a hardware fault.","ze":"排查硬件故障时，要顺着告警所指的子系统与部件往下查。","or":["The reported fan fault calls for cooling-component status and thermal evidence.","Application GPU utilization does not establish the identified fan’s condition.","Fabric congestion counters do not establish fan operation.","Filesystem counters do not establish the identified fan’s condition."],"ref":"https://docs.nvidia.com/datacenter/nvsm/nvsm-user-guide/latest/using-nvsm-cli.html | Chassis thermal status and alerts","s":"","src":"official"},{"id":"NCP-AII-P047","d":"5","m":0,"t":"","c":"5.2 Identify faulty cards/gpus/power supplies","q":"A server has several power supplies, and an alert reports one failed unit. What should the technician verify before selecting a replacement?","zq":"某服务器有多块电源，告警报告其中一块失效。技术员在选择更换件之前应当核实什么？","o":["The failed unit’s physical location and identifying hardware information.","The rack’s total power draw and its historical energy consumption.","The remaining units’ aggregate capacity and their rated input voltage.","The server’s total power budget and its typical idle power draw."],"zo":["失效单元的物理位置与可识别它的硬件信息。","机柜的总功耗与其历史能耗数据。","其余电源单元的合计容量与其额定输入电压。","服务器的总功率预算与其典型空闲功耗。"],"a":0,"e":"Map a hardware fault to the correct component before replacement.","ze":"更换之前，先把硬件故障映射到正确的那个部件。","or":["Location and device identity identify the exact power supply requiring replacement.","Rack measurements do not locate a specific failed power supply.","Remaining capacity matters for availability but does not identify the failed unit.","Server-level power figures do not identify the physical failed unit."],"ref":"https://docs.nvidia.com/datacenter/nvsm/nvsm-user-guide/latest/using-nvsm-cli.html | Power supply inventory, component status, and alerts","s":"","src":"official"},{"id":"NCP-AII-P048","d":"5","m":0,"t":"","c":"5.3 Replace faulty cards/gpus/power supplies","q":"After a documented BlueField card replacement, which validation most directly confirms that the serviced component is ready to return to use?","zq":"按文档完成一次 BlueField 卡更换后，哪种验证最能直接说明该部件已可恢复使用？","o":["Verify the new card’s enumeration, approved firmware, and network connectivity.","Verify the new card’s packaging, order number, and delivery completion record.","Verify the removed card’s serial number, old firmware, and last recorded status.","Verify the previous job’s exit code, GPU count, and last recorded throughput."],"zo":["确认新卡能被枚举、固件为批准版本，且网络连通正常。","确认新卡的包装、订单号与到货完成记录。","确认被拆下那张卡的序列号、旧固件和最后记录的状态。","确认上一个作业的退出码、GPU 数量和最后记录的吞吐。"],"a":0,"e":"Validate the replaced hardware and its actual function before returning the node to service.","ze":"把节点交还使用之前，要验证换上去的硬件本身与它的实际功能。","or":["Post-replacement detection, compatible firmware, and connectivity provide operational evidence.","Delivery records do not show that the installed card works.","The removed device’s records do not validate the replacement’s operation.","A previous job predates servicing and does not validate the new card."],"ref":"https://docs.nvidia.com/dgx/dgxb300-service-manual/bluefield3-card-replacement.html | BlueField-3 replacement and post-installation verification","s":"","src":"official"},{"id":"NCP-AII-P049","d":"5","m":0,"t":"","c":"5.4 Execute performance optimization for AMD and Intel Servers","q":"On a dual-socket GPU server, a benchmark process runs on CPU cores remote from its GPU’s NUMA node. Which adjustment should be evaluated to reduce unnecessary host traffic?","zq":"在双路 GPU 服务器上，某基准进程运行在与其 GPU 所属 NUMA 节点相距较远的 CPU 核上。应当评估哪项调整来减少不必要的主机流量？","o":["Bind the process and its memory to the GPU’s local NUMA domain.","Bind the process and its memory to the GPU’s remote NUMA domain.","Move the process between CPU sockets throughout each benchmark execution cycle.","Place the process on remote cores and retain automatic cross-socket memory allocation."],"zo":["把进程及其内存绑定到该 GPU 所在的本地 NUMA 域。","把进程及其内存绑定到该 GPU 的远端 NUMA 域。","在每轮基准执行过程中让进程在 CPU 插槽之间来回迁移。","把进程放在远端核上，同时保留跨插槽的自动内存分配。"],"a":0,"e":"Use platform-specific GPU, CPU, and memory affinity when evaluating NUMA-sensitive performance.","ze":"评估对 NUMA 敏感的性能时，要使用与平台匹配的 GPU、CPU、内存亲和性设置。","or":["Local CPU and memory placement can reduce cross-socket traffic for host-device transfers.","Remote placement preserves the unnecessary cross-socket path.","Migration can disturb locality rather than establish a consistent local path.","Remote cores and cross-socket allocation retain the stated locality problem."],"ref":"https://docs.nvidia.com/nvidia-hpc-benchmarks/HPL_benchmark.html | CPU and memory affinity examples for GPU servers","s":"","src":"official"},{"id":"NCP-AII-P050","d":"5","m":0,"t":"","c":"5.5 Storage Optimization","q":"An application requests GPUDirect Storage, but its logs report POSIX compatibility-mode I/O. Throughput is below the target. Which check should precede tuning storage bandwidth settings?","zq":"某应用请求使用 GPUDirect Storage，但日志显示它走的是 POSIX 兼容模式 I/O，吞吐低于目标。在调优存储带宽参数之前，应先做哪项检查？","o":["Verify GDS support and configuration for the actual filesystem path.","Increase I/O concurrency while assuming that the intended direct path works.","Increase transfer sizes while assuming that the intended direct path works.","Increase storage queue depth while assuming that the intended direct path works."],"zo":["核实该实际文件系统路径的 GDS 支持与配置。","在假定直通路径可用的前提下提高 I/O 并发。","在假定直通路径可用的前提下加大传输尺寸。","在假定直通路径可用的前提下提高存储队列深度。"],"a":0,"e":"Confirm the intended storage data path before optimizing performance under assumptions that it is active.","ze":"在假定“数据路径已生效”之前，先确认它真的生效，再做性能调优。","or":["The reported compatibility path calls for support and configuration checks before direct-path tuning.","Concurrency tuning assumes a path that the logs indicate is not active.","Transfer-size tuning does not resolve the reported unexpected fallback path.","Queue-depth tuning does not establish that GDS is using the intended path."],"ref":"https://docs.nvidia.com/gpudirect-storage/troubleshooting-guide/ | Compatibility mode and GDS support troubleshooting","s":"","src":"official"}];

  var DOMAINS = {
    '1': '第 1 域 系统与服务器上架',
    '2': '第 2 域 物理层管理',
    '3': '第 3 域 控制面安装',
    '4': '第 4 域 集群测试与验证',
    '5': '第 5 域 故障排查与优化',
    '6': 'XID 错误码专题'
  };
  var DOMAIN_WEIGHT = { '1': '31%', '2': '5%', '3': '19%', '4': '33%', '5': '12%', '6': '—' };
  var LETTERS = ['A', 'B', 'C', 'D', 'E'];
  var EXAM_SIZE = 75;
  var EXAM_MINUTES = 80;
  var PASS_RATE = 0.85;
  var MULTI_IN_EXAM = 4;
  var PRACTICE_SIZE = 20;
  var KEY = 'ncp208.';

  /* ---------- 纯逻辑 ---------- */

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeItem(q) {
    var idx = q.o.map(function (_, i) { return i; });
    return { id: q.id, opts: shuffle(idx), chosen: q.m ? [] : null, locked: false };
  }

  function buildItems(pool, size) {
    return shuffle(pool).slice(0, Math.min(size, pool.length)).map(makeItem);
  }

  function buildExamItems(size, source) {
    var src = source || DATA;
    var multis = src.filter(function (q) { return q.m; });
    var singles = src.filter(function (q) { return !q.m; });
    var takeMulti = Math.min(MULTI_IN_EXAM, multis.length);
    return shuffle(
      shuffle(multis).slice(0, takeMulti).map(makeItem)
        .concat(shuffle(singles).slice(0, Math.min(size - takeMulti, singles.length)).map(makeItem))
    );
  }

  function answersOf(q) { return q.m ? q.ans.slice() : [q.a]; }

  function isCorrect(q, chosen) {
    var arr = chosen === null || chosen === undefined ? [] : (Array.isArray(chosen) ? chosen : [chosen]);
    if (!arr.length) return false;
    return answersOf(q).slice().sort().join(',') === arr.slice().sort().join(',');
  }

  function gradeExam(items) {
    var byId = {};
    DATA.forEach(function (q) { byId[q.id] = q; });
    var correct = 0, wrongList = [], blank = 0, perDomain = {};
    items.forEach(function (it) {
      var q = byId[it.id];
      var d = q.d;
      if (!perDomain[d]) perDomain[d] = { total: 0, correct: 0 };
      perDomain[d].total++;
      var arr = it.chosen === null || it.chosen === undefined ? [] :
        (Array.isArray(it.chosen) ? it.chosen : [it.chosen]);
      if (!arr.length) { blank++; return; }
      if (isCorrect(q, arr)) { correct++; perDomain[d].correct++; }
      else wrongList.push({ id: it.id, chosen: it.chosen });
    });
    var need = Math.ceil(items.length * PASS_RATE);
    return {
      total: items.length, correct: correct, wrong: wrongList.length, blank: blank,
      rate: items.length ? correct / items.length : 0,
      perDomain: perDomain, need: need, pass: correct >= need
    };
  }

  /* ---------- 存储 ---------- */

  function store(key, val) {
    try { localStorage.setItem(KEY + key, JSON.stringify(val)); } catch (e) {}
  }
  function load(key, dflt) {
    try {
      var raw = localStorage.getItem(KEY + key);
      return raw ? JSON.parse(raw) : dflt;
    } catch (e) { return dflt; }
  }

  var S = {
    view: 'home',
    session: null,
    wrong: load('wrong', {}),
    history: load('history', []),
    scope: load('scope', 'all')
  };

  function pool() {
    if (S.scope === 'official') return DATA.filter(function (q) { return q.src === 'official'; });
    if (S.scope === 'lab') return DATA.filter(function (q) { return q.src !== 'official'; });
    return DATA;
  }

  function saveWrong() { store('wrong', S.wrong); }
  function saveHistory() { store('history', S.history.slice(0, 30)); }
  function saveSession() { store('session', S.session); }
  function byId(id) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i];
    return null;
  }

  /* ---------- 工具 ---------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function el(id) { return document.getElementById(id); }

  function remainingMs(sess) {
    var s = sess || S.session;
    if (!s || !s.startedAt) return 0;
    return Math.max(0, s.limitMs - (Date.now() - s.startedAt));
  }

  function chosenArr(it) {
    if (it.chosen === null || it.chosen === undefined) return [];
    return Array.isArray(it.chosen) ? it.chosen : [it.chosen];
  }

  /* ---------- 数据导出 / 导入 ---------- */

  function exportData() {
    var data = { app: 'ncp208', version: 1, exportedAt: new Date().toISOString(), wrong: S.wrong, history: S.history };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ncp208-data-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result)); };
    reader.readAsText(file);
  }

  function datarow() {
    return '<div class="datarow">' +
      '<button class="btn ghost" data-act="export">导出文件</button>' +
      '<button class="btn ghost" data-act="import">导入文件</button>' +
      '<button class="btn ghost" data-act="export-text">复制数据</button>' +
      '<button class="btn ghost" data-act="import-text">粘贴导入</button>' +
      '</div>' +
      '<input type="file" id="importFile" class="filebtn" accept=".json,application/json">';
  }

  /* 微信内置浏览器等环境里下载/上传文件可能被拦，用文本框兜底 */
  function overlay(title, text, onOk) {
    var old = document.getElementById('ovl');
    if (old) old.remove();
    var d = document.createElement('div');
    d.id = 'ovl';
    d.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99;' +
      'display:flex;align-items:center;justify-content:center;padding:14px';
    d.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:560px;width:100%;padding:14px">' +
      '<p style="margin:0 0 8px;font-weight:700;font-size:14px">' + title + '</p>' +
      '<textarea id="ovlText" style="width:100%;height:200px;font:12px Consolas,monospace;' +
      'border:1px solid #e3e8ef;border-radius:10px;padding:8px;resize:vertical">' + esc(text) + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">' +
      '<button class="btn ghost" id="ovlCancel">关闭</button>' +
      (onOk ? '<button class="btn primary" id="ovlOk">导入</button>' : '') +
      (onOk ? '' : '<button class="btn primary" id="ovlCopy">全选并复制</button>') +
      '</div></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) { if (e.target === d) d.remove(); });
    document.getElementById('ovlCancel').onclick = function () { d.remove(); };
    var ta = document.getElementById('ovlText');
    if (onOk) {
      document.getElementById('ovlOk').onclick = function () {
        var v = ta.value.trim();
        d.remove();
        if (!v) return;
        onOk(v);
      };
    } else {
      ta.focus();
      ta.select();
      document.getElementById('ovlCopy').onclick = function () {
        ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (err) {}
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(ta.value).then(function () { alert('已复制'); });
        } else {
          alert(done ? '已复制' : '复制失败，请手动长按全选复制');
        }
      };
    }
  }

  function exportText() {
    var data = { app: 'ncp208', version: 1, exportedAt: new Date().toISOString(), wrong: S.wrong, history: S.history };
    overlay('把下面这段文本存到便签/微信收藏，换设备时用「粘贴导入」', JSON.stringify(data), null);
  }

  function importText(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { alert('这段文本不是合法的 JSON'); return; }
    if (!d || (!d.wrong && !d.history)) { alert('这段文本里没有错题本或成绩数据'); return; }
    var nw = d.wrong && typeof d.wrong === 'object' ? d.wrong : {};
    var nh = Array.isArray(d.history) ? d.history : [];
    if (!confirm('导入后会用这段数据覆盖当前错题本与成绩（' +
      Object.keys(nw).length + ' 道错题 / ' + nh.length + ' 条记录），继续？')) return;
    S.wrong = nw; S.history = nh;
    saveWrong(); saveHistory();
    alert('导入完成');
    renderHome();
  }

  /* ---------- 首页 ---------- */

  function renderHome() {
    S.view = 'home';
    var wrongCount = Object.keys(S.wrong).length;
    var last = S.history[0];
    var nMulti = DATA.filter(function (q) { return q.m; }).length;
    var nOfficial = DATA.filter(function (q) { return q.src === 'official'; }).length;
    var nLab = DATA.length - nOfficial;
    var cur = pool();
    var domainRows = [1, 2, 3, 4, 5, 6].map(function (d) {
      var n = cur.filter(function (q) { return q.d === String(d); }).length;
      return '<div class="row"><span>' + DOMAINS[d] + '</span><b>' + n + '</b>' +
        '<i>' + DOMAIN_WEIGHT[d] + '</i></div>';
    }).join('');

    var scopeBtn = function (key, label) {
      var on = S.scope === key ? ' on' : '';
      return '<button class="chip' + on + '" data-scope="' + key + '">' + label + '</button>';
    };

    var histRows = S.history.slice(0, 6).map(function (h) {
      var badge = h.mode === 'exam'
        ? '<em class="' + (h.pass ? 'pass' : 'fail') + '">' + (h.pass ? '及格' : '不及格') + '</em>'
        : '<em>' + pct(h.rate) + '</em>';
      return '<div class="row"><span>' + esc(h.date) + '</span><b>' + h.correct + '/' + h.total +
        '</b>' + badge + '</div>';
    }).join('') || '<p class="muted">还没有记录，先做一次模拟考吧。</p>';

    var lastBlock = last
      ? '<p class="last">' + last.correct + ' / ' + last.total + '（' + pct(last.rate) + '）' +
        (last.mode === 'exam' ? ' · <b class="' + (last.pass ? 'pass' : 'fail') + '">' +
          (last.pass ? '及格' : '不及格') + '</b>' : ' · 练习') +
        ' · ' + esc(last.date) + '</p>'
      : '';

    el('app').innerHTML =
      '<div class="hero">' +
        '<div class="logo">NCP-AII</div>' +
        '<h1>刷题 · 模拟考</h1>' +
        '<p>题库 ' + DATA.length + ' 题（DC Lab ' + nLab + ' + 官方样题 ' + nOfficial +
        '，含 ' + nMulti + ' 道多选）· 每次随机抽 ' + EXAM_SIZE +
        ' 题 · 限时 ' + EXAM_MINUTES + ' 分钟 · 及格线 ' + pct(PASS_RATE) + '</p>' +
      '</div>' +

      '<div class="scope">' +
        '<span class="scopeLabel">题库范围</span>' +
        scopeBtn('all', '全部 ' + DATA.length) +
        scopeBtn('lab', 'DC Lab ' + nLab) +
        scopeBtn('official', '官方样题 ' + nOfficial) +
      '</div>' +

      '<div class="cards">' +
        '<button class="card primary" data-act="exam">' +
          '<span class="k">模拟考试</span>' +
          '<strong>' + EXAM_SIZE + ' 题 / ' + EXAM_MINUTES + ' 分钟</strong>' +
          '<em>题干与选项随机打乱，固定含 ' + Math.min(MULTI_IN_EXAM, nMulti) +
          ' 道多选；按 ' + pct(PASS_RATE) + ' 判定及格</em>' +
        '</button>' +
        '<button class="card" data-act="practice">' +
          '<span class="k">快速练习</span>' +
          '<strong>' + PRACTICE_SIZE + ' 题 · 即时解析</strong>' +
          '<em>边做边看对错与中英解析，错的自动进错题本</em>' +
        '</button>' +
        '<button class="card" data-act="wrong">' +
          '<span class="k">错题本</span>' +
          '<strong>' + wrongCount + ' 题</strong>' +
          '<em>只练做错过的题；答对即移出，答错计数 +1</em>' +
        '</button>' +
      '</div>' +

      (last ? '<div class="panel"><h2>上一次成绩</h2>' + lastBlock + '</div>' : '') +

      '<div class="panel"><h2>题库构成</h2>' + domainRows + '</div>' +
      '<div class="panel"><h2>历史记录</h2>' + histRows + '</div>' +
      '<div class="panel"><h2>换设备 / 换网址</h2>' +
        '<p class="muted">答题记录存在当前浏览器里。换手机、换网址或清了缓存后，用「导出 → 导入」搬一次即可。</p>' +
        datarow() +
      '</div>' +
      '<p class="foot">离线单文件 · 数据只存在本机浏览器（localStorage）· 清空浏览器数据会丢失错题本</p>';
  }

  /* ---------- 答题页 ---------- */

  function optClass(it, q, oi, locked) {
    var cls = 'opt';
    var pick = chosenArr(it);
    if (q.m) {
      if (locked) {
        if (answersOf(q).indexOf(oi) >= 0) cls += ' correct';
        else if (pick.indexOf(oi) >= 0) cls += ' wrong';
      } else if (pick.indexOf(oi) >= 0) cls += ' sel';
      return cls;
    }
    if (locked) {
      if (oi === q.a) cls += ' correct';
      else if (oi === it.chosen) cls += ' wrong';
    } else if (oi === it.chosen) cls += ' sel';
    return cls;
  }

  /* 解析块：英文原文 + 中文译文；官方样题附带逐选项解析与官方参考链接 */
  function explBlock(q, it) {
    var html = '<div class="expl"><p class="lbl">解析 / explanation</p>' +
      '<p class="en">' + esc(q.e) + '</p>' +
      (q.ze ? '<p class="zh">' + esc(q.ze) + '</p>' : '');
    if (q.or && q.or.length) {
      var rows = q.or.map(function (r, i) {
        if (!r) return '';
        var letter = it ? LETTERS[it.opts.indexOf(i)] : LETTERS[i];
        return '<li><b>' + letter + '</b>' + esc(r) + '</li>';
      }).join('');
      html += '<details class="rat"><summary>为什么其他选项不对（原文）</summary><ul>' + rows + '</ul></details>';
    }
    if (q.ref) {
      var m = String(q.ref).match(/^(https?:\/\/\S+)\s*(?:\|\s*(.*))?$/);
      if (m) {
        html += '<p class="ref"><a href="' + esc(m[1]) + '" target="_blank" rel="noopener">' +
          esc(m[2] || m[1]) + '</a></p>';
      } else {
        html += '<p class="ref">' + esc(q.ref) + '</p>';
      }
    }
    return html + '</div>';
  }

  function renderSession() {
    var s = S.session;
    S.view = s.mode;
    var it = s.items[s.cur];
    var q = byId(it.id);
    var locked = s.mode !== 'exam' && it.locked;
    var pick = chosenArr(it);

    var opts = it.opts.map(function (oi, k) {
      var zh = q.zo && q.zo[oi] && q.zo[oi].replace(/\s/g, '') !== String(q.o[oi]).replace(/\s/g, '')
        ? '<em>' + esc(q.zo[oi]) + '</em>' : '';
      return '<button class="' + optClass(it, q, oi, locked) + '" data-opt="' + oi + '"' +
        (locked ? ' disabled' : '') + '>' +
        '<b>' + LETTERS[k] + '</b><span>' + esc(q.o[oi]) + '</span>' + zh + '</button>';
    }).join('');

    var answered = s.items.filter(function (x) { return chosenArr(x).length > 0; }).length;
    var grid = s.items.map(function (x, k) {
      var c = 'gbtn';
      if (chosenArr(x).length > 0) c += ' done';
      if (k === s.cur) c += ' cur';
      return '<button class="' + c + '" data-goto="' + k + '">' + (k + 1) + '</button>';
    }).join('');

    var head = '<div class="bar">' +
      '<div class="left">' + (s.mode === 'exam' ? '模拟考试' : s.mode === 'practice' ? '快速练习' : '错题重练') +
      ' · 第 ' + (s.cur + 1) + ' / ' + s.items.length + ' 题</div>' +
      (s.mode === 'exam' ? '<div class="timer" id="timer">' + fmt(Math.ceil(remainingMs() / 1000)) + '</div>'
                         : '<div class="timer small">已答 ' + answered + '</div>') +
      '</div>';

    var progress = '<div class="progress"><span style="width:' +
      Math.round((s.cur + 1) / s.items.length * 100) + '%"></span></div>';

    var snippet = q.s ? '<pre class="snippet">' + esc(q.s) + '</pre>' : '';
    var multiHint = q.m
      ? '<div class="mhint">多选题 · 选出<b>所有</b>正确项，全部选对才计分（已选 ' + pick.length + ' 项）</div>'
      : '';

    var feedback = '';
    if (locked) {
      var ok = isCorrect(q, it.chosen);
      var ansTxt = answersOf(q).map(function (a) { return LETTERS[it.opts.indexOf(a)]; }).join('、');
      var okTxt = q.m
        ? (ok ? '✓ 全对' : '✗ 未全对，正确答案 ' + ansTxt)
        : (ok ? '✓ 答对' : '✗ 答错，正确答案 ' + ansTxt);
      feedback = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' + okTxt + '</div>' +
        explBlock(q, it);
    }

    var confirmBtn = (q.m && s.mode !== 'exam' && !it.locked && pick.length)
      ? '<button class="btn primary" data-act="lock">确认作答</button>' : '';

    el('app').innerHTML =
      head + progress +
      '<div class="qcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] +
          (q.m ? ' · <b class="mtag">多选</b>' : '') +
          (q.src === 'official' ? ' · <b class="otag">官方样题</b>' : '') +
          (q.t ? ' · 工具 ' + esc(q.t) : '') + (q.c ? ' · ' + esc(q.c) : '') + '</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        (q.zq ? '<div class="stem zh">' + esc(q.zq) + '</div>' : '') +
        snippet + multiHint +
        '<div class="options">' + opts + '</div>' +
      '</div>' + feedback +
      '<div class="controls">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>上一题</button>' +
        '<button class="btn ghost" data-act="next"' + (s.cur === s.items.length - 1 ? ' disabled' : '') + '>下一题</button>' +
        confirmBtn +
        (s.mode === 'exam'
          ? '<button class="btn primary" data-act="submit">交卷</button>'
          : '<button class="btn primary" data-act="finish">结束本轮</button>') +
      '</div>' +
      '<details class="grid-wrap"' + (s.mode === 'exam' ? '' : ' open') + '>' +
        '<summary>答题卡（已答 ' + answered + ' / ' + s.items.length + '）</summary>' +
        '<div class="grid">' + grid + '</div>' +
      '</details>' +
      '<p class="foot">' + (s.mode === 'exam'
        ? '快捷键：1-4 / A-D 选择，← → 翻页，Enter 下一题；多选题可反复点选，到时间自动交卷。'
        : '单选题点一次即判定；多选题选好后点「确认作答」。') + '</p>';

    if (s.mode === 'exam') startTimer();
  }

  /* ---------- 计时 ---------- */

  var tick = null;
  function startTimer() {
    stopTimer();
    tick = setInterval(function () {
      var left = remainingMs();
      var t = el('timer');
      if (t) {
        t.textContent = fmt(Math.ceil(left / 1000));
        t.className = 'timer' + (left < 5 * 60 * 1000 ? ' warn' : '');
      }
      if (left <= 0) { stopTimer(); submitExam(true); }
    }, 500);
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  /* ---------- 动作 ---------- */

  function startExam() {
    S.session = {
      mode: 'exam',
      items: buildExamItems(EXAM_SIZE, pool()),
      cur: 0,
      startedAt: Date.now(),
      limitMs: EXAM_MINUTES * 60 * 1000,
      submitted: false
    };
    saveSession();
    renderSession();
  }

  function startPractice(src, size, mode) {
    S.session = {
      mode: mode || 'practice',
      items: buildItems(src || pool(), size || PRACTICE_SIZE),
      cur: 0,
      startedAt: Date.now(),
      limitMs: 0,
      submitted: false
    };
    saveSession();
    renderSession();
  }

  function lockPractice(it, q) {
    it.locked = true;
    if (!isCorrect(q, it.chosen)) {
      var w = S.wrong[it.id] || { n: 0 };
      w.n = (w.n || 0) + 1;
      w.last = Date.now();
      S.wrong[it.id] = w;
      saveWrong();
    }
  }

  function pick(oi) {
    var s = S.session;
    var it = s.items[s.cur];
    var q = byId(it.id);
    if (s.mode !== 'exam' && it.locked) return;

    if (q.m) {
      var arr = chosenArr(it).slice();
      var at = arr.indexOf(oi);
      if (at >= 0) arr.splice(at, 1); else arr.push(oi);
      it.chosen = arr.sort();
    } else {
      it.chosen = oi;
      if (s.mode !== 'exam') lockPractice(it, q);
    }
    saveSession();
    renderSession();
  }

  function submitExam(auto) {
    var s = S.session;
    if (!s || s.submitted) return;
    if (!auto) {
      var blank = s.items.filter(function (x) { return chosenArr(x).length === 0; }).length;
      var msg = (blank > 0 ? '还有 ' + blank + ' 题未作答，' : '') + '确定交卷？';
      if (!confirm(msg)) return;
    }
    s.submitted = true;
    s.spentMs = Math.max(0, Date.now() - s.startedAt);
    var g = gradeExam(s.items);
    s.result = g;
    g.date = new Date().toLocaleString('zh-CN', { hour12: false });
    g.mode = s.mode;
    S.history.unshift({
      date: g.date, correct: g.correct, total: g.total, rate: g.rate,
      mode: s.mode, pass: g.pass
    });
    saveHistory();

    if (s.mode === 'exam') {
      s.items.forEach(function (it) {
        var q = byId(it.id);
        if (isCorrect(q, it.chosen)) {
          if (S.wrong[it.id]) delete S.wrong[it.id];
        } else {
          var w = S.wrong[it.id] || { n: 0 };
          w.n = (w.n || 0) + 1;
          w.last = Date.now();
          S.wrong[it.id] = w;
        }
      });
      saveWrong();
    }
    saveSession();
    stopTimer();
    renderResult();
  }

  /* ---------- 结果 ---------- */

  function renderResult() {
    S.view = 'result';
    var s = S.session, g = s.result;
    var dRows = Object.keys(g.perDomain).sort().map(function (d) {
      var x = g.perDomain[d];
      return '<div class="row"><span>' + DOMAINS[d] + '</span><b>' + x.correct + '/' + x.total +
        '</b><i>' + pct(x.total ? x.correct / x.total : 0) + '</i></div>';
    }).join('');

    var wrongItems = s.items.filter(function (it) { return !isCorrect(byId(it.id), it.chosen); });
    var wrongRows = wrongItems.map(function (it, k) {
      var q = byId(it.id);
      return '<button class="wrow" data-review="' + k + '"><b>Q' + (s.items.indexOf(it) + 1) + '</b>' +
        '<span>' + (q.m ? '[多选] ' : '') + esc(q.q.slice(0, 52)) + (q.q.length > 52 ? '…' : '') + '</span>' +
        '<i>' + DOMAINS[q.d] + '</i></button>';
    }).join('') || '<p class="muted">全对，没有错题 🎉</p>';

    var isExam = s.mode === 'exam';
    var verdict = isExam
      ? '<div class="verdict ' + (g.pass ? 'pass' : 'fail') + '">' + (g.pass ? '及格' : '不及格') + '</div>'
      : '';

    el('app').innerHTML =
      '<div class="result-head">' +
        verdict +
        '<div class="score">' + g.correct + '<small>/' + g.total + '</small></div>' +
        '<div class="rate">正确率 ' + pct(g.rate) +
          (isExam ? ' · 及格线 ' + pct(PASS_RATE) + '（需 ' + g.need + ' 题）' : '') + '</div>' +
        '<div class="muted">答对 ' + g.correct + ' · 答错 ' + g.wrong + ' · 未答 ' + g.blank +
          ' · 用时 ' + fmt(Math.round((s.spentMs || 0) / 1000)) + ' · ' + esc(g.date) + '</div>' +
      '</div>' +
      '<div class="panel"><h2>按考纲域</h2>' + dRows + '</div>' +
      '<div class="panel"><h2>本轮错题（' + wrongItems.length + '）</h2>' + wrongRows + '</div>' +
      '<div class="controls">' +
        '<button class="btn primary" data-act="review">逐题看解析</button>' +
        '<button class="btn ghost" data-act="wrong">去错题本</button>' +
        '<button class="btn ghost" data-act="home">返回首页</button>' +
      '</div>' +
      '<p class="foot">错题已自动写入错题本（答错计数 +1）；在错题本里答对一次即移出。多选题需全部选对才计分。</p>';
  }

  function renderReview() {
    S.view = 'review';
    var s = S.session;
    var it = s.items[s.cur];
    var q = byId(it.id);
    var ok = isCorrect(q, it.chosen);
    var pick = chosenArr(it);

    var opts = it.opts.map(function (oi, k) {
      var cls = 'opt';
      if (answersOf(q).indexOf(oi) >= 0) cls += ' correct';
      else if (pick.indexOf(oi) >= 0) cls += ' wrong';
      var zh = q.zo && q.zo[oi] && q.zo[oi].replace(/\s/g, '') !== String(q.o[oi]).replace(/\s/g, '')
        ? '<em>' + esc(q.zo[oi]) + '</em>' : '';
      return '<div class="' + cls + '"><b>' + LETTERS[k] + '</b><span>' + esc(q.o[oi]) +
        '</span>' + zh + '</div>';
    }).join('');

    var ansTxt = answersOf(q).map(function (a) { return LETTERS[it.opts.indexOf(a)]; }).join('、');

    el('app').innerHTML =
      '<div class="bar"><div class="left">逐题解析 · 第 ' + (s.cur + 1) + '/' + s.items.length + ' 题' +
        (q.m ? ' · 多选' : '') + '</div>' +
      '<div class="timer small ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '答对' : '答错') +
        '（答案 ' + ansTxt + '）</div></div>' +
      '<div class="qcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] +
          (q.m ? ' · <b class="mtag">多选</b>' : '') +
          (q.src === 'official' ? ' · <b class="otag">官方样题</b>' : '') +
          (q.t ? ' · 工具 ' + esc(q.t) : '') + '</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        (q.zq ? '<div class="stem zh">' + esc(q.zq) + '</div>' : '') +
        (q.s ? '<pre class="snippet">' + esc(q.s) + '</pre>' : '') +
        '<div class="options">' + opts + '</div>' +
      '</div>' +
      explBlock(q, it) +
      '<div class="controls">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>上一题</button>' +
        '<button class="btn ghost" data-act="next"' + (s.cur === s.items.length - 1 ? ' disabled' : '') + '>下一题</button>' +
        '<button class="btn primary" data-act="home">返回首页</button>' +
      '</div>';
  }

  /* ---------- 错题本 ---------- */

  function renderWrong() {
    S.view = 'wrong';
    var ids = Object.keys(S.wrong);
    var cards = ids.map(function (id) {
      var q = byId(id);
      if (!q) return '';
      var w = S.wrong[id];
      var ansTxt = answersOf(q).map(function (a) { return LETTERS[a]; }).join('、');
      return '<div class="wcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] + (q.m ? ' · 多选' : '') +
          ' · 错 ' + (w.n || 1) + ' 次</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        '<div class="stem zh">' + esc(q.zq || '') + '</div>' +
        '<details><summary>看答案与解析</summary>' +
          '<p class="ans">答案 ' + ansTxt + '：' +
            answersOf(q).map(function (a) { return esc(q.o[a]); }).join(' ／ ') + '</p>' +
          '<p class="en">' + esc(q.e) + '</p>' +
          (q.ze ? '<p class="zh">' + esc(q.ze) + '</p>' : '') +
        '</details>' +
        '<button class="link" data-remove="' + esc(id) + '">已掌握，移出错题本</button>' +
      '</div>';
    }).join('');

    el('app').innerHTML =
      '<div class="bar"><div class="left">错题本 · ' + ids.length + ' 题</div></div>' +
      (ids.length
        ? '<div class="controls">' +
            '<button class="btn primary" data-act="drill-wrong">重练全部错题</button>' +
            '<button class="btn ghost" data-act="home">返回首页</button>' +
          '</div>' + datarow() + cards
        : '<div class="panel"><p class="muted">错题本是空的。去做一次模拟考或快速练习吧。</p>' +
          '<button class="btn ghost" data-act="home">返回首页</button></div>');
  }

  function renderResume() {
    S.view = 'resume';
    var s = S.session;
    el('app').innerHTML =
      '<div class="hero"><h1>发现未完成的模拟考</h1>' +
      '<p>已答 ' + s.items.filter(function (x) { return chosenArr(x).length > 0; }).length +
      ' / ' + s.items.length + ' 题，剩余时间 ' + fmt(Math.ceil(remainingMs() / 1000)) + '</p></div>' +
      '<div class="controls">' +
        '<button class="btn primary" data-act="resume">继续考试</button>' +
        '<button class="btn ghost" data-act="discard">放弃这次</button>' +
      '</div>';
  }

  /* ---------- 事件 ---------- */

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var sc = e.target.closest('[data-scope]');
      if (sc) {
        S.scope = sc.getAttribute('data-scope');
        store('scope', S.scope);
        renderHome();
        return;
      }
      var t = e.target.closest('[data-act],[data-opt],[data-goto],[data-review],[data-remove]');
      if (!t) return;
      var act = t.getAttribute('data-act');

      if (t.hasAttribute('data-opt')) { pick(parseInt(t.getAttribute('data-opt'), 10)); return; }
      if (t.hasAttribute('data-goto')) {
        S.session.cur = parseInt(t.getAttribute('data-goto'), 10);
        saveSession(); renderSession(); return;
      }
      if (t.hasAttribute('data-review')) {
        var k = parseInt(t.getAttribute('data-review'), 10);
        var ss = S.session;
        var wrongs = ss.items.filter(function (it) { return !isCorrect(byId(it.id), it.chosen); });
        ss.cur = ss.items.indexOf(wrongs[k]);
        renderReview(); return;
      }
      if (t.hasAttribute('data-remove')) {
        delete S.wrong[t.getAttribute('data-remove')];
        saveWrong(); renderWrong(); return;
      }
      if (t.closest('.expl') && t.tagName === 'SUMMARY') return;

      switch (act) {
        case 'exam': startExam(); break;
        case 'practice': startPractice(pool(), PRACTICE_SIZE, 'practice'); break;
        case 'wrong': renderWrong(); break;
        case 'drill-wrong':
          startPractice(Object.keys(S.wrong).map(byId).filter(Boolean),
            Object.keys(S.wrong).length, 'wrong');
          break;
        case 'lock':
          var curIt = S.session.items[S.session.cur];
          lockPractice(curIt, byId(curIt.id));
          saveSession(); renderSession();
          break;
        case 'prev':
          if (S.session && S.session.cur > 0) {
            S.session.cur--; saveSession();
            S.view === 'review' ? renderReview() : renderSession();
          }
          break;
        case 'next':
          if (S.session && S.session.cur < S.session.items.length - 1) {
            S.session.cur++; saveSession();
            S.view === 'review' ? renderReview() : renderSession();
          }
          break;
        case 'submit': submitExam(false); break;
        case 'finish': if (confirm('结束本轮练习？')) submitExam(true); break;
        case 'review': S.session.cur = 0; renderReview(); break;
        case 'home': stopTimer(); renderHome(); break;
        case 'resume': renderSession(); break;
        case 'discard': S.session = null; saveSession(); renderHome(); break;
        case 'export': exportData(); break;
        case 'export-text': exportText(); break;
        case 'import-text': overlay('把之前复制的那段 JSON 粘到这里', '', function (v) { importText(v); }); break;
        case 'import': {
          var f = el('importFile');
          if (f) f.click();
          break;
        }
      }
    });

    document.addEventListener('change', function (e) {
      if (e.target && e.target.id === 'importFile' && e.target.files && e.target.files[0]) {
        importData(e.target.files[0]);
        e.target.value = '';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (!S.session || S.session.submitted) return;
      if (S.view !== 'exam' && S.view !== 'practice' && S.view !== 'wrong') return;
      var s = S.session;
      var k = e.key;
      if (k >= '1' && k <= '4') {
        var n = parseInt(k, 10) - 1;
        var it = s.items[s.cur];
        if (n < it.opts.length) pick(it.opts[n]);
        e.preventDefault();
      } else if (/^[a-dA-D]$/.test(k)) {
        var m = 'abcd'.indexOf(k.toLowerCase());
        var it2 = s.items[s.cur];
        if (m < it2.opts.length) pick(it2.opts[m]);
        e.preventDefault();
      } else if (k === 'Enter') {
        if (s.cur < s.items.length - 1) {
          s.cur++; saveSession();
          S.view === 'review' ? renderReview() : renderSession();
        }
        e.preventDefault();
      } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
        if (k === 'ArrowLeft' && s.cur > 0) s.cur--;
        if (k === 'ArrowRight' && s.cur < s.items.length - 1) s.cur++;
        saveSession();
        S.view === 'review' ? renderReview() : renderSession();
        e.preventDefault();
      }
    });
  }

  /* ---------- 启动 ---------- */

  function boot() {
    bindEvents();
    try {
      localStorage.setItem(KEY + 'probe', '1');
      localStorage.removeItem(KEY + 'probe');
    } catch (err) {
      var warn = document.createElement('div');
      warn.className = 'warnbar';
      warn.textContent = '当前浏览器禁止本页使用本地存储：成绩与错题本不会保存（换用 Chrome / Edge 打开即可）。';
      document.body.insertBefore(warn, document.getElementById('app'));
    }
    var saved = load('session', null);
    if (saved && !saved.submitted && saved.mode === 'exam' && remainingMs(saved) > 0) {
      S.session = saved;
      renderResume();
    } else if (saved && !saved.submitted && saved.mode !== 'exam') {
      S.session = saved;
      renderSession();
    } else {
      renderHome();
    }
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      DATA: DATA, shuffle: shuffle, buildItems: buildItems, buildExamItems: buildExamItems,
      gradeExam: gradeExam, isCorrect: isCorrect, PASS_RATE: PASS_RATE
    };
  } else {
    boot();
  }
})();

</script>
</body>
</html>
