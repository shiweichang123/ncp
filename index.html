 dmidecode 命令只提取 BIOS 版本字符串，而不显示其他 SMBIOS 数据？","o":["dmidecode -t bios | grep Version","dmidecode -s bios-version","dmidecode --bios-version","dmidecode -q -t 0"],"zo":["dmidecode -t bios | grep Version","dmidecode -s bios-version","dmidecode --bios-version","dmidecode -q -t 0"],"a":1,"e":"dmidecode -s bios-version uses the --string option to output only the BIOS version string with no other data. The -s flag supports various keywords including bios-version, bios-release-date, system-manufacturer, system-product-name, system-serial-number, and baseboard-serial-number. This is ideal for scripting.","ze":"-s bios-version 只输出 BIOS 版本字符串，没有任何多余内容。-s 还支持 bios-release-date、system-manufacturer、system-product-name、system-serial-number、baseboard-serial-number 等关键字，特别适合脚本调用。","s":""},{"id":"tm-bmc-013","d":"1","m":0,"t":"dmidecode","c":"最佳实践","q":"During system bring-up of a new DGX node, which dmidecode information is most critical to verify before starting GPU workloads?","zq":"新 DGX 节点上架时，在启动 GPU 负载之前最需要核对哪项 dmidecode 信息？","o":["The chassis asset tag string","The system UUID for license management","The total installed memory (dmidecode -t memory) and CPU count/model (dmidecode -t processor) to confirm hardware matches the expected BOM","The BIOS vendor name"],"zo":["机箱资产标签字符串","用于许可管理的系统 UUID","已安装内存总量（-t memory）与 CPU 数量/型号（-t processor），确认硬件与预期 BOM 一致","BIOS 厂商名称"],"a":2,"e":"During system bring-up, verifying that the installed hardware matches the Bill of Materials (BOM) is essential. dmidecode -t memory confirms all DIMM slots are populated with the correct capacity and speed. dmidecode -t processor confirms the correct CPU model and count. Missing or incorrect hardware would impact GPU workload performance and should be caught before deployment.","ze":"上架时必须确认实装硬件与 BOM 一致：-t memory 核对每个 DIMM 槽的容量与速率，-t processor 核对 CPU 型号与数量。缺装或错装会直接影响 GPU 负载性能，必须在部署前发现。","s":""},{"id":"tm-bmc-014","d":"1","m":0,"t":"ipmitool","c":"命令语法","q":"Which ipmitool command displays the BMC firmware version and manufacturer information?","zq":"哪条 ipmitool 命令显示 BMC 固件版本与厂商信息？","o":["ipmitool bmc info","ipmitool mc info","ipmitool chassis identify","ipmitool fru print"],"zo":["ipmitool bmc info","ipmitool mc info","ipmitool chassis identify","ipmitool fru print"],"a":1,"e":"ipmitool mc info (management controller info) displays the BMC firmware version, manufacturer ID, IPMI specification version, and device ID. This is essential during system bring-up to verify the BMC firmware is at the expected version before deploying workloads.","ze":"mc info（management controller info）显示 BMC 固件版本、厂商 ID、IPMI 规范版本与设备 ID。上架时用它确认 BMC 固件处于预期版本，再开始部署负载。","s":""},{"id":"tm-bmc-015","d":"1","m":0,"t":"ipmitool","c":"输出判读","q":"What does this ipmitool sensor output indicate?","zq":"这段 ipmitool sensor 输出说明了什么？","o":["All fans are operating normally within thresholds","Fan3 is reading 0 RPM with a critical (cr) status, indicating the fan has failed or is disconnected; the lower critical threshold is 600 RPM","Fan3 is temporarily stopped for noise reduction","The sensor is miscalibrated and the fan is actually spinning"],"zo":["所有风扇都在阈值内正常运行","Fan3 读数为 0 RPM、状态为 cr（严重），说明风扇失效或未接；转速下临界阈值为 600 RPM","Fan3 为降低噪音而临时停转","传感器校准错误，风扇实际在转"],"a":1,"e":"Fan3 shows 0 RPM with status 'cr' (critical). The lower critical threshold is 600 RPM, and 0 RPM means the fan is not spinning at all. This is a hardware failure requiring immediate attention, as inadequate cooling will lead to thermal shutdown. The system should be scheduled for fan replacement before thermal damage occurs to GPUs or CPUs.","ze":"Fan3 读数为 0 RPM、状态为 cr（critical），下临界阈值为 600 RPM——0 表示风扇完全不转，属硬件故障。散热不足会触发热关机，应在 GPU/CPU 受损前安排更换风扇。","s":"$ ipmitool sensor list | grep -i fan\nFan1             | 8400.000   | RPM  | ok    | 600.000  | 900.000  | na  | na  | 25000.000 | 25400.000\nFan2             | 8500.000   | RPM  | ok    | 600.000  | 900.000  | na  | na  | 25000.000 | 25400.000\nFan3             | 0.000      | RPM  | cr    | 600.000  | 900.000  | na  | na  | 25000.000 | 25400.000\nFan4             | 8350.000   | RPM  | ok    | 600.000  | 900.000  | na  | na  | 25000.000 | 25400.000"},{"id":"tm-bmc-016","d":"1","m":0,"t":"ipmitool","c":"参数用法","q":"Which ipmitool command configures the BMC network settings for remote out-of-band management?","zq":"哪条 ipmitool 命令用于配置 BMC 网络，以便远程带外管理？","o":["ipmitool lan set 1 ipaddr 10.0.1.100","ipmitool network set 10.0.1.100","ipmitool bmc network --ip 10.0.1.100","ipmitool config lan ip=10.0.1.100"],"zo":["ipmitool lan set 1 ipaddr 10.0.1.100","ipmitool network set 10.0.1.100","ipmitool bmc network --ip 10.0.1.100","ipmitool config lan ip=10.0.1.100"],"a":0,"e":"ipmitool lan set <channel> <parameter> <value> configures BMC networking. Channel 1 is typically the dedicated BMC management port. Parameters include ipaddr, netmask, defgw ipaddr (default gateway), and ipsrc (static/dhcp). Example: 'ipmitool lan set 1 ipsrc static' followed by 'ipmitool lan set 1 ipaddr 10.0.1.100'. Verify with 'ipmitool lan print 1'.","ze":"lan set <通道> <参数> <值> 用于配置 BMC 网络，通道 1 一般是专用管理口。常用参数有 ipaddr、netmask、defgw ipaddr、ipsrc（static/dhcp），配置后用 lan print 1 验证。","s":""},{"id":"tm-bmc-017","d":"1","m":0,"t":"sensors","c":"输出判读","q":"What does this sensors output indicate about the power supply?","zq":"这段 sensors 输出说明供电状况如何？","o":["All voltages are critically low and the power supply is failing","The system is drawing 2847W total power and all voltage rails are within their acceptable min/max thresholds, indicating normal operation","The +12V rail at 11.78V is dangerously close to the minimum threshold","The power supply is oversized for this system at 2847W"],"zo":["各电压严重偏低，电源即将失效","整机功耗 2847 W，各电压轨均在允许的最小/最大范围内，属正常运行","+12V 的 11.78 V 已危险地接近下限","2847 W 说明该系统电源选型过大"],"a":1,"e":"All three voltage rails (+12V at 11.78V, +5V at 4.87V, +3.3V at 3.28V) are within their specified min/max ranges, indicating stable power delivery. The 2847W total power draw is typical for a DGX system under load with 8 GPUs. The +12V rail reading of 11.78V is within the 10.80-13.20V range and is not concerning.","ze":"+12V 的 11.78V、+5V 的 4.87V、+3.3V 的 3.28V 都落在各自的最小/最大范围内，供电稳定；2847W 是 8 卡 DGX 带载的典型功耗；11.78V 处于 10.80–13.20V 区间内，不必担心。","s":"power_meter-acpi-0\nAdapter: ACPI interface\npower1:      2847.00 W  (interval = 1.000 s)\n\nnct6775-isa-0a20\nAdapter: ISA adapter\n+12V:          +11.78 V  (min = +10.80 V, max = +13.20 V)\n+5V:            +4.87 V  (min =  +4.50 V, max =  +5.50 V)\n+3.3V:          +3.28 V  (min =  +2.97 V, max =  +3.63 V)"},{"id":"tm-bmc-018","d":"5","m":0,"t":"sensors","c":"故障排查","q":"The sensors command shows a CPU VRM temperature reading of 105C with an ALARM flag. What is the likely impact on system performance?","zq":"sensors 显示 CPU VRM 温度为 105℃ 并带 ALARM 标记，对系统性能的可能影响是什么？","o":["No impact; VRM temperatures are not related to CPU performance","The CPU is likely being thermally throttled because the VRM (Voltage Regulator Module) is overheating, which can cause reduced clock speeds and power delivery instability","The ALARM is cosmetic and only affects the sensor display","The GPU will throttle because VRM temperature affects GPU power"],"zo":["没有影响，VRM 温度与 CPU 性能无关","由于供电模块（VRM）过热，CPU 很可能被热降频，表现为频率下降与供电不稳","ALARM 只是显示上的提示，不影响硬件","GPU 会降频，因为 VRM 温度会影响 GPU 供电"],"a":1,"e":"VRM (Voltage Regulator Module) overheating at 105C is a serious issue. VRMs convert the 12V input to the precise voltages the CPU requires. When VRMs overheat, they reduce power output to protect themselves, which forces the CPU to throttle. This can also cause voltage instability leading to system crashes. Common causes include blocked airflow, failed fans, or excessive sustained CPU load. VRM heatsink and airflow should be inspected.","ze":"VRM 过热到 105℃ 是严重问题。VRM 把 12V 输入转换成 CPU 所需的精确电压；过热时它会降低输出以自保，迫使 CPU 降频，还可能造成电压不稳导致系统崩溃。常见原因：风道受阻、风扇故障、CPU 长期满载。应检查 VRM 散热片与气流。","s":""},{"id":"tm-bmc-019","d":"1","m":0,"t":"sensors","c":"最佳实践","q":"What is the recommended approach for monitoring sensor readings over time to detect gradual hardware degradation?","zq":"要长期监测传感器读数以及早发现硬件缓慢劣化，推荐的做法是？","o":["Manually run the sensors command once a day and visually check for changes","Script periodic sensor readings to a log file or monitoring system, and set alerts when values approach warning thresholds or show consistent upward/downward trends","Only check sensors when a hardware failure occurs","Replace all hardware annually regardless of sensor readings"],"zo":["每天手工跑一次 sensors，用肉眼比对变化","定时把传感器读数写入日志或监控系统，并在接近告警阈值或出现持续上升/下降趋势时触发告警","只在硬件已经故障后才检查 sensors","无论读数如何，每年更换全部硬件"],"a":1,"e":"Proactive monitoring involves scripting periodic 'sensors' output collection (e.g., via cron) and feeding the data to a time-series monitoring system like Prometheus, Grafana, or Nagios. Setting threshold-based alerts catches degradation early. For example, a CPU temperature trending upward over weeks may indicate thermal paste degradation or fan bearing wear before an actual failure occurs.","ze":"主动监控的做法是用 cron 定时采集 sensors 输出并送入时序系统（Prometheus、Grafana、Nagios 等），按阈值告警。例如 CPU 温度数周内持续上升，可能预示硅脂劣化或风扇轴承磨损，可在真正故障前发现。","s":""},{"id":"tm-bmc-020","d":"1","m":0,"t":"dmidecode","c":"输出判读","q":"What does this dmidecode output reveal about a DIMM slot?","zq":"这段 dmidecode 输出揭示了 DIMM 槽位的什么信息？","o":["The DIMM is installed but its speed could not be read","The DIMM slot DIMM_P1_G2 is empty (no module installed), which may indicate a missing DIMM if the BOM specifies full population","The DIMM has failed and needs replacement","The DIMM is running in single-channel mode"],"zo":["DIMM 已安装，但读不到速率","DIMM_P1_G2 槽位是空的（未安装模组）；若 BOM 要求满配，则说明漏装","该 DIMM 已损坏，需要更换","该 DIMM 运行在单通道模式"],"a":1,"e":"When dmidecode shows 'Size: No Module Installed' with all other fields as Unknown, the physical DIMM slot is empty. During system bring-up, comparing this against the Bill of Materials (BOM) is critical. An empty slot where a DIMM should be installed means reduced memory capacity and potentially suboptimal memory channel configuration, which affects memory bandwidth.","ze":"显示 Size: No Module Installed 且其余字段为 Unknown，说明该槽位是空的。上架时对照 BOM 很关键：应装而未装的槽位不仅降低容量，还可能破坏内存通道配置，影响带宽。","s":"Memory Device\n\tTotal Width: Unknown\n\tData Width: Unknown\n\tSize: No Module Installed\n\tForm Factor: Unknown\n\tLocator: DIMM_P1_G2\n\tBank Locator: NODE 1\n\tType: Unknown\n\tSpeed: Unknown"},{"id":"tm-bmc-021","d":"1","m":0,"t":"dmidecode","c":"命令语法","q":"Which dmidecode command shows processor (CPU) information including model, speed, and core count?","zq":"哪条 dmidecode 命令显示处理器信息（型号、主频、核心数）？","o":["dmidecode -t processor","dmidecode -t cpu","dmidecode --cpu-info","dmidecode -s processor-model"],"zo":["dmidecode -t processor","dmidecode -t cpu","dmidecode --cpu-info","dmidecode -s processor-model"],"a":0,"e":"dmidecode -t processor (or -t 4, since SMBIOS type 4 is Processor) displays detailed CPU information including the processor family, model name, maximum speed, current speed, core count, thread count, and socket designation. This is essential for verifying the CPU configuration matches the expected hardware specification during server bring-up.","ze":"dmidecode -t processor（SMBIOS 类型 4）显示处理器家族、型号、最高与当前主频、核心数、线程数与插槽标识，用于核对 CPU 配置是否符合硬件规格。","s":""},{"id":"tm-bmc-022","d":"1","m":0,"t":"dmidecode","c":"参数用法","q":"Which dmidecode command extracts the system serial number in a format suitable for inventory scripts?","zq":"哪条 dmidecode 命令能以适合资产盘点脚本的格式提取系统序列号？","o":["dmidecode -t system | grep Serial","dmidecode -s system-serial-number","dmidecode --serial","dmidecode -q -t 1"],"zo":["dmidecode -t system | grep Serial","dmidecode -s system-serial-number","dmidecode --serial","dmidecode -q -t 1"],"a":1,"e":"dmidecode -s system-serial-number uses the --string flag to output only the system serial number with no headers or extra text. This clean single-line output is ideal for scripting and inventory automation. The -s flag supports keywords like system-serial-number, system-product-name, system-manufacturer, bios-version, and baseboard-serial-number.","ze":"-s system-serial-number 只输出序列号，无表头、无多余文字，单行干净输出，适合脚本与资产盘点自动化。","s":""},{"id":"tm-bmc-023","d":"1","m":0,"t":"ipmitool","c":"故障排查","q":"The ipmitool sel elist output shows 'SEL is full' and no new events are being recorded. What should you do?","zq":"ipmitool sel elist 提示“SEL is full”，之后不再记录新事件，应如何处理？","o":["Replace the BMC battery to restore SEL storage","Save the current SEL entries for analysis, then clear the SEL with 'ipmitool sel clear' to allow new events to be logged","Reboot the system to automatically clear the SEL","Upgrade the BMC firmware to increase SEL storage capacity"],"zo":["更换 BMC 电池以恢复 SEL 存储","先把现有 SEL 条目保存下来用于分析，再执行 ipmitool sel clear 腾出空间，使新事件可被记录","重启系统自动清空 SEL","升级 BMC 固件以扩大 SEL 容量"],"a":1,"e":"The SEL (System Event Log) has a fixed size in the BMC's non-volatile storage. When full, new events are silently dropped, which means critical hardware events go unrecorded. The correct procedure is to first save the current entries (ipmitool sel elist > sel_backup.txt) for analysis, then clear the log (ipmitool sel clear) to make room for new events. Regular SEL harvesting should be automated to prevent this.","ze":"SEL 在 BMC 非易失存储中的容量是固定的，写满后新事件会被静默丢弃，关键硬件事件就漏记了。正确做法是先把现有条目导出保存（sel elist > sel_backup.txt），再 sel clear 腾出空间；平时应把 SEL 采集自动化。","s":""},{"id":"tm-bmc-024","d":"1","m":0,"t":"dmidecode","c":"概念理解","q":"What is the source of the data that dmidecode reads, and why does it require root privileges?","zq":"dmidecode 读取的数据来自何处？为什么需要 root 权限？","o":["dmidecode reads from the BIOS chip directly via SPI","dmidecode reads SMBIOS/DMI tables from system firmware that are mapped into memory by the BIOS/UEFI, requiring root to access /dev/mem or /sys/firmware/dmi","dmidecode queries the CPU directly for hardware information","dmidecode reads from the BMC's sensor data repository"],"zo":["直接通过 SPI 读取 BIOS 芯片","读取由 BIOS/UEFI 映射到内存的 SMBIOS/DMI 表，需 root 访问 /dev/mem 或 /sys/firmware/dmi","直接向 CPU 查询硬件信息","读取 BMC 的传感器数据仓库"],"a":1,"e":"dmidecode reads SMBIOS (System Management BIOS) tables that the BIOS/UEFI firmware populates during POST and maps into physical memory. On Linux, these are accessed either through /dev/mem (raw memory access) or /sys/firmware/dmi/tables/ (sysfs). Both require root privileges. The data includes hardware inventory information that the firmware collects about installed components.","ze":"dmidecode 读的是 BIOS/UEFI 在 POST 期间生成并映射进物理内存的 SMBIOS 表。Linux 下通过 /dev/mem（裸内存访问）或 /sys/firmware/dmi/tables/ 读取，两条路径都需要 root 权限。","s":""},{"id":"tm-bmc-025","d":"1","m":0,"t":"sensors","c":"最佳实践","q":"After running sensors-detect on a new system, what file stores the persistent configuration for which sensor modules to load at boot?","zq":"在新系统上运行过 sensors-detect 后，哪个文件保存“开机加载哪些传感器模块”的持久配置？","o":["/etc/sensors.conf","/etc/modules-load.d/ or /etc/modprobe.d/ (depending on distribution), with modules detected by sensors-detect","/var/lib/sensors/config","/usr/share/sensors/drivers.conf"],"zo":["/etc/sensors.conf","/etc/modules-load.d/ 或 /etc/modprobe.d/（因发行版而异），其中记录 sensors-detect 探测到的模块","/var/lib/sensors/config","/usr/share/sensors/drivers.conf"],"a":1,"e":"sensors-detect probes for hardware monitoring chips and offers to add the required kernel modules to the system's module auto-loading configuration. On systemd-based systems, this is typically /etc/modules-load.d/lm-sensors.conf. On older systems, modules are added to /etc/modules. The sensors thresholds and label configuration is separate, stored in /etc/sensors3.conf or /etc/sensors.d/.","ze":"sensors-detect 探测到监控芯片后，会把所需内核模块写入开机自动加载配置：systemd 系统通常是 /etc/modules-load.d/lm-sensors.conf，旧系统写进 /etc/modules。阈值与标签配置另存在 /etc/sensors3.conf 或 /etc/sensors.d/。","s":""},{"id":"tm-clus-001","d":"3","m":0,"t":"sinfo","c":"输出判读","q":"What do these sinfo node states mean?","zq":"这些 sinfo 节点状态分别代表什么？","o":["idle=available, alloc=has jobs, drain=being emptied for maintenance, down=unavailable/failed","idle=powered off, alloc=booting, drain=updating, down=busy","idle=no GPUs, alloc=GPUs allocated, drain=low memory, down=network issue","All states mean the nodes are operational with different load levels"],"zo":["idle=可用；alloc=已分配作业；drain=正在清空以维护；down=不可用/故障","idle=已关机；alloc=正在启动；drain=正在更新；down=繁忙","idle=无 GPU；alloc=GPU 已分配；drain=内存不足；down=网络故障","所有状态都表示节点可运行，只是负载不同"],"a":0,"e":"In Slurm, \"idle\" means the node is available and not running any jobs. \"alloc\" (allocated) means all resources are assigned to running jobs. \"drain\" means the node is marked for maintenance; running jobs will complete but no new jobs will be scheduled. \"down\" means the node is unavailable, either due to failure or manual admin action.","ze":"Slurm 中 idle 表示节点可用且没有作业；alloc 表示资源已全部分配给运行中的作业；drain 表示节点被标记维护——运行中的作业会跑完但不再调度新作业；down 表示节点不可用（故障或管理员操作）。","s":"$ sinfo -N -l\nNODELIST    NODES PARTITION STATE      CPUS MEMORY  GRES\ndgx-01          1 gpu*      idle       256  2048000 gpu:a100:8\ndgx-02          1 gpu*      alloc      256  2048000 gpu:a100:8\ndgx-03          1 gpu*      drain      256  2048000 gpu:a100:8\ndgx-04          1 gpu*      down       256  2048000 gpu:a100:8"},{"id":"tm-clus-002","d":"3","m":0,"t":"sinfo","c":"参数用法","q":"Which sinfo command shows only nodes that are in a drained state along with the reason they were drained?","zq":"哪条 sinfo 命令只显示处于 drain 状态的节点，并给出被 drain 的原因？","o":["sinfo -t drain -R","sinfo --state=drain --list-reasons","sinfo -N -t drain -o \"%N %T %E\"","Both the -R flag and the %E output format would show drained nodes with reasons"],"zo":["sinfo -t drain -R","sinfo --state=drain --list-reasons","sinfo -N -t drain -o \"%N %T %E\"","加 -R 与用 %E 输出格式都能显示被 drain 的节点及其原因"],"a":3,"e":"sinfo -t drain filters to only drained nodes. The -R flag or the %E format specifier in -o (output format) both display the reason a node was drained. Option A uses -R for a reason summary, while option C uses a custom output format showing node name (%N), state (%T), and reason (%E). Both approaches are valid.","ze":"sinfo -t drain 只筛出被 drain 的节点；-R 参数或 -o 输出格式里的 %E 都会显示 drain 原因。A 用 -R 给出原因摘要，C 用自定义格式输出节点名（%N）、状态（%T）与原因（%E），两种做法都成立。","s":""},{"id":"tm-clus-003","d":"3","m":0,"t":"sinfo","c":"输出判读","q":"You see a node in \"mixed\" state in sinfo output. What does this mean?","zq":"sinfo 输出中某个节点处于 mixed 状态，是什么意思？","o":["The node has both CPU and GPU resources","The node has some resources allocated to jobs and some resources still available for new jobs","The node is running both batch and interactive jobs","The node has a mix of healthy and faulty GPUs"],"zo":["该节点同时拥有 CPU 与 GPU 资源","该节点部分资源已分配给作业，剩余资源仍可接纳新作业","该节点同时运行批处理与交互式作业","该节点混有健康与故障的 GPU"],"a":1,"e":"The \"mixed\" state in Slurm means the node is partially allocated. Some CPUs, memory, or GPUs are assigned to running jobs while the remaining resources are available for new job scheduling. This is common on large nodes like DGX systems with 8 GPUs where one job may use 4 GPUs, leaving the other 4 available.","ze":"mixed 表示节点部分分配：一部分 CPU、内存或 GPU 已分配给运行中的作业，剩余资源仍可调度新作业。在 8 卡 DGX 这类大节点上很常见——一个作业用了 4 卡，另外 4 卡仍可用。","s":""},{"id":"tm-clus-004","d":"3","m":0,"t":"sinfo","c":"命令语法","q":"Which sinfo flag provides a node-oriented listing showing one line per node instead of summarized groups?","zq":"哪个 sinfo 参数按“每个节点一行”的方式列出，而不是按状态分组汇总？","o":["sinfo -a","sinfo -N","sinfo --long","sinfo -p all"],"zo":["sinfo -a","sinfo -N","sinfo --long","sinfo -p all"],"a":1,"e":"sinfo -N (or --Node) switches to a node-oriented format showing one line per node. By default, sinfo groups nodes with the same state and partition together. The -N flag is commonly combined with -l (long format) as \"sinfo -N -l\" to get detailed per-node information.","ze":"sinfo -N（--Node）切换为按节点列出，一行一个节点；默认情况下 sinfo 会把状态与分区相同的节点归组显示。-N 常与 -l 组合成 sinfo -N -l 获取每节点详细信息。","s":""},{"id":"tm-clus-005","d":"3","m":0,"t":"squeue","c":"输出判读","q":"What do the PENDING job reasons in this squeue output mean?","zq":"这段 squeue 输出中两个 PENDING 作业的原因分别是什么意思？","o":["Both pending jobs are waiting for the same reason","Job 1001 is waiting because higher-priority jobs exist ahead of it; job 1002 is waiting because the requested resources (nodes/GPUs) are not currently available","Job 1001 has been deprioritized by the admin; job 1002 has a resource request error","Both jobs will start as soon as job 1003 completes"],"zo":["两个作业等待的原因相同","作业 1001 是因为队列中有更高优先级的作业排在前面；作业 1002 是因为所申请的节点/GPU 当前不可用","作业 1001 被管理员降级；作业 1002 资源申请出错","两个作业都会在 1003 结束后立即启动"],"a":1,"e":"(Priority) means the job is eligible to run but other jobs with higher priority are ahead of it in the queue. (Resources) means the job could run based on priority but the specific resources it requested (CPUs, GPUs, memory, or nodes) are currently in use. Job 1003 is running (ST=R) on dgx-01 and dgx-02.","ze":"(Priority) 表示作业本可运行，但队首有更高优先级的作业；(Resources) 表示按优先级本可运行，但申请的 CPU/GPU/内存/节点当前正被占用。作业 1003 正在 dgx-01、dgx-02 上运行（ST=R）。","s":"$ squeue\nJOBID  PARTITION  NAME      USER    ST  TIME   NODES NODELIST(REASON)\n1001   gpu        train_llm alice   PD  0:00   4     (Priority)\n1002   gpu        inference bob     PD  0:00   1     (Resources)\n1003   gpu        eval      carol   R   2:15:30 2    dgx-[01-02]"},{"id":"tm-clus-006","d":"3","m":0,"t":"squeue","c":"参数用法","q":"Which squeue command shows only your own jobs with a custom format including job ID, name, state, elapsed time, and node list?","zq":"哪条 squeue 命令只显示自己的作业，并自定义输出作业号、名称、状态、已运行时间与节点列表？","o":["squeue -u $USER --format=\"%.18i %.30j %.8T %.10M %R\"","squeue --me --long","squeue -u $USER -o \"JobID,Name,State,Time,NodeList\"","squeue --user=$USER --verbose"],"zo":["squeue -u $USER --format=\"%.18i %.30j %.8T %.10M %R\"","squeue --me --long","squeue -u $USER -o \"JobID,Name,State,Time,NodeList\"","squeue --user=$USER --verbose"],"a":0,"e":"squeue -u $USER filters to your jobs. The --format flag uses printf-style field specifiers: %i=JobID, %j=JobName, %T=State (full word), %M=TimeUsed, %R=ReasonOrNodeList. The dot-number prefix (e.g., %.18i) specifies field width. This produces clean columnar output for monitoring your own job queue.","ze":"squeue -u $USER 只显示自己的作业；--format 使用 printf 风格字段：%i 作业号、%j 作业名、%T 状态全称、%M 已用时间、%R 原因或节点列表；点号加数字（如 %.18i）指定字段宽度，输出规整便于监控。","s":""},{"id":"tm-clus-007","d":"3","m":0,"t":"squeue","c":"故障排查","q":"A user reports their job has been pending for 3 hours with reason (ReqNodeNotAvail, Reserved for maintenance). What does this mean and what should you check?","zq":"用户反馈作业已 pending 3 小时，原因是 (ReqNodeNotAvail, Reserved for maintenance)，这意味着什么、该查什么？","o":["The job requested a specific node that does not exist in the cluster","One or more nodes that the job could run on are reserved or in a drain/down state, and there are not enough remaining nodes to satisfy the request","The Slurm controller is down and not processing job requests","The user does not have permission to submit jobs to that partition"],"zo":["作业申请了一个集群中不存在的节点","作业本可运行的节点被预留或处于 drain/down 状态，剩余可分配节点不足以满足申请","Slurm 控制器已宕机，不再处理作业请求","该用户没有向该分区提交作业的权限"],"a":1,"e":"The reason \"ReqNodeNotAvail, Reserved for maintenance\" means that nodes the scheduler would assign to this job are currently drained or reserved. If the job requires more nodes than are available in non-drained state, it will wait indefinitely. Check \"sinfo -t drain,down -R\" to see which nodes are unavailable and why, and whether the maintenance window can be shortened.","ze":"“ReqNodeNotAvail, Reserved for maintenance”表示调度器本会分配给该作业的节点正在被 drain 或预留；如果作业所需节点数超过非 drain 状态下的可用数，就会无限期等待。用 sinfo -t drain,down -R 查看哪些节点不可用及其原因，并评估维护窗口能否缩短。","s":""},{"id":"tm-clus-008","d":"3","m":0,"t":"scontrol","c":"命令语法","q":"Which scontrol command properly drains a node for maintenance with a reason message?","zq":"哪条 scontrol 命令能正确地把节点置为 drain（维护），并附带原因说明？","o":["scontrol update NodeName=dgx-03 State=DRAIN Reason=\"GPU replacement\"","scontrol drain dgx-03 \"GPU replacement\"","scontrol set node dgx-03 --state=drain --reason=\"GPU replacement\"","scontrol node dgx-03 drain \"GPU replacement\""],"zo":["scontrol update NodeName=dgx-03 State=DRAIN Reason=\"GPU replacement\"","scontrol drain dgx-03 \"GPU replacement\"","scontrol set node dgx-03 --state=drain --reason=\"GPU replacement\"","scontrol node dgx-03 drain \"GPU replacement\""],"a":0,"e":"scontrol update NodeName=<node> State=DRAIN Reason=\"<text>\" is the correct syntax. The \"update\" subcommand modifies Slurm entity properties. Setting State=DRAIN allows running jobs to finish but prevents new jobs from being scheduled. The Reason string is recorded and visible in sinfo -R output, providing an audit trail for why the node was drained.","ze":"正确语法是 scontrol update NodeName=<节点> State=DRAIN Reason=\"<原因>\"。update 子命令用于修改 Slurm 实体属性；设为 DRAIN 允许运行中作业跑完但不再调度新作业；Reason 会被记录并出现在 sinfo -R 中，形成审计线索。","s":""},{"id":"tm-clus-009","d":"3","m":0,"t":"scontrol","c":"故障排查","q":"After replacing a GPU and rebooting, a node still shows as \"down\" in Slurm. What scontrol command brings it back to service?","zq":"更换 GPU 并重启后，节点在 Slurm 中仍显示 down。用哪条 scontrol 命令让它恢复服务？","o":["scontrol update NodeName=dgx-03 State=IDLE","scontrol update NodeName=dgx-03 State=RESUME","scontrol reboot NodeName=dgx-03","scontrol update NodeName=dgx-03 State=UNDRAIN"],"zo":["scontrol update NodeName=dgx-03 State=IDLE","scontrol update NodeName=dgx-03 State=RESUME","scontrol reboot NodeName=dgx-03","scontrol update NodeName=dgx-03 State=UNDRAIN"],"a":1,"e":"scontrol update NodeName=<node> State=RESUME clears the down or drained state and returns the node to active service. State=IDLE would also work if the node is currently down (not drained). State=RESUME is the standard way to undo both DRAIN and DOWN states. The slurmd daemon must be running on the node for it to successfully resume.","ze":"scontrol update NodeName=<节点> State=RESUME 会清除 down 或 drained 状态、让节点恢复服务。节点处于 down（而非 drained）时设 IDLE 也能生效，但 RESUME 是同时撤销 DRAIN 与 DOWN 的标准做法；前提是该节点上的 slurmd 正在运行。","s":""},{"id":"tm-clus-010","d":"3","m":0,"t":"scontrol","c":"参数用法","q":"Which scontrol command shows the detailed configuration and current state of a specific node?","zq":"哪条 scontrol 命令显示指定节点的详细配置与当前状态？","o":["scontrol info node dgx-01","scontrol show node dgx-01","scontrol status dgx-01","scontrol describe node dgx-01"],"zo":["scontrol info node dgx-01","scontrol show node dgx-01","scontrol status dgx-01","scontrol describe node dgx-01"],"a":1,"e":"scontrol show node <nodename> displays detailed information about a node including its state, reason (if drained/down), configured resources (CPUs, memory, GPUs), allocated resources, last boot time, Slurm version, and current load. This is the go-to command for detailed node troubleshooting.","ze":"scontrol show node <节点> 显示节点的详细配置与当前状态：状态、原因（若 drain/down）、配置资源（CPU/内存/GPU）、已分配资源、上次启动时间、Slurm 版本与当前负载，是节点级排障的首选命令。","s":""},{"id":"tm-clus-011","d":"3","m":0,"t":"sacct","c":"命令语法","q":"Which sacct command shows detailed resource usage for a completed job including elapsed time, maximum memory, and exit code?","zq":"哪条 sacct 命令能显示已完成作业的详细资源用量，包括运行时长、最大内存与退出码？","o":["sacct -j 12345 --format=JobID,JobName,Elapsed,MaxRSS,ExitCode","sacct --job 12345 --long","sacct -j 12345 -v","sacct --jobid=12345 --details"],"zo":["sacct -j 12345 --format=JobID,JobName,Elapsed,MaxRSS,ExitCode","sacct --job 12345 --long","sacct -j 12345 -v","sacct --jobid=12345 --details"],"a":0,"e":"sacct -j <jobid> queries a specific job. The --format flag selects which fields to display. Key fields include Elapsed (wall clock time), MaxRSS (maximum resident set size / peak memory), ExitCode (return code:signal), MaxVMSize (peak virtual memory), and CPUTime (total CPU time across all cores). Custom format strings are essential for job post-mortem analysis.","ze":"sacct -j <作业号> 查询指定作业，--format 决定显示哪些字段。常用字段：Elapsed（墙钟时间）、MaxRSS（峰值常驻内存）、ExitCode（返回码:信号）、MaxVMSize（峰值虚拟内存）、CPUTime（所有核心累计 CPU 时间）。自定义格式是作业事后分析的基础。","s":""},{"id":"tm-clus-012","d":"3","m":0,"t":"sacct","c":"输出判读","q":"What does this sacct output reveal about the failed job?","zq":"这段 sacct 输出揭示了失败作业的什么问题？","o":["The job ran out of memory (OOM killed)","The job was killed by signal 9 (SIGKILL), which combined with MaxRSS near the memory limit suggests an out-of-memory kill by the kernel OOM killer or Slurm cgroup enforcement","The job completed successfully but Slurm misreported the status","The user cancelled the job with scancel"],"zo":["作业内存耗尽（被 OOM 杀死）","作业被信号 9（SIGKILL）杀死，结合接近内存上限的 MaxRSS，说明是被内核 OOM killer 或 Slurm cgroup 限制所杀","作业其实成功完成，只是 Slurm 状态上报错误","用户用 scancel 主动取消了作业"],"a":1,"e":"ExitCode 0:9 means the process exited with return code 0 but was killed by signal 9 (SIGKILL). SIGKILL is the signal used by the Linux OOM (Out Of Memory) killer and by Slurm's cgroup memory enforcement when a job exceeds its memory allocation. MaxRSS of 1843200K (~1.8TB) for the batch step suggests the job consumed enormous memory. Check dmesg for OOM killer messages.","ze":"ExitCode 0:9 表示进程返回码为 0，但被信号 9（SIGKILL）杀死。SIGKILL 正是 Linux OOM killer 与 Slurm cgroup 内存限制超限时使用的信号；batch 步 MaxRSS 约 1.8 TB 说明内存消耗极大，应查 dmesg 中的 OOM 记录。","s":"$ sacct -j 5678 --format=JobID,JobName,State,ExitCode,MaxRSS,Elapsed,NodeList\nJobID        JobName    State      ExitCode  MaxRSS     Elapsed    NodeList\n5678         train_gpt  FAILED     0:9       ---        1:23:45    dgx-01\n5678.batch   batch      FAILED     0:9       1843200K   1:23:45    dgx-01\n5678.0       orted      COMPLETED  0:0       52480K     1:23:42    dgx-01"},{"id":"tm-clus-013","d":"3","m":0,"t":"sacct","c":"最佳实践","q":"You need to analyze GPU utilization patterns across all jobs in the past 7 days to justify a cluster expansion. Which sacct approach is best?","zq":"需要分析过去 7 天所有作业的 GPU 使用情况，以论证扩容需求。哪种 sacct 用法最合适？","o":["sacct -a --starttime=now-7days --format=JobID,AllocTRES,Elapsed,State -P","sacct --allusers --starttime=$(date -d \"7 days ago\" +%Y-%m-%d) --format=JobID,User,Partition,AllocTRES,Elapsed,State,ReqTRES -P --delimiter=\"|\"","sacct -a -S now-7days -o ALL","sacct -a --json > usage.json"],"zo":["sacct -a --starttime=now-7days --format=JobID,AllocTRES,Elapsed,State -P","sacct --allusers --starttime=$(date -d \"7 days ago\" +%Y-%m-%d) --format=JobID,User,Partition,AllocTRES,Elapsed,State,ReqTRES -P --delimiter=\"|\"","sacct -a -S now-7days -o ALL","sacct -a --json > usage.json"],"a":1,"e":"Option B provides the most useful data for capacity analysis. --allusers shows all users (requires admin), --starttime filters the date range, --format includes AllocTRES (showing allocated GPUs) and ReqTRES (requested GPUs) to identify over-requesting. The -P flag with --delimiter produces parseable output. Comparing ReqTRES vs AllocTRES reveals whether users are requesting more GPUs than they utilize.","ze":"B 方案信息最全：--allusers 覆盖所有用户（需管理员），--starttime 限定日期范围，--format 同时包含 AllocTRES（实际分配的 GPU）与 ReqTRES（申请的 GPU），可识别超额申请；-P 配合 --delimiter 输出可解析格式。对比 Req 与 Alloc 就能看出用户是否申请多于实际使用。","s":""},{"id":"tm-clus-014","d":"3","m":0,"t":"sinfo","c":"参数用法","q":"Which sinfo command shows detailed long-format output including CPU count, memory, GRES (GPUs), and disk info?","zq":"哪条 sinfo 命令输出包含 CPU 数、内存、GRES（GPU）与磁盘信息的详细长格式？","o":["sinfo --verbose","sinfo -l","sinfo --detail","sinfo -a --long-format"],"zo":["sinfo --verbose","sinfo -l","sinfo --detail","sinfo -a --long-format"],"a":1,"e":"sinfo -l (or --long) displays extended information including CPU count, allocated/idle/other/total, S:C:T (sockets:cores:threads), memory in MB, temporary disk space, node weight, available features, and GRES (Generic Resources such as GPUs). This is commonly combined with -N as 'sinfo -N -l' for per-node detailed listings.","ze":"sinfo -l（--long）输出扩展信息：CPU 数、已分配/空闲/其他/总数、S:C:T（插槽:核心:线程）、内存、临时磁盘空间、节点权重、可用特性与 GRES（如 GPU）。常与 -N 组合成 sinfo -N -l 做逐节点查看。","s":""},{"id":"tm-clus-015","d":"3","m":0,"t":"sinfo","c":"输出判读","q":"What does this sinfo output tell you about the partition configuration?","zq":"这段 sinfo 输出说明了分区配置的什么情况？","o":["There are 14 total nodes across three partitions","The gpu partition is the default (indicated by *), allows 7-day jobs, and contains all 8 nodes; the debug partition limits jobs to 1 hour on 2 nodes; nodes can belong to multiple partitions","The priority partition has dedicated nodes that cannot be used by other partitions","Only the gpu partition is active because it has the asterisk"],"zo":["三个分区共 14 个节点","gpu 是默认分区（带 *），单作业最长 7 天，包含全部 8 个节点；debug 分区把作业限制在 2 个节点上、最长 1 小时；节点可同时属于多个分区","priority 分区拥有独占节点，其他分区不能使用","只有 gpu 分区是活动的，因为它带星号"],"a":1,"e":"The asterisk (*) on 'gpu*' indicates it is the default partition. Nodes can belong to multiple partitions simultaneously (dgx-01 and dgx-02 are in both gpu and debug). TIMELIMIT shows maximum job duration: 7 days for gpu, 1 hour for debug, 3 days for priority. All partitions show AVAIL=up. The 8 unique nodes serve all three partitions with different policies.","ze":"gpu* 后的星号表示它是默认分区。节点可同时属于多个分区（dgx-01、dgx-02 同时在 gpu 与 debug 中）。TIMELIMIT 是作业最长时长：gpu 7 天、debug 1 小时、priority 3 天；三个分区 AVAIL 均为 up，8 个节点按不同策略服务三个分区。","s":"$ sinfo -a\nPARTITION  AVAIL  TIMELIMIT  NODES  STATE  NODELIST\ngpu*       up     7-00:00:00   8    idle   dgx-[01-08]\ndebug      up     1:00:00      2    idle   dgx-[01-02]\npriority   up     3-00:00:00   4    idle   dgx-[05-08]"},{"id":"tm-clus-016","d":"3","m":0,"t":"sinfo","c":"最佳实践","q":"Which sinfo command is most useful for quickly generating a custom report of GPU availability across the cluster?","zq":"要快速生成一份集群 GPU 可用性的自定义报表，哪条 sinfo 命令最合适？","o":["sinfo -N -l | grep gpu","sinfo -N -o \"%N %P %T %G\" --state=idle,mixed","sinfo --json","sinfo -a -t idle"],"zo":["sinfo -N -l | grep gpu","sinfo -N -o \"%N %P %T %G\" --state=idle,mixed","sinfo --json","sinfo -a -t idle"],"a":1,"e":"The -o (--format) flag with custom format specifiers provides targeted output: %N=NodeName, %P=Partition, %T=State, %G=GRES (GPUs). Filtering with --state=idle,mixed shows only nodes with available resources. This custom format produces clean output for dashboards or scripts that track GPU availability across the cluster.","ze":"-o（--format）配合格式符可定向输出：%N 节点名、%P 分区、%T 状态、%G GRES（GPU）；再用 --state=idle,mixed 只保留仍有可用资源的节点。这样输出的内容干净，适合仪表盘或脚本统计 GPU 可用性。","s":""},{"id":"tm-clus-017","d":"3","m":0,"t":"squeue","c":"输出判读","q":"What does this squeue output indicate about job 2001?","zq":"这段 squeue 输出说明作业 2001 的情况如何？","o":["The job is pending and waiting for 4 nodes","The job is running across 4 DGX nodes (dgx-01 through dgx-04) and has been executing for 5 hours and 42 minutes","The job failed after 5 hours and 42 minutes","The job is using 4 GPUs on a single node"],"zo":["作业在排队，等待 4 个节点","作业正在 4 台 DGX 节点（dgx-01 至 dgx-04）上运行，已执行 5 小时 42 分","作业运行 5 小时 42 分后失败","作业在单节点上使用 4 块 GPU"],"a":1,"e":"State RUNNING means the job is actively executing. NODES=4 with NODELIST=dgx-[01-04] shows it is a multi-node distributed job spanning 4 DGX systems. TIME of 5:42:30 is the elapsed wall-clock time. This is typical for large-scale distributed training jobs in HPC GPU clusters where multiple DGX nodes are used together.","ze":"State RUNNING 表示作业正在执行；NODES=4 与 NODELIST=dgx-[01-04] 说明这是跨 4 台 DGX 的多节点分布式作业；TIME 5:42:30 是已运行的墙钟时间。这种跨节点分布式训练在 HPC GPU 集群里很典型。","s":"$ squeue -j 2001 --format=\"%.18i %.30j %.8T %.10M %.9P %.6D %R\"\nJOBID                          NAME    STATE       TIME PARTITION  NODES NODELIST(REASON)\n2001              multi_node_train  RUNNING   5:42:30       gpu      4 dgx-[01-04]"},{"id":"tm-clus-018","d":"3","m":0,"t":"squeue","c":"命令语法","q":"Which squeue flag shows the estimated start time for pending jobs?","zq":"哪个 squeue 参数可显示排队作业的预计开始时间？","o":["squeue --estimate","squeue --start","squeue -t PD --eta","squeue --when"],"zo":["squeue --estimate","squeue --start","squeue -t PD --eta","squeue --when"],"a":1,"e":"squeue --start displays the estimated start time for pending jobs based on the scheduler's backfill calculations. This helps users understand when their queued jobs are expected to begin. The estimate depends on the current running jobs' time limits and resource availability. It is commonly used as 'squeue --start -u $USER' to check your own pending jobs.","ze":"squeue --start 依据调度器的 backfill 计算显示排队作业的预计开始时间，估算结果取决于当前运行作业的时限与资源可用情况。常用 squeue --start -u $USER 查看自己作业的预计开始时间。","s":""},{"id":"tm-clus-019","d":"3","m":0,"t":"squeue","c":"故障排查","q":"A user's job has been pending for 12 hours with reason (QOSMaxGRESPerUser). What does this mean and how should it be resolved?","zq":"用户作业已 pending 12 小时，原因为 (QOSMaxGRESPerUser)。这意味着什么、应如何解决？","o":["The user's account has expired and needs to be renewed","The user has reached their QOS (Quality of Service) limit for maximum GRES (GPUs) per user, and must wait for their other running jobs to finish before more GPUs can be allocated","The GRES plugin is not configured on the cluster","The job is requesting more GPUs than exist in the cluster"],"zo":["该用户的账户已过期，需要续期","该用户已达 QOS 规定的单用户 GRES（GPU）上限，需等其其他运行中作业结束释放 GPU","集群未配置 GRES 插件","作业申请的 GPU 数超过集群总量"],"a":1,"e":"QOSMaxGRESPerUser means the QOS policy limits how many GRES (GPU) resources a single user can have allocated simultaneously. The user has already reached that limit with other running jobs. Solutions: wait for existing jobs to complete, cancel lower-priority jobs, or ask an administrator to adjust the QOS limits if justified. This policy ensures fair GPU sharing among users.","ze":"QOSMaxGRESPerUser 表示 QOS 策略限制了单用户可同时占用的 GRES（GPU）数量，该用户已被其他运行中作业占满配额。解决方式：等现有作业结束、取消低优先级作业，或在理由充分时请管理员调整 QOS 上限；该策略用于保证 GPU 的公平共享。","s":""},{"id":"tm-clus-020","d":"3","m":0,"t":"scontrol","c":"命令语法","q":"Which scontrol command places a hold on a pending job to prevent it from starting?","zq":"哪条 scontrol 命令可以挂起（hold）一个排队中的作业，使其不被启动？","o":["scontrol suspend 12345","scontrol hold 12345","scontrol update JobId=12345 Priority=0","Both scontrol hold and setting the job priority to zero prevent a pending job from starting"],"zo":["scontrol suspend 12345","scontrol hold 12345","scontrol update JobId=12345 Priority=0","scontrol hold 与把作业优先级设为 0 都能阻止排队作业启动"],"a":3,"e":"Both 'scontrol hold <jobid>' and 'scontrol update JobId=<jobid> Priority=0' prevent a pending job from being scheduled. The hold command is the standard approach and sets a user hold. Setting Priority=0 also works since jobs with priority 0 are never scheduled. To release a held job, use 'scontrol release <jobid>'. Note: 'suspend' pauses a running job, not a pending one.","ze":"scontrol hold <作业号> 与 scontrol update JobId=<作业号> Priority=0 都能阻止排队作业被调度。hold 是标准做法（设置用户 hold）；优先级为 0 的作业同样不会被调度。释放用 scontrol release；注意 suspend 暂停的是运行中的作业，不是排队作业。","s":""},{"id":"tm-clus-021","d":"3","m":0,"t":"scontrol","c":"输出判读","q":"What does this scontrol show node output reveal?","zq":"这段 scontrol show node 输出揭示了什么？","o":["The node is fully allocated and cannot accept new jobs","The node has 4 of 8 GPUs allocated (indices 0-3), 128 of 256 CPUs in use, is in MIXED state, and has a scheduled maintenance reason set by an admin","The node is down for maintenance and all jobs have been stopped","The node has a hardware failure on GPUs 4-7"],"zo":["节点已全部分配，无法再接纳新作业","节点 8 块 GPU 中已分配 4 块（索引 0-3）、256 个 CPU 中用 128 个，状态为 MIXED，且管理员设置了一条计划维护的 Reason","节点因维护而 down，所有作业已停止","节点的 4-7 号 GPU 存在硬件故障"],"a":1,"e":"The MIXED state means the node is partially allocated. GresUsed shows gpu:a100:4(IDX:0-3) meaning GPUs 0-3 are allocated to jobs while GPUs 4-7 are available. CPUAlloc=128 of CPUTot=256 and AllocMem=1024000 of 2048000 confirm partial allocation. The Reason field shows a scheduled maintenance note, but since the state is MIXED (not DRAIN), the node is still accepting new jobs. The reason may be informational or from a previous drain state.","ze":"MIXED 表示部分分配：GresUsed 显示 gpu:a100:4(IDX:0-3)，即 0-3 号 GPU 已分配、4-7 号仍可用；CPUAlloc 128/256 与 AllocMem 1024000/2048000 也印证了部分占用。Reason 里有维护备注，但由于状态是 MIXED 而非 DRAIN，节点仍在接收新作业。","s":"$ scontrol show node dgx-03\nNodeName=dgx-03 Arch=x86_64 CoresPerSocket=64\n   CPUAlloc=128 CPUTot=256 CPULoad=64.52\n   Gres=gpu:a100:8\n   GresUsed=gpu:a100:4(IDX:0-3)\n   State=MIXED\n   RealMemory=2048000 AllocMem=1024000\n   Reason=scheduled maintenance [admin@2026-02-15T10:00:00]"},{"id":"tm-clus-022","d":"3","m":0,"t":"scontrol","c":"最佳实践","q":"After changing slurm.conf on the Slurm controller, what scontrol command applies the new configuration without restarting the slurmctld daemon?","zq":"修改 Slurm 控制节点的 slurm.conf 后，哪条 scontrol 命令可不重启 slurmctld 而让新配置生效？","o":["scontrol reload","scontrol reconfig","scontrol update config","scontrol apply"],"zo":["scontrol reload","scontrol reconfig","scontrol update config","scontrol apply"],"a":1,"e":"scontrol reconfig tells the Slurm controller (slurmctld) to re-read its configuration file (slurm.conf) and apply changes without requiring a daemon restart. This avoids disrupting running jobs. Not all configuration changes can be applied live; some require a full restart. It also triggers slurmd on all compute nodes to re-read their local configuration.","ze":"scontrol reconfig 让 slurmctld 重新读取 slurm.conf 并应用改动，无需重启守护进程，从而避免打断运行中的作业。并非所有配置项都支持热加载，部分仍需完整重启；该命令同时会让计算节点上的 slurmd 重读本地配置。","s":""},{"id":"tm-clus-023","d":"3","m":0,"t":"sacct","c":"参数用法","q":"Which sacct flag produces parseable output with pipe-delimited fields instead of the default fixed-width format?","zq":"哪个 sacct 参数可输出以竖线分隔、便于程序解析的格式，而不是默认的定宽格式？","o":["sacct --csv","sacct -P --delimiter=\"|\"","sacct --parsable","sacct -o tsv"],"zo":["sacct --csv","sacct -P --delimiter=\"|\"","sacct --parsable","sacct -o tsv"],"a":1,"e":"sacct -P (or --parsable2) produces output without trailing delimiters, using | as the default delimiter. Adding --delimiter='|' explicitly sets the pipe character (though it is the default). The -P flag is essential for scripting and data analysis because the default fixed-width format is difficult to parse programmatically. You can also use --delimiter=',' for CSV output.","ze":"sacct -P（--parsable2）输出不带行尾分隔符，默认以 | 分隔；--delimiter 可显式指定分隔符（用 , 即输出 CSV）。默认的定宽格式很难被程序解析，因此脚本与数据分析必须用 -P。","s":""},{"id":"tm-clus-024","d":"3","m":0,"t":"sacct","c":"输出判读","q":"What does the AllocTRES field in this sacct output tell you?","zq":"这段 sacct 输出中的 AllocTRES 字段说明了什么？","o":["The job requested but did not actually use these resources","The job was allocated 256 CPUs, 8 GPUs, ~2TB of memory on 1 node, showing the Trackable RESources (TRES) that Slurm accounted for","The billing field means the user was charged 256 credits","The AllocTRES only shows limits, not actual allocation"],"zo":["作业申请了这些资源，但实际并未使用","作业被分配了 256 个 CPU、8 块 GPU、约 2 TB 内存、1 个节点，即 Slurm 记账的可追踪资源（TRES）","billing 字段表示向用户扣了 256 个额度","AllocTRES 只表示限额，不表示实际分配"],"a":1,"e":"AllocTRES (Allocated Trackable RESources) shows the exact resources Slurm allocated to the job. gres/gpu=8 means 8 GPUs, cpu=256 means 256 CPU cores, mem=2048000M means approximately 2TB of memory, node=1 means one node. The billing field is used for fairshare calculations. This data is essential for capacity planning and understanding actual resource consumption.","ze":"AllocTRES 显示 Slurm 实际分配给作业的资源：gres/gpu=8 是 8 块 GPU、cpu=256 是 256 个核、mem=2048000M 约 2 TB、node=1 是 1 个节点；billing 字段用于 fairshare 计算。这些数据是容量规划与资源核算的直接依据。","s":"$ sacct -j 9999 --format=JobID,AllocTRES%60,Elapsed\nJobID                                                    AllocTRES    Elapsed\n9999             billing=256,cpu=256,gres/gpu=8,mem=2048000M,node=1   4:30:15\n9999.batch       cpu=256,mem=2048000M,node=1                          4:30:15\n9999.0           billing=256,cpu=256,gres/gpu=8,mem=2048000M,node=1   4:30:12"},{"id":"tm-clus-025","d":"3","m":0,"t":"sacct","c":"故障排查","q":"sacct shows a job with State=TIMEOUT and Elapsed matching the partition's MaxTime exactly. What happened and how should the user fix this?","zq":"sacct 显示某作业 State=TIMEOUT，且 Elapsed 恰好等于分区 MaxTime。发生了什么、用户该如何改进？","o":["The Slurm controller crashed and the job was killed","The job ran until the partition's maximum walltime limit and was terminated by Slurm; the user should estimate runtime more accurately and request more time with --time, or use checkpointing to resume","The node the job was running on went down","The user's account ran out of allocation hours"],"zo":["Slurm 控制器崩溃导致作业被杀","作业跑到分区最大时长上限后被 Slurm 终止；用户应更准确估算时长并用 --time 申请更多时间，或使用检查点续跑","作业所在节点宕机","用户的机时额度用尽"],"a":1,"e":"State=TIMEOUT means the job exceeded its walltime limit. When Elapsed matches the partition's MaxTime, the job consumed the entire allowed duration. Solutions include: requesting more time with sbatch --time if the partition allows it, moving to a partition with a higher time limit, implementing application-level checkpointing to save progress and resume in a new job, or optimizing the workload to complete faster.","ze":"State=TIMEOUT 表示作业超过墙钟时限被杀；Elapsed 恰好等于分区 MaxTime，说明用满了允许时长。解决办法：分区允许时用 sbatch --time 申请更长时间、换到时限更宽松的分区、实现应用级检查点以便续跑，或优化负载缩短运行时间。","s":""},{"id":"tm-cont-001","d":"3","m":0,"t":"docker","c":"命令语法","q":"Which docker run flag enables GPU access inside a container using the NVIDIA Container Toolkit?","zq":"在已安装 NVIDIA Container Toolkit 的环境里，哪个 docker run 参数可让容器访问 GPU？","o":["--device=/dev/nvidia0","--gpus all","--nvidia-gpu","--runtime=gpu"],"zo":["--device=/dev/nvidia0","--gpus all","--nvidia-gpu","--runtime=gpu"],"a":1,"e":"The --gpus flag (introduced with Docker 19.03+) is the standard way to expose GPUs to containers when the NVIDIA Container Toolkit (nvidia-container-toolkit) is installed. \"--gpus all\" exposes all GPUs, while \"--gpus 2\" or \"--gpus device=0,1\" limit which GPUs are visible. This flag requires the nvidia-container-runtime to be configured as a Docker runtime.","ze":"--gpus 是 Docker 19.03+ 在装好 NVIDIA Container Toolkit 后暴露 GPU 的标准方式。--gpus all 暴露全部；--gpus 2 或 --gpus device=0,1 限制可见范围。前提是把 nvidia-container-runtime 配置为 Docker 的运行时。","s":""},{"id":"tm-cont-002","d":"3","m":0,"t":"docker","c":"故障排查","q":"Running \"docker run --gpus all nvidia/cuda:12.3.0-base-ubuntu22.04 nvidia-smi\" fails with \"could not select device driver\". What is the likely cause?","zq":"执行 docker run --gpus all nvidia/cuda:12.3.0-base-ubuntu22.04 nvidia-smi 报错 “could not select device driver”，最可能的原因是？","o":["The CUDA version in the container does not match the host driver","The NVIDIA Container Toolkit (nvidia-container-toolkit) is not installed or the nvidia-container-runtime is not configured in Docker's daemon.json","The docker daemon needs to be restarted","The GPU is in exclusive compute mode"],"zo":["容器内 CUDA 版本与主机驱动不匹配","未安装 NVIDIA Container Toolkit，或 Docker 的 daemon.json 中没有配置 nvidia-container-runtime","需要重启 docker 守护进程","GPU 处于独占计算模式"],"a":1,"e":"The error \"could not select device driver\" with the --gpus flag means Docker cannot find the NVIDIA container runtime. The nvidia-container-toolkit package must be installed and either configured as the default runtime in /etc/docker/daemon.json or specified with --runtime=nvidia. After installation, the Docker daemon must be restarted with \"systemctl restart docker\".","ze":"带 --gpus 时报“could not select device driver”，说明 Docker 找不到 NVIDIA 容器运行时。需要安装 nvidia-container-toolkit，并在 /etc/docker/daemon.json 里配置为默认运行时（或显式 --runtime=nvidia），然后 systemctl restart docker。","s":""},{"id":"tm-cont-003","d":"3","m":0,"t":"docker","c":"最佳实践","q":"When pulling GPU container images for a DGX cluster, what is the recommended image registry?","zq":"在 DGX 集群上拉取 GPU 容器镜像，推荐使用哪个镜像仓库？","o":["Docker Hub (docker.io)","NVIDIA NGC Container Registry (nvcr.io)","GitHub Container Registry (ghcr.io)","Amazon ECR Public"],"zo":["Docker Hub（docker.io）","NVIDIA NGC 容器仓库（nvcr.io）","GitHub Container Registry（ghcr.io）","Amazon ECR Public"],"a":1,"e":"The NVIDIA NGC (GPU Cloud) Container Registry at nvcr.io provides optimized, tested, and NVIDIA-supported GPU container images. NGC images for PyTorch, TensorFlow, RAPIDS, and other frameworks are pre-built with optimized CUDA, cuDNN, NCCL, and driver compatibility tested on DGX systems. Example: nvcr.io/nvidia/pytorch:24.01-py3.","ze":"nvcr.io（NGC）提供经优化、测试并有 NVIDIA 支持的 GPU 容器镜像：PyTorch、TensorFlow、RAPIDS 等镜像都已针对 DGX 验证 CUDA、cuDNN、NCCL 与驱动兼容性，例如 nvcr.io/nvidia/pytorch:24.01-py3。","s":""},{"id":"tm-cont-004","d":"3","m":0,"t":"docker","c":"概念理解","q":"Why is Docker generally not recommended for multi-node GPU jobs in HPC environments?","zq":"在 HPC 环境中，为什么一般不建议用 Docker 跑多节点 GPU 作业？","o":["Docker cannot access GPUs","Docker requires root privileges for the daemon, does not natively integrate with job schedulers like Slurm, and has overhead from its layered filesystem and network namespace","Docker images are too large for HPC storage","Docker does not support NVIDIA GPUs newer than A100"],"zo":["Docker 无法访问 GPU","Docker 守护进程需要 root 权限、不与 Slurm 等调度器原生集成，且分层文件系统与网络命名空间带来额外开销","Docker 镜像对 HPC 存储来说太大","Docker 不支持 A100 之后的 NVIDIA GPU"],"a":1,"e":"Docker's architecture has several limitations for HPC: the daemon runs as root (security concern on shared clusters), it does not integrate with Slurm or other schedulers natively, its overlay filesystem adds I/O overhead, and its network namespacing complicates high-performance InfiniBand networking. Enroot and Pyxis were specifically designed to solve these problems for HPC GPU workloads.","ze":"Docker 在 HPC 上有几处硬伤：守护进程以 root 运行（共享集群的安全隐患）、不与 Slurm 等调度器原生集成、overlay 分层文件系统带来 I/O 开销、网络命名空间让 InfiniBand 高性能网络复杂化。Enroot 与 Pyxis 正是为此而生。","s":""},{"id":"tm-cont-005","d":"3","m":0,"t":"enroot","c":"命令语法","q":"What is the correct three-step enroot workflow to go from a Docker image to a running container?","zq":"从 Docker 镜像到运行容器，enroot 正确的三步工作流是？","o":["enroot pull, enroot build, enroot run","enroot import, enroot create, enroot start","enroot download, enroot install, enroot exec","enroot fetch, enroot unpack, enroot launch"],"zo":["enroot pull、build、run","enroot import、create、start","enroot download、install、exec","enroot fetch、unpack、launch"],"a":1,"e":"The enroot workflow is: 1) \"enroot import\" downloads a container image and saves it as a squashfs file (.sqsh). 2) \"enroot create\" unpacks the squashfs into a rootfs directory (a container sandbox). 3) \"enroot start\" launches a process inside the sandbox. This unprivileged workflow requires no daemon and no root access.","ze":"enroot 的三步：import 下载镜像并存为 squashfs（.sqsh）；create 解包为 rootfs 目录（沙箱）；start 在沙箱内启动进程。整个过程无需守护进程、无需 root。","s":""},{"id":"tm-cont-006","d":"3","m":0,"t":"enroot","c":"参数用法","q":"What does the following enroot import command do?","zq":"下面这条 enroot import 命令做了什么？","o":["It pulls and runs the PyTorch container from NGC","It downloads the NGC PyTorch image and converts it to a squashfs file (nvidia+pytorch+24.01-py3.sqsh) for later use with enroot create","It creates a Docker volume from the NGC image","It installs PyTorch directly on the host system"],"zo":["拉取并运行 NGC 上的 PyTorch 容器","从 NGC 下载 PyTorch 镜像并转换为 squashfs 文件（nvidia+pytorch+24.01-py3.sqsh），供后续 enroot create 使用","从 NGC 镜像创建 Docker 卷","在主机上直接安装 PyTorch"],"a":1,"e":"enroot import with the docker:// scheme downloads the specified container image from a registry (in this case NGC at nvcr.io) and converts it into a compressed squashfs archive (.sqsh file). The # separates the registry host from the image path. This .sqsh file is a portable, read-only image that can be used with \"enroot create\" to create runnable container sandboxes.","ze":"docker:// 方案下 import 会从仓库（此处 nvcr.io）下载指定镜像并转换成压缩的 squashfs（.sqsh 文件）；# 用于分隔仓库主机与镜像路径。得到的 .sqsh 是可移植的只读镜像，供 enroot create 使用。","s":"$ enroot import docker://nvcr.io#nvidia/pytorch:24.01-py3"},{"id":"tm-cont-007","d":"3","m":0,"t":"enroot","c":"概念理解","q":"What is the key advantage of enroot over Docker for running GPU containers on a shared HPC cluster?","zq":"在共享 HPC 集群上运行 GPU 容器，enroot 相对 Docker 的关键优势是什么？","o":["Enroot supports more GPU architectures than Docker","Enroot runs entirely unprivileged (no root daemon), uses no overlay filesystem, and directly accesses the host network and GPU devices without namespace overhead","Enroot has a built-in job scheduler","Enroot containers are faster to build than Docker images"],"zo":["enroot 支持的 GPU 架构比 Docker 多","enroot 全程无需特权（无 root 守护进程）、不使用 overlay 文件系统，并直接使用主机网络与 GPU 设备，没有命名空间开销","enroot 内置作业调度器","enroot 容器构建速度比 Docker 镜像快"],"a":1,"e":"Enroot was designed by NVIDIA specifically for HPC environments. It requires no root-privileged daemon, uses simple rootfs directories instead of layered overlay filesystems, shares the host network stack (critical for InfiniBand RDMA), and directly accesses GPU devices. This eliminates the security, performance, and networking issues that make Docker problematic on shared HPC clusters.","ze":"Enroot 由 NVIDIA 为 HPC 设计：不需要 root 守护进程、用普通 rootfs 目录替代分层 overlay、共享主机网络栈（对 InfiniBand RDMA 至关重要）、可直接访问 GPU 设备。这消除了 Docker 在共享 HPC 集群上的安全、性能与网络难题。","s":""},{"id":"tm-cont-008","d":"3","m":0,"t":"enroot","c":"故障排查","q":"An enroot start command fails with \"nvidia-container-cli: device error: unknown device id\". What should you check?","zq":"enroot start 报错 “nvidia-container-cli: device error: unknown device id”，应检查什么？","o":["The enroot squashfs file is corrupted","The CUDA version inside the container exceeds the host driver capability","The nvidia-container-cli hook is failing because the GPU driver is not loaded or the libnvidia-container package is misconfigured","The container needs to be re-imported from the registry"],"zo":["enroot 的 squashfs 文件已损坏","容器内 CUDA 版本超出主机驱动能力","nvidia-container-cli 钩子失败，因为 GPU 驱动未加载或 libnvidia-container 配置有误","需要从仓库重新导入容器"],"a":2,"e":"enroot uses nvidia-container-cli hooks to inject GPU device files and driver libraries into containers. The \"unknown device id\" error means nvidia-container-cli cannot enumerate GPUs, typically because the NVIDIA kernel driver is not loaded (check with lsmod | grep nvidia), the /dev/nvidia* device files do not exist, or libnvidia-container is not properly installed. Run nvidia-smi on the host first to verify GPU access.","ze":"enroot 通过 nvidia-container-cli 钩子把 GPU 设备文件与驱动库注入容器。“unknown device id”表示该工具枚举不到 GPU，常见原因是驱动未加载（lsmod | grep nvidia）、/dev/nvidia* 设备文件不存在或 libnvidia-container 安装不当。先在主机上跑 nvidia-smi 验证。","s":""},{"id":"tm-cont-009","d":"3","m":0,"t":"enroot","c":"参数用法","q":"Which enroot start flags mount the host filesystem and pass environment variables into the container?","zq":"哪组 enroot start 参数可以挂载主机目录并向容器传入环境变量？","o":["enroot start --bind /data:/data --env NCCL_DEBUG=INFO my_container","enroot start --mount /data:/data --env NCCL_DEBUG=INFO my_container","enroot start -m /data:/data -e NCCL_DEBUG=INFO my_container","enroot start --volume /data:/data --export NCCL_DEBUG=INFO my_container"],"zo":["--bind /data:/data --env NCCL_DEBUG=INFO","--mount /data:/data --env NCCL_DEBUG=INFO","-m /data:/data -e NCCL_DEBUG=INFO","--volume ... --export ..."],"a":1,"e":"enroot start uses --mount (or -m) to bind-mount host paths into the container, following the format source:destination. The --env (or -e) flag passes environment variables. Unlike Docker's --bind or -v syntax, enroot uses --mount. This is essential for accessing shared filesystems (like Lustre or NFS) and configuring NCCL for multi-node GPU communication.","ze":"enroot start 用 --mount（或 -m）按 source:destination 绑定挂载主机路径，用 --env（或 -e）传环境变量；与 Docker 的 -v/--bind 语法不同。访问共享文件系统（Lustre、NFS）以及配置多节点 NCCL 时都要用到。","s":""},{"id":"tm-cont-010","d":"3","m":0,"t":"pyxis","c":"命令语法","q":"Which srun flag, provided by the Pyxis plugin, specifies a container image to run a job in?","zq":"Pyxis 插件为 srun 提供的哪个参数用于指定作业所用的容器镜像？","o":["srun --docker-image=<image>","srun --container-image=<image>","srun --enroot-image=<image>","srun --image=<image>"],"zo":["--docker-image=","--container-image=","--enroot-image=","--image="],"a":1,"e":"Pyxis adds the --container-image flag to srun (and sbatch). This flag specifies the container image URI, which Pyxis passes to enroot to import, create, and start the container. Example: srun --container-image=nvcr.io#nvidia/pytorch:24.01-py3 python train.py.","ze":"Pyxis 为 srun（与 sbatch）增加了 --container-image，用于指定镜像 URI；Pyxis 会交给 enroot 完成导入、创建与启动，例如 srun --container-image=nvcr.io#nvidia/pytorch:24.01-py3 python train.py。","s":""},{"id":"tm-cont-011","d":"3","m":0,"t":"pyxis","c":"概念理解","q":"What is the relationship between Pyxis and Enroot?","zq":"Pyxis 与 Enroot 是什么关系？","o":["Pyxis is a replacement for Enroot that works directly with Docker","Pyxis is a Slurm SPANK plugin that uses Enroot as its container runtime backend to execute containerized jobs through Slurm","Enroot is a plugin for Pyxis that adds GPU support","They are independent tools that can be used separately but not together"],"zo":["Pyxis 是 Enroot 的替代品，可直接对接 Docker","Pyxis 是 Slurm 的 SPANK 插件，用 Enroot 作为容器运行时后端，从而通过 Slurm 运行容器化作业","Enroot 是 Pyxis 的插件，用于提供 GPU 支持","两者相互独立，可分别使用但不能配合"],"a":1,"e":"Pyxis is a Slurm SPANK (Slurm Plug-in Architecture for Node and job Kontrol) plugin developed by NVIDIA. When a user submits a job with --container-image, Pyxis intercepts the job launch and uses Enroot behind the scenes to import, create, and start the container on each allocated node. This provides seamless container integration with Slurm without users needing to manage Enroot directly.","ze":"Pyxis 是 NVIDIA 开发的 Slurm SPANK 插件。用户以 --container-image 提交作业时，Pyxis 拦截作业启动，在每台分配到的节点上用 Enroot 导入、创建并启动容器，实现容器与 Slurm 的无缝集成，用户无需直接操作 Enroot。","s":""},{"id":"tm-cont-012","d":"3","m":0,"t":"pyxis","c":"参数用法","q":"Which Pyxis flag mounts a host directory inside the container when running with srun?","zq":"用 srun 运行时，哪个 Pyxis 参数把主机目录挂载进容器？","o":["srun --container-image=<img> --bind=/data:/data python train.py","srun --container-image=<img> --container-mounts=/data:/data python train.py","srun --container-image=<img> --mount=/data:/data python train.py","srun --container-image=<img> --volume=/data:/data python train.py"],"zo":["--bind=/data:/data","--container-mounts=/data:/data","--mount=/data:/data","--volume=/data:/data"],"a":1,"e":"Pyxis provides the --container-mounts flag for bind-mounting host directories into the container, using source:destination[:flags] format. Multiple mounts can be comma-separated. This is essential for accessing shared storage (e.g., Lustre, GPFS, NFS) containing datasets and model checkpoints from within the container.","ze":"Pyxis 提供 --container-mounts，按 source:destination[:flags] 绑定挂载主机目录，多组用逗号分隔。要访问共享存储上的数据集与模型检查点，这个参数是必需的。","s":""},{"id":"tm-cont-013","d":"3","m":0,"t":"pyxis","c":"故障排查","q":"A multi-node Slurm job with --container-image works on one node but fails on others with \"No such file\" for the squashfs image. What is the likely issue?","zq":"带 --container-image 的多节点 Slurm 作业在一台节点上正常，其他节点报 squashfs 镜像 “No such file”，最可能的原因是什么？","o":["The container image is too large for the other nodes","The enroot image cache (typically ~/.local/share/enroot/) is on local storage and the imported image is only available on the node where the srun command was issued","The other nodes do not have GPUs","The Slurm controller cannot reach the other nodes"],"zo":["镜像对其它节点来说太大","enroot 镜像缓存（通常位于 ~/.local/share/enroot/）在本地磁盘上，导入的镜像只存在于执行 srun 的那台节点","其他节点没有 GPU","Slurm 控制器无法访问其他节点"],"a":1,"e":"By default, enroot stores imported images and created containers in ~/.local/share/enroot/ on local disk. In a multi-node job, each node needs access to the image. If the user's home directory is on local storage instead of shared NFS/Lustre, the image will only exist on the submission node. Solutions include using shared storage for enroot data, pre-pulling images on all nodes, or configuring Pyxis to import on each node.","ze":"enroot 默认把导入的镜像与创建的容器放在本地磁盘的 ~/.local/share/enroot/。多节点作业要求每个节点都能访问镜像；若家目录在本地盘而非共享 NFS/Lustre，镜像只存在于作业提交节点。解决办法：把 enroot 数据放到共享存储、各节点预拉取，或让 Pyxis 逐节点导入。","s":""},{"id":"tm-cont-014","d":"3","m":0,"t":"docker","c":"参数用法","q":"Which docker run flag limits a container to use only specific GPUs (e.g., GPUs 0 and 2)?","zq":"哪个 docker run 参数可把容器限制为只使用指定的 GPU（例如 GPU 0 和 2）？","o":["docker run --gpus \"device=0,2\"","docker run --gpus 2","docker run --gpu-ids 0,2","docker run --nvidia device=0,2"],"zo":["docker run --gpus \"device=0,2\"","docker run --gpus 2","docker run --gpu-ids 0,2","docker run --nvidia device=0,2"],"a":0,"e":"The --gpus flag accepts device specifications. \"--gpus 'device=0,2'\" exposes only GPUs 0 and 2 to the container. This is useful for running multiple containers on a single DGX system, each with a subset of GPUs. You can also use GPU UUIDs instead of indices. Note that \"--gpus 2\" means \"any 2 GPUs\" (count), not \"GPU index 2\".","ze":"--gpus 支持设备规格：“--gpus 'device=0,2'”只把 0 与 2 号 GPU 暴露给容器，适合在一台 DGX 上并行跑多个各占部分 GPU 的容器，也可用 GPU UUID 代替索引。注意“--gpus 2”表示“任意 2 块”，不是“2 号 GPU”。","s":""},{"id":"tm-cont-015","d":"3","m":0,"t":"docker","c":"输出判读","q":"What does this daemon.json configuration enable?","zq":"这份 daemon.json 配置启用了什么？","o":["It installs the NVIDIA driver inside all Docker containers","It sets the NVIDIA container runtime as the default for all Docker containers, eliminating the need to specify --gpus or --runtime=nvidia on every docker run command","It restricts Docker to only run NVIDIA-based containers","It configures Docker to use GPU acceleration for image builds"],"zo":["在所有 Docker 容器内安装 NVIDIA 驱动","把 NVIDIA 容器运行时设为所有 Docker 容器的默认运行时，从而无需每次 docker run 都加 --gpus 或 --runtime=nvidia","限制 Docker 只能运行 NVIDIA 相关容器","让 Docker 在构建镜像时启用 GPU 加速"],"a":1,"e":"Setting 'default-runtime' to 'nvidia' in daemon.json means every container launched by this Docker daemon will automatically use the NVIDIA container runtime. This eliminates the need to pass --gpus or --runtime=nvidia on every docker run command. The NVIDIA runtime handles injecting GPU device files and driver libraries into containers transparently.","ze":"把 default-runtime 设为 nvidia，意味着该 Docker 守护进程启动的所有容器默认使用 NVIDIA 容器运行时，不必每次 docker run 都加 --gpus 或 --runtime=nvidia；GPU 设备文件与驱动库由该运行时透明注入。","s":"$ cat /etc/docker/daemon.json\n{\n    \"default-runtime\": \"nvidia\",\n    \"runtimes\": {\n        \"nvidia\": {\n            \"path\": \"nvidia-container-runtime\",\n            \"runtimeArgs\": []\n        }\n    }\n}"},{"id":"tm-cont-016","d":"3","m":0,"t":"docker","c":"故障排查","q":"A Docker GPU container starts successfully but nvidia-smi inside the container shows fewer GPUs than the host. What is the most likely cause?","zq":"Docker GPU 容器能正常启动，但容器内 nvidia-smi 显示的 GPU 数量少于主机，最可能的原因是什么？","o":["The container's CUDA version is incompatible with some GPUs","The NVIDIA_VISIBLE_DEVICES environment variable or the --gpus flag is restricting which GPUs are visible to the container","Some GPUs have failed since the container was built","The Docker image was built on a system with fewer GPUs"],"zo":["容器内 CUDA 版本与部分 GPU 不兼容","NVIDIA_VISIBLE_DEVICES 环境变量或 --gpus 参数限制了容器可见的 GPU","构建镜像后部分 GPU 发生了故障","镜像是在 GPU 更少的机器上构建的"],"a":1,"e":"The NVIDIA Container Toolkit uses the NVIDIA_VISIBLE_DEVICES environment variable (set automatically by --gpus) to control GPU visibility. If --gpus is set to a specific count or device list, only those GPUs appear inside the container. Check the docker run command for --gpus specifications and the NVIDIA_VISIBLE_DEVICES variable. Use '--gpus all' to expose all GPUs.","ze":"NVIDIA Container Toolkit 通过 NVIDIA_VISIBLE_DEVICES（由 --gpus 自动设置）控制可见 GPU。若 --gpus 指定了数量或设备列表，容器内就只看得到那些卡；检查 docker run 的 --gpus 写法与 NVIDIA_VISIBLE_DEVICES，用 --gpus all 才是全部暴露。","s":""},{"id":"tm-cont-017","d":"3","m":0,"t":"enroot","c":"命令语法","q":"Which enroot command lists all created container sandboxes on the system?","zq":"哪条 enroot 命令可列出系统上已创建的所有容器沙箱？","o":["enroot ps","enroot list","enroot containers","enroot show --all"],"zo":["enroot ps","enroot list","enroot containers","enroot show --all"],"a":1,"e":"enroot list displays all container sandboxes (rootfs directories) that have been created with 'enroot create'. Each entry shows the container name. Containers in this list can be started with 'enroot start <name>' and removed with 'enroot remove <name>'. This is analogous to listing Docker containers, but enroot containers are simply unpacked directories.","ze":"enroot list 列出所有用 enroot create 创建的沙箱（rootfs 目录）及其名称。这些容器可用 enroot start <名称> 启动、enroot remove <名称> 删除；类似 docker ps，但 enroot 容器只是解包出来的目录。","s":""},{"id":"tm-cont-018","d":"3","m":0,"t":"enroot","c":"输出判读","q":"What does this enroot import output tell you about the process?","zq":"这段 enroot import 输出说明了什么？","o":["The import failed because it needed to download 47 layers","The import successfully authenticated with NGC, downloaded the image layers, and created a squashfs file named nvidia+pytorch+24.01-py3.sqsh","The image was cached locally and no download occurred","The container is now running with the PyTorch framework"],"zo":["因为要下载 47 层，导入失败了","成功向 NGC 认证、下载镜像层，并生成了名为 nvidia+pytorch+24.01-py3.sqsh 的 squashfs 文件","镜像已在本地缓存，未发生下载","容器此时已在运行 PyTorch"],"a":1,"e":"The output shows enroot's import workflow: authenticating with the NGC registry (using credentials from $ENROOT_CONFIG_PATH/.credentials), downloading 47 container layers, extracting them, and converting the result to a compressed squashfs filesystem. The final output line shows the resulting .sqsh file name. This file can now be used with 'enroot create' to make a runnable sandbox.","ze":"输出展示了 import 的完整流程：向 NGC 认证（凭据来自 $ENROOT_CONFIG_PATH/.credentials）、下载 47 个镜像层、解压并转换为压缩的 squashfs，最后打印生成的 .sqsh 文件名，随后可用 enroot create 生成可运行沙箱。","s":"$ enroot import docker://nvcr.io#nvidia/pytorch:24.01-py3\n[INFO] Querying registry for permission grant\n[INFO] Authenticating with user credentials\n[INFO] Fetching image manifest list\n[INFO] Fetching image manifest\n[INFO] Downloading 47 missing layers\n[INFO] Extracting image layers\n[INFO] Converting to squashfs filesystem\nnvidia+pytorch+24.01-py3.sqsh"},{"id":"tm-cont-019","d":"3","m":0,"t":"enroot","c":"最佳实践","q":"In an HPC cluster with shared NFS storage, where should enroot squashfs images (.sqsh) be stored for multi-node jobs?","zq":"在使用共享 NFS 存储的 HPC 集群中，多节点作业用的 enroot squashfs 镜像（.sqsh）应放在哪里？","o":["On each node's local /tmp directory for performance","In a shared filesystem location accessible from all compute nodes, so all nodes can create containers from the same image without re-importing","Only on the login/submission node since enroot handles distribution","In the Docker registry since enroot always re-downloads"],"zo":["放在每个节点的本地 /tmp 以获得性能","放在所有计算节点都能访问的共享文件系统位置，使各节点都能用同一镜像创建容器而无需重复导入","只放在登录/提交节点，enroot 会自动分发","放在 Docker 仓库里，因为 enroot 每次都会重新下载"],"a":1,"e":"Storing .sqsh images on shared storage (NFS, Lustre, GPFS) ensures all compute nodes can access the same image file. When a multi-node Slurm job starts, each node needs to 'enroot create' from the .sqsh file. If the file is on local storage, it only exists on the node where 'enroot import' was run. Shared storage eliminates the need to import the image on every node separately.","ze":"把 .sqsh 放在共享存储（NFS、Lustre、GPFS）上，所有计算节点都能访问同一镜像文件；多节点作业启动时每个节点都要用该文件 create。若放在本地存储，只有执行 import 的那台节点有该文件，因此共享存储能免去逐节点重复导入。","s":""},{"id":"tm-cont-020","d":"3","m":0,"t":"enroot","c":"故障排查","q":"An enroot import from NGC fails with 'HTTP 401 Unauthorized'. What should you check?","zq":"从 NGC 执行 enroot import 报 “HTTP 401 Unauthorized”，应检查什么？","o":["The NGC container image has been deprecated and is no longer available","The NGC API key in the enroot credentials file ($ENROOT_CONFIG_PATH/.credentials or ~/.config/enroot/.credentials) is missing, expired, or incorrectly formatted","The system clock is wrong and the TLS certificate has expired","enroot does not support authenticated registries"],"zo":["该 NGC 镜像已废弃下架","enroot 凭据文件（$ENROOT_CONFIG_PATH/.credentials 或 ~/.config/enroot/.credentials）中的 NGC API Key 缺失、过期或格式不正确","系统时钟不对导致 TLS 证书过期","enroot 不支持需要认证的仓库"],"a":1,"e":"NGC requires an API key for pulling container images. enroot reads credentials from a .credentials file (typically at ~/.config/enroot/.credentials). The file format is: 'machine nvcr.io login $oauthtoken password <YOUR_NGC_API_KEY>'. A 401 error means the credentials are missing, the API key has expired, or the file format is incorrect. Generate a new API key at ngc.nvidia.com.","ze":"NGC 拉取镜像需要 API Key，enroot 从 ~/.config/enroot/.credentials（或 $ENROOT_CONFIG_PATH 指定目录）读取，格式为 machine nvcr.io login $oauthtoken password <API_KEY>。401 表示凭据缺失、Key 过期或格式不对；可到 ngc.nvidia.com 重新生成。","s":""},{"id":"tm-cont-021","d":"3","m":0,"t":"pyxis","c":"参数用法","q":"Which Pyxis flag sets the working directory inside the container when running a Slurm job?","zq":"运行 Slurm 作业时，哪个 Pyxis 参数用于设置容器内的工作目录？","o":["srun --container-image=<img> --chdir=/workspace python train.py","srun --container-image=<img> --container-workdir=/workspace python train.py","srun --container-image=<img> --workdir=/workspace python train.py","srun --container-image=<img> --cd=/workspace python train.py"],"zo":["--chdir=/workspace","--container-workdir=/workspace","--workdir=/workspace","--cd=/workspace"],"a":1,"e":"Pyxis provides the --container-workdir flag to set the working directory inside the container. Without this, the working directory defaults to the container's configured WORKDIR. This is useful when the container expects files in a specific location or when you want to change to a mounted data directory before running the application.","ze":"Pyxis 用 --container-workdir 设置容器内的工作目录；不指定时则用镜像自身配置的 WORKDIR。当应用要求特定路径，或希望先切到挂载的数据目录再启动时使用。","s":""},{"id":"tm-cont-022","d":"3","m":0,"t":"pyxis","c":"输出判读","q":"What does the --container-name flag do in this Pyxis command?","zq":"这条 Pyxis 命令中的 --container-name 参数有什么作用？","o":["It assigns a hostname to the container","It names the enroot container sandbox, allowing it to be reused across multiple srun invocations without re-importing and re-creating the container","It sets the Slurm job name","It creates a DNS entry for the container"],"zo":["给容器指定主机名","为 enroot 容器沙箱命名，使其可在多次 srun 之间复用，免去重复导入与创建","设置 Slurm 作业名","为容器创建 DNS 记录"],"a":1,"e":"The --container-name flag gives a persistent name to the enroot sandbox. Without it, Pyxis creates a temporary container that is destroyed after the job. With a name, the container persists and subsequent srun commands using the same --container-name will reuse the existing sandbox, skipping the import and create steps. This dramatically speeds up iterative development workflows.","ze":"--container-name 为 enroot 沙箱指定持久名称。不指定时 Pyxis 创建临时容器，作业结束即销毁；指定后沙箱保留，之后使用同一名称的 srun 会复用该沙箱，跳过导入与创建步骤，显著加快迭代开发。","s":"$ srun --container-image=nvcr.io#nvidia/pytorch:24.01-py3 \\\n       --container-name=pytorch_training \\\n       --container-mounts=/data:/data \\\n       python train.py"},{"id":"tm-cont-023","d":"3","m":0,"t":"pyxis","c":"故障排查","q":"A Slurm job with --container-image fails with 'pyxis: container start failed'. The same image works fine with 'enroot start' directly. What should you investigate?","zq":"带 --container-image 的 Slurm 作业报 “pyxis: container start failed”，但用 enroot start 直接运行同一镜像正常。应排查什么？","o":["The image is too large for Pyxis to handle","Check the Pyxis SPANK plugin configuration in plugstack.conf, verify that enroot is in the PATH for the Slurm daemon, and check slurmd logs for detailed error messages","Pyxis requires a newer version of Slurm than what is installed","The container image must be pre-imported before using with Pyxis"],"zo":["镜像太大，Pyxis 处理不了","检查 plugstack.conf 中的 Pyxis SPANK 插件配置、确认 slurmd 的 PATH 中有 enroot，并查看 slurmd 日志中的详细报错","Pyxis 需要比当前更新的 Slurm 版本","镜像必须先手动导入才能被 Pyxis 使用"],"a":1,"e":"When enroot works directly but Pyxis fails, the issue is typically in the Slurm-Pyxis integration. Check: 1) plugstack.conf references the correct pyxis.so path, 2) the slurmd service has enroot in its PATH, 3) required directories (like /run/enroot) exist and have correct permissions. The slurmd log (usually /var/log/slurm/slurmd.log) contains the detailed error from the SPANK plugin.","ze":"enroot 直接可用而 Pyxis 失败，问题通常在 Slurm-Pyxis 集成：1) plugstack.conf 中 pyxis.so 路径是否正确；2) slurmd 服务的 PATH 是否包含 enroot；3) /run/enroot 等目录是否存在且权限正确。详细报错在 slurmd 日志里（通常是 /var/log/slurm/slurmd.log）。","s":""},{"id":"tm-cont-024","d":"3","m":0,"t":"pyxis","c":"最佳实践","q":"For a multi-node distributed training job using Pyxis, which combination of flags ensures all nodes have the same container environment with access to the shared dataset?","zq":"多节点分布式训练用 Pyxis 时，哪种参数组合能保证各节点容器环境一致且都能访问共享数据集？","o":["--container-image only; Pyxis handles everything else automatically","--container-image=nvcr.io#nvidia/pytorch:24.01-py3 --container-mounts=/shared/datasets:/data,/shared/checkpoints:/checkpoints --no-container-remap-root","--container-image=<img> --container-mounts=/data:/data --container-name=training_env to import once and reuse across nodes","Multi-node jobs cannot use containers"],"zo":["只写 --container-image，其余 Pyxis 会自动处理","--container-image=... --container-mounts=/shared/datasets:/data,/shared/checkpoints:/checkpoints --no-container-remap-root","--container-image=<img> --container-mounts=/data:/data --container-name=training_env，导入一次各节点复用","多节点作业无法使用容器"],"a":1,"e":"For multi-node training: --container-image specifies the NGC image (Pyxis imports it on each node if not cached), --container-mounts makes shared filesystem paths available inside the container for datasets and checkpoint saving, and --no-container-remap-root keeps the user mapping consistent for shared filesystem permissions. Each node independently creates the container from the same image.","ze":"多节点训练需要：--container-image 指定镜像（未缓存时 Pyxis 会在每台节点导入）、--container-mounts 把共享数据集与检查点目录挂进容器、--no-container-remap-root 保持用户映射一致以便正确访问共享文件系统权限。每台节点各自从同一镜像创建容器。","s":""},{"id":"tm-cont-025","d":"3","m":0,"t":"enroot","c":"概念理解","q":"What file format does enroot use for portable container images, and why was this format chosen over Docker's layered format?","zq":"enroot 用什么文件格式存放可移植容器镜像？为什么选它而不选 Docker 的分层格式？","o":["TAR archives, for compatibility with standard Unix tools","Squashfs (.sqsh), a compressed read-only filesystem format that provides fast random access, small image sizes, and avoids the overhead of Docker's overlay filesystem layers","OCI image format, identical to Docker's format","ISO disk images, for direct mounting as virtual drives"],"zo":["TAR 归档，便于与标准 Unix 工具兼容","Squashfs（.sqsh）：压缩的只读文件系统，随机读取快、体积小，且没有 Docker overlay 分层的开销","OCI 镜像格式，与 Docker 完全相同","ISO 磁盘镜像，可直接作为虚拟盘挂载"],"a":1,"e":"Enroot uses squashfs, a compressed read-only filesystem format native to the Linux kernel. Squashfs provides excellent compression ratios (reducing storage), fast random-access reads (no need to decompress entire layers), and can be loop-mounted directly. Unlike Docker's layered overlay filesystem which introduces I/O overhead, a single squashfs file is simple and performant, ideal for HPC workloads.","ze":"Enroot 使用 squashfs——Linux 内核原生的压缩只读文件系统：压缩率高（省空间）、随机读取快（无需解压整层）、可直接 loop 挂载。相比 Docker 分层 overlay 带来的 I/O 开销，单个 squashfs 文件更简单高效，非常适合 HPC。","s":""},{"id":"tm-diag-001","d":"4","m":0,"t":"dcgmi diag","c":"概念理解","q":"What are the three diagnostic levels available in dcgmi diag and how do they differ?","zq":"dcgmi diag 有哪三个诊断级别，区别是什么？","o":["Levels 1, 2, 3: quick GPU info, driver check, full hardware scan","Levels 1, 2, 3: quick deployment check (seconds), medium stress tests (minutes), comprehensive long-duration tests (15+ minutes) including PCIe, memory, compute, and NVLink stress","Levels A, B, C: basic, standard, advanced","Levels 1, 2, 3: single GPU, multi-GPU, full system"],"zo":["1、2、3 级分别对应：快速 GPU 信息、驱动检查、完整硬件扫描","1、2、3 级分别对应：秒级部署检查、分钟级中等强度压力测试、15 分钟以上的综合长时间测试（含 PCIe、内存、计算与 NVLink 压力）","A、B、C 三级：基础、标准、高级","1、2、3 级分别对应：单卡、多卡、整机"],"a":1,"e":"dcgmi diag -r 1 runs quick deployment tests in seconds (software/driver verification, basic GPU checks). -r 2 adds medium-length stress tests lasting a few minutes. -r 3 runs the full comprehensive suite including extended memory bandwidth, PCIe stress, NVLink bandwidth, and compute stress tests that can take 15+ minutes per GPU. Level 3 is recommended for pre-deployment validation.","ze":"dcgmi diag -r 1 在数秒内完成部署类检查（软件/驱动校验、基础 GPU 检查）；-r 2 增加几分钟的中等压力测试；-r 3 跑完整套件——扩展内存带宽、PCIe 压力、NVLink 带宽与计算压力，每卡可能超过 15 分钟。部署前验证推荐 3 级。","s":""},{"id":"tm-diag-002","d":"4","m":0,"t":"dcgmi diag","c":"输出判读","q":"What does this dcgmi diag output indicate?","zq":"这段 dcgmi diag 输出说明了什么？","o":["The GPU passed all tests and is healthy","The GPU failed the memory bandwidth test, achieving only 1523 GB/s instead of the expected 1800+ GB/s, indicating possible HBM degradation or thermal throttling","The NVLink test failed","The test is incomplete because it did not reach level 3"],"zo":["该 GPU 通过全部测试，状态健康","该 GPU 未通过内存带宽测试，只跑到 1523 GB/s（预期 ≥1800 GB/s），可能说明 HBM 劣化或温度降频","NVLink 测试失败","测试未完成，因为没有达到 3 级"],"a":1,"e":"The Memory Bandwidth test failed because GPU 0 achieved only 1523 GB/s, below the 1800 GB/s threshold. This can indicate degraded HBM (High Bandwidth Memory) modules, thermal throttling reducing memory clock speeds, or ECC errors causing page retirements that reduce available bandwidth. The GPU should be investigated further and potentially RMA'd.","ze":"Memory Bandwidth 项失败：GPU 0 只达到 1523 GB/s，低于 1800 GB/s 阈值。可能原因包括 HBM 模块劣化、温度降频导致显存频率下降、ECC 错误造成页退役使可用带宽减少。应进一步排查，必要时返修。","s":"$ dcgmi diag -r 3 -i 0\n+---------------------------+--------------------------------+\n| Diagnostic                | Result                         |\n+===========================+================================+\n| Deployment                | Pass                           |\n| PCIe                      | Pass                           |\n| Memory                    | Pass                           |\n| SM Stress                 | Pass                           |\n| Targeted Stress           | Pass                           |\n| Targeted Power            | Pass                           |\n| Memory Bandwidth          | Fail (GPU 0: 1523 GB/s,       |\n|                           |  expected >= 1800 GB/s)        |\n| NVLink                    | Pass                           |\n+---------------------------+--------------------------------+"},{"id":"tm-diag-003","d":"4","m":0,"t":"dcgmi diag","c":"参数用法","q":"How do you run dcgmi diag on a specific GPU rather than all GPUs in the system?","zq":"如何只对指定 GPU 运行 dcgmi diag，而不是系统内全部 GPU？","o":["dcgmi diag -r 3 --gpu 0","dcgmi diag -r 3 -i 0","dcgmi diag -r 3 --device=0","dcgmi diag -r 3 -g 0"],"zo":["dcgmi diag -r 3 --gpu 0","dcgmi diag -r 3 -i 0","dcgmi diag -r 3 --device=0","dcgmi diag -r 3 -g 0"],"a":1,"e":"dcgmi diag -i (or --gpu-id) specifies which GPU to test by entity ID. \"dcgmi diag -r 3 -i 0\" runs a comprehensive (level 3) diagnostic on GPU 0 only. Without the -i flag, dcgmi diag tests all GPUs in the default group. You can also specify a DCGM group ID with -g to test a pre-defined set of GPUs.","ze":"-i（--gpu-id）按 entity ID 指定被测 GPU，dcgmi diag -r 3 -i 0 只对 0 号卡做 3 级诊断。不加 -i 则测试默认组内的全部 GPU；也可用 -g 指定预先建好的 DCGM 组。","s":""},{"id":"tm-diag-004","d":"4","m":0,"t":"dcgmi diag","c":"最佳实践","q":"When should you run dcgmi diag -r 3 on a production DGX system?","zq":"在生产环境中的 DGX 系统上，什么时候适合运行 dcgmi diag -r 3？","o":["While production jobs are running to test under real load","During scheduled maintenance windows, after hardware changes, or during initial system bring-up, because level 3 tests are destructive to running workloads","Only when NVIDIA support requests it","Every hour as a health monitoring routine"],"zo":["在生产作业运行时跑，以测试真实负载下的表现","在计划维护窗口、硬件变更之后、或系统初始上架验证时运行，因为 3 级测试会干扰甚至压垮正在运行的作业","只在 NVIDIA 支持要求时才跑","每小时跑一次作为健康巡检"],"a":1,"e":"dcgmi diag -r 3 is a stress test that fully utilizes GPU compute, memory, PCIe, and NVLink resources. Running it during production would interfere with and likely crash running workloads. It should be run during maintenance windows, after hardware replacements (GPU, NVLink cables, PCIe risers), and during initial system bring-up validation. For ongoing health monitoring, use dcgmi health -c or -r 1 instead.","ze":"-r 3 是压力测试，会占满计算、显存、PCIe 与 NVLink
