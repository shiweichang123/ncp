 资源；跑在生产环境中会干扰甚至压垮正在运行的作业。应在维护窗口、更换硬件（GPU、NVLink 线缆、PCIe 转接卡）之后或初始上架验证时运行；日常巡检用 dcgmi health 或 -r 1。","s":""},{"id":"tm-diag-005","d":"5","m":0,"t":"dcgmi diag","c":"故障排查","q":"dcgmi diag -r 3 shows \"NVLink: Fail\" for GPU 2 to GPU 3. All other GPU pair tests pass. What is the most likely hardware cause?","zq":"dcgmi diag -r 3 显示 GPU 2 到 GPU 3 的 NVLink 测试失败，其余 GPU 对的测试都通过。最可能的硬件原因是什么？","o":["The GPU driver needs to be updated","The NVLink bridge or cable connecting GPU 2 and GPU 3 is faulty or improperly seated","Both GPU 2 and GPU 3 need to be replaced","The PCIe switch connecting the GPUs has failed"],"zo":["需要更新 GPU 驱动","连接 GPU 2 与 GPU 3 的 NVLink 桥（或线缆）故障，或未正确就位","GPU 2 与 GPU 3 都需要更换","连接这些 GPU 的 PCIe 交换机故障"],"a":1,"e":"When NVLink fails between a specific pair of GPUs while all other NVLink connections pass, the most likely cause is a faulty NVLink bridge (in systems like DGX A100) or NVLink cable (in NVSwitch-based systems like DGX H100). Since both GPUs pass NVLink tests with other peers, the GPUs themselves are likely functional. Reseating or replacing the NVLink bridge/cable between GPU 2 and GPU 3 should resolve the issue.","ze":"只有 2 号与 3 号之间 NVLink 失败、其他 NVLink 都通过，最可能是这一对之间的 NVLink 桥（DGX A100 等）或 NVLink 线缆（DGX H100 这类 NVSwitch 系统）故障或未插好。两块卡与其他对端的测试都正常，说明 GPU 本身基本没问题；重新插拔或更换该桥/线缆即可。","s":""},{"id":"tm-diag-006","d":"5","m":0,"t":"nvidia-bug-report","c":"命令语法","q":"What is the correct command to generate an NVIDIA bug report bundle?","zq":"生成 NVIDIA 缺陷报告（bug report）包的正确命令是？","o":["nvidia-bug-report --generate","nvidia-bug-report.sh","nvidia-smi --bug-report","dcgmi bugreport"],"zo":["nvidia-bug-report --generate","nvidia-bug-report.sh","nvidia-smi --bug-report","dcgmi bugreport"],"a":1,"e":"nvidia-bug-report.sh is a shell script provided with the NVIDIA driver package. It collects comprehensive system and GPU diagnostic information and saves it as a compressed log file (nvidia-bug-report.log.gz). The script must be run with root privileges to capture all information including kernel logs and driver internals.","ze":"nvidia-bug-report.sh 是 NVIDIA 驱动包自带的 shell 脚本，收集系统与 GPU 诊断信息并打包为压缩日志 nvidia-bug-report.log.gz；需要 root 才能抓全内核日志与驱动内部状态。","s":""},{"id":"tm-diag-007","d":"5","m":0,"t":"nvidia-bug-report","c":"概念理解","q":"What types of information does nvidia-bug-report.sh collect in its output bundle?","zq":"nvidia-bug-report.sh 的输出包会收集哪些信息？","o":["Only the nvidia-smi output and driver version","GPU state, driver version, kernel logs (dmesg), Xorg logs, loaded kernel modules, PCI topology, VBIOS versions, ECC status, NVLink status, and system configuration","Only GPU temperature and utilization history","Only the last 100 lines of syslog"],"zo":["只有 nvidia-smi 输出与驱动版本","GPU 状态、驱动版本、内核日志（dmesg）、Xorg 日志、已加载内核模块、PCI 拓扑、VBIOS 版本、ECC 状态、NVLink 状态与系统配置","只有 GPU 温度与利用率历史","只有 syslog 的最后 100 行"],"a":1,"e":"nvidia-bug-report.sh is comprehensive. It captures: nvidia-smi output, driver and VBIOS versions, kernel ring buffer (dmesg) including XID errors, loaded kernel modules, PCI device tree, ECC error counts, NVLink status, thermal and power data, Xorg/display logs, system information (OS, CPU, memory), and relevant configuration files. This complete snapshot is what NVIDIA support needs for issue investigation.","ze":"它会采集 nvidia-smi 输出、驱动与 VBIOS 版本、内核环形缓冲（含 XID 错误）、已加载内核模块、PCI 设备树、ECC 计数、NVLink 状态、温度与功耗数据、Xorg 日志、系统信息（OS/CPU/内存）及相关配置文件——正是 NVIDIA 支持排查所需的完整快照。","s":""},{"id":"tm-diag-008","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When should you run nvidia-bug-report.sh in a troubleshooting workflow?","zq":"在排障流程中，什么时候应当运行 nvidia-bug-report.sh？","o":["After rebooting the system to get a clean state","Immediately when the issue occurs and before any remediation steps, to capture the current problematic state","Only after running all other diagnostic tools first","Once a week as a routine health check"],"zo":["重启系统、恢复到干净状态之后再跑","问题一出现、做任何修复动作之前就跑，以捕获当前故障现场","先把其他诊断工具全部跑完再跑","每周跑一次作为例行健康检查"],"a":1,"e":"nvidia-bug-report.sh should be run immediately when an issue is observed, before any remediation (reboots, driver reloads, GPU resets). The report captures volatile state like current kernel messages (dmesg), XID errors, GPU registers, and process information that would be lost after a reboot or reset. Running it first preserves the evidence needed for root cause analysis.","ze":"应在问题出现的第一时间、任何修复动作（重启、重载驱动、重置 GPU）之前运行。报告捕获的是易失状态：当前 dmesg、XID 错误、GPU 寄存器与进程信息，重启或重置后就没了。","s":""},{"id":"tm-diag-009","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"In the nvidia-bug-report.log output, you find repeated XID Error 79 entries in the dmesg section. What does XID 79 indicate?","zq":"在 nvidia-bug-report.log 的 dmesg 段中反复出现 XID 79，XID 79 表示什么？","o":["A GPU fan failure","A GPU has fallen off the PCIe bus, typically due to a hardware failure, power issue, or PCIe link instability","An application used too much GPU memory","The display output is disconnected"],"zo":["GPU 风扇故障","GPU 从 PCIe 总线上掉线，通常由硬件故障、供电问题或 PCIe 链路不稳定引起","应用占用了过多 GPU 显存","显示输出被断开"],"a":1,"e":"XID Error 79 means \"GPU has fallen off the bus.\" This is a critical hardware error indicating the GPU is no longer responding on the PCIe bus. Common causes include failing GPU hardware, power supply issues to the GPU, PCIe riser card problems, or motherboard PCIe slot defects. The GPU will be inaccessible until a power cycle. This typically requires hardware replacement (GPU, riser, or power cable).","ze":"XID 79 表示 GPU 已从 PCIe 总线掉线，是严重硬件错误：GPU 不再在总线上响应。常见原因：GPU 硬件失效、GPU 供电问题、PCIe 转接卡故障、主板插槽缺陷。在断电重启前 GPU 一直不可访问，通常需要更换硬件（GPU、转接卡或电源线）。","s":""},{"id":"tm-diag-010","d":"4","m":0,"t":"gpu-burn","c":"命令语法","q":"Which gpu-burn command runs a stress test on all GPUs for 5 minutes (300 seconds)?","zq":"哪条 gpu-burn 命令可在所有 GPU 上运行 5 分钟（300 秒）压力测试？","o":["gpu-burn --time 300","gpu-burn -d 300","gpu-burn 300","gpu-burn -t 5m"],"zo":["gpu-burn --time 300","gpu-burn -d 300","gpu-burn 300","gpu-burn -t 5m"],"a":2,"e":"gpu-burn takes the duration in seconds as a positional argument. \"gpu-burn 300\" runs the stress test for 300 seconds (5 minutes) on all available GPUs. By default, it uses double-precision floating point and periodically verifies computation results to detect errors.","ze":"gpu-burn 以秒为位置参数，gpu-burn 300 即在所有可用 GPU 上运行 300 秒（5 分钟）。它默认使用双精度浮点，并周期性校验计算结果以发现错误。","s":""},{"id":"tm-diag-011","d":"4","m":0,"t":"gpu-burn","c":"输出判读","q":"What does this gpu-burn output indicate?","zq":"这段 gpu-burn 输出说明了什么？","o":["All GPUs passed the stress test","GPU 2 is running hot but otherwise functional","GPU 2 produced incorrect computation results (mismatch) and has significantly lower throughput, indicating a hardware fault","The test was too short to produce reliable results"],"zo":["所有 GPU 都通过了压力测试","GPU 2 温度偏高，但功能仍然正常","GPU 2 计算结果不正确（检测到 mismatch）且吞吐显著偏低，说明存在硬件故障","测试时间太短，结果不可靠"],"a":2,"e":"GPU 2 shows \"FAULTY\" with \"mismatch detected,\" meaning the stress test computation results did not match expected values. This indicates the GPU is producing incorrect mathematical results, which is a serious hardware fault. The dramatically lower throughput (4521 vs ~18200 Gflop/s) and higher temperature also suggest hardware degradation. This GPU should be replaced.","ze":"GPU 2 显示 FAULTY 且带 mismatch detected，说明压测计算结果与期望值不一致——GPU 正在产出错误的数学结果，属严重硬件故障。吞吐骤降（4521 对约 18200 Gflop/s）与更高温度也印证了硬件劣化，该卡应更换。","s":"$ gpu-burn 120\nGPU 0: OK - temp: 72C - 18234 Gflop/s\nGPU 1: OK - temp: 74C - 18198 Gflop/s\nGPU 2: FAULTY - temp: 81C - 4521 Gflop/s (mismatch detected)\nGPU 3: OK - temp: 73C - 18201 Gflop/s\nGPU 4: OK - temp: 71C - 18245 Gflop/s\nGPU 5: OK - temp: 75C - 18187 Gflop/s\nGPU 6: OK - temp: 74C - 18203 Gflop/s\nGPU 7: OK - temp: 73C - 18219 Gflop/s"},{"id":"tm-diag-012","d":"4","m":0,"t":"gpu-burn","c":"最佳实践","q":"How long should a gpu-burn stress test run to be considered a thorough burn-in test for new DGX hardware?","zq":"对新 DGX 硬件做彻底烧机（burn-in），gpu-burn 应运行多久？","o":["60 seconds is sufficient for a quick check","5-10 minutes to verify basic functionality","At least 1-4 hours to stress test thermal and power delivery systems under sustained load and catch intermittent faults","Exactly 24 hours as specified by NVIDIA"],"zo":["60 秒足够快速检查","5~10 分钟验证基本功能","至少 1~4 小时，在持续负载下压力测试散热与供电系统，以捕获间歇性故障","按 NVIDIA 规定必须精确 24 小时"],"a":2,"e":"For a thorough burn-in test, 1-4 hours is recommended because intermittent hardware faults (thermal throttling, power delivery issues, marginal memory cells) may not manifest during short tests. Sustained load forces all GPUs to maximum temperature and power draw, which stresses cooling, VRMs, and memory. Short tests (minutes) catch gross failures but miss intermittent issues that appear only after thermal saturation.","ze":"彻底的烧机建议跑 1~4 小时：间歇性硬件问题（热降频、供电边缘状态、临界存储单元）在短测中未必显现；持续负载会把 GPU 推到最高温度与功耗，从而压测散热、VRM 与显存。几分钟的短测只能发现明显故障。","s":""},{"id":"tm-diag-013","d":"4","m":0,"t":"gpu-burn","c":"概念理解","q":"What is the key difference between gpu-burn and dcgmi diag -r 3 for GPU stress testing?","zq":"在 GPU 压力测试上，gpu-burn 与 dcgmi diag -r 3 的关键区别是什么？","o":["They test the same things in the same way","gpu-burn focuses purely on sustained compute stress and thermal stability, while dcgmi diag -r 3 tests multiple subsystems (memory, PCIe, NVLink, compute) individually with pass/fail thresholds","dcgmi diag is only for NVIDIA GPUs while gpu-burn works on any GPU","gpu-burn is an official NVIDIA tool while dcgmi diag is third-party"],"zo":["两者用相同方式测试相同内容","gpu-burn 专注持续计算压力与热稳定性；dcgmi diag -r 3 会分别测试多个子系统（内存、PCIe、NVLink、计算），并给出各自的通过/失败阈值","dcgmi diag 只支持 NVIDIA GPU，gpu-burn 支持任何 GPU","gpu-burn 是 NVIDIA 官方工具，dcgmi diag 是第三方工具"],"a":1,"e":"gpu-burn is a focused CUDA compute stress test that maximizes GPU utilization to test thermal and power stability, verifying computation correctness over time. dcgmi diag -r 3 is a comprehensive diagnostic suite that individually tests deployment health, PCIe bandwidth, memory bandwidth, SM compute, NVLink bandwidth, and power delivery with specific pass/fail thresholds for each. They complement each other: dcgmi diag identifies which subsystem has issues, while gpu-burn validates sustained compute reliability.","ze":"gpu-burn 是专注的 CUDA 计算压力测试，把 GPU 利用率拉满以验证热与功耗稳定性，并校验计算正确性；dcgmi diag -r 3 则分项测试部署健康、PCIe 带宽、内存带宽、SM 计算、NVLink 带宽与供电，各有明确阈值。两者互补：前者验证持续可靠性，后者定位哪个子系统有问题。","s":""},{"id":"tm-diag-014","d":"4","m":0,"t":"dcgmi diag","c":"参数用法","q":"Which dcgmi diag flag runs diagnostics on a specific DCGM group rather than the default group?","zq":"哪个 dcgmi diag 参数可对指定的 DCGM 组（而不是默认组）运行诊断？","o":["dcgmi diag -r 3 --group 2","dcgmi diag -r 3 -g 2","dcgmi diag -r 3 --target-group 2","dcgmi diag -r 3 -G 2"],"zo":["--group 2","-g 2","--target-group 2","-G 2"],"a":1,"e":"dcgmi diag -g (--group) specifies a DCGM group ID to run diagnostics against. First create a group with 'dcgmi group -c mygroup -a 0,1' and note the returned group ID. Then 'dcgmi diag -r 3 -g <groupId>' runs diagnostics on only the GPUs in that group. This is useful for testing a subset of GPUs, for example after replacing a specific GPU.","ze":"-g（--group）指定 DCGM 组 ID。先用 dcgmi group -c mygroup -a 0,1 建组并记下返回的 ID，再用 dcgmi diag -r 3 -g <组ID> 只测组内 GPU；例如刚换过某块卡、只想复测它时很有用。","s":""},{"id":"tm-diag-015","d":"1","m":0,"t":"dcgmi diag","c":"输出判读","q":"What does this dcgmi diag level 1 output indicate?","zq":"这段 dcgmi diag level 1 的输出说明了什么？","o":["The GPU hardware has failed and needs replacement","The NVIDIA driver is not properly installed or the NVML shared library (libnvidia-ml.so) is missing from the library path","DCGM is not compatible with the installed GPU","The GPU needs a firmware update before diagnostics can run"],"zo":["GPU 硬件已损坏，需要更换","NVIDIA 驱动未正确安装，或 NVML 共享库（libnvidia-ml.so）不在库搜索路径中","DCGM 与已安装的 GPU 不兼容","诊断前需要先升级 GPU 固件"],"a":1,"e":"The Deployment test at level 1 checks basic software prerequisites. 'NVML library not found' means the NVIDIA Management Library (libnvidia-ml.so) is not in the library search path. This typically indicates the NVIDIA driver is not installed, not loaded (check with 'lsmod | grep nvidia'), or the library path is misconfigured. This must be fixed before any GPU operations can work.","ze":"1 级的 Deployment 检查基础软件前提；报“NVML library not found”说明 libnvidia-ml.so 不在库搜索路径，常见原因是驱动未安装、内核模块未加载（lsmod | grep nvidia）或库路径配置错误。必须先修好，后续 GPU 操作才能正常。","s":"$ dcgmi diag -r 1\n+---------------------------+--------------------------------+\n| Diagnostic                | Result                         |\n+===========================+================================+\n| Deployment                | Fail                           |\n|                           | Error: NVML library not found  |\n+---------------------------+--------------------------------+"},{"id":"tm-diag-016","d":"4","m":0,"t":"dcgmi diag","c":"命令语法","q":"Which dcgmi diag command runs only the quick deployment validation tests?","zq":"哪条 dcgmi diag 命令只运行快速的部署验证测试？","o":["dcgmi diag -r 1","dcgmi diag --quick","dcgmi diag -r 0","dcgmi diag --deploy"],"zo":["dcgmi diag -r 1","dcgmi diag --quick","dcgmi diag -r 0","dcgmi diag --deploy"],"a":0,"e":"dcgmi diag -r 1 runs level 1 diagnostics, which are quick deployment validation tests that complete in seconds. These tests verify the NVIDIA driver is loaded, GPUs are accessible, ECC mode is as expected, and basic GPU health indicators are normal. Level 1 is suitable for quick health checks without impacting running workloads.","ze":"-r 1 即 1 级诊断，数秒完成：验证 NVIDIA 驱动已加载、GPU 可访问、ECC 模式符合预期、基础健康指标正常。适合不影响业务的快速体检。","s":""},{"id":"tm-diag-017","d":"5","m":0,"t":"nvidia-bug-report","c":"输出判读","q":"In the nvidia-bug-report output, you find this dmesg entry. What does it mean?","zq":"在 nvidia-bug-report 输出中看到如下 dmesg 记录，它意味着什么？","o":["The GPU has fallen off the PCIe bus","XID 48 indicates a double-bit ECC error in GPU memory, and the repeated errors from the same process suggest corrupted GPU memory pages that need to be retired","The Python process is using too much GPU memory","The GPU temperature is too high and thermal throttling is occurring"],"zo":["GPU 已从 PCIe 总线掉线","XID 48 表示 GPU 显存出现双比特 ECC 错误；同一进程反复报错说明显存页已损坏，需要退役","Python 进程占用了过多显存","GPU 温度过高导致降频"],"a":1,"e":"XID 48 is a double-bit (uncorrectable) ECC error. Unlike single-bit errors that ECC corrects transparently, double-bit errors corrupt data and typically cause the CUDA context to be destroyed. Repeated XID 48 errors on the same GPU indicate degrading memory cells. The affected memory pages should be retired (nvidia-smi --retire-pages), and if errors persist, the GPU should be RMA'd.","ze":"XID 48 是双比特（不可纠正）ECC 错误。单比特可被 ECC 透明纠正，双比特会损坏数据并通常导致 CUDA 上下文销毁；同一 GPU 反复报 XID 48，说明存储单元正在劣化。应退役受损页（nvidia-smi --retire-pages），若错误持续则申请返修。","s":"[  142.835421] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010\n[  142.835423] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010\n[  142.835425] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010"},{"id":"tm-diag-018","d":"5","m":0,"t":"nvidia-bug-report","c":"参数用法","q":"What is the default output filename and format generated by nvidia-bug-report.sh?","zq":"nvidia-bug-report.sh 默认生成的文件名与格式是什么？","o":["nvidia-diagnostics.txt in the current directory","nvidia-bug-report.log.gz - a gzip-compressed log file in the current directory","/var/log/nvidia-bug-report.json","nvidia-report.tar.gz containing multiple diagnostic files"],"zo":["当前目录下的 nvidia-diagnostics.txt","当前目录下的 nvidia-bug-report.log.gz","/var/log/nvidia-bug-report.json","包含多个诊断文件的 nvidia-report.tar.gz"],"a":1,"e":"nvidia-bug-report.sh generates a file named nvidia-bug-report.log.gz in the current working directory. The .gz extension indicates gzip compression. To read it, use 'zcat nvidia-bug-report.log.gz' or 'gunzip nvidia-bug-report.log.gz' followed by viewing the resulting .log file. The compressed format reduces the file size for easy sharing with NVIDIA support.","ze":"nvidia-bug-report.sh 在当前工作目录生成 nvidia-bug-report.log.gz。.gz 表示 gzip 压缩，可用 zcat 直接查看，或 gunzip 解压后阅读。压缩是为了减小体积、便于发给 NVIDIA 支持。","s":""},{"id":"tm-diag-019","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"nvidia-bug-report.sh generates an incomplete report with warnings about missing information. What is the most likely cause?","zq":"nvidia-bug-report.sh 生成的报告不完整，并提示部分信息缺失。最可能的原因是什么？","o":["The disk is full and the report cannot be written","The script was run without root/sudo privileges, preventing it from accessing kernel logs, device files, and driver internals","The NVIDIA driver version is too old for the bug report tool","The system has too many GPUs for the report tool to handle"],"zo":["磁盘已满，报告写不下去","脚本没有以 root/sudo 运行，因而无法读取内核日志、设备文件与驱动内部状态","NVIDIA 驱动版本对报告工具来说太旧","GPU 数量太多，报告工具处理不了"],"a":1,"e":"nvidia-bug-report.sh requires root privileges to collect complete information. Without root: dmesg (kernel ring buffer) may be restricted, /dev/nvidia* device file details may be inaccessible, driver internal state cannot be queried, and some system configuration files cannot be read. Always run as 'sudo nvidia-bug-report.sh' to ensure a complete diagnostic bundle.","ze":"脚本需要 root 才能采集完整信息：非 root 时 dmesg（内核环形缓冲）可能受限、/dev/nvidia* 设备细节不可读、驱动内部状态查不到、部分系统配置文件无法读取。始终用 sudo nvidia-bug-report.sh 运行。","s":""},{"id":"tm-diag-020","d":"4","m":0,"t":"gpu-burn","c":"参数用法","q":"Which gpu-burn flag forces the stress test to use double-precision (FP64) floating-point operations?","zq":"哪个 gpu-burn 参数强制压力测试使用双精度（FP64）浮点运算？","o":["gpu-burn --fp64 120","gpu-burn -d 120","gpu-burn --double 120","gpu-burn -p double 120"],"zo":["gpu-burn --fp64 120","gpu-burn -d 120","gpu-burn --double 120","gpu-burn -p double 120"],"a":1,"e":"gpu-burn -d enables double-precision (FP64) mode for the stress test. Without -d, gpu-burn uses single-precision (FP32) by default. Double-precision tests are important because A100 and H100 GPUs have significant FP64 compute capability used in scientific computing workloads. FP64 mode also generates more heat, making it better for thermal stress testing.","ze":"-d 让压测使用双精度（FP64）。不加 -d 时默认单精度（FP32）。A100/H100 的 FP64 算力在科学计算中很重要；FP64 也更耗电、发热更高，更适合做热压力测试。","s":""},{"id":"tm-diag-021","d":"4","m":0,"t":"gpu-burn","c":"输出判读","q":"What does this gpu-burn temperature progression indicate?","zq":"这段 gpu-burn 温度变化说明了什么？","o":["The GPU is overheating and will soon reach critical temperature","The GPU temperature rose from 45C to 79C and stabilized, showing normal thermal saturation behavior with consistent Gflop/s, indicating healthy cooling","The decreasing Gflop/s indicates the GPU is throttling","The test should be stopped because temperature has plateaued"],"zo":["GPU 正在过热，很快会达到临界温度","温度从 45℃ 升至 79℃ 后趋于稳定，Gflop/s 保持一致，属正常的热饱和过程，说明散热健康","Gflop/s 下降说明 GPU 在降频","温度已经平台化，应停止测试"],"a":1,"e":"This shows a healthy thermal profile. The GPU temperature rises from ambient (45C) during ramp-up, then stabilizes at 79C after about 2 minutes as the cooling system reaches equilibrium. The Gflop/s decrease is minimal (18230 to 18172, less than 0.5%) and consistent with slight thermal management adjustments. A problematic GPU would show continued temperature rise or significant Gflop/s drops.","ze":"温度从 45℃ 升到 79℃ 后趋于稳定，Gflop/s 只小幅下降（18230→18172，不到 0.5%），说明散热系统约 2 分钟达到平衡，是健康的热饱和曲线。有问题的卡会持续升温，或出现明显的性能跌落。","s":"GPU 0: OK - temp: 45C - 18230 Gflop/s  (10s elapsed)\nGPU 0: OK - temp: 62C - 18215 Gflop/s  (30s elapsed)\nGPU 0: OK - temp: 75C - 18198 Gflop/s  (60s elapsed)\nGPU 0: OK - temp: 78C - 18180 Gflop/s  (120s elapsed)\nGPU 0: OK - temp: 79C - 18175 Gflop/s  (180s elapsed)\nGPU 0: OK - temp: 79C - 18172 Gflop/s  (240s elapsed)"},{"id":"tm-diag-022","d":"5","m":0,"t":"gpu-burn","c":"故障排查","q":"gpu-burn exits immediately with 'CUDA Error: out of memory' on a GPU that nvidia-smi shows as having 80 GB free. What could cause this?","zq":"gpu-burn 在一台 nvidia-smi 显示还有 80 GB 空闲显存的 GPU 上立即报 “CUDA Error: out of memory” 退出，可能是什么原因？","o":["gpu-burn has a memory leak in its initialization code","Another process has allocated GPU memory without actively using it (showing 0% utilization in nvidia-smi but reserving memory), or ECC page retirements have reduced available memory below what gpu-burn requires","The GPU's memory clock is running too slowly","gpu-burn does not support GPUs with more than 40 GB memory"],"zo":["gpu-burn 初始化代码有内存泄漏","有其他进程占用了显存但并未真正计算（nvidia-smi 里利用率为 0% 但显存被预留），或 ECC 页退役使可用显存低于 gpu-burn 所需","GPU 显存频率过低","gpu-burn 不支持 40 GB 以上显存的 GPU"],"a":1,"e":"nvidia-smi's 'free' memory may not reflect reservations by idle processes or frameworks like PyTorch that pre-allocate GPU memory. Check nvidia-smi for processes holding memory with 'nvidia-smi pmon'. Also, extensive ECC page retirements (nvidia-smi -q -d RETIRED_PAGES) can reduce usable memory. Kill any idle processes holding GPU memory before running gpu-burn.","ze":"nvidia-smi 显示的“空闲”显存未必反映被空闲进程或 PyTorch 这类框架预留的显存。可用 nvidia-smi pmon 查看占着显存的进程；此外大量 ECC 页退役（nvidia-smi -q -d RETIRED_PAGES）也会把可用显存压到 gpu-burn 所需之下。跑之前先清理占用显存的空闲进程。","s":""},{"id":"tm-diag-023","d":"4","m":0,"t":"dcgmi diag","c":"最佳实践","q":"What is the recommended diagnostic sequence when bringing up a new DGX node before putting it into production?","zq":"新 DGX 节点上架、投入生产之前，推荐的诊断顺序是什么？","o":["Just run gpu-burn for 5 minutes and deploy if it passes","Run dcgmi diag -r 1 first to verify basic deployment, then -r 3 for comprehensive hardware validation, followed by gpu-burn for extended thermal stress testing","Only check nvidia-smi output and deploy if all GPUs are visible","Run nvidia-bug-report.sh and send it to NVIDIA support for approval"],"zo":["只跑 5 分钟 gpu-burn，通过就上线","先跑 dcgmi diag -r 1 验证基础部署，再跑 -r 3 做全面硬件验证，最后用 gpu-burn 做长时间热压力测试","只看 nvidia-smi 输出，GPU 都能看到就上线","跑 nvidia-bug-report.sh 发给 NVIDIA 支持等批准"],"a":1,"e":"A proper bring-up sequence starts with dcgmi diag -r 1 to quickly verify driver installation and basic GPU health (seconds). If that passes, dcgmi diag -r 3 tests all subsystems including PCIe, memory, NVLink, and compute (15+ minutes). Finally, gpu-burn runs an extended stress test (1-4 hours) to verify thermal stability under sustained load. This layered approach catches issues at each level.","ze":"正确顺序：先用 dcgmi diag -r 1 快速确认驱动与基础健康（秒级）；再 -r 3 全面测试 PCIe、内存、NVLink 与计算（15 分钟以上）；最后 gpu-burn 做 1~4 小时长时间压力测试，验证持续负载下的热稳定性。分层递进能在每一级捕获问题。","s":""},{"id":"tm-diag-024","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When filing an RMA (Return Merchandise Authorization) request for a failed GPU, which diagnostic artifacts should you include?","zq":"为故障 GPU 提交 RMA（返修授权）时，应附带哪些诊断材料？","o":["Only the nvidia-smi output showing the error","The nvidia-bug-report.log.gz, dcgmi diag -r 3 output, nvidia-smi -q output for the failed GPU, and the GPU serial number from nvidia-smi -q -d SERIAL","A photo of the GPU and the purchase receipt","Only the dmesg output showing XID errors"],"zo":["只附一份显示报错的 nvidia-smi 输出","nvidia-bug-report.log.gz、dcgmi diag -r 3 输出、故障 GPU 的 nvidia-smi -q 输出，以及 nvidia-smi -q -d SERIAL 读到的 GPU 序列号","GPU 照片与购买发票","只附显示 XID 错误的 dmesg 输出"],"a":1,"e":"A thorough RMA submission includes: nvidia-bug-report.log.gz (comprehensive system state), dcgmi diag -r 3 results (specific test failures), nvidia-smi -q for the failed GPU (ECC errors, retired pages, temperature history), and the GPU serial number. This documentation helps NVIDIA validate the failure and expedite the replacement. Without these artifacts, the RMA process may be delayed.","ze":"完整的 RMA 材料包括：nvidia-bug-report.log.gz（整体系统状态）、dcgmi diag -r 3 结果（具体失败项）、故障 GPU 的 nvidia-smi -q（ECC 错误、退役页、温度历史）以及 GPU 序列号（nvidia-smi -q -d SERIAL）。这些能帮 NVIDIA 确认故障、加快换件；缺材料会拖延流程。","s":""},{"id":"tm-diag-025","d":"4","m":0,"t":"gpu-burn","c":"命令语法","q":"How would you run gpu-burn to stress test only specific GPUs (e.g., GPUs 2 and 5) rather than all GPUs in the system?","zq":"如何让 gpu-burn 只压测指定的 GPU（例如 GPU 2 和 5），而不是全部 GPU？","o":["gpu-burn --gpus 2,5 300","gpu-burn -i 2,5 300","Set CUDA_VISIBLE_DEVICES=2,5 before running gpu-burn 300","gpu-burn 300 --device 2 --device 5"],"zo":["gpu-burn --gpus 2,5 300","gpu-burn -i 2,5 300","运行前设置环境变量 CUDA_VISIBLE_DEVICES=2,5，再执行 gpu-burn 300","gpu-burn 300 --device 2 --device 5"],"a":2,"e":"gpu-burn does not have a built-in GPU selection flag. To limit which GPUs are tested, use the CUDA_VISIBLE_DEVICES environment variable. Setting 'CUDA_VISIBLE_DEVICES=2,5 gpu-burn 300' makes gpu-burn only see and test GPUs 2 and 5. This environment variable is a standard CUDA mechanism for controlling GPU visibility that works with all CUDA applications.","ze":"gpu-burn 没有内置的 GPU 选择参数，需用环境变量 CUDA_VISIBLE_DEVICES 限制可见设备：CUDA_VISIBLE_DEVICES=2,5 gpu-burn 300 就只测 2、5 号卡。这是 CUDA 通用的可见性控制机制，对所有 CUDA 应用都有效。","s":""},{"id":"tm-xid-001","d":"5","m":0,"t":"dmesg","c":"命令语法","q":"Which dmesg command filters kernel logs to show only NVIDIA GPU XID errors?","zq":"哪条 dmesg 命令可把内核日志过滤为只显示 NVIDIA GPU 的 XID 错误？","o":["dmesg | grep -i 'NVRM: Xid'","dmesg --filter=nvidia","dmesg -d nvidia-xid","dmesg | grep GPU_ERROR"],"zo":["dmesg | grep -i 'NVRM: Xid'","dmesg --filter=nvidia","dmesg -d nvidia-xid","dmesg | grep GPU_ERROR"],"a":0,"e":"NVIDIA kernel driver messages are logged with the 'NVRM' prefix. XID errors specifically appear as 'NVRM: Xid' entries in the kernel ring buffer. Using 'dmesg | grep -i \"NVRM: Xid\"' filters for these GPU error messages.","ze":"NVIDIA 内核驱动的消息以 NVRM 前缀记录，XID 错误在内核环形缓冲中表现为“NVRM: Xid”。用 dmesg | grep -i \"NVRM: Xid\" 即可筛出这些 GPU 错误。","s":""},{"id":"tm-xid-002","d":"5","m":0,"t":"dmesg","c":"输出判读","q":"What does this dmesg output indicate?","zq":"这段 dmesg 输出说明了什么？","o":["A single-bit correctable ECC error that can be safely ignored","A double-bit uncorrectable ECC error on GPU at PCI 3b:00 — the GPU memory is failing","A driver timeout that requires a process restart","A PCIe link training failure requiring a system reboot"],"zo":["单比特可纠正 ECC 错误，可以忽略","PCI 3b:00 处的 GPU 出现双比特不可纠正 ECC 错误——显存正在失效","驱动超时，需要重启进程","PCIe 链路训练失败，需要重启系统"],"a":1,"e":"XID 48 indicates a double-bit (uncorrectable) ECC error in GPU memory. Unlike single-bit errors that ECC can correct, double-bit errors corrupt data and cannot be recovered. Repeated XID 48 errors on the same GPU strongly suggest failing GPU memory that requires hardware replacement.","ze":"XID 48 表示显存发生了双比特（不可纠正）ECC 错误。单比特能被 ECC 纠正，双比特会损坏数据且无法恢复；同一 GPU 反复出现 XID 48，强烈提示显存失效，需要更换硬件。","s":"[12345.678] NVRM: Xid (PCI:0000:3b:00): 48, pid=5432, name=python3, Ch 00000010\n[12345.679] NVRM: Xid (PCI:0000:3b:00): 48, pid=5432, name=python3, Ch 00000010"},{"id":"tm-xid-003","d":"5","m":0,"t":"dmesg","c":"输出判读","q":"What does XID error code 79 in dmesg indicate?","zq":"dmesg 中的 XID 79 表示什么？","o":["The GPU driver crashed and needs to be reloaded","The GPU has fallen off the PCIe bus — a critical hardware failure requiring physical intervention","The GPU firmware needs an update","The GPU is throttling due to excessive temperature"],"zo":["GPU 驱动崩溃，需要重新加载","GPU 已从 PCIe 总线掉线——属严重硬件故障，需要物理干预","GPU 固件需要升级","GPU 因温度过高而降频"],"a":1,"e":"XID 79 means the GPU has lost communication with the system over the PCIe bus. The 'fallen off the bus' message confirms a critical hardware event. This typically requires reseating the GPU in its PCIe slot, checking PCIe cables, or replacing the GPU. A system reboot is required to recover.","ze":"XID 79 表示 GPU 已通过 PCIe 与系统失去通信，“fallen off the bus”确认这是严重硬件事件。通常需要重新插拔 GPU、检查 PCIe 线缆或更换 GPU，并且必须重启系统才能恢复。","s":"[98765.432] NVRM: Xid (PCI:0000:86:00): 79, pid='<unknown>', name=<unknown>\n[98765.433] NVRM: GPU at PCI:0000:86:00 has fallen off the bus"},{"id":"tm-xid-004","d":"5","m":0,"t":"dmesg","c":"参数用法","q":"Which dmesg option adds human-readable timestamps to the output, making it easier to correlate XID errors with other system events?","zq":"哪个 dmesg 选项可把时间戳转换为人类可读时间，便于把 XID 错误与其他系统事件对齐？","o":["dmesg -T","dmesg --timestamp","dmesg -v","dmesg --human-time"],"zo":["dmesg -T","dmesg --timestamp","dmesg -v","dmesg --human-time"],"a":0,"e":"The -T flag converts the kernel's monotonic clock timestamps to human-readable local time format. This is essential when correlating XID errors with application logs, job scheduler events, or hardware monitoring timestamps.","ze":"-T 把内核单调时钟时间戳转换为人类可读的本地时间，便于把 XID 错误与应用日志、作业调度事件、监控数据的时间对齐。","s":""},{"id":"tm-xid-005","d":"4","m":0,"t":"dmesg","c":"输出判读","q":"A dmesg log shows repeated XID 63 errors on GPU 3. What is the correct interpretation and action?","zq":"dmesg 中 GPU 3 反复出现 XID 63 错误，正确的理解与处置是？","o":["This is normal ECC behavior — no action needed","The GPU is retiring failing memory rows; monitor the count and plan replacement if rows approach the maximum","The GPU driver has crashed and needs to be reinstalled","The GPU temperature is too high — adjust fan speed"],"zo":["这是正常的 ECC 行为，无需处理","GPU 正在退役失效的内存行；应监控退役行数量，若接近上限则计划更换","GPU 驱动崩溃，需要重装","GPU 温度过高，应调整风扇"],"a":1,"e":"XID 63 indicates ECC page retirement — the GPU's row remapper is marking failing memory rows as unavailable and redirecting to spare rows. Each GPU has a limited number of spare rows. While a few retirements are normal over a GPU's lifetime, rapidly accumulating retirements indicate degrading memory. Check retirement counts with 'nvidia-smi -q -d PAGE_RETIREMENT' and plan replacement if approaching limits.","ze":"XID 63 表示 ECC 页退役：GPU 的行重映射器把出错的内存行标记为不可用，并重定向到备用行。每块 GPU 的备用行数量有限，少量退役在一个生命周期内属正常，但快速累积说明显存正在劣化；用 nvidia-smi -q -d PAGE_RETIREMENT 查看计数，接近上限就应计划更换。","s":"[45678.901] NVRM: Xid (PCI:0000:c1:00): 63, pid=0, Row Remapper: New row marked for remapping\n[45678.902] NVRM: Xid (PCI:0000:c1:00): 63, pid=0, Row Remapper: New row marked for remapping"},{"id":"tm-xid-006","d":"5","m":0,"t":"dmesg","c":"故障排查","q":"You see XID 31 errors in dmesg that only occur during a specific training job. What is the most likely root cause?","zq":"dmesg 中的 XID 31 只在某个特定训练作业中出现，最可能的根因是？","o":["Faulty GPU hardware that needs replacement","A bug in the application code causing illegal memory access on the GPU","Insufficient PCIe bandwidth between GPUs","NVLink cable degradation"],"zo":["GPU 硬件故障，需要更换","应用代码存在 bug，导致对 GPU 的非法显存访问","GPU 之间 PCIe 带宽不足","NVLink 线缆劣化"],"a":1,"e":"XID 31 indicates a GPU memory page fault — an access to an invalid GPU memory address. When this error only occurs with a specific application, it almost always indicates a software bug such as an out-of-bounds memory access, use-after-free, or incorrect CUDA memory management. If the error occurred across multiple applications, hardware would be more suspect.","ze":"XID 31 是 GPU 显存缺页——访问了非法的 GPU 显存地址。只在特定应用出现时，几乎总是软件 bug：越界访问、释放后使用（use-after-free）或 CUDA 显存管理错误。若多个应用都出现，才更应怀疑硬件。","s":""},{"id":"tm-xid-007","d":"5","m":0,"t":"dmesg","c":"概念理解","q":"What is the relationship between XID error codes and the NVIDIA kernel module (NVRM)?","zq":"XID 错误码与 NVIDIA 内核模块（NVRM）是什么关系？","o":["XID codes are generated by the CUDA runtime library","XID codes are generated by the NVIDIA kernel driver (NVRM) and logged to the kernel ring buffer via dmesg","XID codes are generated by the DCGM daemon","XID codes are generated by nvidia-smi polling"],"zo":["XID 码由 CUDA 运行时库生成","XID 码由 NVIDIA 内核驱动（NVRM）生成，并通过 dmesg 记录到内核环形缓冲区","XID 码由 DCGM 守护进程生成","XID 码由 nvidia-smi 轮询生成"],"a":1,"e":"XID (eXtended Information Detail) error codes are generated by NVRM, the NVIDIA Resource Manager kernel module. When the GPU hardware reports an error condition, NVRM translates it into an XID code and logs it to the kernel ring buffer. These messages are then visible through dmesg and journalctl.","ze":"XID（eXtended Information Detail）错误码由 NVRM 生成——即 NVIDIA 资源管理内核模块。GPU 硬件报告错误条件时，NVRM 把它翻译成 XID 码并写入内核环形缓冲，随后通过 dmesg 与 journalctl 可见。","s":""},{"id":"tm-xid-008","d":"4","m":0,"t":"nvidia-smi","c":"命令语法","q":"Which nvidia-smi command displays the count of ECC page retirements related to double-bit errors?","zq":"哪条 nvidia-smi 命令可显示与双比特错误相关的 ECC 页退役计数？","o":["nvidia-smi -q -d PAGE_RETIREMENT","nvidia-smi --ecc-errors","nvidia-smi -q -d ECC_PAGES","nvidia-smi --retirement-count"],"zo":["nvidia-smi -q -d PAGE_RETIREMENT","nvidia-smi --ecc-errors","nvidia-smi -q -d ECC_PAGES","nvidia-smi --retirement-count"],"a":0,"e":"The command 'nvidia-smi -q -d PAGE_RETIREMENT' displays retired page information including single-bit and double-bit retirement causes, pending retirements, and whether a reboot is needed to apply pending retirements. This is the primary tool for assessing GPU memory health after XID 48 or XID 63 errors.","ze":"nvidia-smi -q -d PAGE_RETIREMENT 显示退役页信息：单比特与双比特退役原因、待生效的退役、以及是否需要重启才能应用。XID 48 或 63 之后，这是评估显存健康的主要工具。","s":""},{"id":"tm-xid-009","d":"4","m":0,"t":"nvidia-smi","c":"输出判读","q":"What does this nvidia-smi ECC output tell you about the GPU's health?","zq":"这段 nvidia-smi ECC 输出说明该 GPU 的健康状况如何？","o":["The GPU is failing and must be replaced immediately","The GPU has historical uncorrectable errors but is currently stable — monitor closely and plan replacement","The GPU is perfectly healthy with only correctable errors","ECC is malfunctioning and needs to be disabled"],"zo":["GPU 已失效，必须立即更换","GPU 历史上出现过不可纠正错误，但当前稳定——应密切监控并计划更换","GPU 完全健康，只有可纠正错误","ECC 功能异常，应关闭 ECC"],"a":1,"e":"Volatile counters (reset each boot) show zero uncorrectable errors — the GPU is currently stable. However, Aggregate counters (lifetime) show 2 SRAM uncorrectable and 1 DRAM uncorrectable errors historically. This GPU has experienced serious errors in the past. While stable now, it should be monitored closely and scheduled for replacement during the next maintenance window.","ze":"Volatile（每次启动清零）显示 0 个不可纠正错误——当前是稳定的；但 Aggregate（全生命周期）记录有 2 个 SRAM 不可纠正与 1 个 DRAM 不可纠正错误，说明历史上出现过严重问题。应密切监控，并在下次维护窗口安排更换。","s":"$ nvidia-smi -q -d ECC -i 2\n    ECC Errors\n        Volatile\n            SRAM Correctable              : 0\n            SRAM Uncorrectable            : 0\n            DRAM Correctable              : 142\n            DRAM Uncorrectable            : 0\n        Aggregate\n            SRAM Correctable              : 0\n            SRAM Uncorrectable            : 2\n            DRAM Correctable              : 3847\n            DRAM Uncorrectable            : 1"},{"id":"tm-xid-010","d":"5","m":0,"t":"nvidia-smi","c":"参数用法","q":"After a GPU reports XID 48 errors, which nvidia-smi command should you run first to assess the damage?","zq":"GPU 报出 XID 48 后，应先运行哪条 nvidia-smi 命令评估损伤？","o":["nvidia-smi -q -d PERFORMANCE","nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>","nvidia-smi --reset-ecc-errors","nvidia-smi -pl 300"],"zo":["nvidia-smi -q -d PERFORMANCE","nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>","nvidia-smi --reset-ecc-errors","nvidia-smi -pl 300"],"a":1,"e":"After XID 48 (double-bit ECC error), you need to check both ECC error counts and page retirement status. The combined query 'nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>' shows current error counts, whether pages were retired, and if a reboot is pending to apply retirements.","ze":"XID 48 之后需要同时看 ECC 计数与页退役状态：nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu> 会显示当前错误计数、是否发生页退役、是否需要重启才能应用退役。","s":""},{"id":"tm-xid-011","d":"5","m":0,"t":"nvidia-smi","c":"输出判读","q":"You run nvidia-smi and see 'ERR!' in the GPU utilization column. What XID-related condition causes this?","zq":"运行 nvidia-smi 时看到 GPU 利用率列显示 'ERR!'，是哪种 XID 相关状况导致的？","o":["The GPU is overclocked beyond safe limits","The GPU has a critical health status due to unrecoverable errors (XID 48, 64, or 79)","The nvidia-smi binary is outdated and needs updating","The GPU is in MIG mode and cannot report utilization"],"zo":["GPU 超频超出安全范围","GPU 因不可恢复错误（XID 48、64 或 79）进入严重健康状态","nvidia-smi 二进制过旧，需要更新","GPU 处于 MIG 模式，无法上报利用率"],"a":1,"e":"nvidia-smi displays 'ERR!' when it cannot communicate with the GPU or the GPU is in a critical error state. This typically follows XID 79 (GPU fallen off bus), XID 48 (uncorrectable ECC), or XID 64 (ECC error with GPU exception). The GPU is non-functional and requires at minimum a GPU reset, driver reload, or system reboot.","ze":"nvidia-smi 显示 ERR! 表示它无法与 GPU 通信，或 GPU 处于严重错误状态，典型对应 XID 79（掉总线）、XID 48（不可纠正 ECC）、XID 64（ECC 错误伴随 GPU 异常）。此时 GPU 已不可用，至少需要重置 GPU、重载驱动或重启系统。","s":""},{"id":"tm-xid-012","d":"5","m":0,"t":"nvidia-smi","c":"故障排查","q":"A GPU shows XID 13 errors during training. Which nvidia-smi command helps determine if the issue is thermal throttling?","zq":"某 GPU 在训练中出现 XID 13，哪条 nvidia-smi 命令有助于判断是否为热降频所致？","o":["nvidia-smi -q -d TEMPERATURE,POWER -i <gpu_id>","nvidia-smi --gpu-reset -i <gpu_id>","nvidia-smi -q -d CLOCK","nvidia-smi dmon -s t"],"zo":["nvidia-smi -q -d TEMPERATURE,POWER -i <gpu_id>","nvidia-smi --gpu-reset -i <gpu_id>","nvidia-smi -q -d CLOCK","nvidia-smi dmon -s t"],"a":0,"e":"XID 13 (GPU exception) can be caused by thermal issues. Checking 'nvidia-smi -q -d TEMPERATURE,POWER' shows current temperature, thermal slowdown threshold, thermal shutdown threshold, and power draw. If the GPU temperature is near the slowdown threshold, thermal throttling is likely contributing to the XID 13 errors.","ze":"XID 13（GPU 异常）可能由热问题引起。用 nvidia-smi -q -d TEMPERATURE,POWER 查看当前温度、降频阈值、关机阈值与功耗；若温度接近降频阈值，热节流很可能是 XID 13 的诱因。","s":""},{"id":"tm-xid-013","d":"5","m":0,"t":"nvidia-smi","c":"最佳实践","q":"What is the recommended first step when nvidia-smi shows a GPU with persistent XID errors?","zq":"当 nvidia-smi 显示某 GPU 存在持续性 XID 错误时，推荐的第一步是？","o":["Immediately replace the GPU hardware","Reset the GPU ECC error counters and see if errors reappear","Isolate the GPU by draining it from the job scheduler, then run diagnostics","Reboot the entire node immediately"],"zo":["立即更换 GPU 硬件","清零 GPU 的 ECC 错误计数器，看错误是否复现","先在调度器中把该 GPU drain 隔离，再运行诊断","立即重启整台节点"],"a":2,"e":"The recommended workflow is: (1) drain the node or specific GPU from the job scheduler to prevent new jobs, (2) run DCGM diagnostics to assess the GPU's health, (3) check ECC counts and page retirements, (4) decide on remediation. Immediately replacing hardware or rebooting wastes time if the issue is software-related, and resetting counters loses diagnostic evidence.","ze":"推荐流程：1) 在调度器里把节点或该 GPU drain 掉，阻止新作业；2) 跑 DCGM 诊断评估健康；3) 查 ECC 计数与页退役；4) 再决定处置。贸然换件或重启会浪费时间（若其实是软件问题），而清零计数器会丢失诊断证据。","s":""},{"id":"tm-xid-014","d":"4","m":0,"t":"nvidia-smi","c":"概念理解","q":"What is the difference between volatile and aggregate ECC error counters in nvidia-smi?","zq":"nvidia-smi 中的 volatile 与 aggregate ECC 计数器有什么区别？","o":["Volatile counts errors in GPU L2 cache; aggregate counts errors in HBM","Volatile counts since last driver load; aggregate counts across all time since manufacturing","Volatile counts correctable errors; aggregate counts uncorrectable errors","Volatile counts single-GPU errors; aggregate counts multi-GPU NVLink errors"],"zo":["volatile 统计 L2 缓存错误，aggregate 统计 HBM 错误","volatile 统计自上次驱动加载以来的错误；aggregate 统计自出厂以来的全部错误","volatile 统计可纠正错误，aggregate 统计不可纠正错误","volatile 统计单卡错误，aggregate 统计多卡 NVLink 错误"],"a":1,"e":"Volatile ECC counters reset when the GPU driver is loaded (typically at boot). They show errors accumulated during the current session. Aggregate counters persist across driver loads and reboots — they represent the GPU's lifetime error history stored in the GPU's InfoROM. Comparing both tells you whether errors are a new issue or chronic.","ze":"Volatile 计数器在驱动加载（通常开机）时清零，只反映本次会话；Aggregate 跨驱动加载与重启保留，记录 GPU 出厂以来的错误历史（存于 InfoROM）。对比两者即可判断是新出现的问题还是慢性问题。","s":""},{"id":"tm-xid-015","d":"4","m":0,"t":"dcgmi","c":"命令语法","q":"Which DCGM diagnostic level is recommended for investigating XID errors after isolating a suspicious GPU?","zq":"隔离出可疑 GPU 之后，排查 XID 错误时推荐使用哪个 DCGM 诊断级别？","o":["dcgmi diag -r 1 (short — 30 seconds)","dcgmi diag -r 2 (medium — 2 minutes)","dcgmi diag -r 3 (long — 15+ minutes, includes stress tests)","dcgmi diag -r 0 (quick health check)"],"zo":["dcgmi diag -r 1（短，约 30 秒）","dcgmi diag -r 2（中，约 2 分钟）","dcgmi diag -r 3（长，15 分钟以上，含压力测试）","dcgmi diag -r 0（快速健康检查）"],"a":2,"e":"Level 3 (long diagnostic, via -r 3) runs comprehensive stress tests including memory bandwidth tests, compute stress tests, and PCIe throughput validation. After XID errors, you need a thorough assessment to determine if the GPU can reliably handle sustained workloads. Levels 1 and 2 may miss intermittent faults that only manifest under load.","ze":"3 级（-r 3）会运行内存带宽、计算压力与 PCIe 吞吐等完整压测。出现 XID 后需要判断该卡能否稳定承载持续负载，而 1、2 级可能漏掉只在带载下才暴露的间歇故障。","s":""},{"id":"tm-xid-016","d":"4","m":0,"t":"dcgmi","c":"输出判读","q":"What does a DCGM health check result of 'Warning' for the 'Memory' subsystem suggest after XID errors?","zq":"出现 XID 错误后，DCGM 健康检查在“Memory”子系统上返回 Warning，说明什么？","o":["The GPU memory is completely failed and cannot be used","The GPU has accumulated ECC errors that haven't yet reached critical thresholds but warrant monitoring","The DCGM service is misconfigured","The GPU memory bandwidth is below expected performance"],"zo":["GPU 显存已完全失效，无法使用","GPU 累积了尚未达到临界阈值的 ECC 错误，需要持续监控","DCGM 服务配置有误","GPU 显存带宽低于预期性能"],"a":1,"e":"A 'Warning' status for the Memory subsystem in 'dcgmi health --check' means DCGM has detected ECC errors that are below the critical failure threshold but above normal levels. The GPU is still functional but showing signs of degradation. Schedule replacement during the next maintenance window.","ze":"Memory 子系统给出 Warning，表示检测到尚未达到临界阈值的 ECC 错误，但已高于正常水平。GPU 仍然可用，却已出现劣化迹象，应安排在下次维护窗口更换。","s":""},{"id":"tm-xid-017","d":"4","m":0,"t":"dcgmi","c":"参数用法","q":"How do you configure DCGM to automatically monitor for XID errors and trigger an alert?","zq":"如何配置 DCGM 自动监控 XID 错误并触发告警？","o":["dcgmi policy -g 1 --set 1,1 -x --action 1","dcgmi health --set --watches xid","dcgmi stats --enable-xid-watch","dcgmi config --set-alert xid"],"zo":["dcgmi policy -g 1 --set 1,1 -x --action 1","dcgmi health --set --watches xid","dcgmi stats --enable-xid-watch","dcgmi config --set-alert xid"],"a":0,"e":"The DCGM policy system monitors GPU health conditions and triggers actions. 'dcgmi policy -g 1 --set 1,1 -x --action 1' sets a policy on group 1 (-g flag required) watching for XID errors (-x flag) with specified violation and action parameters. When an XID error occurs, DCGM logs the event and can trigger configurable responses.","ze":"DCGM 的策略系统监控 GPU 健康条件并触发动作：policy -g 1 --set 1,1 -x --action 1 在 1 号组上设置监视 XID（-x）的策略，并给定违规与动作参数。发生 XID 时 DCGM 记录事件，并可触发可配置的响应。","s":""},{"id":"tm-xid-018","d":"5","m":0,"t":"dcgmi","c":"故障排查","q":"A DCGM level-3 diagnostic reports 'FAIL' on the 'Diagnostic' test for GPU 5. The GPU previously showed XID 64 errors. What should you do?","zq":"DCGM 3 级诊断在 GPU 5 的 Diagnostic 项上报 FAIL，该 GPU 此前出现过 XID 64。应如何处理？","o":["Reset the ECC counters and retry the diagnostic","Update the GPU firmware and rerun","Mark the GPU for replacement — XID 64 plus diagnostic failure confirms hardware degradation","Lower the GPU power limit and retry"],"zo":["清零 ECC 计数器后重跑诊断","升级 GPU 固件后重跑","把该 GPU 标记为待更换——XID 64 加上诊断失败可确认硬件劣化","降低 GPU 功耗上限后重试"],"a":2,"e":"XID 64 indicates ECC errors combined with a GPU exception, meaning compute operations are being corrupted. When a level-3 DCGM diagnostic also fails, this confirms the GPU cannot reliably perform computations. The combination of runtime XID 64 errors and diagnostic failure is strong evidence of hardware degradation. The GPU should be replaced.","ze":"XID 64 表示 ECC 错误伴随 GPU 异常，计算过程正在被破坏；当 3 级诊断同样失败，两者叠加就是硬件劣化的有力证据，该 GPU 应标记为待更换。清零计数器或升级固件都修不了已劣化的显存。","s":""},{"id":"tm-xid-019","d":"5","m":0,"t":"dcgmi","c":"最佳实践","q":"What is the recommended sequence for using DCGM when triaging a GPU that reported XID errors during a training job?","zq":"训练作业中出现 XID 错误后，用 DCGM 排查的推荐顺序是？","o":["Run mode 3 diagnostic immediately while the job is still running","Stop the job, run 'dcgmi health --check', then 'dcgmi diag -r 3' if health shows warnings","Reboot the node first, then run diagnostics","Skip DCGM and go straight to hardware replacement"],"zo":["作业还在跑时立即执行 3 级诊断","先停掉作业，运行 dcgmi health --check，若健康检查出现告警再跑 dcgmi diag -r 3","先重启节点，再跑诊断","跳过 DCGM，直接换硬件"],"a":1,"e":"The recommended triage sequence is: (1) stop/drain workloads from the GPU, (2) run 'dcgmi health --check' for a quick subsystem assessment, (3) if any subsystem shows Warning or Error, run 'dcgmi diag --mode 3' for comprehensive stress testing. Running diagnostics while a job is active gives unreliable results. Rebooting before diagnostics can clear volatile error counters.","ze":"推荐顺序：1) 停掉或把作业移出该 GPU；2) 跑 dcgmi health --check 做快速子系统评估；3) 若某子系统出现 Warning/Error，再跑 dcgmi diag -r 3 做完整压测。作业运行中跑诊断结果不可靠；先重启则会清掉易失的错误计数。","s":""},{"id":"tm-xid-020","d":"4","m":0,"t":"dcgmi","c":"概念理解","q":"What DCGM health subsystems are most relevant when investigating GPU XID errors?","zq":"排查 GPU XID 错误时，最相关的 DCGM 健康子系统有哪些？","o":["PCIe and NVLink subsystems only","Memory, GPU Core, and Thermal subsystems","Only the Memory subsystem","All 8 DCGM health subsystems equally"],"zo":["只有 PCIe 与 NVLink 子系统","Memory、GPU Core 与 Thermal 三个子系统","只有 Memory 子系统","8 个 DCGM 健康子系统同等重要"],"a":1,"e":"When investigating XID errors, the most relevant DCGM health subsystems are: Memory (ECC errors, page retirements), GPU Core (compute engine faults, hardware exceptions), and Thermal (overheating causing GPU instability). PCIe and NVLink are relevant for XID 79 (fallen off bus) but less common.","ze":"排查 XID 时最相关的三个子系统是 Memory（ECC 错误、页退役）、GPU Core（计算引擎故障、硬件异常）与 Thermal（过热导致不稳定）。PCIe 与 NVLink 主要与 XID 79（掉总线）等场景相关，相对少见。","s":""},{"id":"tm-xid-021","d":"5","m":0,"t":"nvidia-bug-report","c":"命令语法","q":"What command generates a comprehensive NVIDIA diagnostic bundle for support escalation after XID errors?","zq":"出现 XID 错误后，用哪条命令生成完整的 NVIDIA 诊断包以便升级给支持团队？","o":["nvidia-bug-report.sh","nvidia-collect-logs --all","nvidia-smi --generate-report","dcgmi report --full"],"zo":["nvidia-bug-report.sh","nvidia-collect-logs --all","nvidia-smi --generate-report","dcgmi report --full"],"a":0,"e":"nvidia-bug-report.sh generates a compressed archive containing GPU state, driver versions, kernel logs (including XID errors), PCI topology, ECC status, and system configuration. This is the standard artifact to include when escalating GPU issues to NVIDIA support.","ze":"nvidia-bug-report.sh 生成含 GPU 状态、驱动版本、内核日志（含 XID）、PCI 拓扑、ECC 状态与系统配置的压缩包，是向 NVIDIA 支持升级问题时的标准附件。","s":""},{"id":"tm-xid-022","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When should you run nvidia-bug-report.sh relative to investigating XID errors?","zq":"相对 XID 排查流程，nvidia-bug-report.sh 应该在什么时候运行？","o":["After rebooting the system to get a clean state","Before rebooting or resetting the GPU — while error state is still in memory","Only after NVIDIA support requests it","It does not matter when you run it"],"zo":["重启系统、恢复干净状态之后","在重启或重置 GPU 之前——此时错误现场仍在内存中","只在 NVIDIA 支持要求时才跑","什么时候跑都一样"],"a":1,"e":"nvidia-bug-report.sh should be run before any reboot, GPU reset, or driver reload. The report captures volatile kernel logs (dmesg), current GPU state, and runtime error counters that are lost on reboot. Running it after a reboot produces a clean-looking report that lacks the critical error evidence needed for diagnosis.","ze":"应在任何重启、GPU 重置或驱动重载之前运行——报告捕获的 dmesg、当前 GPU 状态与运行时错误计数都是易失的。重启后再跑只会得到“看起来很干净”的报告，丢掉定位所需的证据。","s":""},{"id":"tm-xid-023","d":"5","m":0,"t":"nvidia-bug-report","c":"参数用法","q":"Which option generates the nvidia-bug-report output to a specific file path?","zq":"哪个选项可把 nvidia-bug-report 的输出写到指定文件路径？","o":["nvidia-bug-report.sh --output-dir /tmp/gpu-report","nvidia-bug-report.sh --output-file /tmp/gpu-report.gz","nvidia-bug-report.sh -o /tmp/gpu-report","nvidia-bug-report.sh > /tmp/gpu-report.gz"],"zo":["nvidia-bug-report.sh --output-dir /tmp/gpu-report","nvidia-bug-report.sh --output-file /tmp/gpu-report.gz","nvidia-bug-report.sh -o /tmp/gpu-report","nvidia-bug-report.sh > /tmp/gpu-report.gz"],"a":1,"e":"nvidia-bug-report.sh uses --output-file to specify the output path for the compressed report archive. By default, it creates nvidia-bug-report.log.gz in the current directory. Specifying a custom path is useful when the current directory has limited space or when collecting reports from multiple nodes to a shared filesystem.","ze":"nvidia-bug-report.sh 用 --output-file 指定压缩报告的输出路径；默认在当前目录生成 nvidia-bug-report.log.gz。当前目录空间不足，或要把多台节点的报告汇总到共享存储时，自定义路径很有用。","s":""},{"id":"tm-xid-024","d":"5","m":0,"t":"nvidia-bug-report","c":"概念理解","q":"What key information does nvidia-bug-report.sh capture that is relevant to XID error diagnosis?","zq":"nvidia-bug-report.sh 会捕获哪些与 XID 诊断相关的关键信息？","o":["Only the current nvidia-smi output","Kernel logs with XID errors, GPU state, ECC counters, PCIe topology, driver version, and system configuration","A screenshot of the GPU temperature graph","Only the DCGM diagnostic results"],"zo":["只有当前的 nvidia-smi 输出","含 XID 错误的内核日志、GPU 状态、ECC 计数器、PCIe 拓扑、驱动版本与系统配置","GPU 温度曲线截图","只有 DCGM 诊断结果"],"a":1,"e":"nvidia-bug-report.sh creates a comprehensive snapshot including: full dmesg with XID error history, nvidia-smi output for all GPUs, ECC error and page retirement counters, PCIe link status and topology, driver and firmware versions, and system configuration. This single artifact provides all the context needed to diagnose XID errors.","ze":"它生成的是完整快照：含 XID 历史的完整 dmesg、所有 GPU 的 nvidia-smi 输出、ECC 与页退役计数、PCIe 链路状态与拓扑、驱动与固件版本以及系统配置。一个文件就够定位 XID 问题。","s":""},{"id":"tm-xid-025","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"You need to collect diagnostic data from a node where GPU 3 has XID 79 (fallen off bus) and nvidia-smi hangs. How should you proceed?","zq":"需要在一台 GPU 3 报 XID 79（已掉线）、nvidia-smi 卡死的节点上收集诊断数据，应如何操作？","o":["Wait for nvidia-smi to respond, then run nvidia-bug-report.sh","Run nvidia-bug-report.sh — it has timeout mechanisms and can capture partial data even with hung GPUs","Reboot the node first to restore GPU communication, then collect data","Skip data collection and replace the GPU immediately"],"zo":["等 nvidia-smi 恢复响应后，再运行 nvidia-bug-report.sh","直接运行 nvidia-bug-report.sh——它内置超时机制，即使有 GPU 卡死也能采集到部分数据","先重启节点恢复 GPU 通信，再收集数据","跳过数据收集，直接更换 GPU"],"a":1,"e":"nvidia-bug-report.sh includes timeout mechanisms for each data collection step, so it can complete even when individual GPUs are unresponsive. It will capture the available kernel logs showing the XID 79 error, working GPU states, and PCIe topology showing the failed device. Rebooting would lose the volatile error logs. Always attempt data collection before destructive recovery steps.","ze":"nvidia-bug-report.sh 对每个采集步骤都有超时机制，即使个别 GPU 无响应也能跑完，能抓到显示 XID 79 的内核日志、正常 GPU 的状态，以及标出故障设备的 PCIe 拓扑。重启会丢掉易失的错误日志，所以务必先采集证据再恢复。","s":""},{"id":"t1-xid13","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 13 indicate?","zq":"XID 13 错误表示什么？","o":["Graphics engine exception during shader or CUDA kernel execution","Uncorrectable double-bit ECC error in GPU memory","GPU has fallen off the PCIe bus","NVLink training failure between GPUs"],"zo":["着色器或 CUDA kernel 执行期间的图形引擎异常","GPU 显存中出现不可纠正的双比特 ECC 错误","GPU 已从 PCIe 总线掉线","GPU 之间的 NVLink 训练失败"],"a":0,"e":"XID 13 is a Graphics Engine Exception. It typically occurs during shader or CUDA kernel execution and is often caused by a misbehaving application, shader bug, or driver issue. It may also indicate a CUDA kernel timeout.","ze":"XID 13 是图形引擎异常，通常发生在着色器或 CUDA kernel 执行期间，多由应用行为异常、shader bug 或驱动问题引起，也可能表示 CUDA kernel 超时。","s":""},{"id":"t1-xid27","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 27 indicate?","zq":"XID 27 错误表示什么？","o":["NVLink communication timeout between GPUs","GPU memory interface error — communication between GPU core and VRAM failed","Driver firmware version mismatch","GPU stopped responding to driver commands"],"zo":["GPU 之间的 NVLink 通信超时","GPU 内存接口错误——GPU 核心与显存（VRAM）之间的通信失败","驱动与固件版本不匹配","GPU 停止响应驱动命令"],"a":1,"e":"XID 27 is a GPU Memory Interface Error, meaning communication between the GPU core and VRAM has failed. This is typically caused by a hardware defect in the memory controller, memory bus issue, or severe overheating. GPU replacement is likely required if persistent.","ze":"XID 27 是 GPU 内存接口错误：GPU 核心与 VRAM 之间的通信失败。常见原因是内存控制器硬件缺陷、显存总线问题或严重过热；若持续出现，通常需要更换 GPU。","s":""},{"id":"t1-xid38","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 38 indicate?","zq":"XID 38 错误表示什么？","o":["GPU thermal shutdown due to overheating","NVLink ECC error on the data path","Driver firmware mismatch — loaded firmware does not match expected version","Row remapping threshold exceeded in GPU memory"],"zo":["GPU 因过热触发关机保护","NVLink 数据路径上的 ECC 错误","驱动与固件不匹配——已加载固件与预期版本不符","GPU 显存的行重映射超过阈值"],"a":2,"e":"XID 38 is a Driver Firmware Mismatch. It occurs when the loaded driver firmware does not match the expected version, typically caused by an incomplete driver installation, corrupted firmware, or a driver/firmware version mismatch. Reinstalling NVIDIA drivers completely is the primary fix.","ze":"XID 38 是驱动与固件不匹配：已加载的固件与期望版本不一致，常因驱动安装不完整、固件损坏或版本错配。完整重装 NVIDIA 驱动是主要修复手段。","s":""},{"id":"t1-xid43","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 43 indicate?","zq":"XID 43 错误表示什么？","o":["Single-bit ECC error rate has exceeded threshold","GPU firmware needs to be updated","GPU has stopped responding and cannot be recovered","NVLink flow control credits exhausted"],"zo":["单比特 ECC 错误率超过阈值","GPU 固件需要升级","GPU 已停止响应且无法恢复","NVLink 流控信用（credit）耗尽"],"a":2,"e":"XID 43 means the GPU has stopped responding and cannot be recovered. Common causes include GPU hang, thermal throttling, power issues, or hardware failure. Checking GPU temperature and cooling, then attempting a GPU reset, are the recommended first steps.","ze":"XID 43 表示 GPU 已停止响应且无法恢复。常见原因：GPU 挂死、热节流、供电问题或硬件故障。建议先检查温度与散热，再尝试 GPU 重置。","s":""},{"id":"t1-xid48","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 48 indicate?","zq":"XID 48 错误表示什么？","o":["GPU memory page fault during application execution","Uncorrectable double-bit ECC error in GPU memory","High rate of correctable single-bit ECC errors","GPU memory interface communication failure"],"zo":["应用执行期间的 GPU 显存缺页","GPU 显存中不可纠正的双比特 ECC 错误","可纠正单比特 ECC 错误出现频率很高","GPU 内存接口通信失败"],"a":1,"e":"XID 48 is a Double-Bit ECC Error — an uncorrectable error in GPU memory. Unlike single-bit errors which can be corrected, double-bit errors indicate failing hardware. GPU replacement is required if errors persist.","ze":"XID 48 是双比特 ECC 错误——显存中的不可纠正错误。单比特可纠正，双比特说明硬件正在失效；若错误持续必须更换 GPU。","s":""},{"id":"t1-xid54","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 54 indicate?","zq":"XID 54 错误表示什么？","o":["GPU preemptive resource cleanup after application exit","Hardware watchdog timeout — GPU unresponsive to internal health checks","Display engine error in rendering pipeline","Invalid or corrupted GPU command buffer"],"zo":["应用退出后 GPU 的抢占式资源清理","硬件看门狗超时——GPU 对内部健康检查无响应","渲染管线中的显示引擎错误","GPU 命令缓冲区内容非法或已损坏"],"a":1,"e":"XID 54 is a Hardware Watchdog Timeout, meaning the GPU hardware watchdog detected that the GPU is unresponsive to internal health checks. This is more severe than XID 43 and often requires a node reboot. Recurring instances indicate GPU replacement is needed.","ze":"XID 54 是硬件看门狗超时：GPU 硬件看门狗检测到 GPU 对内部健康检查无响应。它比 XID 43 更严重，常需重启节点；反复出现说明该换卡了。","s":""},{"id":"t1-xid63","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 63 indicate?","zq":"XID 63 错误表示什么？","o":["NVLink failed to complete link training","Row remapping failure — GPU memory error correction capacity exhausted","GPU copy engine encountered a transfer error","Contained ECC error handled successfully"],"zo":["NVLink 未能完成链路训练","行重映射失败——GPU 显存的纠错能力已耗尽","GPU 拷贝引擎遇到传输错误","已成功处理的受控 ECC 错误"],"a":1,"e":"XID 63 is a Row Remapping Failure. It means the GPU failed to remap a memory row with errors, indicating that the GPU memory has exhausted its error correction capacity. Hardware failure is imminent and GPU replacement is required.","ze":"XID 63 是行重映射失败：GPU 无法再重映射出错的内存行，说明显存纠错能力已耗尽。硬件失效在即，需要更换 GPU。","s":""},{"id":"t1-xid74","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 74 indicate?","zq":"XID 74 错误表示什么？","o":["GPU memory interface communication failure","Driver firmware version mismatch","NVLink error — fault detected on NVLink interconnect","GPU thermal throttling activated"],"zo":["GPU 内存接口通信失败","驱动与固件版本不匹配","NVLink 错误——在 NVLink 互联上检测到故障","GPU 热降频已启用"],"a":2,"e":"XID 74 is an NVLink Error, indicating a fault detected on the NVLink interconnect. Causes include NVLink cable faults, GPU seating issues, or hardware failure on the NVLink bridge. Checking NVLink status with nvidia-smi nvlink -s and verifying physical connections are the first steps.","ze":"XID 74 是 NVLink 错误：在 NVLink 互联上检测到故障。原因包括 NVLink 线缆故障、GPU 未插好、NVLink 桥硬件失效。应先用 nvidia-smi nvlink -s 检查状态并确认物理连接。","s":""},{"id":"t1-xid79","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 79 indicate?","zq":"XID 79 错误表示什么？","o":["GPU stopped responding but can be reset","GPU has fallen off the PCIe bus and is completely unreachable","NVLink timeout during GPU-to-GPU communication","ECC error that could not be contained"],"zo":["GPU 停止响应，但可以重置","GPU 已从 PCIe 总线掉线，完全无法访问","GPU 间通信时 NVLink 超时","无法被隔离的 ECC 错误"],"a":1,"e":"XID 79 means the GPU has fallen off the PCIe bus — it is completely unresponsive and disconnected. This is a severe hardware failure caused by power issues, thermal shutdown, or PCIe link failure. GPU reset will NOT work because the GPU is unreachable. A node reboot and hardware inspection are required.","ze":"XID 79 表示 GPU 已从 PCIe 总线掉线，完全无响应、已断连。这是严重硬件故障，可能由供电问题、热关机或 PCIe 链路失效引起。由于 GPU 不可达，GPU 重置无效，必须重启节点并做硬件检查。","s":""},{"id":"t1-xid92","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 92 indicate?","zq":"XID 92 错误表示什么？","o":["Uncorrectable double-bit ECC error","Uncontained ECC error with possible data corruption","Elevated rate of correctable single-bit ECC errors","Row remapping threshold exceeded"],"zo":["不可纠正的双比特 ECC 错误","未被隔离、可能造成数据损坏的 ECC 错误","可纠正单比特 ECC 错误出现频率升高","行重映射超过阈值"],"a":2,"e":"XID 92 indicates a High Single-Bit ECC Rate — an elevated rate of correctable single-bit ECC errors. While these errors are corrected, the increasing rate is an early indicator of memory degradation and potential future failure. Proactive monitoring and planning for GPU replacement is recommended.","ze":"XID 92 表示单比特 ECC 错误率过高。这些错误虽被纠正，但频率上升是显存劣化的早期信号，预示未来可能失效；建议加强监控并计划更换。","s":""},{"id":"t1-xid95","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 95 indicate?","zq":"XID 95 错误表示什么？","o":["Contained ECC error — data integrity maintained","High rate of correctable single-bit ECC errors","Uncontained ECC error — data may be corrupted","GPU memory page fault from application bug"],"zo":["已隔离的 ECC 错误——数据完整性得以保持","可纠正单比特 ECC 错误出现频率很高","未隔离的 ECC 错误——数据可能已损坏","应用 bug 导致的 GPU 显存缺页"],"a":2,"e":"XID 95 is an Uncontained ECC Error, meaning an ECC error occurred that could not be contained and data may be corrupted. This is a critical error requiring immediate attention: check running workloads for data corruption, run diagnostics, and consider GPU replacement.","ze":"XID 95 是未隔离的 ECC 错误：发生了无法被隔离的 ECC 错误，数据可能已损坏。属严重错误，需立即处理——检查运行中的作业是否数据损坏、跑诊断，并考虑更换 GPU。","s":""},{"id":"t1-xid64","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 64 indicate?","zq":"XID 64 错误表示什么？","o":["NVLink ECC error on the data path","Memory row remapping has reached its threshold — GPU memory health degraded","GPU stopped responding to driver health checks","Graphics engine exception during shader execution"],"zo":["NVLink 数据路径上的 ECC 错误","显存行重映射已达阈值——GPU 显存健康度劣化","GPU 停止响应驱动的健康检查","着色器执行期间的图形引擎异常"],"a":1,"e":"XID 64 is Row Remapping Threshold Exceeded. It means too many memory rows have been remapped due to errors, indicating degraded GPU memory health. Proactive GPU replacement should be scheduled.","ze":"XID 64 是行重映射超阈值：因错误被重映射的内存行过多，显存健康度已劣化，应安排预防性更换 GPU。","s":""},{"id":"t1-xid76","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 76 indicate?","zq":"XID 76 错误表示什么？","o":["NVLink operation timed out during GPU communication","NVLink failed to complete link training — link cannot establish connection","NVLink flow control credits exhausted","NVLink ECC error on the data path"],"zo":["GPU 通信时 NVLink 操作超时","NVLink 未能完成链路训练——链路无法建立连接","NVLink 流控信用耗尽","NVLink 数据路径上的 ECC 错误"],"a":1,"e":"XID 76 is an NVLink Training Error, meaning NVLink failed to complete link training and cannot establish a connection. This indicates a physical NVLink connection problem, NVLink bridge damage, or GPU hardware failure. Reseating GPUs and NVLink bridges is the first step.","ze":"XID 76 是 NVLink 训练错误：NVLink 未能完成链路训练、无法建立连接。说明 NVLink 物理连接有问题、桥损坏或 GPU 硬件故障；应先重新插拔 GPU 与 NVLink 桥。","s":""},{"id":"t1-xid77","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 77 indicate?","zq":"XID 77 错误表示什么？","o":["NVLink operation timed out — communication between GPUs failed","GPU hardware watchdog detected a timeout","GPU fell off the PCIe bus","NVLink link training failed"],"zo":["NVLink 操作超时——GPU 之间的通信失败","GPU 硬件看门狗检测到超时","GPU 从 PCIe 总线掉线","NVLink 链路训练失败"],"a":0,"e":"XID 77 is an NVLink Timeout, indicating that an NVLink operation timed out and communication between GPUs has failed. This can be caused by NVLink link failure, severe congestion, or hardware faults. Checking NVLink error counters and fabric manager status are the first steps.","ze":"XID 77 是 NVLink 超时：NVLink 操作超时，GPU 之间通信失败。可能由 NVLink 链路故障、严重拥塞或硬件问题引起；应先查 NVLink 错误计数与 fabric manager 状态。","s":""},{"id":"t1-xid78","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 78 indicate?","zq":"XID 78 错误表示什么？","o":["High rate of correctable single-bit ECC errors in GPU memory","Row remapping failure in GPU memory","Uncorrectable ECC error on the NVLink data path","Driver firmware version mismatch"],"zo":["GPU 显存中可纠正单比特 ECC 错误出现频率很高","GPU 显存的行重映射失败","NVLink 数据路径上的不可纠正 ECC 错误","驱动与固件版本不匹配"],"a":2,"e":"XID 78 is an NVLink ECC Error — an uncorrectable ECC error on the NVLink data path. This indicates hardware failure in the NVLink fabric, potentially affecting the NVSwitch or GPU NVLink interface. Hardware replacement is likely required.","ze":"XID 78 是 NVLink ECC 错误：NVLink 数据路径上的不可纠正 ECC 错误，说明 NVLink 链路（可能涉及 NVSwitch 或 GPU 的 NVLink 接口）硬件失效，通常需要更换硬件。","s":""},{"id":"t2-xid48-ecc","d":"6","m":0,"t":"","c":"现场处置","q":"You see this in dmesg. What is the severity level and recommended first action?","zq":"你在 dmesg 中看到如下记录。它的严重级别与建议的首要动作是什么？","o":["Warning — restart the application and monitor","Critical — check ECC counters with nvidia-smi -q -d ECC and run dcgmi diag -r 3","Informational — no action needed, errors are auto-corrected","Warning — update NVIDIA drivers to latest version"],"zo":["警告级——重启应用并观察","严重级——用 nvidia-smi -q -d ECC 检查 ECC 计数，并运行 dcgmi diag -r 3","提示级——无需处理，错误会被自动纠正","警告级——把 NVIDIA 驱动升到最新版"],"a":1,"e":"XID 48 (Double-Bit ECC Error) is Critical severity. Double-bit errors are uncorrectable and indicate failing hardware. The first actions are to check ECC counters and run memory diagnostics. GPU replacement is required if errors persist.","ze":"XID 48（双比特 ECC 错误）属严重级别：双比特不可纠正，说明硬件正在失效。第一步是查 ECC 计数并跑显存诊断；若错误持续，需要更换 GPU。","s":"[  842.156789] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python3, Double Bit ECC Error"},{"id":"t2-xid79-fallen","d":"6","m":0,"t":"","c":"现场处置","q":"You see this error in the system log. What should you do first?","zq":"在系统日志中看到如下错误，首先应做什么？","o":["Run nvidia-smi --gpu-reset to recover the GPU","Restart the CUDA application with higher memory limits","Check system logs for thermal/power events, then plan a node reboot and hardware inspection","Update the NVIDIA driver and reboot"],"zo":["执行 nvidia-smi --gpu-reset 以恢复 GPU","以更大的显存上限重启 CUDA 应用","查看系统日志中的温度/供电事件，再计划重启节点并做硬件检查","升级 NVIDIA 驱动并重启"],"a":2,"e":"XID 79 (GPU Fallen Off Bus) means the GPU is completely unreachable on the PCIe bus. GPU reset will NOT work because the GPU is disconnected. You must check for thermal or power events that caused it, plan a node reboot, and perform hardware inspection of the PCIe slot and power delivery.","ze":"XID 79（GPU 掉总线）表示 GPU 在 PCIe 上完全不可达，GPU 重置无效。必须先查导致它的温度/供电事件，再计划重启节点并检查 PCIe 插槽与供电。","s":"[15234.891234] NVRM: Xid (PCI:0000:af:00): 79, pid=0, GPU has fallen off the bus.\n[15234.891456] NVRM: GPU 0000:af:00.0: GPU has fallen off the bus.\n[15234.891678] NVRM: A GPU crash dump has been created."},{"id":"t2-xid43-hang","d":"6","m":0,"t":"","c":"现场处置","q":"A user reports their training job is frozen. You find this in dmesg. What is the appropriate response?","zq":"用户反馈训练作业卡死，你在 dmesg 中看到如下记录。应如何处置？","o":["Ignore it — XID 43 is informational and resolves automatically","Check GPU temperature, verify cooling, and attempt nvidia-smi --gpu-reset","Reinstall NVIDIA drivers immediately","Check NVLink status with nvidia-smi nvlink -s"],"zo":["忽略——XID 43 只是提示信息，会自动恢复","检查 GPU 温度、确认散热，并尝试 nvidia-smi --gpu-reset","立即重装 NVIDIA 驱动","用 nvidia-smi nvlink -s 检查 NVLink 状态"],"a":1,"e":"XID 43 (GPU Stopped Responding) is a Critical error often caused by thermal issues, power problems, or hardware failure. The recommended first steps are to check GPU temperature, verify the cooling system, and attempt a GPU reset. If persistent, hardware replacement may be needed.","ze":"XID 43（GPU 停止响应）是严重错误，常由热问题、供电问题或硬件故障引起。建议先查 GPU 温度与散热，再尝试 GPU 重置；持续出现则可能需要更换硬件。","s":"[  567.234567] NVRM: Xid (PCI:0000:3b:00): 43, pid=8901, name=python3, Ch 00000010\n[  567.234789] NVRM: Xid (PCI:0000:3b:00): 43, pid=8901, name=python3, Ch 00000010"},{"id":"t2-xid92-sbe","d":"6","m":0,"t":"","c":"现场处置","q":"You see this in monitoring logs. What action should you take?","zq":"在监控日志中看到如下记录，应采取什么措施？","o":["No action needed — single-bit errors are always harmless","Immediately replace the GPU — this is an uncorrectable error","Monitor ECC counters with nvidia-smi -q -d ECC, track error rate, and schedule preventive maintenance","Reset ECC counters and ignore future occurrences"],"zo":["无需处理——单比特错误总是无害的","立即更换 GPU——这是不可纠正错误","用 nvidia-smi -q -d ECC 监控 ECC 计数、跟踪错误率，并安排预防性维护","清零 ECC 计数器并忽略后续告警"],"a":2,"e":"XID 92 (High Single-Bit ECC Rate) is a Warning severity. While single-bit errors are corrected, an elevated rate is an early indicator of memory degradation. The correct approach is to monitor ECC counters, track the error rate over time, and schedule preventive maintenance. Proactive GPU replacement should be considered if the rate increases.","ze":"XID 92（单比特 ECC 速率过高）属警告级：错误虽被纠正，但速率上升是显存劣化的早期信号。正确做法是监控 ECC 计数、跟踪错误率趋势并安排预防性维护；速率继续上升则考虑更换。","s":"[12045.678901] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[12048.123456] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[12051.987654] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate"},{"id":"t2-xid38-firmware","d":"6","m":0,"t":"","c":"现场处置","q":"After a driver update, you see this error. What is the most likely cause and fix?","zq":"更新驱动后出现如下错误，最可能的原因与修复方法是什么？","o":["The GPU hardware is defective and needs replacement","Incomplete driver installation — reinstall NVIDIA drivers completely","The PCIe link is degraded — reseat the GPU","NVLink firmware needs separate update"],"zo":["GPU 硬件已损坏，需要更换","驱动安装不完整——请完整重装 NVIDIA 驱动","PCIe 链路劣化——重新插拔 GPU","NVLink 固件需要单独升级"],"a":1,"e":"XID 38 (Driver Firmware Mismatch) occurs when loaded driver firmware does not match the expected version. After a driver update, this most likely indicates an incomplete installation. The fix is to completely reinstall NVIDIA drivers and verify firmware versions with nvidia-smi -q.","ze":"XID 38（驱动固件不匹配）表示加载的固件与期望版本不符，驱动更新后出现多半是安装不完整。修复方法是完整重装 NVIDIA 驱动，并用 nvidia-smi -q 核对固件版本。","s":"[    4.567890] NVRM: Xid (PCI:0000:3b:00): 38, pid=0, Driver Firmware Mismatch\n[    4.567901] NVRM: GPU 0000:3b:00.0: Failed to initialize firmware"},{"id":"t2-xid13-app","d":"6","m":0,"t":"","c":"现场处置","q":"A developer reports intermittent crashes in their CUDA application. You find this in dmesg. What should you advise?","zq":"开发人员反馈其 CUDA 应用间歇性崩溃，你在 dmesg 中看到如下记录。应给出什么建议？","o":["Replace the GPU immediately — this indicates hardware failure","Check application logs, verify CUDA toolkit version compatibility, and update NVIDIA drivers","Reseat the NVLink bridge connections","Check ECC counters for memory errors"],"zo":["立即更换 GPU——这说明硬件故障","检查应用日志、核对 CUDA 工具包版本兼容性，并更新 NVIDIA 驱动","重新插拔 NVLink 桥连接","检查 ECC 计数器是否有内存错误"],"a":1,"e":"XID 13 (Graphics Engine Exception) is typically an application-level issue caused by a misbehaving application, shader bug, or driver incompatibility. The recommended first steps are to check application logs, verify CUDA toolkit version compatibility, and update drivers. Only if persistent should you run dcgmi diag -r 3 to rule out hardware issues.","ze":"XID 13（图形引擎异常）通常是应用层问题：应用行为异常、shader bug 或驱动不兼容。第一步查应用日志、核对 CUDA 工具包版本并更新驱动；只有持续出现时才用 dcgmi diag -r 3 排除硬件。","s":"[  234.567890] NVRM: Xid (PCI:0000:3b:00): 13, pid=4567, name=train.py, Graphics Exception on Channel 0x0010"},{"id":"t2-xid54-watchdog","d":"6","m":0,"t":"","c":"现场处置","q":"You see this error and nvidia-smi hangs when you run it. What should you do?","zq":"看到如下错误，且运行 nvidia-smi 时卡死，该怎么办？","o":["Wait for the GPU to recover — watchdog timeouts are transient","Run nvidia-smi --gpu-reset (it will always work for XID 54)","Check GPU temperature, check system event log with ipmitool sel list, and plan a node reboot","Reinstall NVIDIA drivers and reboot"],"zo":["等 GPU 自行恢复——看门狗超时是暂时性的","执行 nvidia-smi --gpu-reset（对 XID 54 一定有效）","检查 GPU 温度、用 ipmitool sel list 查看系统事件日志，并计划重启节点","重装 NVIDIA 驱动并重启"],"a":2,"e":"XID 54 (Hardware Watchdog Timeout) is more severe than XID 43. The GPU is unresponsive to internal health checks, and nvidia-smi --gpu-reset may not work. The recommended actions are to check GPU temperature, review the system event log with ipmitool sel list, and plan a node reboot. If recurring, GPU replacement is required.","ze":"XID 54（硬件看门狗超时）比 XID 43 更严重：GPU 对内部健康检查无响应，nvidia-smi --gpu-reset 可能无效。应检查温度、用 ipmitool sel list 查看系统事件日志，并计划重启节点；反复出现需要更换 GPU。","s":"[  789.012345] NVRM: Xid (PCI:0000:3b:00): 54, pid=0, Hardware Watchdog Timeout\n[  789.012456] NVRM: Xid (PCI:0000:3b:00): 54, pid=0, Hardware Watchdog Timeout"},{"id":"t2-xid74-nvlink","d":"6","m":0,"t":"","c":"现场处置","q":"Multi-GPU training suddenly fails. You find this in dmesg. What is your first diagnostic step?","zq":"多卡训练突然失败，你在 dmesg 中看到如下记录。第一个诊断步骤是什么？","o":["Check ECC error counters on GPU memory","Check NVLink status with nvidia-smi nvlink -s and error counters with nvidia-smi nvlink -e","Reinstall the CUDA toolkit","Run nvidia-smi --gpu-reset on all GPUs"],"zo":["检查 GPU 显存的 ECC 错误计数器","用 nvidia-smi nvlink -s 查看 NVLink 状态、用 nvidia-smi nvlink -e 查看错误计数","重装 CUDA 工具包","对所有 GPU 执行 nvidia-smi --gpu-reset"],"a":1,"e":"XID 74 (NVLink Error) indicates a fault on the NVLink interconnect. The first diagnostic step is to check NVLink status and error counters with nvidia-smi nvlink -s and nvidia-smi nvlink -e. You should also verify GPU seating and NVLink bridge connections physically.","ze":"XID 74（NVLink 错误）表示 NVLink 互联上出现了故障。第一步用 nvidia-smi nvlink -s 看链路状态、nvidia-smi nvlink -e 看错误计数，同时检查 GPU 是否插好、NVLink 桥是否连接到位。","s":"[ 3456.789012] NVRM: Xid (PCI:0000:3b:00): 74, pid=5678, name=nccl, NVLink Error on GPU 0000:3b:00"},{"id":"t2-xid63-rowremap","d":"6","m":0,"t":"","c":"现场处置","q":"You find this error in the system log during a routine health check. What does this mean for the GPU?","zq":"例行健康检查时在系统日志中发现如下错误，这对该 GPU 意味着什么？","o":["The GPU memory is healthy — row remapping successfully fixed the error","The GPU memory has exhausted its error correction capacity — replacement required","A minor software issue — restart the GPU driver","NVLink fabric needs reconfiguration"],"zo":["GPU 显存健康——行重映射已成功修复该错误","GPU 显存的纠错能力已耗尽——需要更换","只是小软件问题——重启 GPU 驱动即可","NVLink fabric 需要重新配置"],"a":1,"e":"XID 63 (Row Remapping Failure) means the GPU failed to remap a memory row with errors, indicating that the GPU memory has exhausted its error correction capacity. Hardware failure is imminent and GPU replacement is required. Check status with nvidia-smi -q -d ROW_REMAPPER and document error counts for the RMA process.","ze":"XID 63（行重映射失败）表示 GPU 无法再重映射出错的内存行，纠错能力已耗尽，硬件失效在即。用 nvidia-smi -q -d ROW_REMAPPER 记录状态与错误计数，作为 RMA 依据。","s":"[ 9876.543210] NVRM: Xid (PCI:0000:86:00): 63, pid=0, Row Remapping Failure\n[ 9876.543321] NVRM: GPU 0000:86:00.0: Row remapper: new failure detected"},{"id":"t2-xid95-uncontained","d":"6","m":0,"t":"","c":"现场处置","q":"A large-scale training run is in progress when you see this. What is the immediate priority?","zq":"大规模训练正在进行时看到如下记录，当前的优先事项是什么？","o":["Continue the training run — the error was likely transient","Immediately check running workloads for data corruption and review checkpoint integrity","Reset ECC counters and continue monitoring","Schedule a preventive maintenance window for next week"],"zo":["继续训练——该错误大概是暂时性的","立即检查运行中的作业是否存在数据损坏，并核验检查点完整性","清零 ECC 计数器并继续观察","安排下周的预防性维护窗口"],"a":1,"e":"XID 95 (Uncontained ECC Error) is a Critical error where data integrity cannot be guaranteed. The immediate priority during a training run is to check for data corruption in running workloads and verify checkpoint integrity. Run dcgmi diag -r 3 and consider GPU replacement.","ze":"XID 95（未隔离 ECC 错误）是严重错误，数据完整性无法保证。训练进行中最紧急的是检查运行中作业是否出现数据损坏、核验检查点完整性，随后跑 dcgmi diag -r 3 并考虑更换 GPU。","s":"[24680.135790] NVRM: Xid (PCI:0000:3b:00): 95, pid=9876, name=python3, Uncontained ECC Error"},{"id":"t2-xid76-training","d":"6","m":0,"t":"","c":"现场处置","q":"After installing new GPUs, nvidia-smi topo -m shows missing NVLink connections and you see this error. What is the most likely fix?","zq":"安装新 GPU 后，nvidia-smi topo -m 显示 NVLink 连接缺失，并出现如下错误。最可能的修复方法是？","o":["Update the NVIDIA driver to a newer version","Run dcgmi diag -r 3 to fix the NVLink configuration","Check and reseat physical NVLink bridge/cable connections","Increase the GPU power limit to support NVLink"],"zo":["把 NVIDIA 驱动升级到更新版本","运行 dcgmi diag -r 3 以修复 NVLink 配置","检查并重新插紧物理 NVLink 桥/线缆连接","提高 GPU 功耗上限以支持 NVLink"],"a":2,"e":"XID 76 (NVLink Training Error) after new GPU installation most likely indicates a physical connection problem. The NVLink bridge or cable may not be properly seated. Reseating GPUs and NVLink bridges is the most likely fix. If persistent after reseating, the NVLink bridge or GPU may need replacement.","ze":"新装 GPU 后出现 XID 76（NVLink 训练错误），最可能是物理连接问题：NVLink 桥或线缆没有插好。重新插拔 GPU 与 NVLink 桥通常能解决；若重新插拔后仍报错，则桥或 GPU 可能需要更换。","s":"[   12.345678] NVRM: Xid (PCI:0000:3b:00): 76, pid=0, NVLink Training Error\n[   12.345789] NVRM: GPU 0000:3b:00.0: NVLink link 2 failed training"},{"id":"t2-xid64-threshold","d":"6","m":0,"t":"","c":"现场处置","q":"Your monitoring system flags this on a production GPU. What is the appropriate response?","zq":"监控系统在生产 GPU 上告警如下记录，应如何处置？","o":["No action needed — the GPU will continue to remap rows","Schedule proactive GPU replacement and increase monitoring frequency","Disable ECC to prevent further remapping","Run nvidia-smi --gpu-reset to clear the remapping table"],"zo":["无需处理——GPU 会继续重映射行","安排预防性更换 GPU，并提高监控频率","关闭 ECC 以阻止继续重映射","运行 nvidia-smi --gpu-reset 清空重映射表"],"a":1,"e":"XID 64 (Row Remapping Threshold Exceeded) means too many memory rows have been remapped. The GPU memory health is degraded. The appropriate response is to schedule a proactive GPU replacement and increase monitoring frequency with nvidia-smi -q -d ROW_REMAPPER.","ze":"XID 64（行重映射超阈值）表示被重映射的内存行过多，显存健康度已下降。应安排预防性更换，并提高 nvidia-smi -q -d ROW_REMAPPER 的监控频率。","s":"[ 8765.432100] NVRM: Xid (PCI:0000:3b:00): 64, pid=0, Row Remapping Threshold Exceeded"},{"id":"t3-ecc-cascade","d":"6","m":0,"t":"","c":"综合场景","q":"You see the following sequence of errors over a 2-hour period. Which error should you prioritize and why?","zq":"两小时内依次出现如下错误序列，应先处理哪一个、为什么？","o":["Prioritize XID 92 — it appeared first and is the root cause","Prioritize XID 48 — double-bit errors are always the most critical","Prioritize XID 95 — uncontained ECC means data corruption is possible, then address the full memory failure chain","All are equally important — address them in chronological order"],"zo":["优先处理 XID 92——它最先出现，是根因","优先处理 XID 48——双比特错误总是最严重","优先处理 XID 95——未隔离的 ECC 意味着可能已发生数据损坏，随后再处理整条内存失效链","重要性相同——按时间顺序处理即可"],"a":2,"e":"This shows a classic ECC degradation cascade: high single-bit rate (92) escalated to uncorrectable double-bit (48) and then to uncontained (95). XID 95 is the immediate priority because data corruption may have occurred — you must check workload integrity first. Then address the root cause: the GPU memory is failing and replacement is required. The XID 92 warnings were the early indicator.","ze":"这是典型的 ECC 劣化链：单比特速率过高（92）→ 不可纠正双比特（48）→ 未隔离（95）。应优先处理 XID 95，因为可能已发生数据损坏，必须先核查作业数据完整性；然后处理根因——显存正在失效，需要更换。XID 92 是这条链的早期预警。","s":"[10000.000000] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[10045.123456] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[10890.567890] NVRM: Xid (PCI:0000:3b:00): 48, pid=5678, name=python3, Double Bit ECC Error\n[11234.901234] NVRM: Xid (PCI:0000:3b:00): 95, pid=5678, name=python3, Uncontained ECC Error"},{"id":"t3-nvlink-multi","d":"6","m":0,"t":"","c":"综合场景","q":"A multi-GPU training job crashes. You find these errors in dmesg. What is the root cause and what should you check first?","zq":"多卡训练作业崩溃，dmesg 中出现如下错误。根因是什么、应先检查什么？","o":["Prioritize XID 77 — timeouts are the most severe NVLink error","Prioritize XID 76 — the training error is the root cause; check physical NVLink connections and run nvidia-smi topo -m","Prioritize XID 74 — it appears most frequently, indicating widespread NVLink failure","Ignore NVLink errors — they are transient and will resolve after restarting the job"],"zo":["优先看 XID 77——超时是最严重的 NVLink 错误","优先看 XID 76——链路训练失败是根因；检查物理 NVLink 连接并运行 nvidia-smi topo -m","优先看 XID 74——它出现次数最多，说明 NVLink 大面积失效","忽略 NVLink 错误——都是暂时性的，重启作业即可"],"a":1,"e":"XID 76 (NVLink Training Error) is the root cause — the NVLink link failed to train (establish connection), which then caused NVLink errors (74) and timeouts (77) on communication attempts. Check physical NVLink connections first with nvidia-smi topo -m to see which links are missing, then reseat NVLink bridges. The other errors are downstream consequences.","ze":"根因是 XID 76（NVLink 训练错误）：链路训练失败、未能建立连接，之后才出现 NVLink 错误（74）与超时（77）。应先查物理 NVLink 连接，用 nvidia-smi topo -m 看缺了哪些链路，再重新插拔 NVLink 桥；其他错误都是下游后果。","s":"[  500.111111] NVRM: Xid (PCI:0000:3b:00): 76, pid=0, NVLink Training Error\n[  500.222222] NVRM: Xid (PCI:0000:3b:00): 74, pid=3456, name=nccl, NVLink Error\n[  500.333333] NVRM: Xid (PCI:0000:86:00): 77, pid=3456, name=nccl, NVLink Timeout\n[  500.444444] NVRM: Xid (PCI:0000:86:00): 74, pid=3456, name=nccl, NVLink Error"},{"id":"t3-thermal-cascade","d":"6","m":0,"t":"","c":"综合场景","q":"Over a 10-minute period during a heatwave, you see the following errors on one GPU. What is the likely root cause and correct escalation path?","zq":"热浪期间，某块 GPU 在 10 分钟内出现如下错误。最可能的根因与正确的升级处置路径是什么？","o":["This is a driver bug — reinstall NVIDIA drivers","Thermal failure cascade: GPU overheated (43), watchdog tripped (54), then thermal shutdown caused PCIe disconnect (79). Check cooling system immediately.","PCIe link failure: the GPU fell off the bus (79) causing all other errors. Reseat the GPU.","Application bug caused the GPU hang (43) — fix the application code"],"zo":["这是驱动 bug——重装 NVIDIA 驱动","热失效链：GPU 过热（43）→ 看门狗触发（54）→ 热关机导致 PCIe 掉线（79）。应立即检查散热系统","PCIe 链路故障：GPU 掉线（79）导致其他错误。重新插拔 GPU 即可","应用 bug 导致 GPU 卡死（43）——修复应用代码"],"a":1,"e":"During a heatwave, this is a classic thermal failure cascade. XID 43 (GPU stopped responding) appeared first due to thermal throttling. When cooling was insufficient, the hardware watchdog triggered (XID 54). Finally, thermal shutdown caused the GPU to disconnect from the PCIe bus (XID 79). The root cause is thermal — check the cooling system, fan operation, and airflow immediately.","ze":"热浪期间这是典型的热失效链：过热先导致 GPU 停止响应（43），散热不足时硬件看门狗触发（54），最终热关机使 GPU 从 PCIe 总线断开（79）。根因是散热，应立即检查冷却系统、风扇运行与风道。","s":"[20000.000000] NVRM: Xid (PCI:0000:af:00): 43, pid=7890, name=python3, Ch 00000010\n[20015.123456] NVRM: Xid (PCI:0000:af:00): 43, pid=7890, name=
