<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#76B900" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NCP-AII 刷题" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>NCP-AII 刷题 · 模拟考（75 题 / 80 分钟 / 85% 及格）</title>
<style>
  :root {
    --green: #76B900;
    --green-d: #5c9100;
    --ink: #10151c;
    --muted: #6b7684;
    --line: #e3e8ef;
    --bg: #f6f8fb;
    --card: #ffffff;
    --en: #1f2937;
    --zh: #1f4e79;
    --ok: #1e7b34;
    --bad: #c0392b;
    --warn: #b45309;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    font-size: 15px; line-height: 1.6;
    padding: 0 0 40px;
  }
  #app { max-width: 880px; margin: 0 auto; padding: 18px 16px 0; }

  .hero { padding: 26px 0 10px; }
  .logo {
    display: inline-block; font-weight: 800; letter-spacing: 2px; font-size: 12px;
    color: #fff; background: var(--green); padding: 3px 10px; border-radius: 999px;
  }
  .hero h1 { font-size: 30px; margin: 12px 0 6px; letter-spacing: -.5px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }

  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0 18px; }
  @media (min-width: 720px) { .cards { grid-template-columns: repeat(3, 1fr); } }
  .card {
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 16px 14px; cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
    transition: .15s ease; font: inherit; color: inherit;
  }
  .card:hover { border-color: #cbd5e1; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(16,21,28,.06); }
  .card.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .card.primary .k, .card.primary em { color: #b9c4d2; }
  .card .k { font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .card strong { font-size: 18px; font-weight: 700; }
  .card em { font-style: normal; font-size: 12.5px; color: var(--muted); line-height: 1.45; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .row:last-child { border-bottom: 0; }
  .row span { flex: 1; }
  .row b { font-variant-numeric: tabular-nums; }
  .row i { font-style: normal; color: var(--muted); width: 48px; text-align: right; font-size: 12.5px; }
  .row em { font-style: normal; font-size: 12px; width: 52px; text-align: right; color: var(--muted); }
  .row em.pass, .row em.fail { font-weight: 700; }
  .last { margin: 0; font-size: 15px; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .foot { color: #93a0ae; font-size: 12px; margin-top: 14px; line-height: 1.5; }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 10px; }
  .bar .left { font-size: 13px; color: var(--muted); }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; color: var(--ink); }
  .timer.warn { color: var(--bad); }
  .timer.small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .timer.small.ok { color: var(--ok); }
  .timer.small.bad { color: var(--bad); }
  .progress { height: 4px; background: #e8edf4; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress span { display: block; height: 100%; background: var(--green); transition: width .2s; }

  .qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .stem { font-size: 16px; line-height: 1.55; color: var(--en); }
  .stem.zh { color: var(--zh); font-size: 14.5px; margin-top: 6px; }
  .snippet {
    font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12px; line-height: 1.5;
    background: #f1f4f8; border: 1px solid #e3e8ef; border-radius: 10px;
    padding: 10px 12px; margin: 12px 0 4px; overflow-x: auto; white-space: pre; color: #334155;
  }
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px; cursor: pointer; font: inherit; color: inherit; transition: .12s;
    flex-wrap: wrap;
  }
  .opt:hover { border-color: #b9c6d6; background: #fbfcfe; }
  .opt b {
    flex: 0 0 22px; height: 22px; line-height: 22px; text-align: center;
    background: #eef2f7; color: #475569; border-radius: 6px; font-size: 12px; font-weight: 700;
  }
  .opt span { flex: 1 1 320px; font-size: 14.5px; word-break: break-word;
    font-family: Consolas, "Cascadia Mono", Menlo, monospace; color: var(--en); }
  .opt em { flex: 1 1 100%; font-style: normal; font-size: 13px; color: var(--zh); padding-left: 32px; }
  .opt.sel { border-color: var(--green); background: #f3fbe9; }
  .opt.sel b { background: var(--green); color: #fff; }
  .opt.correct { border-color: var(--ok); background: #effaf1; }
  .opt.correct b { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: #fdf1f0; }
  .opt.wrong b { background: var(--bad); color: #fff; }
  .opt[disabled] { cursor: default; }

  .mtag { color: #fff; background: #7c3aed; border-radius: 5px; padding: 1px 6px; font-size: 10.5px; }
  .mhint {
    margin-top: 12px; padding: 8px 11px; border-radius: 10px; font-size: 12.5px;
    background: #f5f3ff; border: 1px solid #ddd6fe; color: #5b21b6;
  }
  .mhint b { color: #4c1d95; }

  .fb { margin: 12px 0 0; font-weight: 700; font-size: 14px; }
  .fb.ok { color: var(--ok); }
  .fb.bad { color: var(--bad); }
  .expl { background: #fbfcfe; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .expl .lbl { margin: 0 0 6px; font-size: 11px; letter-spacing: 1px; color: #94a3b8; text-transform: uppercase; }
  .expl .en { margin: 0 0 6px; font-size: 13px; color: #64748b; }
  .expl .zh { margin: 0; font-size: 14px; color: #1b355e; }
  .ans { margin: 6px 0; font-weight: 700; color: var(--ok); font-size: 14px; }

  .controls { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .btn {
    font: inherit; font-weight: 700; font-size: 14px; border-radius: 11px; padding: 11px 18px;
    cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #08110a; }
  .btn.primary:hover { background: var(--green-d); border-color: var(--green-d); color: #fff; }
  .btn.ghost:hover { border-color: #b9c6d6; }

  .grid-wrap { margin-top: 6px; }
  .grid-wrap summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 8px 0 4px; }
  .gbtn {
    font: inherit; font-size: 12px; padding: 7px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  .gbtn.done { background: #eef7e2; border-color: #cfe6ad; color: #3f5b12; font-weight: 700; }
  .gbtn.cur { outline: 2px solid var(--ink); outline-offset: 1px; }

  .result-head { text-align: center; padding: 18px 0 8px; }
  .verdict { font-size: 15px; font-weight: 800; letter-spacing: 2px; margin-bottom: 2px; }
  .verdict.pass, .pass { color: var(--ok); }
  .verdict.fail, .fail { color: var(--bad); }
  .score { font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .score small { font-size: 22px; color: var(--muted); font-weight: 700; }
  .rate { font-size: 15px; font-weight: 700; color: var(--green-d); margin: 6px 0 4px; }
  .wrow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
    margin-bottom: 6px; cursor: pointer; font: inherit;
  }
  .wrow:hover { border-color: #b9c6d6; }
  .wrow b { font-size: 12px; color: var(--muted); width: 34px; flex: 0 0 auto; }
  .wrow span { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow i { font-style: normal; font-size: 11.5px; color: #94a3b8; }

  .wcard { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 10px 0; }
  .wcard .stem { font-size: 15px; }
  .wcard details { margin-top: 10px; }
  .wcard summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .link { background: none; border: 0; color: var(--bad); font: inherit; font-size: 12.5px; padding: 8px 0 0; cursor: pointer; }

  .warnbar {
    max-width: 880px; margin: 12px auto 0; padding: 10px 14px;
    background: #fff4e5; border: 1px solid #f0c894; border-radius: 12px;
    color: #8a4b00; font-size: 13px;
  }

  /* 手机端 */
  .datarow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .datarow .btn { padding: 9px 14px; font-size: 13px; font-weight: 600; }
  .filebtn { display: none; }

  @media (max-width: 560px) {
    body { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
    #app { padding: 10px 12px 0; }
    .hero { padding: 16px 0 6px; }
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 13px; line-height: 1.5; }
    .cards { gap: 10px; margin: 14px 0; }
    .card { padding: 14px; }
    .card strong { font-size: 17px; }
    .bar .left { font-size: 12px; }
    .timer { font-size: 17px; }
    .qcard { padding: 13px; border-radius: 12px; }
    .stem { font-size: 15.5px; }
    .stem.zh { font-size: 14px; }
    .snippet { font-size: 11.5px; }
    .opt { padding: 12px 11px; gap: 8px; }
    .opt span { flex: 1 1 240px; font-size: 14px; }
    .opt em { flex-basis: 100%; padding-left: 30px; font-size: 12.5px; }
    .controls {
      position: sticky; bottom: 0; z-index: 6; margin: 12px 0 0;
      padding: 10px 0 calc(6px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, var(--bg) 72%, rgba(246, 248, 251, 0));
    }
    .btn { flex: 1 1 auto; text-align: center; padding: 13px 14px; font-size: 15px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
    .gbtn { padding: 8px 0; }
    .score { font-size: 54px; }
    .row { font-size: 13px; }
    .wrow span { white-space: normal; }
    .wrow { align-items: flex-start; }
    .datarow .btn { flex: 1 1 auto; text-align: center; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* NCP-AII 刷题 · 模拟考（单文件离线版）
   题库：DC Lab Sim 原站 208 题 + 15 道自编多选题
   考试：75 题 / 80 分钟，85% 及格；题干与选项每题打乱 */
(function () {
  'use strict';

  var DATA = [{"id":"tm-gpu-001","d":"1","m":0,"t":"nvidia-smi","c":"参数用法","q":"Which nvidia-smi flag enables persistence mode on GPU 0?","zq":"哪个 nvidia-smi 参数可以在 GPU 0 上启用持久化模式（persistence mode）？","o":["nvidia-smi --pm 1 -i 0","nvidia-smi --persist-mode -i 0","nvidia-smi -pm enable -i 0","nvidia-smi --daemon -i 0"],"zo":["nvidia-smi --pm 1 -i 0","nvidia-smi --persist-mode -i 0","nvidia-smi -pm enable -i 0","nvidia-smi --daemon -i 0"],"a":0,"e":"nvidia-smi uses --pm (or -pm) with a value of 0 or 1 to disable or enable persistence mode. Persistence mode keeps the NVIDIA driver loaded even when no GPU clients are connected, reducing latency for the first GPU call after idle periods.","ze":"--pm（或 -pm）取值为 0 或 1，用于关闭或开启持久化模式。该模式让驱动在无 GPU 客户端连接时也保持加载，从而降低空闲后首次调用的延迟。","s":""},{"id":"tm-gpu-002","d":"4","m":0,"t":"nvidia-smi","c":"输出判读","q":"What does this nvidia-smi output indicate about the GPU health?","zq":"这段 nvidia-smi 输出说明该 GPU 的健康状况如何？","o":["The GPU is healthy with only correctable errors","The GPU has uncorrectable SRAM errors that may indicate failing memory and should be investigated","ECC is disabled so errors are not being tracked","The GPU needs a driver update to clear pending ECC mode"],"zo":["GPU 健康，只有可纠正错误","GPU 出现了不可纠正的 SRAM 错误，可能说明内存在失效，需要进一步排查","ECC 已关闭，错误没有被记录","需要更新驱动以清除 pending 的 ECC 模式"],"a":1,"e":"SRAM Uncorrectable errors (3 in this case) are serious because they cannot be corrected by ECC. While DRAM correctable errors (15) are normal over time and handled automatically, uncorrectable SRAM errors can cause compute corruption and may indicate degrading GPU memory. This GPU should be monitored and potentially replaced.","ze":"SRAM 不可纠正错误（此处 3 个）无法由 ECC 纠正，可能导致计算结果损坏；DRAM 可纠正错误（15 个）随时间累积属正常且被自动处理。出现不可纠正的 SRAM 错误说明显存可能在劣化，应加强监控并考虑更换。","s":"$ nvidia-smi -q -d ECC\nGPU 0000:3B:00.0\n    ECC Mode\n        Current                           : Enabled\n        Pending                           : Enabled\n    ECC Errors\n        Volatile\n            SRAM Correctable              : 0\n            SRAM Uncorrectable            : 3\n            DRAM Correctable              : 15\n            DRAM Uncorrectable            : 0"},{"id":"tm-gpu-003","d":"4","m":0,"t":"nvidia-smi","c":"命令语法","q":"Which nvidia-smi command displays the GPU interconnect topology matrix showing NVLink and PCIe connections between GPUs?","zq":"哪条 nvidia-smi 命令可显示 GPU 互联拓扑矩阵（NVLink 与 PCIe 连接关系）？","o":["nvidia-smi nvlink --status","nvidia-smi topo -m","nvidia-smi -q -d TOPOLOGY","nvidia-smi --interconnect"],"zo":["nvidia-smi nvlink --status","nvidia-smi topo -m","nvidia-smi -q -d TOPOLOGY","nvidia-smi --interconnect"],"a":1,"e":"nvidia-smi topo -m (or --matrix) displays the topology matrix showing how GPUs are connected to each other via NVLink, PCIe, or through CPU sockets. The matrix uses abbreviations like NV18 (NVLink with 18 links), PHB (PCIe Host Bridge), SYS (cross-socket), and PIX (same PCIe switch).","ze":"topo -m（--matrix）显示 GPU 之间的连接关系，矩阵中用缩写表示：NV18 为 18 条 NVLink、PHB 为经 PCIe 主机桥、SYS 为跨 CPU 插槽、PIX 为同一 PCIe 交换机。","s":""},{"id":"tm-gpu-004","d":"1","m":0,"t":"nvidia-smi","c":"参数用法","q":"Which nvidia-smi command enables Multi-Instance GPU (MIG) mode on GPU 0?","zq":"哪条 nvidia-smi 命令可在 GPU 0 上启用 MIG（多实例 GPU）模式？","o":["nvidia-smi --mig 1 -i 0","nvidia-smi mig -cgi 0 -i 0","nvidia-smi -q -d MIG -i 0","nvidia-smi --mig-mode enable -i 0"],"zo":["nvidia-smi --mig 1 -i 0","nvidia-smi mig -cgi 0 -i 0","nvidia-smi -q -d MIG -i 0","nvidia-smi --mig-mode enable -i 0"],"a":0,"e":"nvidia-smi --mig 1 -i 0 (or -mig 1) enables MIG mode on GPU 0. After enabling MIG mode, a GPU reset is required for the change to take effect. MIG partitions an A100/H100/H200 GPU into up to seven isolated instances, each with dedicated compute, memory, and cache resources.","ze":"--mig 1（或 -mig 1）在 GPU 0 上开启 MIG 模式，开启后需重置 GPU 才生效。MIG 可把 A100/H100/H200 切成最多 7 个隔离实例，每个实例有独立的计算、显存与缓存资源。","s":""},{"id":"tm-gpu-005","d":"4","m":0,"t":"nvidia-smi","c":"最佳实践","q":"You need to continuously log GPU power draw, temperature, and utilization to a CSV file every 2 seconds. Which command is most appropriate?","zq":"需要每 2 秒把 GPU 功耗、温度与利用率持续写入 CSV 文件，哪条命令最合适？","o":["nvidia-smi -l 2 > gpu_log.csv","nvidia-smi dmon -s put -d 2 > gpu_log.csv","nvidia-smi --query-gpu=power.draw,temperature.gpu,utilization.gpu --format=csv -l 2 > gpu_log.csv","nvidia-smi -q -d POWER,TEMPERATURE -l 2 > gpu_log.csv"],"zo":["nvidia-smi -l 2 > gpu_log.csv","nvidia-smi dmon -s put -d 2 > gpu_log.csv","nvidia-smi --query-gpu=power.draw,temperature.gpu,utilization.gpu --format=csv -l 2 > gpu_log.csv","nvidia-smi -q -d POWER,TEMPERATURE -l 2 > gpu_log.csv"],"a":2,"e":"nvidia-smi --query-gpu with --format=csv produces clean, parseable CSV output. The -l 2 flag loops every 2 seconds. The dmon subcommand also works for monitoring but outputs a fixed-width table, not CSV. The -q flag produces verbose human-readable output that is harder to parse programmatically.","ze":"--query-gpu 配合 --format=csv 输出干净可解析的 CSV，-l 2 表示每 2 秒刷新一次；dmon 子命令也能监控，但输出是定宽表格；-q 是冗长的人类可读格式，程序解析困难。","s":""},{"id":"tm-gpu-006","d":"4","m":0,"t":"dcgmi","c":"参数用法","q":"What does the -r flag control in the dcgmi diag command?","zq":"dcgmi diag 中的 -r 参数控制什么？","o":["The report output format","The diagnostic run level (1=quick, 2=medium, 3=long)","Whether to reset GPU state before running diagnostics","The number of times to repeat each test"],"zo":["报告输出格式","诊断运行级别（1=快速，2=中等，3=长时间）","运行诊断前是否重置 GPU 状态","每项测试的重复次数"],"a":1,"e":"dcgmi diag -r specifies the diagnostic run level. Level 1 runs quick deployment tests (seconds). Level 2 adds medium-length stress tests (minutes). Level 3 runs comprehensive long-duration tests including extended memory and compute stress tests that can take 15+ minutes per GPU.","ze":"-r 指定诊断运行级别：1 级为秒级部署测试；2 级增加分钟级压力测试；3 级为长时间综合测试，包含扩展内存与计算压力，每卡可能超过 15 分钟。","s":""},{"id":"tm-gpu-007","d":"4","m":0,"t":"dcgmi","c":"概念理解","q":"In DCGM field groups, what does field ID 150 (DCGM_FI_PROF_SM_ACTIVE) measure?","zq":"在 DCGM 的字段组里，字段 ID 150（DCGM_FI_PROF_SM_ACTIVE）测量的是什么？","o":["The number of active CUDA streams on the GPU","The ratio of cycles where at least one warp is active on a Streaming Multiprocessor","The total count of Streaming Multiprocessors on the GPU","The GPU memory bandwidth utilization percentage"],"zo":["GPU 上活跃的 CUDA 流数量","流式多处理器上“至少有一个 warp 处于活跃”的周期占比","GPU 上流式多处理器的总数","GPU 显存带宽利用率百分比"],"a":1,"e":"DCGM field ID 150 (DCGM_FI_PROF_SM_ACTIVE) measures the ratio of cycles where at least one warp is active across all SMs. A value below 1.0 indicates that some SMs are idle, suggesting the workload may not be fully utilizing the GPU compute resources. This is a key metric for GPU profiling.","ze":"字段 150（DCGM_FI_PROF_SM_ACTIVE）度量“至少有一个 warp 处于活跃”的周期占比。数值低于 1.0 说明有 SM 处于空闲，负载可能没有充分利用 GPU 计算资源，是性能分析的关键指标。","s":""},{"id":"tm-gpu-008","d":"5","m":0,"t":"dcgmi","c":"输出判读","q":"What does this dcgmi dmon output indicate?","zq":"这段 dcgmi dmon 输出说明了什么？","o":["All GPUs are running a balanced workload","GPU 2 is thermal throttling and should be checked for cooling issues","GPU 2 has very low SM activity and FP32 activity despite high temperature, suggesting a stuck or failed job","The GPUs need a firmware update to fix temperature readings"],"zo":["所有 GPU 都在跑均衡的负载","GPU 2 因过热而降频，应检查散热","GPU 2 温度很高但 SM 活动与 FP32 活动极低，说明进程可能卡死或任务已失效","需要升级 GPU 固件以修正温度读数"],"a":2,"e":"GPU 2 shows a concerning pattern: high temperature (91C) but extremely low SM activity (0.12) and almost no FP32 activity (0.03). On a healthy GPU under load, high temperature would correlate with high activity. This combination suggests a process may be stuck (spinning without doing useful compute) or there is a hardware issue causing thermal dissipation problems. Field IDs: 203=GPU Temperature, 150=SM Active, 155=FP32 Engine Active.","ze":"GPU 2 呈现令人担心的组合：温度高（91℃）但 SM 活动极低（0.12）、FP32 活动几乎为零（0.03）。正常带载时高温应与高活动相关；这种组合说明进程可能卡死（空转而不做有效计算），或存在影响散热的硬件问题。字段含义：203 温度、150 SM 活跃、155 FP32 引擎活跃。","s":"$ dcgmi dmon -e 203,150,155 -d 1000\n#Entity   GPUTEMP   SMACT   FP32A\nGPU 0       82      0.95    0.87\nGPU 1       84      0.93    0.85\nGPU 2       91      0.12    0.03\nGPU 3       83      0.94    0.86"},{"id":"tm-gpu-009","d":"1","m":0,"t":"dcgmi","c":"命令语法","q":"Which dcgmi command lists all GPUs discovered in the system along with their PCI bus IDs and UUIDs?","zq":"哪条 dcgmi 命令列出系统内发现的所有 GPU 及其 PCI 总线号与 UUID？","o":["dcgmi stats -l","dcgmi discovery -l","dcgmi group --list","dcgmi health -c"],"zo":["dcgmi stats -l","dcgmi discovery -l","dcgmi group --list","dcgmi health -c"],"a":1,"e":"dcgmi discovery -l (or --list) enumerates all GPUs in the system and displays their entity IDs, PCI bus IDs, device names, and UUIDs. This is useful for identifying GPUs before creating groups or running diagnostics on specific devices.","ze":"discovery -l（--list）枚举系统中所有 GPU，显示 entity ID、PCI 总线号、设备名与 UUID。在创建组或对指定设备跑诊断之前，用它确认目标设备。","s":""},{"id":"tm-gpu-010","d":"4","m":0,"t":"nvtop","c":"概念理解","q":"What type of GPU monitoring does nvtop provide that nvidia-smi does not natively offer?","zq":"nvtop 提供了哪种 nvidia-smi 原生不具备的 GPU 监控能力？","o":["ECC error counting","A continuously updating interactive dashboard with per-process GPU utilization graphs","MIG partition management","Remote GPU management over IPMI"],"zo":["ECC 错误计数","持续刷新的交互式面板，可显示按进程划分的 GPU 利用率曲线","MIG 分区管理","通过 IPMI 远程管理 GPU"],"a":1,"e":"nvtop provides a htop-like interactive terminal UI with real-time bar charts for GPU utilization, memory, temperature, and per-process breakdowns. While nvidia-smi can loop with -l, it redraws the entire text output each time rather than providing a smooth interactive dashboard with process sorting and filtering.","ze":"nvtop 提供类似 htop 的交互式终端界面：GPU 利用率、显存、温度的实时柱状图，以及按进程的拆分。nvidia-smi -l 虽然能循环，但每次整屏重绘，没有平滑的交互面板和排序、过滤能力。","s":""},{"id":"tm-gpu-011","d":"5","m":0,"t":"nvtop","c":"故障排查","q":"You are using nvtop and notice one GPU shows 98% memory utilization but 0% compute utilization. What is the most likely explanation?","zq":"用 nvtop 观察到某块 GPU 显存利用率 98% 但计算利用率 0%，最可能的解释是？","o":["The GPU driver has crashed and needs to be reloaded","A process has allocated GPU memory but is not actively running kernels, possibly a memory leak or idle framework","nvtop is reporting incorrect data and you should use nvidia-smi instead","The GPU is in persistence mode which disables compute reporting"],"zo":["GPU 驱动已崩溃，需要重新加载","有进程申请了显存但并未真正跑 kernel，可能是内存泄漏或框架处于空闲","nvtop 上报的数据不准，应改用 nvidia-smi","GPU 处于持久化模式，导致计算利用率不上报"],"a":1,"e":"High memory utilization with zero compute utilization typically indicates a process that has allocated GPU memory buffers but is not actively launching CUDA kernels. This is common with deep learning frameworks (PyTorch, TensorFlow) that pre-allocate GPU memory at startup. It could also indicate a memory leak where a process has exited but not freed GPU memory, or an idle interactive session holding resources.","ze":"显存占用高而计算利用率为 0，通常说明进程分配了显存缓冲但没有真正启动 CUDA kernel——深度学习框架（PyTorch、TensorFlow）启动时预分配显存很常见；也可能是内存泄漏（进程已退出但显存未释放）或空闲的交互式会话占着资源。","s":""},{"id":"tm-gpu-012","d":"1","m":0,"t":"nvsm","c":"命令语法","q":"Which nvsm command displays the overall health status of a DGX system?","zq":"哪条 nvsm 命令显示 DGX 系统的整体健康状态？","o":["nvsm dump health","nvsm show health","nvsm status --all","nvsm diag --quick"],"zo":["nvsm dump health","nvsm show health","nvsm status --all","nvsm diag --quick"],"a":1,"e":"nvsm show health displays the system-wide health status of a DGX system, including GPU, NVLink, InfiniBand, storage, and other subsystem statuses. nvsm (NVIDIA System Management) is the fleet management CLI specific to DGX systems and requires root privileges.","ze":"nvsm show health 显示 DGX 系统的整体健康，覆盖 GPU、NVLink、InfiniBand、存储等子系统。nvsm 是 DGX 专用的机群管理 CLI，需要 root 权限。","s":""},{"id":"tm-gpu-013","d":"1","m":0,"t":"nvsm","c":"概念理解","q":"What distinguishes nvsm from nvidia-smi and dcgmi in a DGX BasePOD environment?","zq":"在 DGX BasePOD 环境中，nvsm 与 nvidia-smi、dcgmi 的区别是什么？","o":["nvsm can only monitor GPUs while nvidia-smi and dcgmi can monitor all components","nvsm provides fleet-level health management across multiple DGX nodes, while nvidia-smi and dcgmi are single-node tools","nvsm is a userspace tool while nvidia-smi and dcgmi require root privileges","nvsm replaces nvidia-smi and dcgmi entirely on DGX systems"],"zo":["nvsm 只能监控 GPU，另两者能监控所有部件","nvsm 提供跨多台 DGX 节点的机群级健康管理，另两者是单节点工具","nvsm 是用户态工具，另两者需要 root","在 DGX 系统上 nvsm 完全取代另两者"],"a":1,"e":"nvsm is designed for managing multiple DGX systems in a BasePOD or SuperPOD configuration. It aggregates health data across the entire DGX fleet and provides centralized management. nvidia-smi and dcgmi operate at the single-node level. nvsm also monitors non-GPU subsystems like storage, networking, and chassis components specific to DGX hardware.","ze":"nvsm 面向 BasePOD/SuperPOD 中多台 DGX 的机群级管理：从中心点汇总全机群健康数据并集中管理；nvidia-smi 与 dcgmi 是单节点工具；nvsm 还能监控存储、网络、机箱等 DGX 特有部件。","s":""},{"id":"tm-gpu-014","d":"4","m":0,"t":"nvidia-smi","c":"参数用法","q":"Which nvidia-smi flag allows you to target a specific GPU by its index when querying information?","zq":"哪个 nvidia-smi 参数可按索引指定要查询的某块 GPU？","o":["nvidia-smi --gpu 0","nvidia-smi -i 0","nvidia-smi --select 0","nvidia-smi -g 0"],"zo":["nvidia-smi --gpu 0","nvidia-smi -i 0","nvidia-smi --select 0","nvidia-smi -g 0"],"a":1,"e":"nvidia-smi -i (or --id) selects a specific GPU by its index, PCI bus ID, or UUID. For example, nvidia-smi -i 0 targets GPU 0, nvidia-smi -i 00000000:3B:00.0 targets by PCI bus address, and nvidia-smi -i GPU-xxxxxxxx targets by UUID. This flag can be combined with most other nvidia-smi commands and queries.","ze":"-i（--id）可按索引、PCI 总线地址或 UUID 选择 GPU：-i 0 选 0 号卡，-i 00000000:3B:00.0 按总线地址，-i GPU-xxxx 按 UUID。该参数可与大多数 nvidia-smi 命令和查询组合使用。","s":""},{"id":"tm-gpu-015","d":"5","m":0,"t":"nvidia-smi","c":"输出判读","q":"What does this nvidia-smi pmon output reveal about the running processes?","zq":"这段 nvidia-smi pmon 输出揭示了运行中进程的什么情况？","o":["All three processes are competing equally for GPU resources","PID 12345 is actively computing (95% SM, 78% mem) using 39 GB framebuffer; PID 12346 has allocated 2 GB but is idle (0% utilization); PID 12347 is a graphics process with minimal usage","The GPU is overloaded and processes should be migrated","PID 12346 is a zombie process that should be killed"],"zo":["三个进程在平等地争抢 GPU 资源","PID 12345 正在积极计算（SM 95%、显存 78%），占用 39 GB 帧缓存；PID 12346 占了 2 GB 但处于空闲（利用率 0%）；PID 12347 是图形进程，占用极小","GPU 已过载，进程应迁移到其他卡","PID 12346 是僵尸进程，应杀掉"],"a":1,"e":"nvidia-smi pmon (process monitor) shows per-process GPU utilization. PID 12345 is a compute (C) process actively using 95% of SM and 78% of memory bandwidth with 39 GB allocated. PID 12346 is also compute but shows 0% utilization despite holding 2 GB of framebuffer memory, suggesting it is between computation phases or idle. PID 12347 is a graphics (G) process (Xorg) with minimal overhead.","ze":"pmon 显示每个进程的 GPU 占用：PID 12345 是计算进程，SM 95%、显存带宽 78%、占用约 39 GB 帧缓存；PID 12346 也是计算类，但利用率为 0 却占着 2 GB，说明处在两段计算之间或已空闲；PID 12347 是图形进程（Xorg），开销极小。","s":"$ nvidia-smi pmon -i 0 -s um -c 1\n# gpu   pid  type    sm   mem   enc   dec    fb   command\n# Idx     #   C/G     %     %     %     %    MB   name\n    0  12345   C      95    78     0     0  39421  python\n    0  12346   C       0     0     0     0   2048  python\n    0  12347   G       3     5     0     0    512  Xorg"},{"id":"tm-gpu-016","d":"4","m":0,"t":"nvidia-smi","c":"命令语法","q":"Which nvidia-smi command checks the NVLink status for a specific GPU?","zq":"哪条 nvidia-smi 命令可检查指定 GPU 的 NVLink 状态？","o":["nvidia-smi topo -m","nvidia-smi nvlink --status -i 0","nvidia-smi -q -d NVLINK","nvidia-smi nvlink -l"],"zo":["nvidia-smi topo -m","nvidia-smi nvlink --status -i 0","nvidia-smi -q -d NVLINK","nvidia-smi nvlink -l"],"a":1,"e":"nvidia-smi nvlink --status -i 0 displays the NVLink link status for GPU 0, showing each NVLink lane, its connected peer GPU, and whether the link is active or inactive. This is distinct from topo -m which shows the topology matrix, and -q -d NVLINK which shows NVLink error counters rather than connection status.","ze":"nvlink --status -i 0 显示 0 号 GPU 的 NVLink 链路状态：每条 lane 的对端 GPU、链路是否激活。它既不同于 topo -m（拓扑矩阵），也不同于 -q -d NVLINK（那是 NVLink 错误计数）。","s":""},{"id":"tm-gpu-017","d":"5","m":0,"t":"dcgmi","c":"输出判读","q":"What does this dcgmi health output indicate?","zq":"这段 dcgmi health 输出说明了什么？","o":["All GPUs are operational and no action is needed","GPU 1 has minor thermal issues and GPU 3 has a critical PCIe problem; the overall group health is Red because any Red GPU makes the group Red","The group needs to be reconfigured because the health check is failing","Only GPU 3 needs attention; GPU 1's Yellow status is informational"],"zo":["所有 GPU 正常，无需处理","GPU 1 有轻微散热问题，GPU 3 存在严重的 PCIe 问题；因为只要有一块 GPU 为 Red，整组健康状态就是 Red","健康检查失败，说明组配置需要重建","只有 GPU 3 需要处理，GPU 1 的 Yellow 只是提示"],"a":1,"e":"DCGM health monitoring uses a traffic-light system: Green (healthy), Yellow (warning), Red (critical). GPU 1's Yellow for thermal violations means it is overheating but still functional. GPU 3's Red for PCIe replay count indicates the PCIe link is unstable and retransmitting packets, which degrades performance and may indicate a failing PCIe connection. The overall group health takes the worst status of any member.","ze":"DCGM 健康用红黄绿表示：Green 正常、Yellow 警告、Red 严重。GPU 1 的 Yellow 表示热违规——过热但仍可用；GPU 3 的 Red 表示 PCIe replay 计数超阈值，链路不稳定、在反复重传，会拖累性能，可能预示 PCIe 连接故障。整组健康取最差成员的状态。","s":"$ dcgmi health -c -g 1\nHealth Monitor Report for group 1\n+------------+--------+-------------------------------------------+\n| Entity     | Health | Detail                                    |\n+============+========+===========================================+\n| GPU 0      | Green  | Healthy                                   |\n| GPU 1      | Yellow | Thermal violations detected               |\n| GPU 2      | Green  | Healthy                                   |\n| GPU 3      | Red    | PCIe replay count exceeds threshold       |\n+============+========+===========================================+\n| Overall    | Red    |                                           |\n+------------+--------+-------------------------------------------+"},{"id":"tm-gpu-018","d":"4","m":0,"t":"dcgmi","c":"参数用法","q":"Which dcgmi command creates a named GPU group for targeted monitoring or diagnostics?","zq":"哪条 dcgmi 命令可创建一个命名的 GPU 组，以便只对部分 GPU 做监控或诊断？","o":["dcgmi group --create --name my_gpus --add 0,1","dcgmi group -c my_gpus -a 0,1","dcgmi group --new my_gpus --gpus 0,1","dcgmi create-group my_gpus 0,1"],"zo":["dcgmi group --create --name my_gpus --add 0,1","dcgmi group -c my_gpus -a 0,1","dcgmi group --new my_gpus --gpus 0,1","dcgmi create-group my_gpus 0,1"],"a":1,"e":"dcgmi group -c (--create) creates a new group with a name, and -a (--add) adds GPU entity IDs to it. Groups allow you to target specific subsets of GPUs for diagnostics (dcgmi diag -g <groupId>), monitoring (dcgmi dmon -g <groupId>), and health checks (dcgmi health -g <groupId>). This is useful when managing systems with 8 GPUs where you want to isolate tests to specific GPUs.","ze":"group -c（--create）创建命名组，-a（--add）把 GPU entity ID 加入。之后可用 dcgmi diag -g、dmon -g、health -g 只针对组内 GPU；在 8 卡系统上只想测部分卡时很方便。","s":""},{"id":"tm-gpu-019","d":"1","m":0,"t":"dcgmi","c":"故障排查","q":"A user reports that dcgmi commands return 'Unable to connect to host engine'. What is the most likely cause?","zq":"用户反馈 dcgmi 命令返回“Unable to connect to host engine”，最可能的原因是？","o":["The NVIDIA driver is not installed","The nv-hostengine daemon (DCGM host engine) is not running and needs to be started with nv-hostengine or systemctl start nvidia-dcgm","The user does not have GPU access permissions","DCGM is not compatible with the installed GPU model"],"zo":["NVIDIA 驱动未安装","nv-hostengine 守护进程（DCGM host engine）未运行，需要启动（nv-hostengine 或 systemctl start nvidia-dcgm）","该用户没有 GPU 访问权限","DCGM 与已安装的 GPU 型号不兼容"],"a":1,"e":"DCGM operates on a client-server architecture. The nv-hostengine daemon (or nvidia-dcgm systemd service) must be running for dcgmi commands to function. dcgmi is a CLI client that communicates with the host engine over a socket. If the host engine is not running, all dcgmi commands will fail with the connection error. Start it with 'nv-hostengine' (standalone) or 'systemctl start nvidia-dcgm' (systemd).","ze":"DCGM 采用客户端/服务端架构，必须有 nv-hostengine 守护进程（或 nvidia-dcgm 服务）在跑；dcgmi 只是通过 socket 与引擎通信的 CLI 客户端。引擎未运行，所有 dcgmi 命令都会报连接失败。启动方式：nv-hostengine 或 systemctl start nvidia-dcgm。","s":""},{"id":"tm-gpu-020","d":"4","m":0,"t":"nvtop","c":"参数用法","q":"While running nvtop, which keyboard key sorts the process list by GPU utilization?","zq":"运行 nvtop 时，按哪个键可按 GPU 利用率对进程排序？","o":["Press 'u' to sort by utilization","Press 'g' to sort by GPU percentage","Press F6 or use the sort menu to select the sort column","Press 's' to switch sort order"],"zo":["按 'u' 按利用率排序","按 'g' 按 GPU 百分比排序","按 F6 或通过排序菜单选择排序列","按 's' 切换排序方向"],"a":2,"e":"nvtop uses function keys and an interactive menu for sorting. F6 opens the sort column selector where you can choose to sort by GPU usage, memory usage, PID, or other fields. The interface is similar to htop, providing an interactive way to analyze which processes consume the most GPU resources.","ze":"nvtop 用功能键与交互菜单排序：按 F6 打开排序列选择器，可选 GPU 占用、显存占用、PID 等字段。界面类似 htop，便于找出最耗 GPU 的进程。","s":""},{"id":"tm-gpu-021","d":"5","m":0,"t":"nvtop","c":"输出判读","q":"In nvtop, you observe GPU 0 showing 100% utilization and 80 GB/80 GB memory with temperature at 83C, while GPU 1-7 show 0% utilization and 0 GB memory. What does this suggest about the workload?","zq":"在 nvtop 中看到 GPU 0 利用率 100%、显存 80 GB/80 GB、温度 83℃，而 GPU 1-7 利用率 0%、显存 0 GB。这说明作业存在什么问题？","o":["A single-GPU training job is running and not using distributed training across all 8 GPUs","GPUs 1-7 have hardware failures and are unavailable","The workload is using MIG mode on GPU 0 only","nvtop is only configured to show GPU 0"],"zo":["当前是单卡训练作业，没有做 8 卡的分布式训练","GPU 1-7 存在硬件故障，不可用","该作业只在 GPU 0 上使用了 MIG 模式","nvtop 只配置为显示 GPU 0"],"a":0,"e":"When only one GPU out of 8 shows utilization in a DGX system, it typically means the workload is not configured for multi-GPU or distributed training. Deep learning frameworks like PyTorch require explicit configuration (DataParallel, DistributedDataParallel, or FSDP) to use multiple GPUs. This is a common oversight that leaves 7 GPUs idle while one is fully loaded.","ze":"8 卡系统里只有 1 块卡有利用率，通常说明作业没有配置成多卡或分布式训练。PyTorch 等框架需要显式启用 DataParallel、DistributedDataParallel 或 FSDP 才会用多卡；这是常见疏漏——7 块卡闲置，1 块卡满载。","s":""},{"id":"tm-gpu-022","d":"4","m":0,"t":"nvtop","c":"最佳实践","q":"What is the primary advantage of using nvtop over nvidia-smi -l for real-time GPU monitoring during a training job?","zq":"训练作业期间做实时 GPU 监控，nvtop 相比 nvidia-smi -l 的主要优势是？","o":["nvtop can access more sensor data than nvidia-smi","nvtop provides a continuously updating dashboard with historical graphs, per-process breakdowns, and interactive sorting without screen flicker","nvtop works remotely while nvidia-smi does not","nvtop supports monitoring non-NVIDIA GPUs"],"zo":["nvtop 能读取比 nvidia-smi 更多的传感器数据","nvtop 提供持续刷新的面板，含历史曲线、按进程拆分与交互式排序，且无屏幕闪烁","nvtop 可远程使用，nvidia-smi 不能","nvtop 支持监控非 NVIDIA 的 GPU"],"a":1,"e":"nvtop provides a smooth interactive terminal UI similar to htop. It shows historical utilization graphs over time, per-process GPU and memory usage with interactive sorting, and updates in place without redrawing the entire screen. nvidia-smi -l redraws the full output each refresh, which is harder to read and does not show historical trends. nvtop is the preferred tool for live monitoring during training runs.","ze":"nvtop 提供类似 htop 的平滑交互界面：历史利用率曲线、按进程的 GPU 与显存占用、交互式排序，并原地刷新而不重绘整屏。nvidia-smi -l 每次刷新都重画全部输出，可读性差且看不到历史趋势，训练期间实时监控更推荐 nvtop。","s":""},{"id":"tm-gpu-023","d":"1","m":0,"t":"nvsm","c":"参数用法","q":"Which nvsm command displays active hardware alerts and warnings on a DGX system?","zq":"哪条 nvsm 命令显示 DGX 系统上活动的硬件告警与警告？","o":["nvsm show alerts","nvsm dump alerts","nvsm list warnings","nvsm status --alerts"],"zo":["nvsm show alerts","nvsm dump alerts","nvsm list warnings","nvsm status --alerts"],"a":0,"e":"nvsm show alerts displays current active alerts and warnings on a DGX system, including hardware failures, thermal events, and component degradation notices. This is a key command for proactive maintenance, allowing administrators to identify and address issues before they cause downtime. nvsm also supports 'show health' for overall health and 'dump' for detailed diagnostic data.","ze":"nvsm show alerts 显示当前活动的告警与警告，包括硬件故障、热事件与部件劣化提示，是主动维护的关键命令；配合 show health（总体健康）与 dump（详细诊断数据）一起用。","s":""},{"id":"tm-gpu-024","d":"5","m":0,"t":"nvsm","c":"故障排查","q":"nvsm show health reports a 'degraded' status for the NVSwitch subsystem on a DGX H100. What is the recommended next step?","zq":"nvsm show health 报告某台 DGX H100 的 NVSwitch 子系统处于 degraded 状态，推荐的下一步是？","o":["Immediately power off the system and replace all NVSwitches","Run nvidia-smi topo -m to verify the NVLink topology, then check nvsm show alerts for specific NVSwitch error details before planning maintenance","Ignore it since DGX systems have redundant NVSwitches","Reboot the system to clear the degraded status"],"zo":["立即关机并更换所有 NVSwitch","先用 nvidia-smi topo -m 确认 NVLink 拓扑，再用 nvsm show alerts 查看 NVSwitch 的具体错误详情，然后再安排维护","忽略它，因为 DGX 系统的 NVSwitch 是冗余的","重启系统以清除 degraded 状态"],"a":1,"e":"A degraded NVSwitch status does not necessarily mean total failure. First, verify which NVLink paths are affected using nvidia-smi topo -m and check nvsm show alerts for the specific error. DGX H100 systems have 4 NVSwitches; a single degraded switch reduces bisection bandwidth but the system may still operate. Gathering diagnostic details before scheduling maintenance avoids unnecessary downtime.","ze":"NVSwitch 处于 degraded 并不等于完全失效。先用 nvidia-smi topo -m 确认受影响的 NVLink 路径，再用 nvsm show alerts 查看具体错误，之后才安排维护。DGX H100 有 4 个 NVSwitch，单个降级会降低对分带宽，但系统仍可运行；先取证能避免不必要的停机。","s":""},{"id":"tm-gpu-025","d":"1","m":0,"t":"nvsm","c":"最佳实践","q":"In a DGX SuperPOD deployment with 20 DGX nodes, what is the most effective way to use nvsm for fleet monitoring?","zq":"在 20 节点的 DGX SuperPOD 部署中，用 nvsm 做机群监控最有效的做法是？","o":["SSH into each node individually and run nvsm show health","Use nvsm's centralized fleet management to aggregate health data across all nodes and set up automated alerts for degraded components","Rely solely on nvidia-smi on each node","Only check nvsm when a user reports a problem"],"zo":["逐台 SSH 登录，分别执行 nvsm show health","使用 nvsm 的集中式机群管理汇总所有节点的健康数据，并为劣化部件配置自动告警","只依赖每台节点上的 nvidia-smi","只有用户报障时才去查 nvsm"],"a":1,"e":"nvsm is specifically designed for fleet-level management in DGX BasePOD and SuperPOD deployments. It can aggregate health status across all DGX nodes from a central point, providing a single-pane-of-glass view of the entire cluster. Automated alerting ensures degraded components are caught early. This proactive approach prevents cascading failures and reduces unplanned downtime across the fleet.","ze":"nvsm 专为 BasePOD/SuperPOD 的机群级管理而设计，可从一个中心点汇总所有 DGX 节点的健康状态，形成单一面板视图。自动化告警能尽早发现劣化部件，避免连锁故障与非计划停机。","s":""},{"id":"tm-ib-001","d":"2","m":0,"t":"ibstat","c":"输出判读","q":"What does this ibstat output tell you about port 1?","zq":"这段 ibstat 输出说明端口 1 处于什么状态？","o":["The port is down and needs to be reset","The port is active, linked at NDR 400 Gb/s, and has been assigned LID 5 by the subnet manager","The port is in initialization state and waiting for the subnet manager","The port has a firmware error on the ConnectX-7 adapter"],"zo":["端口已 down，需要重置","端口处于 Active，已按 NDR 400 Gb/s 建链，并被子网管理器分配了 LID 5","端口处于初始化状态，正在等待子网管理器","ConnectX-7 网卡存在固件错误"],"a":1,"e":"State: Active means the port has completed link negotiation and is fully operational. Physical state: LinkUp confirms the physical cable connection is good. Rate 400 Gb/s (NDR) shows it is running at full NDR speed. Base lid: 5 indicates the subnet manager has assigned Local Identifier 5 to this port. MT4129 is the device ID for ConnectX-7 adapters.","ze":"State: Active 表示端口已完成链路协商、完全可用；Physical state: LinkUp 确认线缆物理连通；Rate 400 Gb/s (NDR) 说明跑在满速 NDR；Base lid: 5 说明子网管理器已分配 LID 5；MT4129 是 ConnectX-7 的设备 ID。","s":"CA 'mlx5_0'\n\tCA type: MT4129\n\tNumber of ports: 1\n\tFirmware version: 22.39.1002\n\tPort 1:\n\t\tState: Active\n\t\tPhysical state: LinkUp\n\t\tRate: 400 Gb/s (NDR)\n\t\tBase lid: 5\n\t\tLMC: 0\n\t\tSM lid: 1\n\t\tPort GUID: 0x0c42a10300f1a4e2\n\t\tLink layer: InfiniBand"},{"id":"tm-ib-002","d":"2","m":0,"t":"ibstat","c":"故障排查","q":"An ibstat output shows State: Down and Physical state: Polling. What should you check first?","zq":"ibstat 显示 State: Down、Physical state: Polling，应先检查什么？","o":["Update the HCA firmware to the latest version","Restart the opensm subnet manager daemon","Check the physical cable connection, as Polling means the port is trying to establish a link but cannot","Reboot the server to reinitialize the InfiniBand driver"],"zo":["把 HCA 固件升级到最新版本","重启 opensm 子网管理器守护进程","检查物理线缆连接——Polling 表示端口正在尝试建链但未能成功","重启服务器以重新初始化 InfiniBand 驱动"],"a":2,"e":"Physical state: Polling means the HCA port is actively trying to establish a physical link but has not succeeded. The most common cause is a disconnected, damaged, or improperly seated cable or transceiver. Check the physical cable connections first before investigating software issues like the subnet manager.","ze":"Physical state: Polling 表示 HCA 端口正在主动尝试建立物理链路但尚未成功，最常见原因是线缆未接、损坏或插不到位的线缆/光模块。应先查物理连接，再去怀疑子网管理器等软件问题。","s":""},{"id":"tm-ib-003","d":"2","m":0,"t":"ibstat","c":"输出判读","q":"An ibstat output shows State: Initializing and Physical state: LinkUp. What does this mean?","zq":"ibstat 显示 State: Initializing、Physical state: LinkUp，这意味着什么？","o":["The cable is bad and needs replacement","The physical link is up but the subnet manager has not yet configured the port with a LID","The HCA firmware is being updated","The port speed is being auto-negotiated"],"zo":["线缆已损坏，需要更换","物理链路已连通，但子网管理器尚未给该端口分配 LID、完成逻辑配置","HCA 固件正在升级中","端口速率正在自动协商"],"a":1,"e":"State: Initializing with Physical state: LinkUp means the physical cable connection is fine (LinkUp) but the port is waiting for the subnet manager (SM) to assign it a Local Identifier (LID) and complete logical configuration. Check if opensm is running and if the SM can reach this port through the fabric.","ze":"State: Initializing 加 Physical state: LinkUp 说明物理连接是好的，但端口还在等子网管理器（SM）分配 LID、完成逻辑配置。应检查 opensm 是否在运行、SM 能否通过 fabric 到达该端口。","s":""},{"id":"tm-ib-004","d":"2","m":0,"t":"ibstat","c":"参数用法","q":"Which ibstat flag produces a short one-line summary of each port instead of the full detailed output?","zq":"哪个 ibstat 参数会为每个端口输出一行简要摘要，而不是完整详情？","o":["ibstat -v","ibstat -s","ibstat -1","ibstat --brief"],"zo":["ibstat -v","ibstat -s","ibstat -1","ibstat --brief"],"a":1,"e":"ibstat -s (or --short) produces a condensed single-line-per-port summary showing just the CA name, port number, state, physical state, and rate. This is useful for quick checks across systems with multiple HCAs and ports.","ze":"ibstat -s（--short）为每个端口输出一行精简摘要，只含 CA 名、端口号、State、Physical state 与 Rate；在多 HCA、多端口的系统上做快速巡检很方便。","s":""},{"id":"tm-ib-005","d":"2","m":0,"t":"perfquery","c":"输出判读","q":"In perfquery output, which counter is most concerning and indicates a potential cable or signal integrity issue?","zq":"在 perfquery 输出中，哪个计数器最值得警惕，提示可能存在线缆或信号完整性问题？","o":["PortXmitDiscards at 0 means the port is not transmitting data","SymbolErrorCounter at 1542 indicates physical layer signal integrity problems likely caused by a bad cable or connector","LinkDownedCounter at 1 is normal and just shows the port was initialized","PortRcvRemotePhysicalErrors at 0 confirms there are no issues"],"zo":["PortXmitDiscards 为 0 说明端口没有发送数据","SymbolErrorCounter 高达 1542，说明物理层信号完整性有问题，常见原因是线缆或连接器不良","LinkDownedCounter 为 1 属正常，只说明端口被初始化过","PortRcvRemotePhysicalErrors 为 0 说明完全没问题"],"a":1,"e":"SymbolErrorCounter tracks 8b/10b or 64b/66b encoding errors at the physical layer. A count of 1542 is abnormally high and typically indicates cable degradation, a dirty connector, or a marginal transceiver. Combined with 287 PortRcvErrors and 3 LinkErrorRecoveryCounter events, this port has significant physical layer issues requiring cable inspection or replacement.","ze":"SymbolErrorCounter 统计物理层 8b/10b 或 64b/66b 编码错误，1542 属异常偏高，通常意味着线缆劣化、端面脏污或光模块处于临界状态。叠加 287 个 PortRcvErrors 和 3 次链路错误恢复，说明该端口物理层问题明显，需要检查或更换线缆。","s":"# Port counters: Lid 5 port 1 (CapMask: 0x5300)\nPortSelect:......................1\nSymbolErrorCounter:..............1542\nLinkErrorRecoveryCounter:........3\nLinkDownedCounter:...............1\nPortRcvErrors:...................287\nPortRcvRemotePhysicalErrors:.....0\nPortRcvSwitchRelayErrors:........0\nPortXmitDiscards:................0\nPortXmitConstraintErrors:........0\nPortRcvConstraintErrors:.........0"},{"id":"tm-ib-006","d":"2","m":0,"t":"perfquery","c":"参数用法","q":"What does the perfquery -x flag do?","zq":"perfquery 的 -x 参数有什么作用？","o":["Exports the counters in XML format","Shows extended 64-bit port counters instead of the default 32-bit counters","Performs an extended diagnostic test on the port","Resets all counters to zero after displaying them"],"zo":["以 XML 格式导出计数器","显示扩展的 64 位端口计数器，而非默认的 32 位计数器","对端口执行扩展诊断测试","显示后把所有计数器清零"],"a":1,"e":"perfquery -x queries the extended 64-bit port counters (PortCountersExtended). The default perfquery uses 32-bit counters which can wrap around on high-bandwidth links (especially NDR at 400 Gb/s). The -x flag is essential for accurate bandwidth measurement on modern high-speed InfiniBand fabrics.","ze":"-x 查询扩展的 64 位端口计数器（PortCountersExtended）。默认的 32 位计数器在 400 Gb/s 这类高带宽链路上很快就会回绕，所以现代高速 fabric 上测带宽必须用 -x。","s":""},{"id":"tm-ib-007","d":"2","m":0,"t":"perfquery","c":"最佳实践","q":"You want to measure actual data throughput on an InfiniBand port over a 10-second interval. What is the correct approach using perfquery?","zq":"想用 perfquery 测量某个 InfiniBand 端口在 10 秒间隔内的实际吞吐，正确做法是？","o":["Run perfquery -x once and divide the byte counters by uptime","Run perfquery -x, wait 10 seconds, run perfquery -x again, and calculate the difference in PortXmitData and PortRcvData","Run perfquery with the -d 10 flag to specify a 10-second duration","Use perfquery --bandwidth to directly display throughput in Gb/s"],"zo":["跑一次 perfquery -x，用字节计数除以开机时长","先跑 perfquery -x，等 10 秒再跑一次，用两次 PortXmitData 与 PortRcvData 的差值计算","用 -d 10 参数指定 10 秒测量时长","用 --bandwidth 直接显示 Gb/s 吞吐"],"a":1,"e":"perfquery displays cumulative counters since the last reset, not rates. To measure throughput over an interval, you must take two readings with -x (for 64-bit counters) and calculate the difference. PortXmitData and PortRcvData count data octets (divided by 4). There is no built-in rate or bandwidth flag in perfquery.","ze":"perfquery 输出的是自上次清零以来的累计值，不是速率。要测区间吞吐，必须取两次 -x 读数再求差；PortXmitData 与 PortRcvData 统计数据八位组（需除以 4）。perfquery 没有内置的速率或带宽选项。","s":""},{"id":"tm-ib-008","d":"2","m":0,"t":"ibdiagnet","c":"概念理解","q":"What is the primary purpose of running ibdiagnet on an InfiniBand fabric?","zq":"在 InfiniBand 网络上运行 ibdiagnet 的主要目的是什么？","o":["To configure switch routing tables","To perform a comprehensive fabric-wide diagnostic scan checking topology, routing, error counters, and link health","To update firmware on all InfiniBand switches","To benchmark RDMA throughput between nodes"],"zo":["配置交换机路由表","对整个 fabric 做一次全面诊断扫描：拓扑、路由、错误计数器与链路健康","升级所有 InfiniBand 交换机固件","测试节点间的 RDMA 吞吐"],"a":1,"e":"ibdiagnet performs a comprehensive scan of the entire InfiniBand fabric. It checks link health, error counters on all ports, routing consistency, topology validation, and can detect duplicate GUIDs or LIDs. It requires root privileges and is typically run as a pre-deployment validation step or when troubleshooting fabric-wide issues.","ze":"ibdiagnet 会对整个 InfiniBand fabric 做一次全面扫描：链路健康、各端口错误计数、路由一致性、拓扑校验，还能发现重复 GUID 或 LID。它需要 root 权限，通常用于部署前验证或全局排障。","s":""},{"id":"tm-ib-009","d":"2","m":0,"t":"ibdiagnet","c":"参数用法","q":"Which ibdiagnet output files are generated by default and where are they stored?","zq":"ibdiagnet 默认会生成哪些输出文件，存放在哪里？","o":["A single ibdiagnet.log in the current directory","Multiple files in /var/tmp/ibdiagnet2/ including ibdiagnet2.log, ibdiagnet2.db_csv, ibdiagnet2.net_dump, and others","A single JSON report in /var/log/ibdiagnet/","Reports are only displayed on stdout and not saved to files"],"zo":["当前目录下单个 ibdiagnet.log","/var/tmp/ibdiagnet2/ 下的多个文件，包括 ibdiagnet2.log、ibdiagnet2.db_csv、ibdiagnet2.net_dump 等","/var/log/ibdiagnet/ 下的单个 JSON 报告","只输出到标准输出，不落盘"],"a":1,"e":"ibdiagnet2 generates multiple output files in /var/tmp/ibdiagnet2/ by default. Key files include ibdiagnet2.log (main log), ibdiagnet2.db_csv (database of all nodes and ports), ibdiagnet2.net_dump (topology dump), and ibdiagnet2.pm (performance counter data). The output directory can be changed with the -o flag.","ze":"ibdiagnet2 默认在 /var/tmp/ibdiagnet2/ 下生成多个文件：ibdiagnet2.log（主日志）、ibdiagnet2.db_csv（所有节点与端口的数据库）、ibdiagnet2.net_dump（拓扑导出）、ibdiagnet2.pm（性能计数数据）。输出目录可用 -o 参数修改。","s":""},{"id":"tm-ib-010","d":"2","m":0,"t":"ibdiagnet","c":"故障排查","q":"ibdiagnet reports \"Duplicated Node GUIDs\" in the fabric. What does this error indicate?","zq":"ibdiagnet 报出“Duplicated Node GUIDs”，说明什么问题？","o":["Two switches have the same firmware version","Two nodes in the fabric have the same GUID, which is typically caused by cloning VMs with virtual HCAs or a manufacturing defect","The subnet manager has assigned duplicate LIDs","Two cables are connected between the same pair of switches"],"zo":["两台交换机固件版本相同","网络中有两个节点使用了相同的 GUID，常见于克隆带虚拟 HCA 的虚拟机，或生产制造缺陷","子网管理器分配了重复的 LID","同一对交换机之间接了两根线缆"],"a":1,"e":"Duplicated Node GUIDs means two separate nodes in the fabric share the same globally unique identifier. GUIDs should be unique per HCA. This can occur when virtual machines with virtual InfiniBand HCAs are cloned without regenerating GUIDs, or in rare cases from manufacturing defects. Duplicate GUIDs cause routing failures because the subnet manager cannot distinguish between the two nodes.","ze":"重复节点 GUID 表示网络中有两个节点共用一个全局唯一标识。GUID 本应每个 HCA 唯一，克隆带虚拟 HCA 的虚拟机而未重新生成、或极少数制造缺陷都会导致重复；子网管理器无法区分这两个节点，因而出现路由失败。","s":""},{"id":"tm-ib-011","d":"2","m":0,"t":"iblinkinfo","c":"命令语法","q":"Which iblinkinfo flag limits the output to show only InfiniBand switch connections?","zq":"哪个 iblinkinfo 参数可以把输出限制为只显示 InfiniBand 交换机之间的连接？","o":["iblinkinfo --switches-only","iblinkinfo -s","iblinkinfo --filter switch","iblinkinfo --type=switch"],"zo":["iblinkinfo --switches-only","iblinkinfo -s","iblinkinfo --filter switch","iblinkinfo --type=switch"],"a":0,"e":"iblinkinfo --switches-only filters the output to display only links between switches, omitting HCA (host) connections. This is useful for examining the switch-level fabric topology without the clutter of all host connections.","ze":"iblinkinfo --switches-only 只显示交换机之间的链路，忽略 HCA（主机）连接，便于专注查看交换机级拓扑，不被大量主机连接干扰。","s":""},{"id":"tm-ib-012","d":"2","m":0,"t":"iblinkinfo","c":"输出判读","q":"What does this iblinkinfo output tell you about the link?","zq":"这段 iblinkinfo 输出说明了这两条链路的什么情况？","o":["Both links are running at the same speed","The first link is at full NDR speed, but the second shows only 4X width without a speed label, indicating it may be running at a reduced rate","The 4X means four times the NDR bandwidth","Both links are connected to different switches"],"zo":["两条链路速率相同","第一条链路为满速 NDR；第二条只显示 4X 宽度、没有速率标识，说明可能以更低速率建链","4X 表示带宽是 NDR 的四倍","两条链路连接在不同的交换机上"],"a":1,"e":"In iblinkinfo output, the link description between ==( and )==> shows speed and width. The first link shows NDR (400 Gb/s). The second shows only \"4X\" (width) without a speed designation, which may indicate the link negotiated at a reduced rate or iblinkinfo could not read the full speed info. Both connect to the same switch (switch1) but on different ports. This warrants investigation.","ze":"iblinkinfo 输出中 ==( 与 )==> 之间是速率与宽度：第一条显示 NDR（400 Gb/s）；第二条只有“4X”（宽度）而没有速率标识，可能以更低速率协商，或工具读不到完整速率信息。两条都连在同一台 switch1 的不同端口上，值得进一步核查。","s":"0x0c42a10300f1a4e0 \"dgx-01 mlx5_0\" 1  ==( NDR  )==>  1 \"MF0;QM3400:switch1/U1\" ( )\n0x0c42a10300f1a4e2 \"dgx-01 mlx5_1\" 1  ==(  4X  )==>  2 \"MF0;QM3400:switch1/U1\" ( )"},{"id":"tm-ib-013","d":"2","m":0,"t":"iblinkinfo","c":"最佳实践","q":"After replacing a cable between two InfiniBand switches, what is the best way to verify the new link is operating correctly?","zq":"更换两台 InfiniBand 交换机之间的线缆后，验证新链路工作正常的最佳做法是？","o":["Run nvidia-smi to check GPU connectivity","Run iblinkinfo to confirm the link is at the expected speed and width, then run perfquery on both switch ports to verify zero error counters","Simply check if ibstat shows Active state on any host port","Reboot both switches and check syslog"],"zo":["运行 nvidia-smi 检查 GPU 连通性","先用 iblinkinfo 确认链路速率与宽度符合预期，再对两端交换机端口执行 perfquery 确认错误计数器为零","只要任一主机端口 ibstat 显示 Active 即可","重启两台交换机并查看 syslog"],"a":1,"e":"After cable replacement, iblinkinfo verifies the new link speed and width match expectations (e.g., NDR 4X). Then perfquery on both switch ports confirms the error counters are at zero after the cable swap. If SymbolErrorCounter or PortRcvErrors start accumulating on the new cable, it may also be faulty.","ze":"换线后先用 iblinkinfo 确认新链路速率与宽度符合预期（例如 NDR 4X），再对两端交换机端口执行 perfquery 确认错误计数为零。若新线缆上 SymbolErrorCounter 或 PortRcvErrors 开始增长，说明新线缆也可能有问题。","s":""},{"id":"tm-ib-014","d":"2","m":0,"t":"ibstat","c":"参数用法","q":"How do you use ibstat to display information for a specific HCA by name?","zq":"如何用 ibstat 只显示指定名称的 HCA 信息？","o":["ibstat --device mlx5_0","ibstat mlx5_0","ibstat -d mlx5_0","ibstat --hca mlx5_0"],"zo":["ibstat --device mlx5_0","ibstat mlx5_0","ibstat -d mlx5_0","ibstat --hca mlx5_0"],"a":1,"e":"ibstat accepts a CA (Channel Adapter) name as a positional argument. Running 'ibstat mlx5_0' displays information only for that specific HCA. On a DGX system with multiple HCAs (mlx5_0 through mlx5_7), this filters the output to a single adapter. Without a CA name, ibstat shows all HCAs.","ze":"ibstat 接受 CA（Channel Adapter）名作为位置参数，ibstat mlx5_0 就只显示该 HCA。在拥有 mlx5_0~mlx5_7 的 DGX 上，这能把输出过滤到单个适配器；不给名称则显示全部 HCA。","s":""},{"id":"tm-ib-015","d":"2","m":0,"t":"ibstat","c":"输出判读","q":"What does this ibstat output indicate about the port's link speed?","zq":"这段 ibstat 输出说明该端口的链路速率如何？","o":["The port is running at the maximum NDR speed for ConnectX-7","The port is running at HDR (200 Gb/s) despite the MT4129 (ConnectX-7) supporting NDR (400 Gb/s), which means the link has negotiated at a reduced speed","HDR 200 Gb/s is the maximum speed for this adapter","The port is inactive and waiting for speed negotiation"],"zo":["端口以 ConnectX-7 的最高 NDR 速率运行","端口以 HDR（200 Gb/s）运行，而 MT4129（ConnectX-7）支持 NDR（400 Gb/s），说明链路以更低速率协商成功","HDR 200 Gb/s 就是该网卡的最高速率","端口未激活，正在等待速率协商"],"a":1,"e":"MT4129 is the ConnectX-7 adapter which supports NDR (400 Gb/s). Showing HDR (200 Gb/s) means the link negotiated at half the maximum speed. This can be caused by a cable rated only for HDR, a remote port that only supports HDR, a partially damaged cable, or a switch port configured for HDR. The cable and remote port should be investigated.","ze":"MT4129 是支持 NDR（400 Gb/s）的 ConnectX-7，显示 HDR（200 Gb/s）说明链路只协商到最高速率的一半。常见原因：线缆只支持 HDR、对端端口只支持 HDR、线缆部分损坏、交换机端口被配置为 HDR，应据此检查线缆与对端端口。","s":"CA 'mlx5_0'\n\tCA type: MT4129\n\tNumber of ports: 1\n\tFirmware version: 22.39.1002\n\tPort 1:\n\t\tState: Active\n\t\tPhysical state: LinkUp\n\t\tRate: 200 Gb/s (HDR)\n\t\tBase lid: 12\n\t\tSM lid: 1"},{"id":"tm-ib-016","d":"2","m":0,"t":"ibstat","c":"概念理解","q":"What is the difference between the 'State' and 'Physical state' fields in ibstat output?","zq":"ibstat 输出中的 State 与 Physical state 有何区别？","o":["They show the same information in different formats","State shows the logical/protocol status (Active, Down, Initializing) while Physical state shows the physical layer link status (LinkUp, Polling, Disabled)","State is for InfiniBand mode and Physical state is for Ethernet mode","Physical state is updated in real-time while State is cached"],"zo":["两者是同一信息的不同呈现格式","State 表示逻辑/协议层状态（Active、Down、Initializing）；Physical state 表示物理层链路状态（LinkUp、Polling、Disabled）","State 用于 InfiniBand 模式，Physical state 用于以太网模式","Physical state 实时刷新，State 是缓存值"],"a":1,"e":"These are two separate layers of the InfiniBand port status. Physical state reflects the physical cable/transceiver link (LinkUp means cable connected and signal OK, Polling means trying to establish link). State reflects the logical protocol layer (Active means the subnet manager has configured the port, Initializing means waiting for SM configuration). A port can be Physical state: LinkUp but State: Initializing if the SM has not yet assigned a LID.","ze":"两个字段属于不同层：Physical state 反映物理链路（LinkUp 表示连通且信号正常，Polling 表示正在尝试建链）；State 反映逻辑/协议层（Active 表示 SM 已配置好该端口，Initializing 表示还在等 SM 配置）。所以会出现 LinkUp 但 Initializing 的组合。","s":""},{"id":"tm-ib-017","d":"2","m":0,"t":"perfquery","c":"输出判读","q":"What does this perfquery extended counters output tell you about the port's traffic?","zq":"这段 perfquery 扩展计数器输出说明该端口的流量特征是什么？","o":["The port is transmitting more data than receiving, indicating a possible routing loop","The port shows highly asymmetric traffic (transmitting ~2x more data than receiving), which is normal for a storage server or data source node, with minimal multicast traffic","The high multicast packet count indicates a broadcast storm","The counters are about to overflow and need to be reset"],"zo":["发送量大于接收量，说明可能存在路由环路","流量高度不对称（发送约为接收的两倍），这对存储服务器或数据源节点属正常；组播流量极少","组播包数量很高，说明存在广播风暴","计数器即将溢出，需要清零"],"a":1,"e":"The extended 64-bit counters show PortXmitData (~982B octets) is roughly double PortRcvData (~457B octets). This asymmetry is common for nodes that serve data (storage servers, data sources). The multicast counts (90/121) are very low relative to unicast, indicating normal point-to-point traffic. These 64-bit counters (-x flag) avoid the wrapping issues of default 32-bit counters on high-speed links.","ze":"扩展 64 位计数器显示 PortXmitData 约为 PortRcvData 的两倍——这种不对称对提供数据的节点（存储服务器、数据源）很常见。组播计数（90/121）相对单播极低，说明是正常的点对点流量。-x 的 64 位计数避免了 32 位计数器在高速链路上的回绕问题。","s":"$ perfquery -x 5 1\n# Port extended counters: Lid 5 port 1\nPortSelect:......................1\nPortXmitData:....................982451678234\nPortRcvData:.....................456789012345\nPortXmitPkts:....................1234567890\nPortRcvPkts:.....................987654321\nPortUnicastXmitPkts:.............1234567800\nPortUnicastRcvPkts:..............987654200\nPortMulticastXmitPkts:...........90\nPortMulticastRcvPkts:............121"},{"id":"tm-ib-018","d":"2","m":0,"t":"perfquery","c":"故障排查","q":"After clearing port counters, perfquery shows PortRcvErrors climbing rapidly on a specific switch port. All other ports on the same switch are clean. What is the most likely cause?","zq":"清零端口计数器后，某台交换机的某个端口 PortRcvErrors 快速攀升，而同交换机其他端口都很干净。最可能的原因是？","o":["The switch firmware is corrupted and needs to be reflashed","The cable connected to that specific port is damaged or the transceiver is failing, since the issue is isolated to one port","The host connected to that port has a driver bug","The subnet manager is misconfiguring that port's routing"],"zo":["交换机固件损坏，需要重刷","该端口所接线缆损坏或光模块正在失效——问题只局限在这一个端口","连接该端口的主机驱动有 bug","子网管理器配置错了该端口的路由"],"a":1,"e":"When PortRcvErrors accumulate rapidly on a single switch port while all other ports are clean, the problem is almost certainly the physical connection on that specific port. The cable or transceiver attached to that port is the most likely culprit. Swap the cable first, then the transceiver if available. If the errors follow the cable to a different port, the cable is confirmed bad. If errors remain on the same port after cable swap, the switch port itself may be faulty.","ze":"某个交换机端口的 PortRcvErrors 快速攀升，而同交换机其他端口干净，问题几乎可以肯定就在这个端口的物理连接上，最可能是线缆或光模块。先换线：若错误跟着线缆跑到别的端口，线缆确定损坏；换线后错误仍在原端口，则该交换机端口可能故障。","s":""},{"id":"tm-ib-019","d":"2","m":0,"t":"perfquery","c":"命令语法","q":"What do the two positional arguments in 'perfquery 5 1' specify?","zq":"“perfquery 5 1”中的两个位置参数分别指什么？","o":["GPU ID 5 and NVLink lane 1","LID (Local Identifier) 5 and port number 1 of the target device","Switch ID 5 and host ID 1","The first 5 ports starting from port 1"],"zo":["GPU 5 与 NVLink 通道 1","目标设备的 LID（本地标识符）5 与端口号 1","交换机 5 与主机 1","从端口 1 开始的前 5 个端口"],"a":1,"e":"perfquery takes a LID (Local Identifier) and port number as positional arguments. 'perfquery 5 1' queries the performance counters for LID 5, port 1. The LID is assigned by the subnet manager and can be found via ibstat (Base lid field) or via the subnet manager's LID table. Without arguments, perfquery queries the local HCA's first port.","ze":"perfquery 的位置参数是 LID 与端口号，perfquery 5 1 即查询 LID 5 的 1 号端口。LID 由子网管理器分配，可用 ibstat 的 Base lid 字段或 SM 的 LID 表查到；不带参数时查询本地 HCA 的第一个端口。","s":""},{"id":"tm-ib-020","d":"2","m":0,"t":"ibdiagnet","c":"参数用法","q":"Which ibdiagnet flag collects port counters from all ports in the fabric?","zq":"哪个 ibdiagnet 参数会采集 fabric 中所有端口的计数器？","o":["ibdiagnet --counters","ibdiagnet --pc","ibdiagnet -p","ibdiagnet --perf-all"],"zo":["ibdiagnet --counters","ibdiagnet --pc","ibdiagnet -p","ibdiagnet --perf-all"],"a":1,"e":"ibdiagnet --pc (port counters) collects performance and error counters from every port discovered in the fabric. The counter data is saved to the ibdiagnet2.pm file in the output directory (/var/tmp/ibdiagnet2/). This is invaluable for identifying ports with high error rates across the entire fabric in a single sweep.","ze":"ibdiagnet --pc（port counters）会采集 fabric 内每个已发现端口的性能与错误计数，结果写入输出目录下的 ibdiagnet2.pm。一次扫描就能定位全网的高错误率端口。","s":""},{"id":"tm-ib-021","d":"2","m":0,"t":"ibdiagnet","c":"输出判读","q":"ibdiagnet reports the following warning. What does it mean?","zq":"ibdiagnet 报出如下告警，含义是什么？","o":["The link is running at double speed because 2X means two times faster","The link negotiated at half the expected width (2X instead of 4X), reducing bandwidth from 400 Gb/s to 200 Gb/s, likely due to a damaged cable with broken lanes","This is an informational message and no action is needed","The switch port needs to be reconfigured for 4X width"],"zo":["2X 表示速率翻倍，链路跑得更快","链路以预期一半的宽度协商（2X 而非 4X），带宽从 400 Gb/s 降到 200 Gb/s，通常是线缆中部分通道损坏所致","只是提示信息，无需处理","需要把交换机端口重新配置为 4X 宽度"],"a":1,"e":"NDR at 4X width provides 400 Gb/s. At 2X width, bandwidth drops to 200 Gb/s. Width degradation from 4X to 2X typically means 2 of the 4 lanes in the cable or transceiver are non-functional. This is usually caused by a damaged cable (bent fibers), dirty connectors, or a partially failed transceiver. The cable should be inspected and replaced.","ze":"NDR 在 4X 宽度下提供 400 Gb/s，降到 2X 就是 200 Gb/s。宽度从 4X 降为 2X 通常意味着线缆或光模块里 4 条通道中有 2 条不工作，常见于线缆受损（光纤弯折）、端面脏污或光模块部分失效，应检查并更换线缆。","s":"-W- Link at the expected speed NDR but width is 2X instead of 4X\n    Source: \"dgx-05 HCA-1\"/1 (lid 42)\n    Destination: \"MF0;QM3400:leaf-sw3\"/15 (lid 3)"},{"id":"tm-ib-022","d":"2","m":0,"t":"ibdiagnet","c":"最佳实践","q":"When should ibdiagnet be run as part of a standard cluster deployment workflow?","zq":"在标准集群部署流程中，应该在什么时候运行 ibdiagnet？","o":["Only when users report network performance issues","After all InfiniBand cabling is complete and the subnet manager is running, as a pre-deployment fabric validation step before running workloads","Only during the initial cable installation, never after","Monthly during production, while jobs are running"],"zo":["只在用户报告网络性能问题时","所有 InfiniBand 布线完成、子网管理器已运行之后，作为跑负载前的部署前验证步骤","只在最初布线时跑一次，之后都不跑","生产环境中每月在作业运行时跑"],"a":1,"e":"ibdiagnet should be run as a standard pre-deployment validation step after the InfiniBand fabric is fully cabled and the subnet manager has configured all ports. It validates the entire fabric topology, checks for cabling errors, mismatched speeds, duplicate GUIDs, and port errors. Running it before deployment catches issues that would cause hard-to-diagnose performance problems later.","ze":"应在 InfiniBand 全部布线完成、子网管理器已配置好所有端口之后，作为部署前验证步骤运行 ibdiagnet：校验拓扑、发现布线错误、速率不匹配、重复 GUID 与端口错误。上线前做这一步，能避免日后难以定位的性能问题。","s":""},{"id":"tm-ib-023","d":"2","m":0,"t":"iblinkinfo","c":"命令语法","q":"Which iblinkinfo flag displays the output in a compact line-by-line format?","zq":"哪个 iblinkinfo 参数以紧凑的逐行格式输出？","o":["iblinkinfo --line","iblinkinfo --compact","iblinkinfo -1","iblinkinfo --brief"],"zo":["iblinkinfo --line","iblinkinfo --compact","iblinkinfo -1","iblinkinfo --brief"],"a":0,"e":"iblinkinfo --line produces a compact one-line-per-link format that is easier to parse and grep through than the default multi-line format. Each line shows the source and destination ports, their LIDs, and the link speed and width. This format is especially useful for scripting and when searching for specific links in a large fabric.","ze":"iblinkinfo --line 输出每条链路一行的紧凑格式，比默认多行格式更易解析和 grep。每行含源/目的端口、各自 LID 与链路速率宽度，适合脚本处理，也便于在大 fabric 中检索特定链路。","s":""},{"id":"tm-ib-024","d":"2","m":0,"t":"iblinkinfo","c":"故障排查","q":"iblinkinfo shows several links between two leaf switches at NDR 4X, but one link between them shows 'Down'. What is the impact and what should you investigate?","zq":"iblinkinfo 显示两台 leaf 交换机之间有多条 NDR 4X 链路，但其中一条显示 Down。影响是什么、应排查什么？","o":["The entire path between the switches is down and no traffic can flow","The down link reduces the aggregate bandwidth between those switches; check the cable, reseat connectors, and verify the switch port LEDs before replacing the cable","The switches will automatically reroute all traffic around the down link with no performance impact","The subnet manager will crash because of the inconsistent link state"],"zo":["两台交换机之间的整条路径都断了，流量无法通过","该条 Down 链路会降低这两台交换机之间的总带宽；先检查线缆、重新插紧连接器、确认端口指示灯，再决定是否换线","交换机会自动绕开该链路，性能不受影响","由于链路状态不一致，子网管理器会崩溃"],"a":1,"e":"InfiniBand fabrics often have multiple links (link aggregation/trunking) between switches for higher aggregate bandwidth. A single down link reduces total inter-switch bandwidth but does not cause complete connectivity loss. The physical layer should be investigated: check cable seating, look for bent fibers, check switch port LEDs, and try swapping the cable. The subnet manager will reroute traffic around the down link, but at reduced bandwidth.","ze":"InfiniBand 常在交换机之间做多链路聚合以提高总带宽，单条链路 down 只降低交换机间的聚合带宽，不会造成完全断连。应先查物理层：插紧连接器、检查光纤是否弯折、看端口指示灯，再尝试换线。SM 会绕开该链路，但带宽会下降。","s":""},{"id":"tm-ib-025","d":"2","m":0,"t":"iblinkinfo","c":"最佳实践","q":"What is the most efficient way to use iblinkinfo to check if all links in the fabric are running at the expected NDR 4X speed?","zq":"用 iblinkinfo 检查全网链路是否都跑在预期 NDR 4X 上，最高效的做法是？","o":["Manually inspect each line of the full iblinkinfo output","Run iblinkinfo and grep for lines that do NOT contain 'NDR' or show unexpected speeds to quickly identify degraded links","Run ibstat on each node individually","Only check switch-to-switch links since host links are always correct"],"zo":["人工逐行阅读完整的 iblinkinfo 输出","运行 iblinkinfo 后 grep 出不含 'NDR' 或速率异常的链路，快速定位降速链路","逐台节点运行 ibstat","只检查交换机间链路，主机侧链路总是正确的"],"a":1,"e":"Piping iblinkinfo output through grep to filter for links not at the expected speed is a quick way to identify any links running below NDR 4X. For example, searching for lines containing 'HDR' or 'Down' or missing 'NDR' highlights problem links. In a large fabric with hundreds of links, this approach finds issues in seconds rather than requiring manual inspection of every line.","ze":"把 iblinkinfo 输出管给 grep，筛出不含 NDR（或含 HDR、Down）的行，几秒钟就能定位降速链路。在数百条链路的大 fabric 里，这比逐行人工检查高效得多。","s":""},{"id":"tm-bmc-001","d":"1","m":0,"t":"ipmitool","c":"命令语法","q":"Which ipmitool command displays the System Event Log (SEL) with human-readable event descriptions?","zq":"哪条 ipmitool 命令能以“人类可读”的事件描述显示系统事件日志（SEL）？","o":["ipmitool sel list","ipmitool sel elist","ipmitool event list","ipmitool log show"],"zo":["以紧凑格式列出 SEL","以扩展格式列出 SEL，事件描述可读","列出 IPMI 事件","显示日志"],"a":1,"e":"ipmitool sel elist displays the System Event Log with extended human-readable descriptions of each event. The plain \"sel list\" shows a more compact format with hex event codes. The SEL contains hardware events like temperature thresholds, power supply failures, memory errors, and other critical platform events.","ze":"elist 会显示扩展的、人类可读的事件描述；不加 e 的 sel list 格式更紧凑，事件码为十六进制。SEL 记录的是温度越限、电源故障、内存错误等平台级事件。","s":""},{"id":"tm-bmc-002","d":"1","m":0,"t":"ipmitool","c":"输出判读","q":"What does this ipmitool sel elist output indicate?","zq":"这段 ipmitool sel elist 输出说明了什么？","o":["Normal memory operation with expected ECC corrections","A DIMM at sensor 0x48 is failing, showing escalating correctable ECC errors followed by an uncorrectable ECC error","The BMC firmware is generating false alarms and should be updated","The memory controller needs reconfiguration"],"zo":["内存工作正常，ECC 纠错属于预期行为","传感器 0x48 对应的 DIMM 正在失效：可纠正 ECC 错误密集出现，随后升级为不可纠正 ECC 错误","BMC 固件产生误报，应升级固件","内存控制器需要重新配置"],"a":1,"e":"Multiple correctable ECC events on the same sensor (0x48) in rapid succession followed by an uncorrectable ECC error is a classic pattern of a failing DIMM. Correctable errors are handled transparently, but when they increase rapidly, they often precede uncorrectable errors that cause data corruption or system crashes. The affected DIMM should be identified and replaced.","ze":"同一传感器（0x48）短时间内连续出现可纠正 ECC，随后升级为不可纠正 ECC，是 DIMM 失效的典型模式。可纠正错误虽被透明处理，但密集出现往往预示着会造成数据损坏或宕机的不可纠正错误，应定位并更换该 DIMM。","s":"$ ipmitool sel elist\n   1 | 02/10/2026 | 14:23:05 | Memory #0x48 | Correctable ECC | Asserted\n   2 | 02/10/2026 | 14:23:06 | Memory #0x48 | Correctable ECC | Asserted\n   3 | 02/10/2026 | 14:23:06 | Memory #0x48 | Correctable ECC | Asserted\n   4 | 02/10/2026 | 14:25:12 | Memory #0x48 | Uncorrectable ECC | Asserted\n   5 | 02/10/2026 | 14:25:12 | Critical Interrupt #0x72 | Bus Correctable Error | Asserted"},{"id":"tm-bmc-003","d":"1","m":0,"t":"ipmitool","c":"参数用法","q":"Which ipmitool command retrieves the Field Replaceable Unit (FRU) information including serial number and part number?","zq":"哪条 ipmitool 命令可读取 FRU（可现场更换单元）信息，包括序列号和部件号？","o":["ipmitool fru print 0","ipmitool chassis identify","ipmitool sdr list","ipmitool mc info"],"zo":["读取 0 号 FRU 区（主板）的库存信息","点亮机箱识别灯","列出传感器数据记录","显示 BMC 自身信息"],"a":0,"e":"ipmitool fru print 0 reads the FRU inventory area 0 (main board) and displays the board manufacturer, product name, serial number, part number, and asset tag. FRU data is stored in EEPROM on the baseboard and is essential for hardware inventory tracking and warranty claims.","ze":"fru print 0 读取 0 号 FRU 区（主板），输出厂商、产品名、序列号、部件号与资产标签。FRU 数据存在主板 EEPROM 中，是资产盘点与保修索赔的依据。","s":""},{"id":"tm-bmc-004","d":"1","m":0,"t":"ipmitool","c":"故障排查","q":"A remote DGX node is unresponsive to SSH. You have BMC network access. What is the correct ipmitool sequence to perform an out-of-band power cycle?","zq":"远程 DGX 节点 SSH 无响应，但你有 BMC 网络访问权限。执行带外电源循环的正确做法是？","o":["ipmitool -I lanplus -H <bmc-ip> -U admin -P <pass> chassis power cycle","ipmitool -I lanplus -H <bmc-ip> -U admin -P <pass> chassis power off && sleep 5 && ipmitool -I lanplus -H <bmc-ip> -U admin -P <pass> chassis power on","ipmitool -I lan -H <bmc-ip> chassis power reset","Both approaches work, but the single atomic command is preferable"],"zo":["用 lanplus 接口执行 chassis power cycle，一条原子命令完成断电再上电","先 chassis power off，等 5 秒再 chassis power on","用旧式 -I lan 接口执行 chassis power reset","两种做法都可行，但一次原子完成的命令更可取"],"a":3,"e":"Both \"chassis power cycle\" (atomic off+on) and separate \"power off\" then \"power on\" commands work. However, \"power cycle\" is preferred because it is a single atomic operation handled by the BMC. The -I lanplus flag uses IPMI v2.0 with encryption (RMCP+), which is more secure than -I lan. The power cycle command is the standard out-of-band recovery method when a server is unresponsive.","ze":"power cycle 与“先 off 再 on”都能实现，但 power cycle 由 BMC 一次原子完成，更可取；-I lanplus 走 IPMI v2.0 加密（RMCP+），比 -I lan 安全。服务器无响应时，带外 power cycle 就是标准恢复手段。","s":""},{"id":"tm-bmc-005","d":"1","m":0,"t":"ipmitool","c":"最佳实践","q":"Before performing maintenance on a DGX node, which ipmitool command should you run to capture a baseline of all sensor readings?","zq":"对 DGX 节点做维护之前，应先运行哪条命令采集全部传感器读数的基线？","o":["ipmitool sel elist","ipmitool sensor list","ipmitool sdr list","ipmitool chassis status"],"zo":["读取 SEL 事件日志","列出全部传感器读数与阈值","列出传感器数据仓库","查看机箱状态"],"a":1,"e":"ipmitool sensor list displays all hardware sensor readings including temperatures, voltages, fan speeds, and power consumption with their current values, thresholds, and status. Capturing this before maintenance provides a baseline to compare against post-maintenance readings to verify no new issues were introduced. \"sdr list\" shows the Sensor Data Repository which lists sensors but with less detail on thresholds.","ze":"sensor list 列出全部传感器读数（温度、电压、风扇、功耗）及其当前值、阈值与状态。维护前采集基线，维护后对比即可确认没有引入新问题；sdr list 也能列传感器，但对阈值的描述较少。","s":""},{"id":"tm-bmc-006","d":"1","m":0,"t":"sensors","c":"输出判读","q":"What does this lm-sensors output indicate?","zq":"这段 lm-sensors 输出说明了什么？","o":["All CPU cores are within safe operating temperatures","Core 3 is at its high threshold and in ALARM state, indicating it is approaching critical temperature","The sensor is reporting in Fahrenheit and temperatures are normal","The coretemp driver is malfunctioning"],"zo":["所有 CPU 核心温度都在安全范围内","Core 3 已达到 high 阈值并进入 ALARM 状态，正在逼近临界温度","传感器以华氏度上报，温度正常","coretemp 驱动工作异常"],"a":1,"e":"Core 3 at 99.0C is at the high threshold (100.0C) and the ALARM flag is shown. While not yet at the critical threshold (110.0C, where thermal shutdown occurs), this core is running dangerously hot. Possible causes include a failing fan, dried thermal paste, blocked airflow, or excessive workload on that core. The issue should be investigated before it reaches the critical threshold.","ze":"Core 3 为 99℃ 已达到 high 阈值（100℃）并显示 ALARM。虽然还没到临界 110℃（热关机点），但已属危险高温；可能是风扇故障、硅脂干化、风道堵塞或该核负载过高，应在触到临界值前排查。","s":"coretemp-isa-0000\nAdapter: ISA adapter\nCore 0:       +82.0°C  (high = +100.0°C, crit = +110.0°C)\nCore 1:       +79.0°C  (high = +100.0°C, crit = +110.0°C)\nCore 2:       +81.0°C  (high = +100.0°C, crit = +110.0°C)\nCore 3:       +99.0°C  (high = +100.0°C, crit = +110.0°C)  ALARM"},{"id":"tm-bmc-007","d":"1","m":0,"t":"sensors","c":"参数用法","q":"What must you run before the sensors command will produce output on a new Linux installation?","zq":"在新的 Linux 系统上，必须先执行什么，sensors 命令才会有输出？","o":["sensors --configure","sensors-detect to probe for and configure hardware monitoring chips","modprobe lm-sensors","systemctl start sensors"],"zo":["sensors --configure","先运行 sensors-detect，探测并配置硬件监控芯片","modprobe lm-sensors","systemctl start sensors"],"a":1,"e":"sensors-detect is an interactive script that probes for available hardware monitoring chips (Super I/O, SMBus, ACPI, ISA) and loads the appropriate kernel modules. Without running sensors-detect first, the sensors command may not find any monitoring chips and produce no output. On many server distributions, the required modules are auto-loaded, but sensors-detect ensures proper configuration.","ze":"sensors-detect 是交互脚本，会探测 Super I/O、SMBus、ACPI、ISA 上的监控芯片并加载相应内核模块。不先运行它，sensors 可能找不到任何监控芯片而无输出；部分服务器发行版会自动加载模块，但该脚本能确保配置正确。","s":""},{"id":"tm-bmc-008","d":"1","m":0,"t":"sensors","c":"故障排查","q":"The sensors command shows all fan speeds at 0 RPM but the system is running normally. What is the most likely explanation?","zq":"sensors 命令显示所有风扇转速为 0 RPM，但系统运行正常。最可能的解释是？","o":["All fans have failed and the system will overshoot shortly","The fan speed sensors may not be supported by the loaded monitoring driver, or the fans are controlled by the BMC and not visible through in-band sensor readings","The system uses passive cooling with no fans","The sensors configuration file is corrupted"],"zo":["风扇全部失效，系统很快就会过热","已加载的监控驱动不支持风扇转速传感器，或风扇由 BMC 控制、带内读数看不到","系统采用无风扇的被动散热","sensors 配置文件已损坏"],"a":1,"e":"On many server platforms, including DGX systems, fan control is managed by the BMC (Baseboard Management Controller) and fan speed readings are only available through IPMI (ipmitool sensor list), not through in-band lm-sensors. If the system is running normally with reasonable temperatures, this is likely a sensor visibility issue rather than actual fan failure.","ze":"很多服务器平台（包括 DGX）的风扇由 BMC 管理，转速只能通过 IPMI（ipmitool sensor list）读取，带内的 lm-sensors 看不到。若系统运行正常、温度合理，通常是传感器可见性问题，而不是风扇真故障。","s":""},{"id":"tm-bmc-009","d":"1","m":0,"t":"sensors","c":"概念理解","q":"What is the difference between the sensors command (lm-sensors) and ipmitool sensor readings?","zq":"sensors（lm-sensors）与 ipmitool 读取传感器有什么区别？","o":["They read the same sensors through the same interface","sensors uses in-band kernel drivers to read monitoring chips directly, while ipmitool reads sensors through the BMC over the IPMI interface","sensors can only read temperature, while ipmitool reads all sensor types","ipmitool is faster because it reads from the BMC cache"],"zo":["两者通过同一接口读取同一批传感器","sensors 通过带内内核驱动直接读取监控芯片；ipmitool 通过 IPMI 接口经 BMC 读取","sensors 只能读温度，ipmitool 能读所有类型","ipmitool 更快，因为它读的是 BMC 缓存"],"a":1,"e":"lm-sensors uses in-band Linux kernel drivers (like coretemp, nct6775) to directly access hardware monitoring chips on the motherboard. ipmitool communicates with the BMC (Baseboard Management Controller) over the KCS or BT interface to read sensor data managed by the BMC firmware. The BMC may expose different or additional sensors not available to in-band drivers, and vice versa.","ze":"lm-sensors 用带内内核驱动（coretemp、nct6775 等）直接访问主板上的监控芯片；ipmitool 则经 KCS 或 BT 接口与 BMC 通信，读取由 BMC 固件管理的传感器。两者可能暴露不同或额外的传感器。","s":""},{"id":"tm-bmc-010","d":"1","m":0,"t":"dmidecode","c":"命令语法","q":"Which dmidecode command shows the system memory configuration including DIMM sizes, speeds, and slot locations?","zq":"哪条 dmidecode 命令显示内存配置，包括 DIMM 容量、速率与槽位？","o":["dmidecode -t memory","dmidecode -t cpu","dmidecode --memory-info","dmidecode -s memory-size"],"zo":["dmidecode -t memory","dmidecode -t cpu","dmidecode --memory-info","dmidecode -s memory-size"],"a":0,"e":"dmidecode -t memory (or --type memory, or --type 17 for individual DIMM entries) displays Memory Device entries from SMBIOS. This shows each DIMM slot with its size, speed, type (DDR4/DDR5), manufacturer, serial number, and part number. This is essential for verifying memory configuration during system bring-up.","ze":"dmidecode -t memory（或 --type 17）读取 SMBIOS 的 Memory Device 条目，显示每个 DIMM 槽的容量、速率、类型、厂商、序列号与部件号，是上架时核对内存配置的主要手段。","s":""},{"id":"tm-bmc-011","d":"1","m":0,"t":"dmidecode","c":"输出判读","q":"What does this dmidecode output tell you about the memory configuration?","zq":"这段 dmidecode 输出说明内存配置出现了什么情况？","o":["The DIMM is running at its full rated speed","The DIMM is rated for 4800 MT/s but is configured to run at 4400 MT/s, possibly due to BIOS settings or mixed-speed DIMM population","The DIMM is faulty because the speeds do not match","The 4400 MT/s is the read speed and 4800 MT/s is the write speed"],"zo":["该 DIMM 正以标称满速运行","DIMM 标称 4800 MT/s，但被配置为 4400 MT/s 运行，可能是 BIOS 设置所致，或混插了不同速率的 DIMM","速率不一致说明 DIMM 已损坏","4400 MT/s 是读速率，4800 MT/s 是写速率"],"a":1,"e":"The \"Speed\" field shows the DIMM's maximum rated speed (4800 MT/s) while \"Configured Memory Speed\" shows the actual operating speed (4400 MT/s). This mismatch commonly occurs when DIMMs of different speed ratings are mixed in the same system, causing all DIMMs to run at the lowest common speed, or when BIOS settings are not optimized.","ze":"Speed 是 DIMM 标称的最高速率（4800 MT/s），Configured Memory Speed 是实际运行速率（4400 MT/s）。混插不同速率的 DIMM 会让全部按最低速率运行，BIOS 设置未优化也会造成这种差异。","s":"Memory Device\n\tSize: 64 GB\n\tForm Factor: DIMM\n\tLocator: DIMM_A0\n\tType: DDR5\n\tSpeed: 4800 MT/s\n\tConfigured Memory Speed: 4400 MT/s\n\tManufacturer: Samsung\n\tPart Number: M321R8GA0BB0-CQKZJ"},{"id":"tm-bmc-012","d":"1","m":0,"t":"dmidecode","c":"参数用法","q":"Which dmidecode command extracts just the BIOS version string without showing all other SMBIOS data?","zq":"哪条
