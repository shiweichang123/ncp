python3, Ch 00000010\n[20120.234567] NVRM: Xid (PCI:0000:af:00): 54, pid=0, Hardware Watchdog Timeout\n[20300.345678] NVRM: Xid (PCI:0000:af:00): 79, pid=0, GPU has fallen off the bus."},{"id":"t3-memory-nvlink","d":"6","m":0,"t":"","c":"综合场景","q":"During a distributed training run across 8 GPUs, you see these errors on GPU 3. Which errors indicate the most urgent hardware issue?","zq":"8 卡分布式训练中，GPU 3 上出现如下错误。哪些错误表明最紧急的硬件问题？","o":["XID 78 — NVLink ECC errors affect all 8 GPUs in the distributed run","XID 48 — double-bit ECC errors are always the highest priority","XID 63 — row remapping failure means GPU memory error correction is exhausted; combined with XID 48 and 78, GPU 3 needs immediate replacement","All are equally critical — replace all NVLink bridges first"],"zo":["XID 78——NVLink ECC 错误会影响本次分布式训练的全部 8 块卡","XID 48——双比特 ECC 错误永远是最高优先级","XID 63——行重映射失败说明显存纠错能力已耗尽；叠加 XID 48 与 78，GPU 3 需立即更换","三者同等紧急——先更换所有 NVLink 桥"],"a":2,"e":"XID 63 (Row Remapping Failure) is the most urgent indicator because it means GPU 3's memory has exhausted its error correction capacity. The double-bit ECC errors (48) confirm active memory failure, and the NVLink ECC error (78) suggests the memory corruption is affecting data transfers between GPUs. GPU 3 needs immediate replacement. The other GPUs are likely fine.","ze":"XID 63（行重映射失败）最紧急：3 号卡的显存已耗尽纠错能力；叠加 XID 48（双比特 ECC）说明显存正在失效，NVLink ECC 错误（78）表明存储损坏已影响 GPU 间数据传输。3 号卡需立即更换，其他卡多半正常。","s":"[ 5000.111111] NVRM: Xid (PCI:0000:86:00): 48, pid=2345, name=python3, Double Bit ECC Error\n[ 5000.222222] NVRM: Xid (PCI:0000:86:00): 78, pid=2345, name=nccl, NVLink ECC Error\n[ 5001.333333] NVRM: Xid (PCI:0000:86:00): 63, pid=0, Row Remapping Failure\n[ 5001.444444] NVRM: Xid (PCI:0000:86:00): 48, pid=2345, name=python3, Double Bit ECC Error"},{"id":"t3-mixed-severity","d":"6","m":0,"t":"","c":"综合场景","q":"After a driver update, multiple users report GPU issues. You see these errors across different GPUs. What is the most likely common cause?","zq":"更新驱动后，多位用户反馈 GPU 异常，多块不同 GPU 上出现如下错误。最可能的共同原因是什么？","o":["Multiple GPUs are failing simultaneously — hardware issue in the node","XID 38 on multiple GPUs indicates the driver update was incomplete; reinstall NVIDIA drivers completely to resolve all errors","XID 43 is the primary concern — focus on the GPU that stopped responding","XID 13 is an application bug unrelated to the other errors"],"zo":["多块 GPU 同时失效——节点级硬件问题","多块 GPU 上出现 XID 38，说明这次驱动更新不完整；完整重装 NVIDIA 驱动即可解决全部错误","XID 43 才是主要问题——应聚焦那块停止响应的 GPU","XID 13 是应用 bug，与其他错误无关"],"a":1,"e":"XID 38 (Driver Firmware Mismatch) appearing on multiple GPUs after a driver update is the key clue — the driver installation was incomplete. The subsequent XID 13 (Graphics Exception) and XID 43 (GPU Stopped Responding) are downstream effects of the firmware mismatch. Completely reinstalling NVIDIA drivers should resolve all errors since the root cause is the incomplete driver update, not hardware failure.","ze":"驱动更新后多块 GPU 同时出现 XID 38（驱动固件不匹配），这是关键线索——驱动安装不完整。随后的 XID 13（图形异常）与 XID 43（GPU 停止响应）是固件错配的下游后果。根因是驱动更新不完整而非硬件失效，完整重装 NVIDIA 驱动即可解决。","s":"[  100.111111] NVRM: Xid (PCI:0000:3b:00): 38, pid=0, Driver Firmware Mismatch\n[  100.222222] NVRM: Xid (PCI:0000:86:00): 38, pid=0, Driver Firmware Mismatch\n[  200.333333] NVRM: Xid (PCI:0000:3b:00): 13, pid=1234, name=python3, Graphics Exception\n[  200.444444] NVRM: Xid (PCI:0000:86:00): 43, pid=5678, name=train.py, GPU Stopped Responding"},{"id":"t3-production-triage","d":"6","m":0,"t":"","c":"综合场景","q":"A production inference server shows degrading performance. Monitoring reveals these errors over the past 24 hours. How should you prioritize your response?","zq":"生产推理服务器性能持续下降，近 24 小时监控出现如下错误。应如何安排处置优先级？","o":["Focus on XID 27 — memory interface errors are the most recent and urgent","Focus on XID 48 — double-bit ECC errors are always top priority","This is a progressive memory failure: row remapping exhausted (64), then uncorrectable errors (48), now memory interface failure (27). Migrate workloads off this GPU and schedule immediate replacement.","Reset ECC counters and monitor for another 24 hours before taking action"],"zo":["聚焦 XID 27——内存接口错误最新、最紧急","聚焦 XID 48——双比特 ECC 永远最高优先级","这是一条递进式显存失效链：行重映射先耗尽（64），随后出现不可纠正错误（48），现在内存接口失效（27）。应立即把业务迁出该 GPU 并安排更换","清零 ECC 计数器，再观察 24 小时才行动"],"a":2,"e":"This shows progressive GPU memory failure over 24 hours. XID 64 (row remapping threshold exceeded) was the first warning that memory health was degraded. XID 48 (double-bit ECC errors) confirmed uncorrectable failures began. XID 27 (memory interface error) indicates the memory subsystem is now critically failing. The correct response is to immediately migrate workloads and replace the GPU — waiting will risk data corruption and unplanned downtime.","ze":"这是 24 小时内的递进式显存失效：XID 64（行重映射超阈值）是首个预警；XID 48（双比特 ECC）确认出现不可纠正错误；XID 27（内存接口错误）说明内存子系统已严重故障。正确做法是立即把业务迁出该 GPU 并安排更换——继续等待会带来数据损坏与非计划停机风险。","s":"[  --- 6 hours ago ---]\n[43200.111111] NVRM: Xid (PCI:0000:3b:00): 64, pid=0, Row Remapping Threshold Exceeded\n[  --- 2 hours ago ---]\n[57600.222222] NVRM: Xid (PCI:0000:3b:00): 48, pid=4321, name=inference, Double Bit ECC Error\n[57601.333333] NVRM: Xid (PCI:0000:3b:00): 48, pid=4321, name=inference, Double Bit ECC Error\n[  --- 30 minutes ago ---]\n[63000.444444] NVRM: Xid (PCI:0000:3b:00): 27, pid=4321, name=inference, GPU Memory Interface Error"},{"id":"ms-ecc-01","d":"1","m":1,"t":"nvidia-smi","c":"参数用法","q":"Which commands or flags show ECC error counters directly? (select all that apply)","zq":"下列哪些命令或参数可以直接查看 ECC 错误计数？（多选）","o":["nvidia-smi -q -d ECC","nvidia-smi -q (its output includes an ECC Errors section)","nvidia-smi --ecc-errors","nvidia-smi -q -d PAGE_RETIREMENT"],"zo":["只查询 ECC 段","全量查询，输出里含 ECC Errors 段","nvidia-smi --ecc-errors","查询页退役信息"],"ans":[0,1],"e":"-q -d ECC prints only the ECC section; a full -q query also contains an ECC Errors section. --ecc-errors is not an nvidia-smi flag, and -q -d PAGE_RETIREMENT reports retired pages rather than ECC counts.","ze":"-q -d ECC 只打印 ECC 段；完整 -q 查询的正文里同样包含 ECC Errors 段。--ecc-errors 并不是 nvidia-smi 的参数；-q -d PAGE_RETIREMENT 给出的是退役页信息，不是 ECC 计数。","s":""},{"id":"ms-xid-01","d":"6","m":1,"t":"dmesg","c":"错误码识别","q":"Which XID codes point directly to GPU memory (ECC / row remap) degradation? (select all that apply)","zq":"下列哪些 XID 码直接指向 GPU 显存（ECC / 行重映射）劣化？（多选）","o":["XID 48","XID 63","XID 64","XID 76"],"zo":["双比特 ECC 错误（不可纠正）","行重映射失败，纠错能力耗尽","行重映射超过阈值","NVLink 链路训练失败"],"ans":[0,1,2],"e":"XID 48 (double-bit ECC), 63 (row remapping failure) and 64 (row remapping threshold exceeded) all describe memory degradation. XID 76 is an NVLink training error, i.e. an interconnect problem.","ze":"XID 48（双比特 ECC）、63（行重映射失败）、64（行重映射超阈值）都属于显存劣化；XID 76 是 NVLink 链路训练失败，属互联问题。","s":""},{"id":"ms-diag-01","d":"4","m":1,"t":"dcgmi diag","c":"最佳实践","q":"Which subsystems does dcgmi diag -r 3 exercise? (select all that apply)","zq":"dcgmi diag -r 3 会覆盖下列哪些子系统？（多选）","o":["Memory (bandwidth and stress)","PCIe","NVLink","Fan PWM control loop"],"zo":["显存（带宽与压力）","PCIe 链路","NVLink","风扇 PWM 控制回路"],"ans":[0,1,2],"e":"Level 3 runs the full suite: deployment checks, PCIe, memory bandwidth, SM compute, NVLink bandwidth and power stress. Fan control is handled by the BMC and is not a DCGM diagnostic target.","ze":"3 级跑的是完整套件：部署检查、PCIe、显存带宽、SM 计算、NVLink 带宽与功耗压力。风扇控制由 BMC 负责，不属于 DCGM 诊断目标。","s":""},{"id":"ms-ib-01","d":"2","m":1,"t":"ibstat","c":"故障排查","q":"Which tools report InfiniBand link rate/width or port error counters? (select all that apply)","zq":"下列哪些工具能给出 InfiniBand 链路速率/宽度或端口错误计数？（多选）","o":["ibstat","iblinkinfo","perfquery","dmidecode"],"zo":["查看本机 HCA 端口状态与速率","查看 fabric 拓扑中各链路速率与宽度","查询端口计数器","读取 SMBIOS 硬件清单"],"ans":[0,1,2],"e":"ibstat shows the local HCA port state and rate, iblinkinfo prints the fabric topology with per-link speed and width, and perfquery reads port counters. dmidecode reads SMBIOS tables and has nothing to do with InfiniBand.","ze":"ibstat 看本机 HCA 端口状态与速率，iblinkinfo 打印 fabric 拓扑里每条链路的速率与宽度，perfquery 读端口计数器；dmidecode 读的是 SMBIOS 硬件清单，与 InfiniBand 无关。","s":""},{"id":"ms-cont-01","d":"3","m":1,"t":"enroot","c":"命令语法","q":"Which three enroot steps take a registry image to a running container? (select all that apply)","zq":"从仓库镜像到运行容器，enroot 需要哪三个步骤？（多选）","o":["enroot import","enroot create","enroot start","enroot pull"],"zo":["下载镜像并转成 .sqsh","把 .sqsh 解包成沙箱目录","在沙箱里启动进程","拉取镜像"],"ans":[0,1,2],"e":"enroot import downloads a registry image into a squashfs file, enroot create unpacks it into a rootfs sandbox, and enroot start launches a process inside it. There is no 'enroot pull' subcommand.","ze":"enroot import 把仓库镜像下载成 squashfs 文件，enroot create 解包成 rootfs 沙箱，enroot start 在沙箱里启动进程。没有 enroot pull 这个子命令。","s":""},{"id":"ms-clus-01","d":"3","m":1,"t":"sinfo","c":"输出判读","q":"Which Slurm node states mean the node will not receive new jobs? (select all that apply)","zq":"Slurm 中哪些节点状态意味着不会再被调度新作业？（多选）","o":["drain","down","mixed","idle"],"zo":["已标记维护，跑完现有作业后不再接新作业","不可用（故障或管理员操作）","部分资源已分配，仍有资源可调度","空闲，完全可调度"],"ans":[0,1],"e":"drain and down both take the node out of scheduling; running jobs on a drained node are allowed to finish. mixed and idle nodes are still schedulable.","ze":"drain 与 down 都会把节点排除在调度之外（drain 节点上运行中的作业允许跑完）；mixed 与 idle 仍然可以被调度。","s":""},{"id":"ms-rack-01","d":"1","m":1,"t":"现场施工","c":"最佳实践","q":"Before racking an AI server, which power/cooling items must be verified? (select all that apply)","zq":"AI 服务器上架之前，供电与散热方面必须确认哪些项？（多选）","o":["A/B dual-feed power and per-rack redundancy","rPDU three-phase load balance","Rack grounding","Switch VLAN assignment"],"zo":["A/B 双路供电与每柜冗余","rPDU 三相负载均衡","机柜接地","交换机 VLAN 划分"],"ans":[0,1,2],"e":"Power redundancy (A/B feeds), rPDU phase balance and grounding are all physical prerequisites. VLAN assignment belongs to network configuration and is not part of rack power readiness.","ze":"A/B 双路供电冗余、rPDU 三相均衡与接地都是物理层前置条件；VLAN 划分属于网络配置，不属于机架上电前的准备项。","s":""},{"id":"ms-perf-01","d":"4","m":1,"t":"nccl-tests","c":"最佳实践","q":"Which methods verify that inter-GPU connectivity inside an 8-GPU node is healthy? (select all that apply)","zq":"验证 8 卡节点内部 GPU 互联是否正常，可用哪些手段？（多选）","o":["nvidia-smi topo -m","nvidia-smi nvlink -s","nccl-tests all_reduce_perf","nvidia-smi -q -d ECC"],"zo":["查看 GPU 间拓扑（NVLink / PCIe 连接关系）","查看每条 NVLink 的链路速率","跑集合通信基准验证带宽","查询 ECC 计数"],"ans":[0,1,2],"e":"topo -m shows how the GPUs are wired, nvlink -s shows per-link NVLink rates, and nccl-tests proves the collective path end to end. ECC counters say nothing about interconnect health.","ze":"topo -m 看 GPU 之间怎么连、nvlink -s 看每条 NVLink 的速率、nccl-tests 端到端验证集合通信通路；ECC 计数与互联健康无关。","s":""},{"id":"ms-dcgm-01","d":"4","m":1,"t":"dcgmi","c":"概念理解","q":"Which statements about dcgmi are correct? (select all that apply)","zq":"关于 dcgmi 的下列说法，哪些是正确的？（多选）","o":["It is a client that needs the nv-hostengine daemon running","A single GPU can be targeted with -i","A pre-defined DCGM group can be targeted with -g","It works without the NVIDIA driver installed"],"zo":["它是客户端，需要 nv-hostengine 守护进程在运行","可用 -i 指定单块 GPU","可用 -g 指定预设的 DCGM 组","不装 NVIDIA 驱动也能工作"],"ans":[0,1,2],"e":"dcgmi talks to the DCGM host engine over a socket, so nv-hostengine (or nvidia-dcgm) must run. -i selects one GPU by entity id and -g selects a group. Without the driver the engine cannot even enumerate GPUs.","ze":"dcgmi 通过 socket 与 DCGM host engine 通信，必须有 nv-hostengine（或 nvidia-dcgm）在跑；-i 按实体 ID 选单卡，-g 选组。没有驱动时引擎连 GPU 都枚举不出来。","s":""},{"id":"ms-k8s-01","d":"3","m":1,"t":"k8s","c":"概念理解","q":"What is required for a Pod to use a GPU in Kubernetes? (select all that apply)","zq":"在 Kubernetes 里让 Pod 使用 GPU，通常需要哪些组件？（多选）","o":["NVIDIA GPU driver on the node","NVIDIA Container Toolkit","NVIDIA device plugin or GPU Operator","MIG mode disabled on every GPU"],"zo":["节点上的 NVIDIA GPU 驱动","NVIDIA Container Toolkit","NVIDIA device plugin 或 GPU Operator","所有 GPU 必须关闭 MIG"],"ans":[0,1,2],"e":"The driver, the container toolkit and a device plugin (or the GPU Operator that deploys it) are the three pieces. MIG can stay enabled — the plugin advertises MIG devices as resources.","ze":"驱动、容器工具链、device plugin（或由 GPU Operator 部署）这三样是必需的。MIG 不必关闭——device plugin 会把 MIG 实例当作资源上报。","s":""},{"id":"ms-xid-02","d":"6","m":1,"t":"ipmitool","c":"现场处置","q":"A node reports XID 79 (GPU has fallen off the bus). Which actions are appropriate? (select all that apply)","zq":"某节点报 XID 79（GPU 已从 PCIe 总线掉线），下列哪些处置是恰当的？（多选）","o":["Capture nvidia-bug-report.sh before anything destructive","Check temperature/power events and the BMC SEL","Run nvidia-smi --gpu-reset to bring it back","Plan a node reboot and a physical PCIe/power inspection"],"zo":["先采集 nvidia-bug-report.sh 再动任何破坏性操作","查看温度/供电事件与 BMC 的 SEL","执行 nvidia-smi --gpu-reset 尝试恢复","计划重启节点并检查 PCIe 与供电"],"ans":[0,1,3],"e":"XID 79 means the GPU is no longer reachable on the bus, so a GPU reset cannot work. Preserve evidence (bug report), look for thermal or power events in the SEL, then reboot and inspect the slot, riser and power cabling.","ze":"XID 79 表示 GPU 在总线上已不可达，GPU 重置不可能生效。应先保留证据（bug report），到 SEL 里找温度或供电事件，然后重启并检查插槽、转接卡与供电线缆。","s":""},{"id":"ms-bug-01","d":"5","m":1,"t":"nvidia-bug-report","c":"最佳实践","q":"Which items does nvidia-bug-report.sh normally include? (select all that apply)","zq":"nvidia-bug-report.sh 生成的报告通常包含哪些内容？（多选）","o":["Kernel log (dmesg) including XID errors","PCIe topology","ECC counters","GPU purchase price"],"zo":["含 XID 错误的内核日志","PCIe 拓扑","ECC 计数器","GPU 采购价格"],"ans":[0,1,2],"e":"The bundle contains kernel logs with XID history, PCI device topology, ECC and page-retirement counters, driver and firmware versions, and system configuration. Commercial data such as price is obviously not included.","ze":"报告包内含带 XID 历史的内核日志、PCI 设备拓扑、ECC 与页退役计数、驱动与固件版本、系统配置；价格这类商业信息自然不会包含。","s":""},{"id":"ms-bmc-01","d":"1","m":1,"t":"ipmitool","c":"命令语法","q":"Which items belong to BMC bring-up on a new node? (select all that apply)","zq":"新节点上架时，下列哪些属于 BMC 侧的初始化内容？（多选）","o":["Management port IP configuration","NTP and time sync","TPM state verification","GPU serial number database"],"zo":["管理口 IP 配置","NTP 与时间同步","TPM 状态确认","GPU 序列号数据库"],"ans":[0,1,2],"e":"BMC bring-up covers IP/netmask/gateway, NTP, accounts, SEL policy and TPM state. A GPU serial number database is an asset-management task performed from the OS, not a BMC setting.","ze":"BMC 初始化包含 IP/掩码/网关、NTP、账号、SEL 策略与 TPM 状态；GPU 序列号数据库是在操作系统里做的资产管理工作，不是 BMC 设置。","s":""},{"id":"ms-roce-01","d":"2","m":1,"t":"ethtool","c":"输出判读","q":"In a RoCE fabric, which counters deserve attention? (select all that apply)","zq":"RoCE 网络中，下列哪些计数器值得重点关注？（多选）","o":["PFC pause frames","RX/TX discards and errors","Symbol errors on the link","Chassis fan RPM"],"zo":["PFC pause 帧","收发丢弃与错误计数","链路符号错误","机箱风扇转速"],"ans":[0,1,2],"e":"Pause frames show congestion/flow-control pressure, discards and errors show drops, and symbol errors show physical-layer degradation. Fan RPM is a chassis sensor unrelated to RoCE behaviour.","ze":"Pause 帧反映拥塞与流控压力，收发丢弃与错误反映丢包，符号错误反映物理层劣化；风扇转速是机箱传感器，与 RoCE 行为无关。","s":""},{"id":"ms-img-01","d":"3","m":1,"t":"pyxis","c":"最佳实践","q":"Which approaches let every node of a multi-node job use the same container image? (select all that apply)","zq":"多节点作业要让每台节点都能用同一镜像，哪些做法可行？（多选）","o":["Keep the .sqsh on shared storage","Pre-pull the image on every node","Rely only on the submit node's local cache","Let Pyxis import it on each node"],"zo":["把 .sqsh 放在共享存储","在各节点预拉取镜像","只依赖提交节点的本地缓存","让 Pyxis 在每台节点各自导入"],"ans":[0,1,3],"e":"Shared storage makes one image visible everywhere, pre-pulling prepares every node, and Pyxis imports on the fly per node when the image is absent. A submit-node-only cache leaves the other nodes without the file.","ze":"共享存储让一台机器上的镜像对所有节点可见，预拉取能提前准备好每台节点，Pyxis 在镜像缺失时就地导入；只靠提交节点的缓存，其他节点拿不到文件。","s":""}];

  var DOMAINS = {
    '1': '第 1 域 系统与服务器上架',
    '2': '第 2 域 物理层管理',
    '3': '第 3 域 控制面安装',
    '4': '第 4 域 集群测试与验证',
    '5': '第 5 域 故障排查与优化',
    '6': 'XID 错误码专题'
  };
  var DOMAIN_WEIGHT = { '1': '31%', '2': '5%', '3': '19%', '4': '33%', '5': '12%', '6': '—' };
  var LETTERS = ['A', 'B', 'C', 'D', 'E'];
  var EXAM_SIZE = 75;
  var EXAM_MINUTES = 80;
  var PASS_RATE = 0.85;
  var MULTI_IN_EXAM = 4;
  var PRACTICE_SIZE = 20;
  var KEY = 'ncp208.';

  /* ---------- 纯逻辑 ---------- */

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeItem(q) {
    var idx = q.o.map(function (_, i) { return i; });
    return { id: q.id, opts: shuffle(idx), chosen: q.m ? [] : null, locked: false };
  }

  function buildItems(pool, size) {
    return shuffle(pool).slice(0, Math.min(size, pool.length)).map(makeItem);
  }

  function buildExamItems(size) {
    var multis = DATA.filter(function (q) { return q.m; });
    var singles = DATA.filter(function (q) { return !q.m; });
    var takeMulti = Math.min(MULTI_IN_EXAM, multis.length);
    return shuffle(
      shuffle(multis).slice(0, takeMulti).map(makeItem)
        .concat(shuffle(singles).slice(0, size - takeMulti).map(makeItem))
    );
  }

  function answersOf(q) { return q.m ? q.ans.slice() : [q.a]; }

  function isCorrect(q, chosen) {
    var arr = chosen === null || chosen === undefined ? [] : (Array.isArray(chosen) ? chosen : [chosen]);
    if (!arr.length) return false;
    return answersOf(q).slice().sort().join(',') === arr.slice().sort().join(',');
  }

  function gradeExam(items) {
    var byId = {};
    DATA.forEach(function (q) { byId[q.id] = q; });
    var correct = 0, wrongList = [], blank = 0, perDomain = {};
    items.forEach(function (it) {
      var q = byId[it.id];
      var d = q.d;
      if (!perDomain[d]) perDomain[d] = { total: 0, correct: 0 };
      perDomain[d].total++;
      var arr = it.chosen === null || it.chosen === undefined ? [] :
        (Array.isArray(it.chosen) ? it.chosen : [it.chosen]);
      if (!arr.length) { blank++; return; }
      if (isCorrect(q, arr)) { correct++; perDomain[d].correct++; }
      else wrongList.push({ id: it.id, chosen: it.chosen });
    });
    var need = Math.ceil(items.length * PASS_RATE);
    return {
      total: items.length, correct: correct, wrong: wrongList.length, blank: blank,
      rate: items.length ? correct / items.length : 0,
      perDomain: perDomain, need: need, pass: correct >= need
    };
  }

  /* ---------- 存储 ---------- */

  function store(key, val) {
    try { localStorage.setItem(KEY + key, JSON.stringify(val)); } catch (e) {}
  }
  function load(key, dflt) {
    try {
      var raw = localStorage.getItem(KEY + key);
      return raw ? JSON.parse(raw) : dflt;
    } catch (e) { return dflt; }
  }

  var S = {
    view: 'home',
    session: null,
    wrong: load('wrong', {}),
    history: load('history', [])
  };

  function saveWrong() { store('wrong', S.wrong); }
  function saveHistory() { store('history', S.history.slice(0, 30)); }
  function saveSession() { store('session', S.session); }
  function byId(id) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i];
    return null;
  }

  /* ---------- 工具 ---------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(sec) {
    if (sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function el(id) { return document.getElementById(id); }

  function remainingMs(sess) {
    var s = sess || S.session;
    if (!s || !s.startedAt) return 0;
    return Math.max(0, s.limitMs - (Date.now() - s.startedAt));
  }

  function chosenArr(it) {
    if (it.chosen === null || it.chosen === undefined) return [];
    return Array.isArray(it.chosen) ? it.chosen : [it.chosen];
  }

  /* ---------- 数据导出 / 导入 ---------- */

  function exportData() {
    var data = { app: 'ncp208', version: 1, exportedAt: new Date().toISOString(), wrong: S.wrong, history: S.history };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ncp208-data-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () { importText(String(reader.result)); };
    reader.readAsText(file);
  }

  function datarow() {
    return '<div class="datarow">' +
      '<button class="btn ghost" data-act="export">导出文件</button>' +
      '<button class="btn ghost" data-act="import">导入文件</button>' +
      '<button class="btn ghost" data-act="export-text">复制数据</button>' +
      '<button class="btn ghost" data-act="import-text">粘贴导入</button>' +
      '</div>' +
      '<input type="file" id="importFile" class="filebtn" accept=".json,application/json">';
  }

  /* 微信内置浏览器等环境里下载/上传文件可能被拦，用文本框兜底 */
  function overlay(title, text, onOk) {
    var old = document.getElementById('ovl');
    if (old) old.remove();
    var d = document.createElement('div');
    d.id = 'ovl';
    d.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99;' +
      'display:flex;align-items:center;justify-content:center;padding:14px';
    d.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:560px;width:100%;padding:14px">' +
      '<p style="margin:0 0 8px;font-weight:700;font-size:14px">' + title + '</p>' +
      '<textarea id="ovlText" style="width:100%;height:200px;font:12px Consolas,monospace;' +
      'border:1px solid #e3e8ef;border-radius:10px;padding:8px;resize:vertical">' + esc(text) + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">' +
      '<button class="btn ghost" id="ovlCancel">关闭</button>' +
      (onOk ? '<button class="btn primary" id="ovlOk">导入</button>' : '') +
      (onOk ? '' : '<button class="btn primary" id="ovlCopy">全选并复制</button>') +
      '</div></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) { if (e.target === d) d.remove(); });
    document.getElementById('ovlCancel').onclick = function () { d.remove(); };
    var ta = document.getElementById('ovlText');
    if (onOk) {
      document.getElementById('ovlOk').onclick = function () {
        var v = ta.value.trim();
        d.remove();
        if (!v) return;
        onOk(v);
      };
    } else {
      ta.focus();
      ta.select();
      document.getElementById('ovlCopy').onclick = function () {
        ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (err) {}
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(ta.value).then(function () { alert('已复制'); });
        } else {
          alert(done ? '已复制' : '复制失败，请手动长按全选复制');
        }
      };
    }
  }

  function exportText() {
    var data = { app: 'ncp208', version: 1, exportedAt: new Date().toISOString(), wrong: S.wrong, history: S.history };
    overlay('把下面这段文本存到便签/微信收藏，换设备时用「粘贴导入」', JSON.stringify(data), null);
  }

  function importText(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { alert('这段文本不是合法的 JSON'); return; }
    if (!d || (!d.wrong && !d.history)) { alert('这段文本里没有错题本或成绩数据'); return; }
    var nw = d.wrong && typeof d.wrong === 'object' ? d.wrong : {};
    var nh = Array.isArray(d.history) ? d.history : [];
    if (!confirm('导入后会用这段数据覆盖当前错题本与成绩（' +
      Object.keys(nw).length + ' 道错题 / ' + nh.length + ' 条记录），继续？')) return;
    S.wrong = nw; S.history = nh;
    saveWrong(); saveHistory();
    alert('导入完成');
    renderHome();
  }

  /* ---------- 首页 ---------- */

  function renderHome() {
    S.view = 'home';
    var wrongCount = Object.keys(S.wrong).length;
    var last = S.history[0];
    var nMulti = DATA.filter(function (q) { return q.m; }).length;
    var domainRows = [1, 2, 3, 4, 5, 6].map(function (d) {
      var n = DATA.filter(function (q) { return q.d === String(d); }).length;
      return '<div class="row"><span>' + DOMAINS[d] + '</span><b>' + n + '</b>' +
        '<i>' + DOMAIN_WEIGHT[d] + '</i></div>';
    }).join('');

    var histRows = S.history.slice(0, 6).map(function (h) {
      var badge = h.mode === 'exam'
        ? '<em class="' + (h.pass ? 'pass' : 'fail') + '">' + (h.pass ? '及格' : '不及格') + '</em>'
        : '<em>' + pct(h.rate) + '</em>';
      return '<div class="row"><span>' + esc(h.date) + '</span><b>' + h.correct + '/' + h.total +
        '</b>' + badge + '</div>';
    }).join('') || '<p class="muted">还没有记录，先做一次模拟考吧。</p>';

    var lastBlock = last
      ? '<p class="last">' + last.correct + ' / ' + last.total + '（' + pct(last.rate) + '）' +
        (last.mode === 'exam' ? ' · <b class="' + (last.pass ? 'pass' : 'fail') + '">' +
          (last.pass ? '及格' : '不及格') + '</b>' : ' · 练习') +
        ' · ' + esc(last.date) + '</p>'
      : '';

    el('app').innerHTML =
      '<div class="hero">' +
        '<div class="logo">NCP-AII</div>' +
        '<h1>刷题 · 模拟考</h1>' +
        '<p>题库 ' + DATA.length + ' 题（含 ' + nMulti + ' 道多选题）· 每次随机抽 ' + EXAM_SIZE +
        ' 题 · 限时 ' + EXAM_MINUTES + ' 分钟 · 及格线 ' + pct(PASS_RATE) + '</p>' +
      '</div>' +

      '<div class="cards">' +
        '<button class="card primary" data-act="exam">' +
          '<span class="k">模拟考试</span>' +
          '<strong>' + EXAM_SIZE + ' 题 / ' + EXAM_MINUTES + ' 分钟</strong>' +
          '<em>题干与选项随机打乱，固定含 ' + Math.min(MULTI_IN_EXAM, nMulti) +
          ' 道多选；按 ' + pct(PASS_RATE) + ' 判定及格</em>' +
        '</button>' +
        '<button class="card" data-act="practice">' +
          '<span class="k">快速练习</span>' +
          '<strong>' + PRACTICE_SIZE + ' 题 · 即时解析</strong>' +
          '<em>边做边看对错与中英解析，错的自动进错题本</em>' +
        '</button>' +
        '<button class="card" data-act="wrong">' +
          '<span class="k">错题本</span>' +
          '<strong>' + wrongCount + ' 题</strong>' +
          '<em>只练做错过的题；答对即移出，答错计数 +1</em>' +
        '</button>' +
      '</div>' +

      (last ? '<div class="panel"><h2>上一次成绩</h2>' + lastBlock + '</div>' : '') +

      '<div class="panel"><h2>题库构成</h2>' + domainRows + '</div>' +
      '<div class="panel"><h2>历史记录</h2>' + histRows + '</div>' +
      '<div class="panel"><h2>换设备 / 换网址</h2>' +
        '<p class="muted">答题记录存在当前浏览器里。换手机、换网址或清了缓存后，用「导出 → 导入」搬一次即可。</p>' +
        datarow() +
      '</div>' +
      '<p class="foot">离线单文件 · 数据只存在本机浏览器（localStorage）· 清空浏览器数据会丢失错题本</p>';
  }

  /* ---------- 答题页 ---------- */

  function optClass(it, q, oi, locked) {
    var cls = 'opt';
    var pick = chosenArr(it);
    if (q.m) {
      if (locked) {
        if (answersOf(q).indexOf(oi) >= 0) cls += ' correct';
        else if (pick.indexOf(oi) >= 0) cls += ' wrong';
      } else if (pick.indexOf(oi) >= 0) cls += ' sel';
      return cls;
    }
    if (locked) {
      if (oi === q.a) cls += ' correct';
      else if (oi === it.chosen) cls += ' wrong';
    } else if (oi === it.chosen) cls += ' sel';
    return cls;
  }

  function renderSession() {
    var s = S.session;
    S.view = s.mode;
    var it = s.items[s.cur];
    var q = byId(it.id);
    var locked = s.mode !== 'exam' && it.locked;
    var pick = chosenArr(it);

    var opts = it.opts.map(function (oi, k) {
      var zh = q.zo && q.zo[oi] && q.zo[oi].replace(/\s/g, '') !== String(q.o[oi]).replace(/\s/g, '')
        ? '<em>' + esc(q.zo[oi]) + '</em>' : '';
      return '<button class="' + optClass(it, q, oi, locked) + '" data-opt="' + oi + '"' +
        (locked ? ' disabled' : '') + '>' +
        '<b>' + LETTERS[k] + '</b><span>' + esc(q.o[oi]) + '</span>' + zh + '</button>';
    }).join('');

    var answered = s.items.filter(function (x) { return chosenArr(x).length > 0; }).length;
    var grid = s.items.map(function (x, k) {
      var c = 'gbtn';
      if (chosenArr(x).length > 0) c += ' done';
      if (k === s.cur) c += ' cur';
      return '<button class="' + c + '" data-goto="' + k + '">' + (k + 1) + '</button>';
    }).join('');

    var head = '<div class="bar">' +
      '<div class="left">' + (s.mode === 'exam' ? '模拟考试' : s.mode === 'practice' ? '快速练习' : '错题重练') +
      ' · 第 ' + (s.cur + 1) + ' / ' + s.items.length + ' 题</div>' +
      (s.mode === 'exam' ? '<div class="timer" id="timer">' + fmt(Math.ceil(remainingMs() / 1000)) + '</div>'
                         : '<div class="timer small">已答 ' + answered + '</div>') +
      '</div>';

    var progress = '<div class="progress"><span style="width:' +
      Math.round((s.cur + 1) / s.items.length * 100) + '%"></span></div>';

    var snippet = q.s ? '<pre class="snippet">' + esc(q.s) + '</pre>' : '';
    var multiHint = q.m
      ? '<div class="mhint">多选题 · 选出<b>所有</b>正确项，全部选对才计分（已选 ' + pick.length + ' 项）</div>'
      : '';

    var feedback = '';
    if (locked) {
      var ok = isCorrect(q, it.chosen);
      var ansTxt = answersOf(q).map(function (a) { return LETTERS[it.opts.indexOf(a)]; }).join('、');
      feedback = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
        (ok ? '✓ 全对' : '✗ 未全对，正确答案 ' + ansTxt) + '</div>' +
        '<div class="expl"><p class="lbl">解析 / explanation</p>' +
        '<p class="en">' + esc(q.e) + '</p>' +
        (q.ze ? '<p class="zh">' + esc(q.ze) + '</p>' : '') + '</div>';
    }

    var confirmBtn = (q.m && s.mode !== 'exam' && !it.locked && pick.length)
      ? '<button class="btn primary" data-act="lock">确认作答</button>' : '';

    el('app').innerHTML =
      head + progress +
      '<div class="qcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] +
          (q.m ? ' · <b class="mtag">多选</b>' : '') +
          (q.t ? ' · 工具 ' + esc(q.t) : '') + (q.c ? ' · ' + esc(q.c) : '') + '</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        (q.zq ? '<div class="stem zh">' + esc(q.zq) + '</div>' : '') +
        snippet + multiHint +
        '<div class="options">' + opts + '</div>' +
      '</div>' + feedback +
      '<div class="controls">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>上一题</button>' +
        '<button class="btn ghost" data-act="next"' + (s.cur === s.items.length - 1 ? ' disabled' : '') + '>下一题</button>' +
        confirmBtn +
        (s.mode === 'exam'
          ? '<button class="btn primary" data-act="submit">交卷</button>'
          : '<button class="btn primary" data-act="finish">结束本轮</button>') +
      '</div>' +
      '<details class="grid-wrap"' + (s.mode === 'exam' ? '' : ' open') + '>' +
        '<summary>答题卡（已答 ' + answered + ' / ' + s.items.length + '）</summary>' +
        '<div class="grid">' + grid + '</div>' +
      '</details>' +
      '<p class="foot">' + (s.mode === 'exam'
        ? '快捷键：1-4 / A-D 选择，← → 翻页，Enter 下一题；多选题可反复点选，到时间自动交卷。'
        : '单选题点一次即判定；多选题选好后点「确认作答」。') + '</p>';

    if (s.mode === 'exam') startTimer();
  }

  /* ---------- 计时 ---------- */

  var tick = null;
  function startTimer() {
    stopTimer();
    tick = setInterval(function () {
      var left = remainingMs();
      var t = el('timer');
      if (t) {
        t.textContent = fmt(Math.ceil(left / 1000));
        t.className = 'timer' + (left < 5 * 60 * 1000 ? ' warn' : '');
      }
      if (left <= 0) { stopTimer(); submitExam(true); }
    }, 500);
  }
  function stopTimer() { if (tick) { clearInterval(tick); tick = null; } }

  /* ---------- 动作 ---------- */

  function startExam() {
    S.session = {
      mode: 'exam',
      items: buildExamItems(EXAM_SIZE),
      cur: 0,
      startedAt: Date.now(),
      limitMs: EXAM_MINUTES * 60 * 1000,
      submitted: false
    };
    saveSession();
    renderSession();
  }

  function startPractice(pool, size, mode) {
    S.session = {
      mode: mode || 'practice',
      items: buildItems(pool || DATA, size || PRACTICE_SIZE),
      cur: 0,
      startedAt: Date.now(),
      limitMs: 0,
      submitted: false
    };
    saveSession();
    renderSession();
  }

  function lockPractice(it, q) {
    it.locked = true;
    if (!isCorrect(q, it.chosen)) {
      var w = S.wrong[it.id] || { n: 0 };
      w.n = (w.n || 0) + 1;
      w.last = Date.now();
      S.wrong[it.id] = w;
      saveWrong();
    }
  }

  function pick(oi) {
    var s = S.session;
    var it = s.items[s.cur];
    var q = byId(it.id);
    if (s.mode !== 'exam' && it.locked) return;

    if (q.m) {
      var arr = chosenArr(it).slice();
      var at = arr.indexOf(oi);
      if (at >= 0) arr.splice(at, 1); else arr.push(oi);
      it.chosen = arr.sort();
    } else {
      it.chosen = oi;
      if (s.mode !== 'exam') lockPractice(it, q);
    }
    saveSession();
    renderSession();
  }

  function submitExam(auto) {
    var s = S.session;
    if (!s || s.submitted) return;
    if (!auto) {
      var blank = s.items.filter(function (x) { return chosenArr(x).length === 0; }).length;
      var msg = (blank > 0 ? '还有 ' + blank + ' 题未作答，' : '') + '确定交卷？';
      if (!confirm(msg)) return;
    }
    s.submitted = true;
    s.spentMs = Math.max(0, Date.now() - s.startedAt);
    var g = gradeExam(s.items);
    s.result = g;
    g.date = new Date().toLocaleString('zh-CN', { hour12: false });
    g.mode = s.mode;
    S.history.unshift({
      date: g.date, correct: g.correct, total: g.total, rate: g.rate,
      mode: s.mode, pass: g.pass
    });
    saveHistory();

    if (s.mode === 'exam') {
      s.items.forEach(function (it) {
        var q = byId(it.id);
        if (isCorrect(q, it.chosen)) {
          if (S.wrong[it.id]) delete S.wrong[it.id];
        } else {
          var w = S.wrong[it.id] || { n: 0 };
          w.n = (w.n || 0) + 1;
          w.last = Date.now();
          S.wrong[it.id] = w;
        }
      });
      saveWrong();
    }
    saveSession();
    stopTimer();
    renderResult();
  }

  /* ---------- 结果 ---------- */

  function renderResult() {
    S.view = 'result';
    var s = S.session, g = s.result;
    var dRows = Object.keys(g.perDomain).sort().map(function (d) {
      var x = g.perDomain[d];
      return '<div class="row"><span>' + DOMAINS[d] + '</span><b>' + x.correct + '/' + x.total +
        '</b><i>' + pct(x.total ? x.correct / x.total : 0) + '</i></div>';
    }).join('');

    var wrongItems = s.items.filter(function (it) { return !isCorrect(byId(it.id), it.chosen); });
    var wrongRows = wrongItems.map(function (it, k) {
      var q = byId(it.id);
      return '<button class="wrow" data-review="' + k + '"><b>Q' + (s.items.indexOf(it) + 1) + '</b>' +
        '<span>' + (q.m ? '[多选] ' : '') + esc(q.q.slice(0, 52)) + (q.q.length > 52 ? '…' : '') + '</span>' +
        '<i>' + DOMAINS[q.d] + '</i></button>';
    }).join('') || '<p class="muted">全对，没有错题 🎉</p>';

    var isExam = s.mode === 'exam';
    var verdict = isExam
      ? '<div class="verdict ' + (g.pass ? 'pass' : 'fail') + '">' + (g.pass ? '及格' : '不及格') + '</div>'
      : '';

    el('app').innerHTML =
      '<div class="result-head">' +
        verdict +
        '<div class="score">' + g.correct + '<small>/' + g.total + '</small></div>' +
        '<div class="rate">正确率 ' + pct(g.rate) +
          (isExam ? ' · 及格线 ' + pct(PASS_RATE) + '（需 ' + g.need + ' 题）' : '') + '</div>' +
        '<div class="muted">答对 ' + g.correct + ' · 答错 ' + g.wrong + ' · 未答 ' + g.blank +
          ' · 用时 ' + fmt(Math.round((s.spentMs || 0) / 1000)) + ' · ' + esc(g.date) + '</div>' +
      '</div>' +
      '<div class="panel"><h2>按考纲域</h2>' + dRows + '</div>' +
      '<div class="panel"><h2>本轮错题（' + wrongItems.length + '）</h2>' + wrongRows + '</div>' +
      '<div class="controls">' +
        '<button class="btn primary" data-act="review">逐题看解析</button>' +
        '<button class="btn ghost" data-act="wrong">去错题本</button>' +
        '<button class="btn ghost" data-act="home">返回首页</button>' +
      '</div>' +
      '<p class="foot">错题已自动写入错题本（答错计数 +1）；在错题本里答对一次即移出。多选题需全部选对才计分。</p>';
  }

  function renderReview() {
    S.view = 'review';
    var s = S.session;
    var it = s.items[s.cur];
    var q = byId(it.id);
    var ok = isCorrect(q, it.chosen);
    var pick = chosenArr(it);

    var opts = it.opts.map(function (oi, k) {
      var cls = 'opt';
      if (answersOf(q).indexOf(oi) >= 0) cls += ' correct';
      else if (pick.indexOf(oi) >= 0) cls += ' wrong';
      var zh = q.zo && q.zo[oi] && q.zo[oi].replace(/\s/g, '') !== String(q.o[oi]).replace(/\s/g, '')
        ? '<em>' + esc(q.zo[oi]) + '</em>' : '';
      return '<div class="' + cls + '"><b>' + LETTERS[k] + '</b><span>' + esc(q.o[oi]) +
        '</span>' + zh + '</div>';
    }).join('');

    var ansTxt = answersOf(q).map(function (a) { return LETTERS[it.opts.indexOf(a)]; }).join('、');

    el('app').innerHTML =
      '<div class="bar"><div class="left">逐题解析 · 第 ' + (s.cur + 1) + '/' + s.items.length + ' 题' +
        (q.m ? ' · 多选' : '') + '</div>' +
      '<div class="timer small ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '答对' : '答错') +
        '（答案 ' + ansTxt + '）</div></div>' +
      '<div class="qcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] + (q.t ? ' · 工具 ' + esc(q.t) : '') + '</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        (q.zq ? '<div class="stem zh">' + esc(q.zq) + '</div>' : '') +
        (q.s ? '<pre class="snippet">' + esc(q.s) + '</pre>' : '') +
        '<div class="options">' + opts + '</div>' +
      '</div>' +
      '<div class="expl"><p class="lbl">解析 / explanation</p>' +
        '<p class="en">' + esc(q.e) + '</p>' +
        (q.ze ? '<p class="zh">' + esc(q.ze) + '</p>' : '') + '</div>' +
      '<div class="controls">' +
        '<button class="btn ghost" data-act="prev"' + (s.cur === 0 ? ' disabled' : '') + '>上一题</button>' +
        '<button class="btn ghost" data-act="next"' + (s.cur === s.items.length - 1 ? ' disabled' : '') + '>下一题</button>' +
        '<button class="btn primary" data-act="home">返回首页</button>' +
      '</div>';
  }

  /* ---------- 错题本 ---------- */

  function renderWrong() {
    S.view = 'wrong';
    var ids = Object.keys(S.wrong);
    var cards = ids.map(function (id) {
      var q = byId(id);
      if (!q) return '';
      var w = S.wrong[id];
      var ansTxt = answersOf(q).map(function (a) { return LETTERS[a]; }).join('、');
      return '<div class="wcard">' +
        '<div class="meta">' + esc(q.id) + ' · ' + DOMAINS[q.d] + (q.m ? ' · 多选' : '') +
          ' · 错 ' + (w.n || 1) + ' 次</div>' +
        '<div class="stem">' + esc(q.q) + '</div>' +
        '<div class="stem zh">' + esc(q.zq || '') + '</div>' +
        '<details><summary>看答案与解析</summary>' +
          '<p class="ans">答案 ' + ansTxt + '：' +
            answersOf(q).map(function (a) { return esc(q.o[a]); }).join(' ／ ') + '</p>' +
          '<p class="en">' + esc(q.e) + '</p>' +
          (q.ze ? '<p class="zh">' + esc(q.ze) + '</p>' : '') +
        '</details>' +
        '<button class="link" data-remove="' + esc(id) + '">已掌握，移出错题本</button>' +
      '</div>';
    }).join('');

    el('app').innerHTML =
      '<div class="bar"><div class="left">错题本 · ' + ids.length + ' 题</div></div>' +
      (ids.length
        ? '<div class="controls">' +
            '<button class="btn primary" data-act="drill-wrong">重练全部错题</button>' +
            '<button class="btn ghost" data-act="home">返回首页</button>' +
          '</div>' + datarow() + cards
        : '<div class="panel"><p class="muted">错题本是空的。去做一次模拟考或快速练习吧。</p>' +
          '<button class="btn ghost" data-act="home">返回首页</button></div>');
  }

  function renderResume() {
    S.view = 'resume';
    var s = S.session;
    el('app').innerHTML =
      '<div class="hero"><h1>发现未完成的模拟考</h1>' +
      '<p>已答 ' + s.items.filter(function (x) { return chosenArr(x).length > 0; }).length +
      ' / ' + s.items.length + ' 题，剩余时间 ' + fmt(Math.ceil(remainingMs() / 1000)) + '</p></div>' +
      '<div class="controls">' +
        '<button class="btn primary" data-act="resume">继续考试</button>' +
        '<button class="btn ghost" data-act="discard">放弃这次</button>' +
      '</div>';
  }

  /* ---------- 事件 ---------- */

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act],[data-opt],[data-goto],[data-review],[data-remove]');
      if (!t) return;
      var act = t.getAttribute('data-act');

      if (t.hasAttribute('data-opt')) { pick(parseInt(t.getAttribute('data-opt'), 10)); return; }
      if (t.hasAttribute('data-goto')) {
        S.session.cur = parseInt(t.getAttribute('data-goto'), 10);
        saveSession(); renderSession(); return;
      }
      if (t.hasAttribute('data-review')) {
        var k = parseInt(t.getAttribute('data-review'), 10);
        var ss = S.session;
        var wrongs = ss.items.filter(function (it) { return !isCorrect(byId(it.id), it.chosen); });
        ss.cur = ss.items.indexOf(wrongs[k]);
        renderReview(); return;
      }
      if (t.hasAttribute('data-remove')) {
        delete S.wrong[t.getAttribute('data-remove')];
        saveWrong(); renderWrong(); return;
      }

      switch (act) {
        case 'exam': startExam(); break;
        case 'practice': startPractice(DATA, PRACTICE_SIZE, 'practice'); break;
        case 'wrong': renderWrong(); break;
        case 'drill-wrong':
          startPractice(Object.keys(S.wrong).map(byId).filter(Boolean),
            Object.keys(S.wrong).length, 'wrong');
          break;
        case 'lock':
          var curIt = S.session.items[S.session.cur];
          lockPractice(curIt, byId(curIt.id));
          saveSession(); renderSession();
          break;
        case 'prev':
          if (S.session && S.session.cur > 0) {
            S.session.cur--; saveSession();
            S.view === 'review' ? renderReview() : renderSession();
          }
          break;
        case 'next':
          if (S.session && S.session.cur < S.session.items.length - 1) {
            S.session.cur++; saveSession();
            S.view === 'review' ? renderReview() : renderSession();
          }
          break;
        case 'submit': submitExam(false); break;
        case 'finish': if (confirm('结束本轮练习？')) submitExam(true); break;
        case 'review': S.session.cur = 0; renderReview(); break;
        case 'home': stopTimer(); renderHome(); break;
        case 'resume': renderSession(); break;
        case 'discard': S.session = null; saveSession(); renderHome(); break;
        case 'export': exportData(); break;
        case 'export-text': exportText(); break;
        case 'import-text': overlay('把之前复制的那段 JSON 粘到这里', '', function (v) { importText(v); }); break;
        case 'import': {
          var f = el('importFile');
          if (f) f.click();
          break;
        }
      }
    });

    document.addEventListener('change', function (e) {
      if (e.target && e.target.id === 'importFile' && e.target.files && e.target.files[0]) {
        importData(e.target.files[0]);
        e.target.value = '';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (!S.session || S.session.submitted) return;
      if (S.view !== 'exam' && S.view !== 'practice' && S.view !== 'wrong') return;
      var s = S.session;
      var k = e.key;
      if (k >= '1' && k <= '4') {
        var n = parseInt(k, 10) - 1;
        var it = s.items[s.cur];
        if (n < it.opts.length) pick(it.opts[n]);
        e.preventDefault();
      } else if (/^[a-dA-D]$/.test(k)) {
        var m = 'abcd'.indexOf(k.toLowerCase());
        var it2 = s.items[s.cur];
        if (m < it2.opts.length) pick(it2.opts[m]);
        e.preventDefault();
      } else if (k === 'Enter') {
        if (s.cur < s.items.length - 1) {
          s.cur++; saveSession();
          S.view === 'review' ? renderReview() : renderSession();
        }
        e.preventDefault();
      } else if (k === 'ArrowLeft' || k === 'ArrowRight') {
        if (k === 'ArrowLeft' && s.cur > 0) s.cur--;
        if (k === 'ArrowRight' && s.cur < s.items.length - 1) s.cur++;
        saveSession();
        S.view === 'review' ? renderReview() : renderSession();
        e.preventDefault();
      }
    });
  }

  /* ---------- 启动 ---------- */

  function boot() {
    bindEvents();
    try {
      localStorage.setItem(KEY + 'probe', '1');
      localStorage.removeItem(KEY + 'probe');
    } catch (err) {
      var warn = document.createElement('div');
      warn.className = 'warnbar';
      warn.textContent = '当前浏览器禁止本页使用本地存储：成绩与错题本不会保存（换用 Chrome / Edge 打开即可）。';
      document.body.insertBefore(warn, document.getElementById('app'));
    }
    var saved = load('session', null);
    if (saved && !saved.submitted && saved.mode === 'exam' && remainingMs(saved) > 0) {
      S.session = saved;
      renderResume();
    } else if (saved && !saved.submitted && saved.mode !== 'exam') {
      S.session = saved;
      renderSession();
    } else {
      renderHome();
    }
  }

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = {
      DATA: DATA, shuffle: shuffle, buildItems: buildItems, buildExamItems: buildExamItems,
      gradeExam: gradeExam, isCorrect: isCorrect, PASS_RATE: PASS_RATE
    };
  } else {
    boot();
  }
})();

</script>
