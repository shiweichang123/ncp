 degradation or thermal throttling","The NVLink test failed","The test is incomplete because it did not reach level 3"],"zo":["该 GPU 通过全部测试，状态健康","该 GPU 未通过内存带宽测试，只跑到 1523 GB/s（预期 ≥1800 GB/s），可能说明 HBM 劣化或温度降频","NVLink 测试失败","测试未完成，因为没有达到 3 级"],"a":1,"e":"The Memory Bandwidth test failed because GPU 0 achieved only 1523 GB/s, below the 1800 GB/s threshold. This can indicate degraded HBM (High Bandwidth Memory) modules, thermal throttling reducing memory clock speeds, or ECC errors causing page retirements that reduce available bandwidth. The GPU should be investigated further and potentially RMA'd.","ze":"Memory Bandwidth 项失败：GPU 0 只达到 1523 GB/s，低于 1800 GB/s 阈值。可能原因包括 HBM 模块劣化、温度降频导致显存频率下降、ECC 错误造成页退役使可用带宽减少。应进一步排查，必要时返修。","s":"$ dcgmi diag -r 3 -i 0\n+---------------------------+--------------------------------+\n| Diagnostic                | Result                         |\n+===========================+================================+\n| Deployment                | Pass                           |\n| PCIe                      | Pass                           |\n| Memory                    | Pass                           |\n| SM Stress                 | Pass                           |\n| Targeted Stress           | Pass                           |\n| Targeted Power            | Pass                           |\n| Memory Bandwidth          | Fail (GPU 0: 1523 GB/s,       |\n|                           |  expected >= 1800 GB/s)        |\n| NVLink                    | Pass                           |\n+---------------------------+--------------------------------+","src":"lab"},{"id":"tm-diag-003","d":"4","m":0,"t":"dcgmi diag","c":"参数用法","q":"How do you run dcgmi diag on a specific GPU rather than all GPUs in the system?","zq":"如何只对指定 GPU 运行 dcgmi diag，而不是系统内全部 GPU？","o":["dcgmi diag -r 3 --gpu 0","dcgmi diag -r 3 -i 0","dcgmi diag -r 3 --device=0","dcgmi diag -r 3 -g 0"],"zo":["dcgmi diag -r 3 --gpu 0","dcgmi diag -r 3 -i 0","dcgmi diag -r 3 --device=0","dcgmi diag -r 3 -g 0"],"a":1,"e":"dcgmi diag -i (or --gpu-id) specifies which GPU to test by entity ID. \"dcgmi diag -r 3 -i 0\" runs a comprehensive (level 3) diagnostic on GPU 0 only. Without the -i flag, dcgmi diag tests all GPUs in the default group. You can also specify a DCGM group ID with -g to test a pre-defined set of GPUs.","ze":"-i（--gpu-id）按 entity ID 指定被测 GPU，dcgmi diag -r 3 -i 0 只对 0 号卡做 3 级诊断。不加 -i 则测试默认组内的全部 GPU；也可用 -g 指定预先建好的 DCGM 组。","s":"","src":"lab"},{"id":"tm-diag-004","d":"4","m":0,"t":"dcgmi diag","c":"最佳实践","q":"When should you run dcgmi diag -r 3 on a production DGX system?","zq":"在生产环境中的 DGX 系统上，什么时候适合运行 dcgmi diag -r 3？","o":["While production jobs are running to test under real load","During scheduled maintenance windows, after hardware changes, or during initial system bring-up, because level 3 tests are destructive to running workloads","Only when NVIDIA support requests it","Every hour as a health monitoring routine"],"zo":["在生产作业运行时跑，以测试真实负载下的表现","在计划维护窗口、硬件变更之后、或系统初始上架验证时运行，因为 3 级测试会干扰甚至压垮正在运行的作业","只在 NVIDIA 支持要求时才跑","每小时跑一次作为健康巡检"],"a":1,"e":"dcgmi diag -r 3 is a stress test that fully utilizes GPU compute, memory, PCIe, and NVLink resources. Running it during production would interfere with and likely crash running workloads. It should be run during maintenance windows, after hardware replacements (GPU, NVLink cables, PCIe risers), and during initial system bring-up validation. For ongoing health monitoring, use dcgmi health -c or -r 1 instead.","ze":"-r 3 是压力测试，会占满计算、显存、PCIe 与 NVLink 资源；跑在生产环境中会干扰甚至压垮正在运行的作业。应在维护窗口、更换硬件（GPU、NVLink 线缆、PCIe 转接卡）之后或初始上架验证时运行；日常巡检用 dcgmi health 或 -r 1。","s":"","src":"lab"},{"id":"tm-diag-005","d":"5","m":0,"t":"dcgmi diag","c":"故障排查","q":"dcgmi diag -r 3 shows \"NVLink: Fail\" for GPU 2 to GPU 3. All other GPU pair tests pass. What is the most likely hardware cause?","zq":"dcgmi diag -r 3 显示 GPU 2 到 GPU 3 的 NVLink 测试失败，其余 GPU 对的测试都通过。最可能的硬件原因是什么？","o":["The GPU driver needs to be updated","The NVLink bridge or cable connecting GPU 2 and GPU 3 is faulty or improperly seated","Both GPU 2 and GPU 3 need to be replaced","The PCIe switch connecting the GPUs has failed"],"zo":["需要更新 GPU 驱动","连接 GPU 2 与 GPU 3 的 NVLink 桥（或线缆）故障，或未正确就位","GPU 2 与 GPU 3 都需要更换","连接这些 GPU 的 PCIe 交换机故障"],"a":1,"e":"When NVLink fails between a specific pair of GPUs while all other NVLink connections pass, the most likely cause is a faulty NVLink bridge (in systems like DGX A100) or NVLink cable (in NVSwitch-based systems like DGX H100). Since both GPUs pass NVLink tests with other peers, the GPUs themselves are likely functional. Reseating or replacing the NVLink bridge/cable between GPU 2 and GPU 3 should resolve the issue.","ze":"只有 2 号与 3 号之间 NVLink 失败、其他 NVLink 都通过，最可能是这一对之间的 NVLink 桥（DGX A100 等）或 NVLink 线缆（DGX H100 这类 NVSwitch 系统）故障或未插好。两块卡与其他对端的测试都正常，说明 GPU 本身基本没问题；重新插拔或更换该桥/线缆即可。","s":"","src":"lab"},{"id":"tm-diag-006","d":"5","m":0,"t":"nvidia-bug-report","c":"命令语法","q":"What is the correct command to generate an NVIDIA bug report bundle?","zq":"生成 NVIDIA 缺陷报告（bug report）包的正确命令是？","o":["nvidia-bug-report --generate","nvidia-bug-report.sh","nvidia-smi --bug-report","dcgmi bugreport"],"zo":["nvidia-bug-report --generate","nvidia-bug-report.sh","nvidia-smi --bug-report","dcgmi bugreport"],"a":1,"e":"nvidia-bug-report.sh is a shell script provided with the NVIDIA driver package. It collects comprehensive system and GPU diagnostic information and saves it as a compressed log file (nvidia-bug-report.log.gz). The script must be run with root privileges to capture all information including kernel logs and driver internals.","ze":"nvidia-bug-report.sh 是 NVIDIA 驱动包自带的 shell 脚本，收集系统与 GPU 诊断信息并打包为压缩日志 nvidia-bug-report.log.gz；需要 root 才能抓全内核日志与驱动内部状态。","s":"","src":"lab"},{"id":"tm-diag-007","d":"5","m":0,"t":"nvidia-bug-report","c":"概念理解","q":"What types of information does nvidia-bug-report.sh collect in its output bundle?","zq":"nvidia-bug-report.sh 的输出包会收集哪些信息？","o":["Only the nvidia-smi output and driver version","GPU state, driver version, kernel logs (dmesg), Xorg logs, loaded kernel modules, PCI topology, VBIOS versions, ECC status, NVLink status, and system configuration","Only GPU temperature and utilization history","Only the last 100 lines of syslog"],"zo":["只有 nvidia-smi 输出与驱动版本","GPU 状态、驱动版本、内核日志（dmesg）、Xorg 日志、已加载内核模块、PCI 拓扑、VBIOS 版本、ECC 状态、NVLink 状态与系统配置","只有 GPU 温度与利用率历史","只有 syslog 的最后 100 行"],"a":1,"e":"nvidia-bug-report.sh is comprehensive. It captures: nvidia-smi output, driver and VBIOS versions, kernel ring buffer (dmesg) including XID errors, loaded kernel modules, PCI device tree, ECC error counts, NVLink status, thermal and power data, Xorg/display logs, system information (OS, CPU, memory), and relevant configuration files. This complete snapshot is what NVIDIA support needs for issue investigation.","ze":"它会采集 nvidia-smi 输出、驱动与 VBIOS 版本、内核环形缓冲（含 XID 错误）、已加载内核模块、PCI 设备树、ECC 计数、NVLink 状态、温度与功耗数据、Xorg 日志、系统信息（OS/CPU/内存）及相关配置文件——正是 NVIDIA 支持排查所需的完整快照。","s":"","src":"lab"},{"id":"tm-diag-008","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When should you run nvidia-bug-report.sh in a troubleshooting workflow?","zq":"在排障流程中，什么时候应当运行 nvidia-bug-report.sh？","o":["After rebooting the system to get a clean state","Immediately when the issue occurs and before any remediation steps, to capture the current problematic state","Only after running all other diagnostic tools first","Once a week as a routine health check"],"zo":["重启系统、恢复到干净状态之后再跑","问题一出现、做任何修复动作之前就跑，以捕获当前故障现场","先把其他诊断工具全部跑完再跑","每周跑一次作为例行健康检查"],"a":1,"e":"nvidia-bug-report.sh should be run immediately when an issue is observed, before any remediation (reboots, driver reloads, GPU resets). The report captures volatile state like current kernel messages (dmesg), XID errors, GPU registers, and process information that would be lost after a reboot or reset. Running it first preserves the evidence needed for root cause analysis.","ze":"应在问题出现的第一时间、任何修复动作（重启、重载驱动、重置 GPU）之前运行。报告捕获的是易失状态：当前 dmesg、XID 错误、GPU 寄存器与进程信息，重启或重置后就没了。","s":"","src":"lab"},{"id":"tm-diag-009","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"In the nvidia-bug-report.log output, you find repeated XID Error 79 entries in the dmesg section. What does XID 79 indicate?","zq":"在 nvidia-bug-report.log 的 dmesg 段中反复出现 XID 79，XID 79 表示什么？","o":["A GPU fan failure","A GPU has fallen off the PCIe bus, typically due to a hardware failure, power issue, or PCIe link instability","An application used too much GPU memory","The display output is disconnected"],"zo":["GPU 风扇故障","GPU 从 PCIe 总线上掉线，通常由硬件故障、供电问题或 PCIe 链路不稳定引起","应用占用了过多 GPU 显存","显示输出被断开"],"a":1,"e":"XID Error 79 means \"GPU has fallen off the bus.\" This is a critical hardware error indicating the GPU is no longer responding on the PCIe bus. Common causes include failing GPU hardware, power supply issues to the GPU, PCIe riser card problems, or motherboard PCIe slot defects. The GPU will be inaccessible until a power cycle. This typically requires hardware replacement (GPU, riser, or power cable).","ze":"XID 79 表示 GPU 已从 PCIe 总线掉线，是严重硬件错误：GPU 不再在总线上响应。常见原因：GPU 硬件失效、GPU 供电问题、PCIe 转接卡故障、主板插槽缺陷。在断电重启前 GPU 一直不可访问，通常需要更换硬件（GPU、转接卡或电源线）。","s":"","src":"lab"},{"id":"tm-diag-010","d":"4","m":0,"t":"gpu-burn","c":"命令语法","q":"Which gpu-burn command runs a stress test on all GPUs for 5 minutes (300 seconds)?","zq":"哪条 gpu-burn 命令可在所有 GPU 上运行 5 分钟（300 秒）压力测试？","o":["gpu-burn --time 300","gpu-burn -d 300","gpu-burn 300","gpu-burn -t 5m"],"zo":["gpu-burn --time 300","gpu-burn -d 300","gpu-burn 300","gpu-burn -t 5m"],"a":2,"e":"gpu-burn takes the duration in seconds as a positional argument. \"gpu-burn 300\" runs the stress test for 300 seconds (5 minutes) on all available GPUs. By default, it uses double-precision floating point and periodically verifies computation results to detect errors.","ze":"gpu-burn 以秒为位置参数，gpu-burn 300 即在所有可用 GPU 上运行 300 秒（5 分钟）。它默认使用双精度浮点，并周期性校验计算结果以发现错误。","s":"","src":"lab"},{"id":"tm-diag-011","d":"4","m":0,"t":"gpu-burn","c":"输出判读","q":"What does this gpu-burn output indicate?","zq":"这段 gpu-burn 输出说明了什么？","o":["All GPUs passed the stress test","GPU 2 is running hot but otherwise functional","GPU 2 produced incorrect computation results (mismatch) and has significantly lower throughput, indicating a hardware fault","The test was too short to produce reliable results"],"zo":["所有 GPU 都通过了压力测试","GPU 2 温度偏高，但功能仍然正常","GPU 2 计算结果不正确（检测到 mismatch）且吞吐显著偏低，说明存在硬件故障","测试时间太短，结果不可靠"],"a":2,"e":"GPU 2 shows \"FAULTY\" with \"mismatch detected,\" meaning the stress test computation results did not match expected values. This indicates the GPU is producing incorrect mathematical results, which is a serious hardware fault. The dramatically lower throughput (4521 vs ~18200 Gflop/s) and higher temperature also suggest hardware degradation. This GPU should be replaced.","ze":"GPU 2 显示 FAULTY 且带 mismatch detected，说明压测计算结果与期望值不一致——GPU 正在产出错误的数学结果，属严重硬件故障。吞吐骤降（4521 对约 18200 Gflop/s）与更高温度也印证了硬件劣化，该卡应更换。","s":"$ gpu-burn 120\nGPU 0: OK - temp: 72C - 18234 Gflop/s\nGPU 1: OK - temp: 74C - 18198 Gflop/s\nGPU 2: FAULTY - temp: 81C - 4521 Gflop/s (mismatch detected)\nGPU 3: OK - temp: 73C - 18201 Gflop/s\nGPU 4: OK - temp: 71C - 18245 Gflop/s\nGPU 5: OK - temp: 75C - 18187 Gflop/s\nGPU 6: OK - temp: 74C - 18203 Gflop/s\nGPU 7: OK - temp: 73C - 18219 Gflop/s","src":"lab"},{"id":"tm-diag-012","d":"4","m":0,"t":"gpu-burn","c":"最佳实践","q":"How long should a gpu-burn stress test run to be considered a thorough burn-in test for new DGX hardware?","zq":"对新 DGX 硬件做彻底烧机（burn-in），gpu-burn 应运行多久？","o":["60 seconds is sufficient for a quick check","5-10 minutes to verify basic functionality","At least 1-4 hours to stress test thermal and power delivery systems under sustained load and catch intermittent faults","Exactly 24 hours as specified by NVIDIA"],"zo":["60 秒足够快速检查","5~10 分钟验证基本功能","至少 1~4 小时，在持续负载下压力测试散热与供电系统，以捕获间歇性故障","按 NVIDIA 规定必须精确 24 小时"],"a":2,"e":"For a thorough burn-in test, 1-4 hours is recommended because intermittent hardware faults (thermal throttling, power delivery issues, marginal memory cells) may not manifest during short tests. Sustained load forces all GPUs to maximum temperature and power draw, which stresses cooling, VRMs, and memory. Short tests (minutes) catch gross failures but miss intermittent issues that appear only after thermal saturation.","ze":"彻底的烧机建议跑 1~4 小时：间歇性硬件问题（热降频、供电边缘状态、临界存储单元）在短测中未必显现；持续负载会把 GPU 推到最高温度与功耗，从而压测散热、VRM 与显存。几分钟的短测只能发现明显故障。","s":"","src":"lab"},{"id":"tm-diag-013","d":"4","m":0,"t":"gpu-burn","c":"概念理解","q":"What is the key difference between gpu-burn and dcgmi diag -r 3 for GPU stress testing?","zq":"在 GPU 压力测试上，gpu-burn 与 dcgmi diag -r 3 的关键区别是什么？","o":["They test the same things in the same way","gpu-burn focuses purely on sustained compute stress and thermal stability, while dcgmi diag -r 3 tests multiple subsystems (memory, PCIe, NVLink, compute) individually with pass/fail thresholds","dcgmi diag is only for NVIDIA GPUs while gpu-burn works on any GPU","gpu-burn is an official NVIDIA tool while dcgmi diag is third-party"],"zo":["两者用相同方式测试相同内容","gpu-burn 专注持续计算压力与热稳定性；dcgmi diag -r 3 会分别测试多个子系统（内存、PCIe、NVLink、计算），并给出各自的通过/失败阈值","dcgmi diag 只支持 NVIDIA GPU，gpu-burn 支持任何 GPU","gpu-burn 是 NVIDIA 官方工具，dcgmi diag 是第三方工具"],"a":1,"e":"gpu-burn is a focused CUDA compute stress test that maximizes GPU utilization to test thermal and power stability, verifying computation correctness over time. dcgmi diag -r 3 is a comprehensive diagnostic suite that individually tests deployment health, PCIe bandwidth, memory bandwidth, SM compute, NVLink bandwidth, and power delivery with specific pass/fail thresholds for each. They complement each other: dcgmi diag identifies which subsystem has issues, while gpu-burn validates sustained compute reliability.","ze":"gpu-burn 是专注的 CUDA 计算压力测试，把 GPU 利用率拉满以验证热与功耗稳定性，并校验计算正确性；dcgmi diag -r 3 则分项测试部署健康、PCIe 带宽、内存带宽、SM 计算、NVLink 带宽与供电，各有明确阈值。两者互补：前者验证持续可靠性，后者定位哪个子系统有问题。","s":"","src":"lab"},{"id":"tm-diag-014","d":"4","m":0,"t":"dcgmi diag","c":"参数用法","q":"Which dcgmi diag flag runs diagnostics on a specific DCGM group rather than the default group?","zq":"哪个 dcgmi diag 参数可对指定的 DCGM 组（而不是默认组）运行诊断？","o":["dcgmi diag -r 3 --group 2","dcgmi diag -r 3 -g 2","dcgmi diag -r 3 --target-group 2","dcgmi diag -r 3 -G 2"],"zo":["--group 2","-g 2","--target-group 2","-G 2"],"a":1,"e":"dcgmi diag -g (--group) specifies a DCGM group ID to run diagnostics against. First create a group with 'dcgmi group -c mygroup -a 0,1' and note the returned group ID. Then 'dcgmi diag -r 3 -g <groupId>' runs diagnostics on only the GPUs in that group. This is useful for testing a subset of GPUs, for example after replacing a specific GPU.","ze":"-g（--group）指定 DCGM 组 ID。先用 dcgmi group -c mygroup -a 0,1 建组并记下返回的 ID，再用 dcgmi diag -r 3 -g <组ID> 只测组内 GPU；例如刚换过某块卡、只想复测它时很有用。","s":"","src":"lab"},{"id":"tm-diag-015","d":"1","m":0,"t":"dcgmi diag","c":"输出判读","q":"What does this dcgmi diag level 1 output indicate?","zq":"这段 dcgmi diag level 1 的输出说明了什么？","o":["The GPU hardware has failed and needs replacement","The NVIDIA driver is not properly installed or the NVML shared library (libnvidia-ml.so) is missing from the library path","DCGM is not compatible with the installed GPU","The GPU needs a firmware update before diagnostics can run"],"zo":["GPU 硬件已损坏，需要更换","NVIDIA 驱动未正确安装，或 NVML 共享库（libnvidia-ml.so）不在库搜索路径中","DCGM 与已安装的 GPU 不兼容","诊断前需要先升级 GPU 固件"],"a":1,"e":"The Deployment test at level 1 checks basic software prerequisites. 'NVML library not found' means the NVIDIA Management Library (libnvidia-ml.so) is not in the library search path. This typically indicates the NVIDIA driver is not installed, not loaded (check with 'lsmod | grep nvidia'), or the library path is misconfigured. This must be fixed before any GPU operations can work.","ze":"1 级的 Deployment 检查基础软件前提；报“NVML library not found”说明 libnvidia-ml.so 不在库搜索路径，常见原因是驱动未安装、内核模块未加载（lsmod | grep nvidia）或库路径配置错误。必须先修好，后续 GPU 操作才能正常。","s":"$ dcgmi diag -r 1\n+---------------------------+--------------------------------+\n| Diagnostic                | Result                         |\n+===========================+================================+\n| Deployment                | Fail                           |\n|                           | Error: NVML library not found  |\n+---------------------------+--------------------------------+","src":"lab"},{"id":"tm-diag-016","d":"4","m":0,"t":"dcgmi diag","c":"命令语法","q":"Which dcgmi diag command runs only the quick deployment validation tests?","zq":"哪条 dcgmi diag 命令只运行快速的部署验证测试？","o":["dcgmi diag -r 1","dcgmi diag --quick","dcgmi diag -r 0","dcgmi diag --deploy"],"zo":["dcgmi diag -r 1","dcgmi diag --quick","dcgmi diag -r 0","dcgmi diag --deploy"],"a":0,"e":"dcgmi diag -r 1 runs level 1 diagnostics, which are quick deployment validation tests that complete in seconds. These tests verify the NVIDIA driver is loaded, GPUs are accessible, ECC mode is as expected, and basic GPU health indicators are normal. Level 1 is suitable for quick health checks without impacting running workloads.","ze":"-r 1 即 1 级诊断，数秒完成：验证 NVIDIA 驱动已加载、GPU 可访问、ECC 模式符合预期、基础健康指标正常。适合不影响业务的快速体检。","s":"","src":"lab"},{"id":"tm-diag-017","d":"5","m":0,"t":"nvidia-bug-report","c":"输出判读","q":"In the nvidia-bug-report output, you find this dmesg entry. What does it mean?","zq":"在 nvidia-bug-report 输出里你看到这条 dmesg 记录。它说明什么？","o":["The GPU has fallen off the PCIe bus","XID 48 is an uncorrectable double-bit ECC error; repeated occurrences on the same GPU indicate degrading memory, and a GPU reset or node reboot is needed to clear the error","The Python process is using too much GPU memory","The GPU temperature is too high and thermal throttling is occurring"],"zo":["GPU 已从 PCIe 总线上脱落","XID 48 是不可纠正的双位 ECC 错误；同一 GPU 上反复出现说明显存在劣化，清除该错误需要重置 GPU 或重启节点","Python 进程占用了过多显存","GPU 温度过高，正在热降频"],"a":1,"e":"Xid 48 is ROBUST_CHANNEL_GPU_ECC_DBE. The catalog states that an uncorrectable error occurred on the GPU and that a GPU reset or node reboot is needed to clear it. If the ECC error is reported for SRAM rather than the framebuffer, check the SRAM DBE threshold and follow the RMA flow if it is exceeded. Inspect the counters with nvidia-smi -q -d ECC and the retirement state with nvidia-smi -q -d PAGE_RETIREMENT.","ze":"Xid 48 是 ROBUST_CHANNEL_GPU_ECC_DBE。官方说明 GPU 上发生了不可纠正错误，清除该错误需要重置 GPU 或重启节点。若 ECC 错误报在 SRAM 而非帧缓冲上，应检查 SRAM DBE 阈值，超过则走 RMA 流程。用 nvidia-smi -q -d ECC 看计数，用 nvidia-smi -q -d PAGE_RETIREMENT 看页面退役状态。","s":"[  142.835421] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010\n[  142.835423] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010\n[  142.835425] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python, Ch 00000010","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 48 GPU_ECC_DBE, GPU reset or node reboot required"},{"id":"tm-diag-018","d":"5","m":0,"t":"nvidia-bug-report","c":"参数用法","q":"What is the default output filename and format generated by nvidia-bug-report.sh?","zq":"nvidia-bug-report.sh 默认生成的文件名与格式是什么？","o":["nvidia-diagnostics.txt in the current directory","nvidia-bug-report.log.gz - a gzip-compressed log file in the current directory","/var/log/nvidia-bug-report.json","nvidia-report.tar.gz containing multiple diagnostic files"],"zo":["当前目录下的 nvidia-diagnostics.txt","当前目录下的 nvidia-bug-report.log.gz","/var/log/nvidia-bug-report.json","包含多个诊断文件的 nvidia-report.tar.gz"],"a":1,"e":"nvidia-bug-report.sh generates a file named nvidia-bug-report.log.gz in the current working directory. The .gz extension indicates gzip compression. To read it, use 'zcat nvidia-bug-report.log.gz' or 'gunzip nvidia-bug-report.log.gz' followed by viewing the resulting .log file. The compressed format reduces the file size for easy sharing with NVIDIA support.","ze":"nvidia-bug-report.sh 在当前工作目录生成 nvidia-bug-report.log.gz。.gz 表示 gzip 压缩，可用 zcat 直接查看，或 gunzip 解压后阅读。压缩是为了减小体积、便于发给 NVIDIA 支持。","s":"","src":"lab"},{"id":"tm-diag-019","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"nvidia-bug-report.sh generates an incomplete report with warnings about missing information. What is the most likely cause?","zq":"nvidia-bug-report.sh 生成的报告不完整，并提示部分信息缺失。最可能的原因是什么？","o":["The disk is full and the report cannot be written","The script was run without root/sudo privileges, preventing it from accessing kernel logs, device files, and driver internals","The NVIDIA driver version is too old for the bug report tool","The system has too many GPUs for the report tool to handle"],"zo":["磁盘已满，报告写不下去","脚本没有以 root/sudo 运行，因而无法读取内核日志、设备文件与驱动内部状态","NVIDIA 驱动版本对报告工具来说太旧","GPU 数量太多，报告工具处理不了"],"a":1,"e":"nvidia-bug-report.sh requires root privileges to collect complete information. Without root: dmesg (kernel ring buffer) may be restricted, /dev/nvidia* device file details may be inaccessible, driver internal state cannot be queried, and some system configuration files cannot be read. Always run as 'sudo nvidia-bug-report.sh' to ensure a complete diagnostic bundle.","ze":"脚本需要 root 才能采集完整信息：非 root 时 dmesg（内核环形缓冲）可能受限、/dev/nvidia* 设备细节不可读、驱动内部状态查不到、部分系统配置文件无法读取。始终用 sudo nvidia-bug-report.sh 运行。","s":"","src":"lab"},{"id":"tm-diag-020","d":"4","m":0,"t":"gpu-burn","c":"参数用法","q":"Which gpu-burn flag forces the stress test to use double-precision (FP64) floating-point operations?","zq":"哪个 gpu-burn 参数强制压力测试使用双精度（FP64）浮点运算？","o":["gpu-burn --fp64 120","gpu-burn -d 120","gpu-burn --double 120","gpu-burn -p double 120"],"zo":["gpu-burn --fp64 120","gpu-burn -d 120","gpu-burn --double 120","gpu-burn -p double 120"],"a":1,"e":"gpu-burn -d enables double-precision (FP64) mode for the stress test. Without -d, gpu-burn uses single-precision (FP32) by default. Double-precision tests are important because A100 and H100 GPUs have significant FP64 compute capability used in scientific computing workloads. FP64 mode also generates more heat, making it better for thermal stress testing.","ze":"-d 让压测使用双精度（FP64）。不加 -d 时默认单精度（FP32）。A100/H100 的 FP64 算力在科学计算中很重要；FP64 也更耗电、发热更高，更适合做热压力测试。","s":"","src":"lab"},{"id":"tm-diag-021","d":"4","m":0,"t":"gpu-burn","c":"输出判读","q":"What does this gpu-burn temperature progression indicate?","zq":"这段 gpu-burn 温度变化说明了什么？","o":["The GPU is overheating and will soon reach critical temperature","The GPU temperature rose from 45C to 79C and stabilized, showing normal thermal saturation behavior with consistent Gflop/s, indicating healthy cooling","The decreasing Gflop/s indicates the GPU is throttling","The test should be stopped because temperature has plateaued"],"zo":["GPU 正在过热，很快会达到临界温度","温度从 45℃ 升至 79℃ 后趋于稳定，Gflop/s 保持一致，属正常的热饱和过程，说明散热健康","Gflop/s 下降说明 GPU 在降频","温度已经平台化，应停止测试"],"a":1,"e":"This shows a healthy thermal profile. The GPU temperature rises from ambient (45C) during ramp-up, then stabilizes at 79C after about 2 minutes as the cooling system reaches equilibrium. The Gflop/s decrease is minimal (18230 to 18172, less than 0.5%) and consistent with slight thermal management adjustments. A problematic GPU would show continued temperature rise or significant Gflop/s drops.","ze":"温度从 45℃ 升到 79℃ 后趋于稳定，Gflop/s 只小幅下降（18230→18172，不到 0.5%），说明散热系统约 2 分钟达到平衡，是健康的热饱和曲线。有问题的卡会持续升温，或出现明显的性能跌落。","s":"GPU 0: OK - temp: 45C - 18230 Gflop/s  (10s elapsed)\nGPU 0: OK - temp: 62C - 18215 Gflop/s  (30s elapsed)\nGPU 0: OK - temp: 75C - 18198 Gflop/s  (60s elapsed)\nGPU 0: OK - temp: 78C - 18180 Gflop/s  (120s elapsed)\nGPU 0: OK - temp: 79C - 18175 Gflop/s  (180s elapsed)\nGPU 0: OK - temp: 79C - 18172 Gflop/s  (240s elapsed)","src":"lab"},{"id":"tm-diag-022","d":"5","m":0,"t":"gpu-burn","c":"故障排查","q":"gpu-burn exits immediately with 'CUDA Error: out of memory' on a GPU that nvidia-smi shows as having 80 GB free. What could cause this?","zq":"gpu-burn 在一台 nvidia-smi 显示还有 80 GB 空闲显存的 GPU 上立即报 “CUDA Error: out of memory” 退出，可能是什么原因？","o":["gpu-burn has a memory leak in its initialization code","Another process has allocated GPU memory without actively using it (showing 0% utilization in nvidia-smi but reserving memory), or ECC page retirements have reduced available memory below what gpu-burn requires","The GPU's memory clock is running too slowly","gpu-burn does not support GPUs with more than 40 GB memory"],"zo":["gpu-burn 初始化代码有内存泄漏","有其他进程占用了显存但并未真正计算（nvidia-smi 里利用率为 0% 但显存被预留），或 ECC 页退役使可用显存低于 gpu-burn 所需","GPU 显存频率过低","gpu-burn 不支持 40 GB 以上显存的 GPU"],"a":1,"e":"nvidia-smi's 'free' memory may not reflect reservations by idle processes or frameworks like PyTorch that pre-allocate GPU memory. Check nvidia-smi for processes holding memory with 'nvidia-smi pmon'. Also, extensive ECC page retirements (nvidia-smi -q -d RETIRED_PAGES) can reduce usable memory. Kill any idle processes holding GPU memory before running gpu-burn.","ze":"nvidia-smi 显示的“空闲”显存未必反映被空闲进程或 PyTorch 这类框架预留的显存。可用 nvidia-smi pmon 查看占着显存的进程；此外大量 ECC 页退役（nvidia-smi -q -d RETIRED_PAGES）也会把可用显存压到 gpu-burn 所需之下。跑之前先清理占用显存的空闲进程。","s":"","src":"lab"},{"id":"tm-diag-023","d":"4","m":0,"t":"dcgmi diag","c":"最佳实践","q":"What is the recommended diagnostic sequence when bringing up a new DGX node before putting it into production?","zq":"新 DGX 节点上架、投入生产之前，推荐的诊断顺序是什么？","o":["Just run gpu-burn for 5 minutes and deploy if it passes","Run dcgmi diag -r 1 first to verify basic deployment, then -r 3 for comprehensive hardware validation, followed by gpu-burn for extended thermal stress testing","Only check nvidia-smi output and deploy if all GPUs are visible","Run nvidia-bug-report.sh and send it to NVIDIA support for approval"],"zo":["只跑 5 分钟 gpu-burn，通过就上线","先跑 dcgmi diag -r 1 验证基础部署，再跑 -r 3 做全面硬件验证，最后用 gpu-burn 做长时间热压力测试","只看 nvidia-smi 输出，GPU 都能看到就上线","跑 nvidia-bug-report.sh 发给 NVIDIA 支持等批准"],"a":1,"e":"A proper bring-up sequence starts with dcgmi diag -r 1 to quickly verify driver installation and basic GPU health (seconds). If that passes, dcgmi diag -r 3 tests all subsystems including PCIe, memory, NVLink, and compute (15+ minutes). Finally, gpu-burn runs an extended stress test (1-4 hours) to verify thermal stability under sustained load. This layered approach catches issues at each level.","ze":"正确顺序：先用 dcgmi diag -r 1 快速确认驱动与基础健康（秒级）；再 -r 3 全面测试 PCIe、内存、NVLink 与计算（15 分钟以上）；最后 gpu-burn 做 1~4 小时长时间压力测试，验证持续负载下的热稳定性。分层递进能在每一级捕获问题。","s":"","src":"lab"},{"id":"tm-diag-024","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When filing an RMA request for a failed GPU, which diagnostic artifacts should you include?","zq":"为一台故障 GPU 提交 RMA 时，应包含哪些诊断产物？","o":["Only the nvidia-smi output showing the error","The nvidia-bug-report.log.gz, the dcgmi diag -r 3 output, the nvidia-smi -q output for the failed GPU, and the GPU serial number recorded from nvidia-smi -q","A photo of the GPU and the purchase receipt","Only the dmesg output showing XID errors"],"zo":["只提供显示错误的 nvidia-smi 输出","nvidia-bug-report.log.gz、dcgmi diag -r 3 的输出、该故障 GPU 的 nvidia-smi -q 输出，以及从 nvidia-smi -q 中记录的 GPU 序列号","GPU 的照片和采购发票","只提供显示 XID 错误的 dmesg 输出"],"a":1,"e":"The Xid Errors and GPU Debug Guidelines both direct you to collect the system configuration, the relevant log messages, the list of debugging steps already taken, the output of nvidia-bug-report.sh, the Fabric Manager logs on HGX systems, and the DCGM diagnostic logs before opening a case with the hardware vendor. The GPU serial number identifies the exact unit for the RMA, and it is recorded in the nvidia-smi -q output.","ze":"Xid Errors 与 GPU 调试指南都要求：在向硬件厂商提交工单前，收集系统配置、相关日志消息、已采取的调试步骤清单、nvidia-bug-report.sh 的输出、HGX 系统上的 Fabric Manager 日志，以及 DCGM 诊断日志。GPU 序列号用于确定 RMA 的具体单元，记录在 nvidia-smi -q 的输出里。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/gpu-debug-guidelines/gpu-node-triage.html | Reporting a GPU issue; data to collect"},{"id":"tm-diag-025","d":"4","m":0,"t":"gpu-burn","c":"命令语法","q":"How would you run gpu-burn to stress test only specific GPUs (e.g., GPUs 2 and 5) rather than all GPUs in the system?","zq":"如何让 gpu-burn 只压测指定的 GPU（例如 GPU 2 和 5），而不是全部 GPU？","o":["gpu-burn --gpus 2,5 300","gpu-burn -i 2,5 300","Set CUDA_VISIBLE_DEVICES=2,5 before running gpu-burn 300","gpu-burn 300 --device 2 --device 5"],"zo":["gpu-burn --gpus 2,5 300","gpu-burn -i 2,5 300","运行前设置环境变量 CUDA_VISIBLE_DEVICES=2,5，再执行 gpu-burn 300","gpu-burn 300 --device 2 --device 5"],"a":2,"e":"gpu-burn does not have a built-in GPU selection flag. To limit which GPUs are tested, use the CUDA_VISIBLE_DEVICES environment variable. Setting 'CUDA_VISIBLE_DEVICES=2,5 gpu-burn 300' makes gpu-burn only see and test GPUs 2 and 5. This environment variable is a standard CUDA mechanism for controlling GPU visibility that works with all CUDA applications.","ze":"gpu-burn 没有内置的 GPU 选择参数，需用环境变量 CUDA_VISIBLE_DEVICES 限制可见设备：CUDA_VISIBLE_DEVICES=2,5 gpu-burn 300 就只测 2、5 号卡。这是 CUDA 通用的可见性控制机制，对所有 CUDA 应用都有效。","s":"","src":"lab"},{"id":"tm-xid-001","d":"5","m":0,"t":"dmesg","c":"命令语法","q":"Which dmesg command filters kernel logs to show only NVIDIA GPU XID errors?","zq":"哪条 dmesg 命令可把内核日志过滤为只显示 NVIDIA GPU 的 XID 错误？","o":["dmesg | grep -i 'NVRM: Xid'","dmesg --filter=nvidia","dmesg -d nvidia-xid","dmesg | grep GPU_ERROR"],"zo":["dmesg | grep -i 'NVRM: Xid'","dmesg --filter=nvidia","dmesg -d nvidia-xid","dmesg | grep GPU_ERROR"],"a":0,"e":"NVIDIA kernel driver messages are logged with the 'NVRM' prefix. XID errors specifically appear as 'NVRM: Xid' entries in the kernel ring buffer. Using 'dmesg | grep -i \"NVRM: Xid\"' filters for these GPU error messages.","ze":"NVIDIA 内核驱动的消息以 NVRM 前缀记录，XID 错误在内核环形缓冲中表现为“NVRM: Xid”。用 dmesg | grep -i \"NVRM: Xid\" 即可筛出这些 GPU 错误。","s":"","src":"lab"},{"id":"tm-xid-002","d":"5","m":0,"t":"dmesg","c":"输出判读","q":"What does this dmesg output indicate?","zq":"这段 dmesg 输出说明了什么？","o":["A single-bit correctable ECC error that can be safely ignored","A double-bit uncorrectable ECC error on GPU at PCI 3b:00, meaning GPU memory has produced an error that ECC cannot correct","A driver timeout that requires a process restart","A PCIe link training failure requiring a system reboot"],"zo":["可安全忽略的单比特可纠正 ECC 错误","PCI 3b:00 这块 GPU 出现双位不可纠正 ECC 错误，即显存产生了 ECC 无法纠正的错误","驱动超时，需要重启进程","PCIe 链路训练失败，需要重启系统"],"a":1,"e":"Xid 48 is ROBUST_CHANNEL_GPU_ECC_DBE, an uncorrectable double-bit ECC error on the GPU. Clearing it requires a GPU reset or a node reboot, so it cannot simply be ignored. Repeated occurrence is a memory-health signal that should go through field diagnostics before any RMA decision. Single-bit errors are the ones ECC corrects transparently, and they surface as Xid 92 when the rate becomes elevated.","ze":"Xid 48 是 ROBUST_CHANNEL_GPU_ECC_DBE，GPU 上不可纠正的双位 ECC 错误。清除它需要重置 GPU 或重启节点，因此不能简单忽略。反复出现属显存健康信号，应先做现场诊断再决定是否 RMA。ECC 能透明纠正的是单比特错误，其错误率升高时表现为 Xid 92。","s":"[12345.678] NVRM: Xid (PCI:0000:3b:00): 48, pid=5432, name=python3, Ch 00000010\n[12345.679] NVRM: Xid (PCI:0000:3b:00): 48, pid=5432, name=python3, Ch 00000010","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 48 GPU_ECC_DBE; Xid 92 excessive single-bit rate"},{"id":"tm-xid-003","d":"5","m":0,"t":"dmesg","c":"输出判读","q":"What does XID error code 79 in dmesg indicate?","zq":"dmesg 中的 XID 79 表示什么？","o":["The GPU driver crashed and needs to be reloaded","The GPU has fallen off the PCIe bus — a critical hardware failure requiring physical intervention","The GPU firmware needs an update","The GPU is throttling due to excessive temperature"],"zo":["GPU 驱动崩溃，需要重新加载","GPU 已从 PCIe 总线掉线——属严重硬件故障，需要物理干预","GPU 固件需要升级","GPU 因温度过高而降频"],"a":1,"e":"XID 79 means the GPU has lost communication with the system over the PCIe bus. The 'fallen off the bus' message confirms a critical hardware event. This typically requires reseating the GPU in its PCIe slot, checking PCIe cables, or replacing the GPU. A system reboot is required to recover.","ze":"XID 79 表示 GPU 已通过 PCIe 与系统失去通信，“fallen off the bus”确认这是严重硬件事件。通常需要重新插拔 GPU、检查 PCIe 线缆或更换 GPU，并且必须重启系统才能恢复。","s":"[98765.432] NVRM: Xid (PCI:0000:86:00): 79, pid='<unknown>', name=<unknown>\n[98765.433] NVRM: GPU at PCI:0000:86:00 has fallen off the bus","src":"lab"},{"id":"tm-xid-004","d":"5","m":0,"t":"dmesg","c":"参数用法","q":"Which dmesg option adds human-readable timestamps to the output, making it easier to correlate XID errors with other system events?","zq":"哪个 dmesg 选项可把时间戳转换为人类可读时间，便于把 XID 错误与其他系统事件对齐？","o":["dmesg -T","dmesg --timestamp","dmesg -v","dmesg --human-time"],"zo":["dmesg -T","dmesg --timestamp","dmesg -v","dmesg --human-time"],"a":0,"e":"The -T flag converts the kernel's monotonic clock timestamps to human-readable local time format. This is essential when correlating XID errors with application logs, job scheduler events, or hardware monitoring timestamps.","ze":"-T 把内核单调时钟时间戳转换为人类可读的本地时间，便于把 XID 错误与应用日志、作业调度事件、监控数据的时间对齐。","s":"","src":"lab"},{"id":"tm-xid-005","d":"4","m":0,"t":"dmesg","c":"输出判读","q":"A dmesg log shows repeated XID 63 errors on GPU 3. What is the correct interpretation and action?","zq":"dmesg 日志里 GPU 3 反复出现 XID 63。正确的理解与处置是什么？","o":["It is an informational record of a row-remapping event; the node can keep running and the GPU can be reset at a convenient time","The GPU has exhausted its error correction capacity and must be replaced immediately","The GPU driver has crashed and must be reinstalled","The GPU is overheating and the fan speed must be adjusted"],"zo":["这是行重映射事件的信息性记录；节点可以继续运行，在方便的时候重置该 GPU 即可","GPU 纠错能力已耗尽，必须立即更换","GPU 驱动已崩溃，必须重装","GPU 过热，需要调整风扇转速"],"a":0,"e":"Xid 63 is INFOROM_DRAM_RETIREMENT_EVENT, described as a GPU memory remapping event, and its resolution bucket is IGNORE for both the immediate and the investigatory action. The GPU Debug Guidelines add that unless the code is associated with another error, the system can keep running and the GPU can be reset at a convenient time. The event that records a failed remap operation is a different code, Xid 64.","ze":"Xid 63 是 INFOROM_DRAM_RETIREMENT_EVENT，官方描述为显存重映射事件，即时与调查两个处置桶都是 IGNORE。GPU 调试指南补充：只要不伴随其它错误，系统可以继续运行，在方便的时候重置该 GPU 即可。表示重映射记录失败的是另一个码 Xid 64。","s":"[45678.901] NVRM: Xid (PCI:0000:c1:00): 63, pid=0, Row Remapper: New row marked for remapping\n[45678.902] NVRM: Xid (PCI:0000:c1:00): 63, pid=0, Row Remapper: New row marked for remapping","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 63 INFOROM_DRAM_RETIREMENT_EVENT, informational"},{"id":"tm-xid-006","d":"5","m":0,"t":"dmesg","c":"故障排查","q":"You see XID 31 errors in dmesg that only occur during a specific training job. What is the most likely root cause?","zq":"dmesg 中的 XID 31 只在某个特定训练作业中出现，最可能的根因是？","o":["Faulty GPU hardware that needs replacement","A bug in the application code causing illegal memory access on the GPU","Insufficient PCIe bandwidth between GPUs","NVLink cable degradation"],"zo":["GPU 硬件故障，需要更换","应用代码存在 bug，导致对 GPU 的非法显存访问","GPU 之间 PCIe 带宽不足","NVLink 线缆劣化"],"a":1,"e":"XID 31 indicates a GPU memory page fault — an access to an invalid GPU memory address. When this error only occurs with a specific application, it almost always indicates a software bug such as an out-of-bounds memory access, use-after-free, or incorrect CUDA memory management. If the error occurred across multiple applications, hardware would be more suspect.","ze":"XID 31 是 GPU 显存缺页——访问了非法的 GPU 显存地址。只在特定应用出现时，几乎总是软件 bug：越界访问、释放后使用（use-after-free）或 CUDA 显存管理错误。若多个应用都出现，才更应怀疑硬件。","s":"","src":"lab"},{"id":"tm-xid-007","d":"5","m":0,"t":"dmesg","c":"概念理解","q":"What is the relationship between XID error codes and the NVIDIA kernel module (NVRM)?","zq":"XID 错误码与 NVIDIA 内核模块（NVRM）之间是什么关系？","o":["XID codes are generated by the CUDA runtime library","XID codes are generated by the NVIDIA kernel driver (NVRM) and printed to the kernel log, which is why they appear in dmesg and journalctl","XID codes are generated by the DCGM daemon","XID codes are generated by nvidia-smi polling"],"zo":["XID 码由 CUDA 运行时库产生","XID 码由 NVIDIA 内核驱动（NVRM）产生并写入内核日志，因此会出现在 dmesg 与 journalctl 中","XID 码由 DCGM 守护进程产生","XID 码由 nvidia-smi 轮询产生"],"a":1,"e":"The Xid Errors document defines Xid messages as error reports from the NVIDIA driver that are printed to the operating system kernel log or event log, and notes that they are most commonly caused by the driver programming the GPU incorrectly or by a corrupted command sent to the GPU. They may indicate a hardware problem, an NVIDIA software problem, or a user application problem. That is why the messages carry the NVRM prefix and are read from dmesg on Linux.","ze":"Xid Errors 文档把 Xid 消息定义为「来自 NVIDIA 驱动的错误报告，打印到操作系统的内核日志或事件日志」，并说明最常见的原因是驱动对 GPU 的编程不正确，或发送到 GPU 的命令已损坏；它可能指向硬件问题、NVIDIA 软件问题或用户应用问题。因此这些消息带 NVRM 前缀，在 Linux 下从 dmesg 读取。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/index.html | What is an Xid message"},{"id":"tm-xid-008","d":"4","m":0,"t":"nvidia-smi","c":"命令语法","q":"Which nvidia-smi command displays the count of ECC page retirements related to double-bit errors?","zq":"哪条 nvidia-smi 命令可显示与双比特错误相关的 ECC 页退役计数？","o":["nvidia-smi -q -d PAGE_RETIREMENT","nvidia-smi --ecc-errors","nvidia-smi -q -d ECC_PAGES","nvidia-smi --retirement-count"],"zo":["nvidia-smi -q -d PAGE_RETIREMENT","nvidia-smi --ecc-errors","nvidia-smi -q -d ECC_PAGES","nvidia-smi --retirement-count"],"a":0,"e":"The command 'nvidia-smi -q -d PAGE_RETIREMENT' displays retired page information including single-bit and double-bit retirement causes, pending retirements, and whether a reboot is needed to apply pending retirements. This is the primary tool for assessing GPU memory health after XID 48 or XID 63 errors.","ze":"nvidia-smi -q -d PAGE_RETIREMENT 显示退役页信息：单比特与双比特退役原因、待生效的退役、以及是否需要重启才能应用。XID 48 或 63 之后，这是评估显存健康的主要工具。","s":"","src":"lab"},{"id":"tm-xid-009","d":"4","m":0,"t":"nvidia-smi","c":"输出判读","q":"What does this nvidia-smi ECC output tell you about the GPU's health?","zq":"这段 nvidia-smi ECC 输出说明该 GPU 的健康状况如何？","o":["The GPU is failing and must be replaced immediately","The GPU has historical uncorrectable errors but is currently stable — monitor closely and plan replacement","The GPU is perfectly healthy with only correctable errors","ECC is malfunctioning and needs to be disabled"],"zo":["GPU 已失效，必须立即更换","GPU 历史上出现过不可纠正错误，但当前稳定——应密切监控并计划更换","GPU 完全健康，只有可纠正错误","ECC 功能异常，应关闭 ECC"],"a":1,"e":"Volatile counters (reset each boot) show zero uncorrectable errors — the GPU is currently stable. However, Aggregate counters (lifetime) show 2 SRAM uncorrectable and 1 DRAM uncorrectable errors historically. This GPU has experienced serious errors in the past. While stable now, it should be monitored closely and scheduled for replacement during the next maintenance window.","ze":"Volatile（每次启动清零）显示 0 个不可纠正错误——当前是稳定的；但 Aggregate（全生命周期）记录有 2 个 SRAM 不可纠正与 1 个 DRAM 不可纠正错误，说明历史上出现过严重问题。应密切监控，并在下次维护窗口安排更换。","s":"$ nvidia-smi -q -d ECC -i 2\n    ECC Errors\n        Volatile\n            SRAM Correctable              : 0\n            SRAM Uncorrectable            : 0\n            DRAM Correctable              : 142\n            DRAM Uncorrectable            : 0\n        Aggregate\n            SRAM Correctable              : 0\n            SRAM Uncorrectable            : 2\n            DRAM Correctable              : 3847\n            DRAM Uncorrectable            : 1","src":"lab"},{"id":"tm-xid-010","d":"5","m":0,"t":"nvidia-smi","c":"参数用法","q":"After a GPU reports XID 48 errors, which nvidia-smi command should you run first to assess the damage?","zq":"GPU 报出 XID 48 后，应先运行哪条 nvidia-smi 命令评估损伤？","o":["nvidia-smi -q -d PERFORMANCE","nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>","nvidia-smi --reset-ecc-errors","nvidia-smi -pl 300"],"zo":["nvidia-smi -q -d PERFORMANCE","nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>","nvidia-smi --reset-ecc-errors","nvidia-smi -pl 300"],"a":1,"e":"After XID 48 (double-bit ECC error), you need to check both ECC error counts and page retirement status. The combined query 'nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu_id>' shows current error counts, whether pages were retired, and if a reboot is pending to apply retirements.","ze":"XID 48 之后需要同时看 ECC 计数与页退役状态：nvidia-smi -q -d ECC,PAGE_RETIREMENT -i <gpu> 会显示当前错误计数、是否发生页退役、是否需要重启才能应用退役。","s":"","src":"lab"},{"id":"tm-xid-011","d":"5","m":0,"t":"nvidia-smi","c":"输出判读","q":"You run nvidia-smi and see ERR! in the GPU utilization column. What condition does this typically indicate?","zq":"运行 nvidia-smi 时 GPU 利用率一列显示 ERR!。这通常说明什么情况？","o":["The GPU is overclocked beyond safe limits","The GPU is in a critical error state that nvidia-smi cannot read reliably, typically after an uncorrectable ECC error (Xid 48) or the GPU dropping off the bus (Xid 79)","The nvidia-smi binary is outdated and needs updating","The GPU is in MIG mode and cannot report utilization"],"zo":["GPU 被超频到超出安全范围","GPU 处于 nvidia-smi 无法可靠读取的关键错误状态，通常发生在不可纠正 ECC 错误（Xid 48）或 GPU 掉总线（Xid 79）之后","nvidia-smi 程序版本过旧，需要更新","GPU 处于 MIG 模式，无法上报利用率"],"a":1,"e":"ERR! means nvidia-smi could not obtain a usable reading from the device. In practice this follows states where the GPU is no longer healthy enough to answer queries, such as an uncorrectable double-bit ECC error (Xid 48) or a bus drop (Xid 79). Recovery starts with a GPU reset, driver reload or node reboot, and the underlying code must be identified from dmesg first. Note that Xid 64 is a row-remapping record failure, not a compute exception.","ze":"ERR! 表示 nvidia-smi 无法从设备取得可用读数。实际情况中它出现在 GPU 已不足以正常应答查询的状态之后，例如不可纠正的双位 ECC 错误（Xid 48）或掉总线（Xid 79）。处置从重置 GPU、重载驱动或重启节点开始，并且必须先从 dmesg 里确认到底是哪个码。注意 Xid 64 是行重映射记录失败，不是计算异常。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 48 and Xid 79 resolution buckets"},{"id":"tm-xid-012","d":"5","m":0,"t":"nvidia-smi","c":"故障排查","q":"A GPU shows XID 13 errors during training. Even though Xid 13 is normally an application fault, which command helps rule out thermal throttling as a contributing factor?","zq":"训练过程中某 GPU 出现 XID 13。虽然 Xid 13 通常是应用故障，但用哪条命令可以排除热降频这一影响因素？","o":["nvidia-smi -q -d TEMPERATURE,POWER -i <gpu_id>","nvidia-smi --gpu-reset -i <gpu_id>","nvidia-smi -q -d CLOCK","nvidia-smi dmon -s t"],"zo":["nvidia-smi -q -d TEMPERATURE,POWER -i <gpu_id>","nvidia-smi --gpu-reset -i <gpu_id>","nvidia-smi -q -d CLOCK","nvidia-smi dmon -s t"],"a":0,"e":"The catalog describes Xid 13 (ROBUST_CHANNEL_GR_EXCEPTION) as a graphics engine exception logged for general user application faults, typically an out-of-bounds access, and NVIDIA recommends reproducing it under cuda-gdb or Compute Sanitizer memcheck. Thermal throttling is not a documented cause, so the real fix is application-side debugging. Ruling out a thermal contribution is still a cheap check: nvidia-smi -q -d TEMPERATURE,POWER shows current temperature against the slowdown and shutdown thresholds plus the power draw.","ze":"官方目录把 Xid 13（ROBUST_CHANNEL_GR_EXCEPTION）描述为图形引擎异常，记录的是通用的用户程序故障，典型是数组越界，NVIDIA 建议用 cuda-gdb 或 Compute Sanitizer memcheck 复现。热降频不是官方列出的成因，真正的修法在应用侧。不过排除热的影响成本很低：nvidia-smi -q -d TEMPERATURE,POWER 能看当前温度相对降频与关机阈值的位置，以及功耗。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 13 GR_EXCEPTION and recommended debugging tools"},{"id":"tm-xid-013","d":"5","m":0,"t":"nvidia-smi","c":"最佳实践","q":"What is the recommended first step when nvidia-smi shows a GPU with persistent XID errors?","zq":"当 nvidia-smi 显示某 GPU 存在持续性 XID 错误时，推荐的第一步是？","o":["Immediately replace the GPU hardware","Reset the GPU ECC error counters and see if errors reappear","Isolate the GPU by draining it from the job scheduler, then run diagnostics","Reboot the entire node immediately"],"zo":["立即更换 GPU 硬件","清零 GPU 的 ECC 错误计数器，看错误是否复现","先在调度器中把该 GPU drain 隔离，再运行诊断","立即重启整台节点"],"a":2,"e":"The recommended workflow is: (1) drain the node or specific GPU from the job scheduler to prevent new jobs, (2) run DCGM diagnostics to assess the GPU's health, (3) check ECC counts and page retirements, (4) decide on remediation. Immediately replacing hardware or rebooting wastes time if the issue is software-related, and resetting counters loses diagnostic evidence.","ze":"推荐流程：1) 在调度器里把节点或该 GPU drain 掉，阻止新作业；2) 跑 DCGM 诊断评估健康；3) 查 ECC 计数与页退役；4) 再决定处置。贸然换件或重启会浪费时间（若其实是软件问题），而清零计数器会丢失诊断证据。","s":"","src":"lab"},{"id":"tm-xid-014","d":"4","m":0,"t":"nvidia-smi","c":"概念理解","q":"What is the difference between volatile and aggregate ECC error counters in nvidia-smi?","zq":"nvidia-smi 中的 volatile 与 aggregate ECC 计数器有什么区别？","o":["Volatile counts errors in GPU L2 cache; aggregate counts errors in HBM","Volatile counts since last driver load; aggregate counts across all time since manufacturing","Volatile counts correctable errors; aggregate counts uncorrectable errors","Volatile counts single-GPU errors; aggregate counts multi-GPU NVLink errors"],"zo":["volatile 统计 L2 缓存错误，aggregate 统计 HBM 错误","volatile 统计自上次驱动加载以来的错误；aggregate 统计自出厂以来的全部错误","volatile 统计可纠正错误，aggregate 统计不可纠正错误","volatile 统计单卡错误，aggregate 统计多卡 NVLink 错误"],"a":1,"e":"Volatile ECC counters reset when the GPU driver is loaded (typically at boot). They show errors accumulated during the current session. Aggregate counters persist across driver loads and reboots — they represent the GPU's lifetime error history stored in the GPU's InfoROM. Comparing both tells you whether errors are a new issue or chronic.","ze":"Volatile 计数器在驱动加载（通常开机）时清零，只反映本次会话；Aggregate 跨驱动加载与重启保留，记录 GPU 出厂以来的错误历史（存于 InfoROM）。对比两者即可判断是新出现的问题还是慢性问题。","s":"","src":"lab"},{"id":"tm-xid-015","d":"4","m":0,"t":"dcgmi","c":"命令语法","q":"Which DCGM diagnostic level is recommended for investigating XID errors after isolating a suspicious GPU?","zq":"隔离出可疑 GPU 之后，排查 XID 错误时推荐使用哪个 DCGM 诊断级别？","o":["dcgmi diag -r 1 (short — 30 seconds)","dcgmi diag -r 2 (medium — 2 minutes)","dcgmi diag -r 3 (long — 15+ minutes, includes stress tests)","dcgmi diag -r 0 (quick health check)"],"zo":["dcgmi diag -r 1（短，约 30 秒）","dcgmi diag -r 2（中，约 2 分钟）","dcgmi diag -r 3（长，15 分钟以上，含压力测试）","dcgmi diag -r 0（快速健康检查）"],"a":2,"e":"Level 3 (long diagnostic, via -r 3) runs comprehensive stress tests including memory bandwidth tests, compute stress tests, and PCIe throughput validation. After XID errors, you need a thorough assessment to determine if the GPU can reliably handle sustained workloads. Levels 1 and 2 may miss intermittent faults that only manifest under load.","ze":"3 级（-r 3）会运行内存带宽、计算压力与 PCIe 吞吐等完整压测。出现 XID 后需要判断该卡能否稳定承载持续负载，而 1、2 级可能漏掉只在带载下才暴露的间歇故障。","s":"","src":"lab"},{"id":"tm-xid-016","d":"4","m":0,"t":"dcgmi","c":"输出判读","q":"What does a DCGM health check result of 'Warning' for the 'Memory' subsystem suggest after XID errors?","zq":"出现 XID 错误后，DCGM 健康检查在“Memory”子系统上返回 Warning，说明什么？","o":["The GPU memory is completely failed and cannot be used","The GPU has accumulated ECC errors that haven't yet reached critical thresholds but warrant monitoring","The DCGM service is misconfigured","The GPU memory bandwidth is below expected performance"],"zo":["GPU 显存已完全失效，无法使用","GPU 累积了尚未达到临界阈值的 ECC 错误，需要持续监控","DCGM 服务配置有误","GPU 显存带宽低于预期性能"],"a":1,"e":"A 'Warning' status for the Memory subsystem in 'dcgmi health --check' means DCGM has detected ECC errors that are below the critical failure threshold but above normal levels. The GPU is still functional but showing signs of degradation. Schedule replacement during the next maintenance window.","ze":"Memory 子系统给出 Warning，表示检测到尚未达到临界阈值的 ECC 错误，但已高于正常水平。GPU 仍然可用，却已出现劣化迹象，应安排在下次维护窗口更换。","s":"","src":"lab"},{"id":"tm-xid-017","d":"4","m":0,"t":"dcgmi","c":"参数用法","q":"You want DCGM to watch a group of GPUs for XID errors and take an action automatically. Which DCGM capability is designed for this?","zq":"你希望 DCGM 针对一组 GPU 监视 XID 错误并自动触发动作。DCGM 的哪项能力是为这个设计的？","o":["Policy management: rules that watch health conditions for a group and trigger configured actions","dcgmi discovery, which enumerates the GPUs in the node","dcgmi diag, which runs diagnostic levels 1, 2 or 3","nvidia-bug-report.sh, which collects a debug archive"],"zo":["策略（policy）管理：为一组 GPU 定义监视健康条件并触发已配置动作的规则","dcgmi discovery，用于枚举节点内的 GPU","dcgmi diag，用于运行 1、2、3 级诊断","nvidia-bug-report.sh，用于收集调试归档"],"a":0,"e":"The Xid Errors document describes DCGM as a set of tools for managing and monitoring NVIDIA data center GPUs in a cluster, providing active health monitoring, comprehensive diagnostics, system alerts and governance policies. Policy is the part that turns a watched condition into an action. Diagnostics are the part that runs tests on demand: the GPU Debug Guidelines use dcgmi diag -r 1 for a quick check, -r 2 as a preflight before starting jobs, and -r 3 for a long stress test.","ze":"Xid Errors 文档把 DCGM 描述为一套用于在集群中管理和监控 NVIDIA 数据中心 GPU 的工具，提供主动健康监控、全面的诊断、系统警报与治理策略。策略（policy）负责把被监视的条件转成动作；诊断负责按需跑测试：GPU 调试指南用 dcgmi diag -r 1 做快速检查、-r 2 作为启动作业前的预检、-r 3 做长时间压力测试。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/index.html | DCGM: health monitoring, diagnostics, alerts and policies"},{"id":"tm-xid-018","d":"5","m":0,"t":"dcgmi","c":"故障排查","q":"A DCGM level-3 diagnostic reports FAIL on the Diagnostic test for GPU 5. The GPU previously showed XID 64 errors. What should you do?","zq":"DCGM 3 级诊断在 GPU 5 的 Diagnostic 测试上报告 FAIL，而该 GPU 之前出现过 XID 64。应当怎么做？","o":["Reset the ECC counters and retry the diagnostic","Update the GPU firmware and rerun","Mark the GPU for replacement: a failed row-remapping record plus a level-3 diagnostic failure is strong evidence of memory degradation","Lower the GPU power limit and retry"],"zo":["重置 ECC 计数器后重跑诊断","升级 GPU 固件后重跑","将该 GPU 标记为待更换：行重映射记录失败叠加 3 级诊断 FAIL，是显存劣化的强证据","降低 GPU 功耗上限后重试"],"a":2,"e":"Xid 64 is INFOROM_DRAM_RETIREMENT_FAILURE, a GPU memory remapping failure whose immediate resolution bucket is RESET_GPU: the record operation itself failed, so the GPU should be reset. If the condition persists after a reset and a level-3 diagnostic also fails, the combination is strong evidence of memory degradation and an RMA is the defensible next step. Resetting ECC counters only hides evidence.","ze":"Xid 64 是 INFOROM_DRAM_RETIREMENT_FAILURE，显存重映射失败，即时处置桶是 RESET_GPU：失败的是记录动作本身，应先重置该 GPU。若重置后仍复现、且 3 级诊断也 FAIL，两者叠加构成显存劣化的强证据，走 RMA 是站得住脚的下一步。重置 ECC 计数器只是把证据抹掉。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 64 INFOROM_DRAM_RETIREMENT_FAILURE, RESET_GPU"},{"id":"tm-xid-019","d":"5","m":0,"t":"dcgmi","c":"最佳实践","q":"What is the recommended sequence for using DCGM when triaging a GPU that reported XID errors during a training job?","zq":"训练作业中出现 XID 错误后，用 DCGM 排查的推荐顺序是？","o":["Run mode 3 diagnostic immediately while the job is still running","Stop the job, run 'dcgmi health --check', then 'dcgmi diag -r 3' if health shows warnings","Reboot the node first, then run diagnostics","Skip DCGM and go straight to hardware replacement"],"zo":["作业还在跑时立即执行 3 级诊断","先停掉作业，运行 dcgmi health --check，若健康检查出现告警再跑 dcgmi diag -r 3","先重启节点，再跑诊断","跳过 DCGM，直接换硬件"],"a":1,"e":"The recommended triage sequence is: (1) stop/drain workloads from the GPU, (2) run 'dcgmi health --check' for a quick subsystem assessment, (3) if any subsystem shows Warning or Error, run 'dcgmi diag --mode 3' for comprehensive stress testing. Running diagnostics while a job is active gives unreliable results. Rebooting before diagnostics can clear volatile error counters.","ze":"推荐顺序：1) 停掉或把作业移出该 GPU；2) 跑 dcgmi health --check 做快速子系统评估；3) 若某子系统出现 Warning/Error，再跑 dcgmi diag -r 3 做完整压测。作业运行中跑诊断结果不可靠；先重启则会清掉易失的错误计数。","s":"","src":"lab"},{"id":"tm-xid-020","d":"4","m":0,"t":"dcgmi","c":"概念理解","q":"What DCGM health subsystems are most relevant when investigating GPU XID errors?","zq":"排查 GPU XID 错误时，最相关的 DCGM 健康子系统有哪些？","o":["PCIe and NVLink subsystems only","Memory, GPU Core, and Thermal subsystems","Only the Memory subsystem","All 8 DCGM health subsystems equally"],"zo":["只有 PCIe 与 NVLink 子系统","Memory、GPU Core 与 Thermal 三个子系统","只有 Memory 子系统","8 个 DCGM 健康子系统同等重要"],"a":1,"e":"When investigating XID errors, the most relevant DCGM health subsystems are: Memory (ECC errors, page retirements), GPU Core (compute engine faults, hardware exceptions), and Thermal (overheating causing GPU instability). PCIe and NVLink are relevant for XID 79 (fallen off bus) but less common.","ze":"排查 XID 时最相关的三个子系统是 Memory（ECC 错误、页退役）、GPU Core（计算引擎故障、硬件异常）与 Thermal（过热导致不稳定）。PCIe 与 NVLink 主要与 XID 79（掉总线）等场景相关，相对少见。","s":"","src":"lab"},{"id":"tm-xid-021","d":"5","m":0,"t":"nvidia-bug-report","c":"命令语法","q":"What command generates a comprehensive NVIDIA diagnostic bundle for support escalation after XID errors?","zq":"出现 XID 错误后，用哪条命令生成完整的 NVIDIA 诊断包以便升级给支持团队？","o":["nvidia-bug-report.sh","nvidia-collect-logs --all","nvidia-smi --generate-report","dcgmi report --full"],"zo":["nvidia-bug-report.sh","nvidia-collect-logs --all","nvidia-smi --generate-report","dcgmi report --full"],"a":0,"e":"nvidia-bug-report.sh generates a compressed archive containing GPU state, driver versions, kernel logs (including XID errors), PCI topology, ECC status, and system configuration. This is the standard artifact to include when escalating GPU issues to NVIDIA support.","ze":"nvidia-bug-report.sh 生成含 GPU 状态、驱动版本、内核日志（含 XID）、PCI 拓扑、ECC 状态与系统配置的压缩包，是向 NVIDIA 支持升级问题时的标准附件。","s":"","src":"lab"},{"id":"tm-xid-022","d":"5","m":0,"t":"nvidia-bug-report","c":"最佳实践","q":"When should you run nvidia-bug-report.sh relative to investigating XID errors?","zq":"相对 XID 排查流程，nvidia-bug-report.sh 应该在什么时候运行？","o":["After rebooting the system to get a clean state","Before rebooting or resetting the GPU — while error state is still in memory","Only after NVIDIA support requests it","It does not matter when you run it"],"zo":["重启系统、恢复干净状态之后","在重启或重置 GPU 之前——此时错误现场仍在内存中","只在 NVIDIA 支持要求时才跑","什么时候跑都一样"],"a":1,"e":"nvidia-bug-report.sh should be run before any reboot, GPU reset, or driver reload. The report captures volatile kernel logs (dmesg), current GPU state, and runtime error counters that are lost on reboot. Running it after a reboot produces a clean-looking report that lacks the critical error evidence needed for diagnosis.","ze":"应在任何重启、GPU 重置或驱动重载之前运行——报告捕获的 dmesg、当前 GPU 状态与运行时错误计数都是易失的。重启后再跑只会得到“看起来很干净”的报告，丢掉定位所需的证据。","s":"","src":"lab"},{"id":"tm-xid-023","d":"5","m":0,"t":"nvidia-bug-report","c":"参数用法","q":"Which option generates the nvidia-bug-report output to a specific file path?","zq":"哪个选项可把 nvidia-bug-report 的输出写到指定文件路径？","o":["nvidia-bug-report.sh --output-dir /tmp/gpu-report","nvidia-bug-report.sh --output-file /tmp/gpu-report.gz","nvidia-bug-report.sh -o /tmp/gpu-report","nvidia-bug-report.sh > /tmp/gpu-report.gz"],"zo":["nvidia-bug-report.sh --output-dir /tmp/gpu-report","nvidia-bug-report.sh --output-file /tmp/gpu-report.gz","nvidia-bug-report.sh -o /tmp/gpu-report","nvidia-bug-report.sh > /tmp/gpu-report.gz"],"a":1,"e":"nvidia-bug-report.sh uses --output-file to specify the output path for the compressed report archive. By default, it creates nvidia-bug-report.log.gz in the current directory. Specifying a custom path is useful when the current directory has limited space or when collecting reports from multiple nodes to a shared filesystem.","ze":"nvidia-bug-report.sh 用 --output-file 指定压缩报告的输出路径；默认在当前目录生成 nvidia-bug-report.log.gz。当前目录空间不足，或要把多台节点的报告汇总到共享存储时，自定义路径很有用。","s":"","src":"lab"},{"id":"tm-xid-024","d":"5","m":0,"t":"nvidia-bug-report","c":"概念理解","q":"What key information does nvidia-bug-report.sh capture that is relevant to XID error diagnosis?","zq":"nvidia-bug-report.sh 会捕获哪些与 XID 诊断相关的关键信息？","o":["Only the current nvidia-smi output","Kernel logs with XID errors, GPU state, ECC counters, PCIe topology, driver version, and system configuration","A screenshot of the GPU temperature graph","Only the DCGM diagnostic results"],"zo":["只有当前的 nvidia-smi 输出","含 XID 错误的内核日志、GPU 状态、ECC 计数器、PCIe 拓扑、驱动版本与系统配置","GPU 温度曲线截图","只有 DCGM 诊断结果"],"a":1,"e":"nvidia-bug-report.sh creates a comprehensive snapshot including: full dmesg with XID error history, nvidia-smi output for all GPUs, ECC error and page retirement counters, PCIe link status and topology, driver and firmware versions, and system configuration. This single artifact provides all the context needed to diagnose XID errors.","ze":"它生成的是完整快照：含 XID 历史的完整 dmesg、所有 GPU 的 nvidia-smi 输出、ECC 与页退役计数、PCIe 链路状态与拓扑、驱动与固件版本以及系统配置。一个文件就够定位 XID 问题。","s":"","src":"lab"},{"id":"tm-xid-025","d":"5","m":0,"t":"nvidia-bug-report","c":"故障排查","q":"You need to collect diagnostic data from a node where GPU 3 has XID 79 (fallen off bus) and nvidia-smi hangs. How should you proceed?","zq":"某节点 GPU 3 报 XID 79（掉总线），nvidia-smi 卡住。此时应如何采集诊断数据？","o":["Wait for nvidia-smi to respond, then run nvidia-bug-report.sh","Run nvidia-bug-report.sh; it normally completes quickly and has a safe mode that avoids the usual causes of hangs","Reboot the node first to restore GPU communication, then collect data","Skip data collection and replace the GPU immediately"],"zo":["等 nvidia-smi 恢复响应后再运行 nvidia-bug-report.sh","运行 nvidia-bug-report.sh；它通常很快完成，并带有可规避常见挂起原因的 safe mode","先重启节点恢复 GPU 通信，再采集数据","跳过数据采集，直接更换 GPU"],"a":1,"e":"The Xid Errors document states that nvidia-bug-report.sh usually runs quickly but in rare cases can be slow, and that you should allow up to an hour for it to finish. If it still hangs, the documented workaround is to run it with two extra arguments: nvidia-bug-report.sh --safe-mode --extra-system-data, which collects alternative logs to avoid the common causes of hangs during debug collection. Rebooting first would discard the volatile kernel evidence.","ze":"Xid Errors 文档说明 nvidia-bug-report.sh 通常很快执行完，但极少数情况下会很慢，应最多等一小时。若仍然挂住，官方给出的做法是带两个参数运行：nvidia-bug-report.sh --safe-mode --extra-system-data，它会采集备用日志以避开调试采集中常见的挂起原因。先重启节点会把易失的内核证据丢掉。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/index.html | nvidia-bug-report.sh, safe mode and extra system data"},{"id":"t1-xid13","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 13 indicate?","zq":"XID 13 错误表示什么？","o":["Graphics engine exception during shader or CUDA kernel execution","Uncorrectable double-bit ECC error in GPU memory","GPU has fallen off the PCIe bus","NVLink training failure between GPUs"],"zo":["着色器或 CUDA kernel 执行期间的图形引擎异常","GPU 显存中出现不可纠正的双比特 ECC 错误","GPU 已从 PCIe 总线掉线","GPU 之间的 NVLink 训练失败"],"a":0,"e":"XID 13 is a Graphics Engine Exception. It typically occurs during shader or CUDA kernel execution and is often caused by a misbehaving application, shader bug, or driver issue. It may also indicate a CUDA kernel timeout.","ze":"XID 13 是图形引擎异常，通常发生在着色器或 CUDA kernel 执行期间，多由应用行为异常、shader bug 或驱动问题引起，也可能表示 CUDA kernel 超时。","s":"","src":"lab"},{"id":"t1-xid27","d":"6","m":0,"t":"","c":"错误码识别","q":"According to the current NVIDIA Xid catalog, what is the status of Xid 27 on A100, H100, B100 and GB200 GPUs?","zq":"按当前 NVIDIA Xid 目录，Xid 27 在 A100、H100、B100、GB200 上的状态是什么？","o":["It reports a GPU memory interface failure between the GPU core and VRAM","It is marked Unused and does not apply to any of these GPU families","It reports a video processor exception on all data center GPUs","It reports that the NVSwitch fabric link is down"],"zo":["表示 GPU 核心与 VRAM 之间的显存接口故障","标记为 Unused（未使用），对上述任一 GPU 系列都不适用","在所有数据中心 GPU 上都表示视频处理器异常","表示 NVSwitch fabric 链路已断开"],"a":1,"e":"In the current Xid catalog Xid 27 (ROBUST_CHANNEL_VP_ERROR) is described as Unused and is marked as not applicable to A100, H100, B100 and GB200. Earlier Xid tables listed it as a video processor exception. A source that presents Xid 27 as a live memory-interface or fabric fault is not consistent with the official catalog.","ze":"当前 Xid 目录里 Xid 27（ROBUST_CHANNEL_VP_ERROR）的描述是 Unused，并标注对 A100、H100、B100、GB200 均不适用。更早的 Xid 表把它写成视频处理器异常。若有资料把 Xid 27 说成正在发生的显存接口或 fabric 故障，那与官方目录不一致。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 27 ROBUST_CHANNEL_VP_ERROR, Unused"},{"id":"t1-xid38","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 38 indicate?","zq":"XID 38 错误表示什么？","o":["A double-bit ECC error in GPU DRAM","A driver firmware error: the FECS watchdog timed out","The auxiliary power cable is not connected to the GPU","NVLink link training failed"],"zo":["GPU DRAM 中的双位 ECC 错误","驱动固件错误：FECS 看门狗超时","GPU 的辅助电源线未连接","NVLink 链路训练失败"],"a":1,"e":"Xid 38 is ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT, described in the catalog as a driver firmware error: the FECS (front-end context switch) microcontroller watchdog timed out. It is not a firmware version mismatch. The immediate resolution bucket is IGNORE; CONTACT_SUPPORT is the investigatory action.","ze":"Xid 38 是 ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT，官方描述为驱动固件错误：FECS（前端上下文切换）微控制器的看门狗超时，并不是固件版本不匹配。即时处置桶为 IGNORE，调查动作才是 CONTACT_SUPPORT。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 38 FECS_ERR_WATCHDOG_TIMEOUT, Driver firmware error"},{"id":"t1-xid43","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 43 indicate?","zq":"XID 43 错误表示什么？","o":["The GPU has stopped responding and cannot be recovered","A user application hit a software-induced fault and was terminated; the GPU itself remains healthy","An uncorrectable ECC error in GPU memory","The GPU has fallen off the PCIe bus"],"zo":["GPU 已停止响应且无法恢复","用户程序发生软件诱发的故障并被终止，GPU 本身仍处于健康状态","GPU 显存出现不可纠正的 ECC 错误","GPU 已从 PCIe 总线上脱落"],"a":1,"e":"Xid 43 is ROBUST_CHANNEL_RESETCHANNEL_VERIF_ERROR and its catalog headline is GPU stopped processing. The detail states that a user application hit a software-induced fault and must terminate, and that the GPU remains in a healthy state. In most cases it indicates a user application error rather than a driver bug or a failing GPU, so the code alone does not justify an RMA.","ze":"Xid 43 是 ROBUST_CHANNEL_RESETCHANNEL_VERIF_ERROR，目录标题为 GPU stopped processing。细则说明是用户程序遇到软件诱发的故障而被迫终止，且 GPU 仍保持健康状态。多数情况下它说明用户程序有问题，而不是驱动 bug 或 GPU 损坏，因此单凭这个码不能启动 RMA。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 43 RESETCHANNEL_VERIF_ERROR, GPU remains healthy"},{"id":"t1-xid48","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 48 indicate?","zq":"XID 48 错误表示什么？","o":["GPU memory page fault during application execution","Uncorrectable double-bit ECC error in GPU memory","High rate of correctable single-bit ECC errors","GPU memory interface communication failure"],"zo":["应用执行期间的 GPU 显存缺页","GPU 显存中不可纠正的双比特 ECC 错误","可纠正单比特 ECC 错误出现频率很高","GPU 内存接口通信失败"],"a":1,"e":"XID 48 is a Double-Bit ECC Error — an uncorrectable error in GPU memory. Unlike single-bit errors which can be corrected, double-bit errors indicate failing hardware. GPU replacement is required if errors persist.","ze":"XID 48 是双比特 ECC 错误——显存中的不可纠正错误。单比特可纠正，双比特说明硬件正在失效；若错误持续必须更换 GPU。","s":"","src":"lab"},{"id":"t1-xid54","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 54 indicate?","zq":"XID 54 错误表示什么？","o":["A hardware watchdog timeout: the GPU is unresponsive to internal health checks","The auxiliary power cable is not connected to the GPU board","The GPU is throttling because inlet temperature is too high","A double-bit ECC error was detected in GPU memory"],"zo":["硬件看门狗超时：GPU 对内部健康检查无响应","GPU 板卡的辅助电源线未连接","进风温度过高导致 GPU 降频","GPU 显存中检测到双位 ECC 错误"],"a":1,"e":"Xid 54 is SILENT_RUNNING_PWR_REDUCED_CLOCKING, described in the catalog as Auxiliary power is not connected to the GPU board. The immediate resolution bucket is CHECK_MECHANICALS, so verify the auxiliary power cabling before investigating thermals or memory.","ze":"Xid 54 是 SILENT_RUNNING_PWR_REDUCED_CLOCKING，官方描述为辅助电源未连接到 GPU 板卡。即时处置桶是 CHECK_MECHANICALS，应先核查辅助供电线缆，而不是先去查温度或显存。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 54 SILENT_RUNNING_PWR_REDUCED_CLOCKING, auxiliary power not connected"},{"id":"t1-xid63","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 63 indicate?","zq":"XID 63 错误表示什么？","o":["Row remapping failed, so the GPU can no longer correct memory errors","The GPU recorded a memory row-remapping event (ECC page retirement); this is informational","A double-bit ECC error that requires an immediate GPU reset","The GPU has fallen off the PCIe bus"],"zo":["行重映射失败，GPU 已无法纠正显存错误","GPU 记录了一次显存行重映射（ECC 页面退役）事件；属信息性事件","需要立即重置 GPU 的双位 ECC 错误","GPU 已从 PCIe 总线上脱落"],"a":1,"e":"Xid 63 is INFOROM_DRAM_RETIREMENT_EVENT, described as a GPU memory remapping event. It records row remapper or dynamic page retirement activity and is informational; the catalog resolution bucket is IGNORE for both actions. The failure to record such an event is Xid 64, and that is the code which requires action.","ze":"Xid 63 是 INFOROM_DRAM_RETIREMENT_EVENT，官方描述为显存重映射事件，记录行重映射器或动态页面退役的活动，属信息性事件，目录里即时与调查两个处置桶都是 IGNORE。表示记录失败的是 Xid 64，那才是需要处置的。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 63 INFOROM_DRAM_RETIREMENT_EVENT, informational"},{"id":"t1-xid74","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 74 indicate?","zq":"XID 74 错误表示什么？","o":["GPU memory interface communication failure","Driver firmware version mismatch","NVLink error — fault detected on NVLink interconnect","GPU thermal throttling activated"],"zo":["GPU 内存接口通信失败","驱动与固件版本不匹配","NVLink 错误——在 NVLink 互联上检测到故障","GPU 热降频已启用"],"a":2,"e":"XID 74 is an NVLink Error, indicating a fault detected on the NVLink interconnect. Causes include NVLink cable faults, GPU seating issues, or hardware failure on the NVLink bridge. Checking NVLink status with nvidia-smi nvlink -s and verifying physical connections are the first steps.","ze":"XID 74 是 NVLink 错误：在 NVLink 互联上检测到故障。原因包括 NVLink 线缆故障、GPU 未插好、NVLink 桥硬件失效。应先用 nvidia-smi nvlink -s 检查状态并确认物理连接。","s":"","src":"lab"},{"id":"t1-xid79","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 79 indicate?","zq":"XID 79 错误表示什么？","o":["GPU stopped responding but can be reset","GPU has fallen off the PCIe bus and is completely unreachable","NVLink timeout during GPU-to-GPU communication","ECC error that could not be contained"],"zo":["GPU 停止响应，但可以重置","GPU 已从 PCIe 总线掉线，完全无法访问","GPU 间通信时 NVLink 超时","无法被隔离的 ECC 错误"],"a":1,"e":"XID 79 means the GPU has fallen off the PCIe bus — it is completely unresponsive and disconnected. This is a severe hardware failure caused by power issues, thermal shutdown, or PCIe link failure. GPU reset will NOT work because the GPU is unreachable. A node reboot and hardware inspection are required.","ze":"XID 79 表示 GPU 已从 PCIe 总线掉线，完全无响应、已断连。这是严重硬件故障，可能由供电问题、热关机或 PCIe 链路失效引起。由于 GPU 不可达，GPU 重置无效，必须重启节点并做硬件检查。","s":"","src":"lab"},{"id":"t1-xid92","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 92 indicate?","zq":"XID 92 错误表示什么？","o":["Uncorrectable double-bit ECC error","Uncontained ECC error with possible data corruption","Elevated rate of correctable single-bit ECC errors","Row remapping threshold exceeded"],"zo":["不可纠正的双比特 ECC 错误","未被隔离、可能造成数据损坏的 ECC 错误","可纠正单比特 ECC 错误出现频率升高","行重映射超过阈值"],"a":2,"e":"XID 92 indicates a High Single-Bit ECC Rate — an elevated rate of correctable single-bit ECC errors. While these errors are corrected, the increasing rate is an early indicator of memory degradation and potential future failure. Proactive monitoring and planning for GPU replacement is recommended.","ze":"XID 92 表示单比特 ECC 错误率过高。这些错误虽被纠正，但频率上升是显存劣化的早期信号，预示未来可能失效；建议加强监控并计划更换。","s":"","src":"lab"},{"id":"t1-xid95","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 95 indicate?","zq":"XID 95 错误表示什么？","o":["A contained memory error limited to a single application","An uncontained memory (ECC) error affecting multiple applications; the GPU must be reset before applications can restart","A high single-bit ECC error rate that ECC can still correct","A row-remapping event that was recorded to InfoROM"],"zo":["仅影响单个应用的可控（contained）显存错误","影响多个应用的不可控（uncontained）显存 ECC 错误；必须先重置该 GPU，应用才能重新启动","ECC 仍可纠正的单比特高错误率","已记录到 InfoROM 的行重映射事件"],"a":1,"e":"Xid 95 is ROBUST_CHANNEL_UNCONTAINED_ERROR, described as an uncontained memory error. Unlike Xid 94, which is contained to one application, Xid 95 affects multiple applications and the affected GPU must be reset before applications can restart. The immediate resolution bucket is RESET_GPU, and Xid 45 is typically seen alongside it.","ze":"Xid 95 是 ROBUST_CHANNEL_UNCONTAINED_ERROR，官方描述为不可控（uncontained）显存错误。与仅影响单个应用的 Xid 94 不同，Xid 95 影响多个应用，必须先重置受影响的 GPU，应用才能重新启动。即时处置桶是 RESET_GPU，通常会伴随看到 Xid 45。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 95 ROBUST_CHANNEL_UNCONTAINED_ERROR, uncontained memory error"},{"id":"t1-xid64","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 64 indicate?","zq":"XID 64 错误表示什么？","o":["A row-remapping (page retirement) record operation failed","A row-remapping event was recorded successfully and needs no action","The auxiliary power cable is not connected to the GPU","NVLink link training failed"],"zo":["行重映射（页面退役）的记录操作失败","行重映射事件已成功记录，无需处理","GPU 的辅助电源线未连接","NVLink 链路训练失败"],"a":0,"e":"Xid 64 is INFOROM_DRAM_RETIREMENT_FAILURE, described as a GPU memory remapping failure: the record operation itself failed. The immediate resolution bucket is RESET_GPU, so reset the affected GPU; if the condition persists, escalate to the hardware vendor.","ze":"Xid 64 是 INFOROM_DRAM_RETIREMENT_FAILURE，官方描述为显存重映射失败，失败的是记录这个动作本身。即时处置桶是 RESET_GPU，应重置受影响的 GPU；若问题持续，再升级到硬件厂商。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 64 INFOROM_DRAM_RETIREMENT_FAILURE, remapping record failed"},{"id":"t1-xid76","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 76 indicate?","zq":"XID 76 错误表示什么？","o":["NVLink failed to complete link training","A Copy Engine (CE7) error, reported as CE7: Unknown Error","vGPU failed to start on the host","A double-bit ECC error in GPU memory"],"zo":["NVLink 未能完成链路训练","拷贝引擎（CE7）错误，报码为 CE7: Unknown Error","主机上的 vGPU 启动失败","GPU 显存中的双位 ECC 错误"],"a":1,"e":"Xid 76 is ROBUST_CHANNEL_CE7_ERROR, listed in the catalog as CE7: Unknown Error. Xid 70, 71, 72, 75, 76, 77 and 85 are all Copy Engine errors, not NVLink errors. Only Xid 74 is NVLINK_ERROR, and it applies to A100 and H100; on B100 and GB200 the NVLink codes are 144 through 150. The immediate resolution bucket for Xid 76 is RESTART_APP.","ze":"Xid 76 是 ROBUST_CHANNEL_CE7_ERROR，目录里的描述就是 CE7: Unknown Error。Xid 70、71、72、75、76、77、85 全部是拷贝引擎错误，不是 NVLink 错误。只有 Xid 74 是 NVLINK_ERROR，且适用于 A100/H100；在 B100/GB200 上 NVLink 相关的码是 144 到 150。Xid 76 的即时处置桶是 RESTART_APP。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 76 ROBUST_CHANNEL_CE7_ERROR, CE7 Unknown Error"},{"id":"t1-xid77","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 77 indicate?","zq":"XID 77 错误表示什么？","o":["An NVLink operation timed out between GPUs","A Copy Engine (CE8) error, reported as CE8: Unknown Error","The GPU has fallen off the PCIe bus","The auxiliary power cable is not connected to the GPU"],"zo":["GPU 之间的 NVLink 操作超时","拷贝引擎（CE8）错误，报码为 CE8: Unknown Error","GPU 已从 PCIe 总线上脱落","GPU 的辅助电源线未连接"],"a":1,"e":"Xid 77 is ROBUST_CHANNEL_CE8_ERROR, listed in the catalog as CE8: Unknown Error, one of the Copy Engine error codes. It is not an NVLink timeout. If copy-engine errors appear while running GPU-to-GPU copies, inspecting NVLink is a reasonable next step, but the code itself identifies a copy engine rather than the link. The immediate resolution bucket is RESTART_APP.","ze":"Xid 77 是 ROBUST_CHANNEL_CE8_ERROR，目录描述为 CE8: Unknown Error，属于拷贝引擎类错误，并不是 NVLink 超时。如果在 GPU 间拷贝时报 CE 错误，去查 NVLink 是合理的下一步，但这个码本身标识的是拷贝引擎而不是链路。即时处置桶是 RESTART_APP。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 77 ROBUST_CHANNEL_CE8_ERROR, CE8 Unknown Error"},{"id":"t1-xid78","d":"6","m":0,"t":"","c":"错误码识别","q":"What does XID error 78 indicate?","zq":"XID 78 错误表示什么？","o":["A high rate of correctable single-bit ECC errors","A row-remapping failure in GPU memory","A vGPU start error: the virtual GPU failed to initialize","An uncorrectable ECC error on the NVLink data path"],"zo":["可纠正单比特 ECC 错误率偏高","显存行重映射失败","vGPU 启动错误：虚拟 GPU 初始化失败","NVLink 数据通路上的不可纠正 ECC 错误"],"a":2,"e":"Xid 78 is VGPU_START_ERROR, described as a vGPU start error. The catalog resolution bucket is UPDATE_SWFW for both the immediate and the investigatory action, so the correct response is to update software and firmware rather than to treat it as an NVLink or memory hardware fault.","ze":"Xid 78 是 VGPU_START_ERROR，官方描述就是 vGPU 启动错误。目录里即时动作与调查动作的处置桶都是 UPDATE_SWFW，正确做法是更新软件与固件，而不是把它当作 NVLink 或显存硬件故障。","s":"","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 78 VGPU_START_ERROR, vGPU start error"},{"id":"t2-xid48-ecc","d":"6","m":0,"t":"","c":"现场处置","q":"You see this in dmesg. What is the severity level and recommended first action?","zq":"你在 dmesg 中看到如下记录。它的严重级别与建议的首要动作是什么？","o":["Warning — restart the application and monitor","Critical — check ECC counters with nvidia-smi -q -d ECC and run dcgmi diag -r 3","Informational — no action needed, errors are auto-corrected","Warning — update NVIDIA drivers to latest version"],"zo":["警告级——重启应用并观察","严重级——用 nvidia-smi -q -d ECC 检查 ECC 计数，并运行 dcgmi diag -r 3","提示级——无需处理，错误会被自动纠正","警告级——把 NVIDIA 驱动升到最新版"],"a":1,"e":"XID 48 (Double-Bit ECC Error) is Critical severity. Double-bit errors are uncorrectable and indicate failing hardware. The first actions are to check ECC counters and run memory diagnostics. GPU replacement is required if errors persist.","ze":"XID 48（双比特 ECC 错误）属严重级别：双比特不可纠正，说明硬件正在失效。第一步是查 ECC 计数并跑显存诊断；若错误持续，需要更换 GPU。","s":"[  842.156789] NVRM: Xid (PCI:0000:3b:00): 48, pid=12345, name=python3, Double Bit ECC Error","src":"lab"},{"id":"t2-xid79-fallen","d":"6","m":0,"t":"","c":"现场处置","q":"You see this error in the system log. What should you do first?","zq":"在系统日志中看到如下错误，首先应做什么？","o":["Run nvidia-smi --gpu-reset to recover the GPU","Restart the CUDA application with higher memory limits","Check system logs for thermal/power events, then plan a node reboot and hardware inspection","Update the NVIDIA driver and reboot"],"zo":["执行 nvidia-smi --gpu-reset 以恢复 GPU","以更大的显存上限重启 CUDA 应用","查看系统日志中的温度/供电事件，再计划重启节点并做硬件检查","升级 NVIDIA 驱动并重启"],"a":2,"e":"XID 79 (GPU Fallen Off Bus) means the GPU is completely unreachable on the PCIe bus. GPU reset will NOT work because the GPU is disconnected. You must check for thermal or power events that caused it, plan a node reboot, and perform hardware inspection of the PCIe slot and power delivery.","ze":"XID 79（GPU 掉总线）表示 GPU 在 PCIe 上完全不可达，GPU 重置无效。必须先查导致它的温度/供电事件，再计划重启节点并检查 PCIe 插槽与供电。","s":"[15234.891234] NVRM: Xid (PCI:0000:af:00): 79, pid=0, GPU has fallen off the bus.\n[15234.891456] NVRM: GPU 0000:af:00.0: GPU has fallen off the bus.\n[15234.891678] NVRM: A GPU crash dump has been created.","src":"lab"},{"id":"t2-xid43-hang","d":"6","m":0,"t":"","c":"现场处置","q":"A user reports their training job is frozen. You find this in dmesg. What does it tell you?","zq":"用户报告训练作业卡住不动。你在 dmesg 里看到这些，它说明什么？","o":["The GPU is overheated and must be cooled before the job is restarted","The GPU is not failing: an application hit a software-induced fault and was terminated, and the GPU remains healthy","The GPU suffered an uncorrectable ECC error and must be replaced","The GPU has fallen off the PCIe bus and the node must be rebooted"],"zo":["GPU 过热，必须先降温才能重启作业","GPU 本身没有故障：用户程序遇到软件诱发的故障被终止，GPU 仍保持健康","GPU 出现不可纠正的 ECC 错误，必须更换","GPU 已从 PCIe 总线上脱落，必须重启节点"],"a":1,"e":"Xid 43 is ROBUST_CHANNEL_RESETCHANNEL_VERIF_ERROR, headline GPU stopped processing. The detail states the user application hit a software-induced fault and had to terminate, and that the GPU remains in a healthy state. In most cases it is a user application error, so the response is to inspect the application and restart the job, not to reset the GPU or replace it. The immediate resolution bucket is IGNORE.","ze":"Xid 43 是 ROBUST_CHANNEL_RESETCHANNEL_VERIF_ERROR，标题为 GPU stopped processing。细则说明用户程序遇到软件诱发的故障被迫终止，且 GPU 仍保持健康状态。多数情况下这是用户程序的问题，正确处置是检查应用并重启作业，而不是重置 GPU 或换卡。即时处置桶为 IGNORE。","s":"[  567.234567] NVRM: Xid (PCI:0000:3b:00): 43, pid=8901, name=python3, Ch 00000010\n[  567.234789] NVRM: Xid (PCI:0000:3b:00): 43, pid=8901, name=python3, Ch 00000010","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 43 RESETCHANNEL_VERIF_ERROR, GPU remains healthy"},{"id":"t2-xid92-sbe","d":"6","m":0,"t":"","c":"现场处置","q":"You see this in monitoring logs. What action should you take?","zq":"在监控日志中看到如下记录，应采取什么措施？","o":["No action needed — single-bit errors are always harmless","Immediately replace the GPU — this is an uncorrectable error","Monitor ECC counters with nvidia-smi -q -d ECC, track error rate, and schedule preventive maintenance","Reset ECC counters and ignore future occurrences"],"zo":["无需处理——单比特错误总是无害的","立即更换 GPU——这是不可纠正错误","用 nvidia-smi -q -d ECC 监控 ECC 计数、跟踪错误率，并安排预防性维护","清零 ECC 计数器并忽略后续告警"],"a":2,"e":"XID 92 (High Single-Bit ECC Rate) is a Warning severity. While single-bit errors are corrected, an elevated rate is an early indicator of memory degradation. The correct approach is to monitor ECC counters, track the error rate over time, and schedule preventive maintenance. Proactive GPU replacement should be considered if the rate increases.","ze":"XID 92（单比特 ECC 速率过高）属警告级：错误虽被纠正，但速率上升是显存劣化的早期信号。正确做法是监控 ECC 计数、跟踪错误率趋势并安排预防性维护；速率继续上升则考虑更换。","s":"[12045.678901] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[12048.123456] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate\n[12051.987654] NVRM: Xid (PCI:0000:3b:00): 92, pid=0, High Single-bit ECC Error Rate","src":"lab"},{"id":"t2-xid38-firmware","d":"6","m":0,"t":"","c":"现场处置","q":"After a driver update you see this in dmesg. What does Xid 38 indicate?","zq":"一次驱动更新之后，你在 dmesg 里看到这条。Xid 38 表示什么？","o":["A double-bit ECC error in GPU memory","A driver firmware error: the FECS watchdog timed out","The GPU has fallen off the PCIe bus","NVLink link training failed"],"zo":["GPU 显存中的双位 ECC 错误","驱动固件错误：FECS 看门狗超时","GPU 已从 PCIe 总线上脱落","NVLink 链路训练失败"],"a":1,"e":"Xid 38 is ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT, described in the catalog as a driver firmware error: the front-end context-switch microcontroller watchdog timed out. It is not a firmware version mismatch. The immediate resolution bucket is IGNORE, with CONTACT_SUPPORT as the investigatory action, so it is not by itself evidence of failing hardware.","ze":"Xid 38 是 ROBUST_CHANNEL_FECS_ERR_WATCHDOG_TIMEOUT，官方描述为驱动固件错误：前端上下文切换微控制器的看门狗超时，并不是固件版本不匹配。即时处置桶为 IGNORE，调查动作才是 CONTACT_SUPPORT，因此单凭它不能断定硬件损坏。","s":"[    4.567890] NVRM: Xid (PCI:0000:3b:00): 38, pid=0","src":"lab","ref":"https://docs.nvidia.com/deploy/xid-errors/analyzing-xid-catalog.html | Xid 38 FECS_ERR_WATCHDOG_TIMEOUT, Driver firmware error"},{"id":"t2-xid13-app","d":"6","m":0,"t":"","c":"现场处置","q":"A developer reports intermittent crashes in their CUDA application. You find this in dmesg. What should you advise?","zq":"开发者反映其 CUDA 应用间歇性崩溃。你在 dmesg 里看到这条。应当建议什么？","o":["Replace the GPU immediately: this indicates hardware failure","Reproduce the crash under Compute Sanitizer memcheck or cuda-gdb to locate the illegal access in the application","Reseat the NVLink bridge connections","Check ECC counters for memory errors"],"zo":["立即更换 GPU：这说明硬件故障","用 Compute Sanitizer memcheck 或 cuda-gdb 复现崩溃，定位应用里的非法访问","重新插拔 NVLink 桥连接","检查 ECC 计数器是否有显存错误"],"a":1,"e":"Xid 13 is ROBUST_CHANNEL_GR_EXCEPTION, a graphics engine exception logged for general user application faults. Typically it is an out-of-bounds access, but it can also be an illegal instruction or register access. NVIDIA recommends running the application in cuda-gdb or the Compute Sanitizer memcheck tool, or running it with CUDA_DEVICE_WAITS_ON_EXCEPTION=1 and attaching the debugger. Hardware failure is a rare cause, so replacement is not the first step.","ze":"Xid 13 是 ROBUST_CHANNEL_GR_EXCEPTION，图形引擎异常，记录的是通用的用户程序故障，典型情况是数组越界，也可能是非法指令或非法寄存器访问。NVIDIA 建议用 cuda-gdb 或 Compute Sanitizer memcheck 运行该程序，或设置 CUDA_DEVICE_WAITS_ON_EXCEPTION=1 后再附加调试器。硬件故障是少见原因
